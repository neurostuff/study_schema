# extraction-deviations.yaml
#
# Everything in the extraction schema that is not a mechanical projection of the storage
# schema. gen_extraction_schema.py applies this file on top of the projection; nothing
# else may differ, and check_extraction_mirrors_storage.py enforces that.
#
# The file has two parts, and the difference between them matters.
#
# `required_additions` is what extraction has because it is an extraction: which model
# ran, what text it read, where the sections of that text begin and end. Storage has no
# place for any of it, so no projection could produce it. These are not judgement calls.
#
# `deviations` is where the two schemas are allowed to disagree about the *domain* --
# a class split, a slot flattened, a union unrolled -- because extracting the storage
# shape directly was measurably worse. It starts empty on purpose. The baseline is that
# the schemas are identical, and each entry is a claim that a paper-reading model does
# better with a different shape. Every entry carries `why`: what was tried, on what, and
# what it changed. The generator refuses an entry without one.
#
# Operations: add_slot, drop_slot, replace_slot, describe_slot, add_class, drop_class.
# `class` is addressed as <module>.<ClassName>, matching the generated module tree.

id: https://neurostuff.org/schemas/extraction-deviations
name: extraction-deviations
title: Departures of the Extraction Schema from the Storage Projection
version: 0.1.0

# Root-schema keys the projection should not inherit. The storage header describes a
# record the mapper writes; this one describes what a model read.
header:

  version: 0.5.0

  description: >-
    Immutable, evidence-first structured output from extracting a neuroimaging
    publication.

    This schema is generated from neuroimaging-study-storage by gen_extraction_schema.py.
    It has the same classes with the same slots in the same nesting; what differs is that
    every source-derived value is wrapped. An ExtractedValue records whether a value was
    found (extraction_status), the value itself when it was, how it relates to the source
    (value_source), and the exact supporting spans (evidence). A slot needing a scalar
    uses a typed subtype -- ExtractedString, ExtractedInteger, ExtractedNumber,
    ExtractedBoolean. Storage's vocabularies come across whole, each field keeping the range
    storage gives it: a closed enum takes a permissible value and nothing else, and an open
    one takes a permissible value or, when none fits, the source's own wording.
    Identifiers, type designators, and pipeline provenance use native LinkML types, because
    nothing in the paper supplies them.

    Evidence is present when one or more independently sufficient EvidenceSets were found,
    or not_found when a value was extracted but no span supports it. For a not_reported
    attribute, omit value and set evidence.status to not_applicable. Entities refer to
    each other by document-local local_id; ingestion resolves them and mints the storage
    identifiers. Do not manually correct an extraction record: create a new extraction
    version or a separate correction record.

    Rules this schema cannot state -- which papers are skipped before extraction, how a
    multivalued extracted fact is shaped, which invariants the structural validator
    enforces, and what a paper may report that no field holds -- are in
    extraction-readme.md. Everything this schema does that is not a projection of storage
    is in extraction-deviations.yaml.

  see_also:
    - https://github.com/neurostuff/study_schema/issues/3
    - https://github.com/neurostuff/study_schema/issues/5
    - https://github.com/neurostuff/study_schema/issues/6
    - https://github.com/neurostuff/study_schema/issues/9

required_additions:

  module: study

  classes:

    ExtractionMetadata:
      description: Pipeline provenance stamped onto the extraction record at generation time.
      attributes:
        extractor_model:
          range: string
          required: true
          description: Model identifier used for extraction, e.g. claude-sonnet-4-6.
        extractor_version:
          range: string
          required: true
          description: Version string of the extraction prompt or pipeline.
        source_text_hash:
          range: string
          description: SHA-256 of the paper text processed, for reproducibility checking.
        extraction_date:
          range: date
          description: ISO-8601 date of extraction.
        paper_sections:
          range: PaperSection
          multivalued: true
          inlined_as_list: true
          description: >-
            Complete deterministic index of all paper sections and subsections,
            including character spans.

    PaperSection:
      description: >-
        Deterministic document index entry for every section and subsection in the
        processed paper text. Character offsets use the same normalized source text
        and half-open interval convention [start_char, end_char).
      attributes:
        ordinal:
          range: integer
          required: true
          minimum_value: 0
          description: Zero-based document order of the section heading.
        title:
          range: string
          required: true
          description: Section or subsection heading text after deterministic normalization.
        level:
          range: integer
          required: true
          minimum_value: 0
          description: Heading depth; 0 is the document-level title, 1 is a top-level section.
        parent_section:
          range: string
          description: title of the immediately containing section, when applicable.
        start_char:
          range: integer
          required: true
          minimum_value: 0
          description: >-
            Inclusive character offset of the section heading in normalized source text.
        end_char:
          range: integer
          required: true
          minimum_value: 0
          description: >-
            Exclusive character offset immediately before the next same-or-higher-level
            heading or EOF.

  slots:

    study.Study:
      extraction_metadata:
        range: ExtractionMetadata
        required: true
        inlined: true
        description: Provenance for this extraction record.

# Nothing here yet. The projection is the baseline; add entries as data shows a different
# shape extracts better. Candidates carried over from the hand-written schema that was
# replaced by the projection, each of which needs re-testing before it comes back:
#
#   1. Acquisition modality payload. Storage subclasses -- MRI is_a Acquisition. The old
#      extraction schema composed instead: Acquisition.mri, .eeg, .pet, .fnirs, .other.
#   2. Analysis.details. Storage has one slot on the abstract AnalysisDetails with a
#      details_type discriminator. The old schema had eight optional sibling slots
#      (decoding, connectivity, conjunction, ...) so no discriminator had to be chosen.
#   3. Effect / Cell / ModelTerm / AnalysisGroup. The old schema replaced these with
#      Term + TermUse + {Condition,Group,Arm,Timepoint,Factor}Term and put statistic,
#      baseline, and mediation_path directly on Analysis.
#   4. StudyDesign.arms / .timepoints. The old schema hung both off Study instead.
#   5. Measure.family / .type. The old schema dropped both and let the mapper derive
#      them from source_label.
#   6. Analysis.interpretations. Storage has multivalued string; the old schema had a
#      single ExtractedValue.
#
# A seventh used to be here and is now settled. Extraction flattened every vocabulary to
# ExtractedString and the map carried 16 synonym tables to get back to a permissible
# value. The projection now emits an Extracted<Enum> wrapper per vocabulary, keeping each
# field's range exactly as storage declares it -- closed for 12 fields, `any_of` with a
# free-text escape hatch for 26 -- and the tables were deleted. The thing to watch is the
# closed ones: a closed vocabulary cannot report that it is short a value, so if
# off-vocabulary answers matter for one of them, opening it is a storage change rather
# than a deviation.
deviations:

  # Each entry is the wrong answer a paper-reading model actually gave, and why it is wrong.
  # `append` rather than `description`: storage keeps the definition and this adds the
  # instruction, so neither can drift from the other.

  - id: mirror-of-is-derived-on-the-extraction-side
    operation: add_slot
    class: analysis.Analysis
    slot: mirror_of
    why: >-
      Storage marks this `deterministic`, so the projection drops it: a deterministic slot
      is filled by code on the storage side and has nothing for a model to read. Here the
      code that fills it runs on the extraction side -- `build_record.mirror_withheld`
      rebuilds the reversed half of a sign-split contrast after the model has settled the
      described half -- so the slot has to exist in the extraction record even though no
      pass extracts it. Without the declaration the builder writes an attribute the
      validator does not know: 36 findings across 21 of the 299 schizophrenia records,
      every one of them the builder's own output being reported as undeclared.
    definition:
      range: Analysis
      inlined: false
      description: >-
        Present only on an analysis the builder derived by reversing another one, and
        naming the analysis it reverses.

        A results table with both signs in one column reports one contrast read two ways.
        The paper's prose describes one direction, so only that half is extracted and the
        other is rebuilt arithmetically -- same cells, directions flipped. This slot is
        what says so. Without it the two halves look like independent findings, and a
        meta-analysis that counts both counts one sample twice.

  - id: region-definition-method-is-about-independence
    operation: describe_slot
    class: region.Region
    slot: definition_method
    why: >-
      Flattened to one value on 29 regions across 3 papers. `SULKxviGFurw` and
      `6oTrCJA43Jcd` marked every region `functional_localizer` while running no localizer
      at all -- their regions are clusters and ICA components of the studies' own analyses
      -- and `YwwKWoEFwY3G` marked all ten `unstated`. The storage description already says
      the field is a statement about independence; what it does not say is which value a
      model reaches for when a region is functionally defined, which is the whole error.
      45 of the 271 reviewed corrections are on `regions[]`.
    append: >-
      Two values are routinely confused and the difference is the entire point of the field.
      `functional_localizer` means a *separate* acquisition or run whose only purpose was to
      locate the region, independent of the effect later tested in it. A region that is a
      peak, a cluster, or a component of one of *this paper's own* analyses is
      `same_study_analysis` however functionally it was defined -- and that value is what
      makes the circularity visible, which is why `Analysis.defines_regions` exists to name
      the analysis it came from. Reaching for `functional_localizer` because the region is
      functional, rather than because a localizer was run, is the mistake to avoid.

  - id: one-model-estimation-per-design-matrix
    operation: describe_slot
    class: analysis.ModelEstimation
    why: >-
      One record stood behind several different design matrices in 3 of 6 newly extracted
      papers. It is the worst class found, because the record stays *valid*: the adjustment
      set is derived by subtracting celled terms from the term list, so a bare two-sample
      t-test came out claiming to have controlled for covariates that are in no model it
      was fitted with. The storage description says an analysis estimated differently takes
      its own record; it does not give the operational test for "differently".
    append: >-
      The test for whether two analyses share a record is mechanical: list the columns each
      was fitted with. A different dependent variable, a different covariate set, or a
      different subset of participants means a different design matrix and therefore a
      separate record, even when family, estimator and software are identical. Two BPM
      regressions of the same measure on the same regressor, one over the patients and one
      over patients and controls pooled, are two records.

      Sharing one record across matrices is not a tidy simplification. Because a contrast's
      adjustment set is *derived* -- the model's terms minus the terms its cells name -- one
      record behind several matrices makes every one of them claim adjustments that were
      never in the model that produced it, and nothing in the record contradicts it.

  - id: a-term-is-not-the-thing-being-measured
    operation: describe_slot
    class: analysis.ModelTerm
    why: >-
      Two papers entered the dependent variable as a term: grey-matter volume on
      `DTpwdoGbjqsq`, and FA/AD/RD/MD as a single four-level factor on `84rGLhCbUJTh`,
      whose Table 2 is literally headed `Diffusion parameter | Region | x | y | z`. As a
      term, the measured quantity lands in its own analysis's derived adjustment set -- the
      record says the analysis controlled for the thing it was measuring.
    append: >-
      A term is something the measure was regressed *on*. The quantity being modelled is
      `Analysis.measure` and never a term of the model that models it. A table laid out with
      one row-block per measured parameter -- four diffusion parameters, three frequency
      bands -- is reporting one analysis per parameter over one measure each, not one
      analysis over a factor whose levels are the parameters.

  - id: model-term-region-is-a-columns-origin-not-a-search-space
    operation: describe_slot
    class: analysis.ModelTerm
    slot: region
    why: >-
      Filled in 4 of 115 extraction runs over 16 papers, all four on `xevP8UDRAVh9`, and in
      every one it points at that study's fronto-temporal explicit mask -- which the same
      runs also put on `Analysis.regions`, correctly. Two further runs of that paper reached
      the other region slot with it and made the mask a *one-level* factor, the region on
      `FactorLevel.regions`. Nothing comes out invalid: the record just asserts that every
      column's signal came out of the mask, so a voxelwise regression of grey matter on
      perfusion reads as an analysis of ROI means. The storage description says what the
      slot holds and why it is singular; what it does not say is which region is *not* a
      column's origin, and a mask is the region a methods section states most plainly. Four
      categorical terms across two papers answered `not_reported` here, which is the same
      gap from the other side -- a factor has no signal to source.
    append: >-
      The test is whether the column's numbers came out of that place. A region that only
      bounds where inference ran -- an explicit mask, a search volume, an atlas the analysis
      was restricted to -- is `Analysis.regions`, and no term draws anything from it. Naming
      it here says the column *was* that region's signal, which for a voxelwise fit inside a
      mask is false, and it says so while `Analysis.regions` goes on saying the true thing,
      so the two never visibly disagree.

      Leave it empty on a categorical term. Regions are carried by a factor's levels, on
      `FactorLevel.regions`, and a factor comparing places has at least two: one level named
      for a mask is a search space written as a comparison the study never made.

  - id: a-classifier-signs-one-cell-not-two
    operation: describe_slot
    class: analysis_details.DecodingDetails
    why: >-
      All three decoding analyses in `ngDTY5BgJUuX` signed both classes -- one `positive`
      and one `negative` -- and all three left `classes` empty. The storage description's
      "one signed cell" was read as licence to sign both sides, which asserts a directional
      contrast between the classes that no accuracy-against-chance test makes.
    append: >-
      "One signed cell" means exactly one. The class the reported accuracy is *for* takes
      the positive cell and the other class takes no cell at all, because absence is the
      zero weight. Signing both would say the paper reported which way the classifier
      erred, which a single accuracy does not. Where the test is undirected -- accuracy
      against chance, with no class named as the target -- every cell is `undirected` instead.

      `classes` is then the only field saying what was told apart, so leaving it empty
      asserts that the paper never named the classes it decoded, which is rare.
