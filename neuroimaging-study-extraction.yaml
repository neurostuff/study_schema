name: neuroimaging-study-extraction
title: Neuroimaging Study Extraction Schema
description: |-
  Immutable, evidence-first structured output from extracting a neuroimaging publication.
  This schema is generated from neuroimaging-study-storage by gen_extraction_schema.py. It has the same classes with the same slots in the same nesting; what differs is that every source-derived value is wrapped. An ExtractedValue records whether a value was found (extraction_status), the value itself when it was, how it relates to the source (value_source), and the exact supporting spans (evidence). A slot needing a scalar uses a typed subtype -- ExtractedString, ExtractedInteger, ExtractedNumber, ExtractedBoolean. Storage's enums are text here: record the paper's wording and let the map normalize it. Identifiers, type designators, and pipeline provenance use native LinkML types, because nothing in the paper supplies them.
  Evidence is present when one or more independently sufficient EvidenceSets were found, or not_found when a value was extracted but no span supports it. For a not_reported attribute, omit value and set evidence.status to not_applicable. Entities refer to each other by document-local local_id; ingestion resolves them and mints the storage identifiers. Do not manually correct an extraction record: create a new extraction version or a separate correction record.
  Rules this schema cannot state -- which papers are skipped before extraction, how a multivalued extracted fact is shaped, which invariants the structural validator enforces, and what a paper may report that no field holds -- are in extraction-readme.md. Everything this schema does that is not a projection of storage is in extraction-deviations.yaml.
