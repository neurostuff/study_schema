id: https://neurostuff.org/schemas/neuroimaging-study-extraction
name: neuroimaging-study-extraction
title: Neuroimaging Study Extraction Schema
description: 'Immutable, evidence-first structured output from extracting a neuroimaging publication.


  Source-derived attributes are ExtractedValue instances. Their extraction_status records whether a value was found, value holds the extracted or generated representation when found, value_source describes its relationship to the source, and evidence records exact supporting spans when available. Fields that require a scalar value type use an ExtractedValue subtype such as ExtractedString, ExtractedInteger, or ExtractedNumber. Pipeline metadata, generated local IDs, and local-ID relationship fields use native LinkML types because they are not source-derived extraction values.


  For extracted values, evidence is present when one or more independently sufficient EvidenceSets were found, or not_found when no support was located. For not_reported attributes, value is omitted and evidence.status is not_applicable. Entities use native document-local local_id strings for cross-references; ingestion resolves them and creates typed storage records. Do not manually correct an extraction record: create a new extraction version or a separate correction record.


  Rules that cannot be stated in this schema -- which papers are skipped before extraction, how a multivalued extracted fact is shaped, which invariants the structural validator enforces, and what a paper may report that no field holds -- are in extraction-readme.md.'
license: CC0-1.0
version: 0.4.0
see_also:
- https://github.com/neurostuff/study_schema/issues/3
- https://github.com/neurostuff/study_schema/issues/5
- https://github.com/neurostuff/study_schema/issues/6
- https://github.com/neurostuff/study_schema/issues/9
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy_ex: https://neurostuff.org/schemas/neuroimaging-study-extraction/
imports:
- linkml:types
- extraction-evidence
default_prefix: neurostudy_ex
default_range: string
classes:
  ExtractionMetadata:
    description: Pipeline provenance stamped onto the extraction record at generation time.
    attributes:
      extractor_model:
        range: string
        required: true
        description: Model identifier used for extraction, e.g. claude-sonnet-4-6.
      extractor_version:
        range: string
        required: true
        description: Version string of the extraction prompt or pipeline.
      source_text_hash:
        range: string
        description: SHA-256 of the paper text processed, for reproducibility checking.
      extraction_date:
        range: date
        description: ISO-8601 date of extraction.
      paper_sections:
        range: PaperSection
        multivalued: true
        inlined_as_list: true
        description: Complete deterministic index of all paper sections and subsections, including character spans.
  PaperSection:
    description: >-
      Deterministic document index entry for every section and subsection in the
      processed paper text. Character offsets use the same normalized source text
      and half-open interval convention [start_char, end_char).
    attributes:
      ordinal:
        range: integer
        required: true
        minimum_value: 0
        description: Zero-based document order of the section heading.
      title:
        range: string
        required: true
        description: Section or subsection heading text after deterministic normalization.
      level:
        range: integer
        required: true
        minimum_value: 0
        description: Heading depth; 0 is the document-level title, 1 is a top-level section.
      parent_section:
        range: string
        description: title of the immediately containing section, when applicable.
      start_char:
        range: integer
        required: true
        minimum_value: 0
        description: Inclusive character offset of the section heading in normalized source text.
      end_char:
        range: integer
        required: true
        minimum_value: 0
        description: Exclusive character offset immediately before the next same-or-higher-level heading or EOF.
  Study:
    tree_root: true
    description: Root extraction record for a single publication.
    attributes:
      extraction_metadata:
        range: ExtractionMetadata
        required: true
        inlined: true
        description: Provenance for this extraction record.
      description:
        range: ExtractedString
        description: Brief summary of the study aims in the extractor's own words.
      design:
        range: ExtractedString
        description: Verbatim or closely paraphrased study design description.
      study_design:
        range: StudyDesign
        inlined: true
        description: >-
          How participants were assigned to what they received, when the paper reports an
          intervention. Omit it for a purely observational study; the narrative in `design`
          stands on its own.
      external_datasets:
        range: ExternalDataset
        multivalued: true
        inlined_as_list: true
        description: Named external datasets used, cited, or made available by the study.
      assessments:
        range: Assessment
        multivalued: true
        inlined_as_list: true
        description: >-
          Assessment records extracted from the paper. Every assessment a Term or an
          Analysis refers to must appear here.
      terms:
        range: Term
        multivalued: true
        inlined_as_list: true
        description: >-
          Term records extracted from the paper. Analyses refer to them by local_id, so a
          term used by two analyses is one record here, not two.
      groups:
        range: Group
        multivalued: true
        inlined_as_list: true
        description: Participant groups extracted from the paper.
      tasks:
        range: Task
        multivalued: true
        inlined_as_list: true
        description: Tasks or paradigms extracted from the paper.
      acquisitions:
        range: Acquisition
        multivalued: true
        inlined_as_list: true
        description: Acquisition protocols extracted from the paper.
      preprocessings:
        range: Preprocessing
        multivalued: true
        inlined_as_list: true
        description: Preprocessing pipelines extracted from the paper.
      model_estimations:
        range: ModelEstimation
        multivalued: true
        inlined_as_list: true
        description: Model estimation records extracted from the paper.
      analyses:
        range: Analysis
        multivalued: true
        inlined_as_list: true
        description: Analyses extracted from the paper.
      conditions:
        range: Condition
        multivalued: true
        inlined_as_list: true
        description: >-
          Conditions extracted from the paper. Tasks refer to them by local_id, so a
          condition is one record here however many analyses use it; the mapper inlines each
          one under the task that owns it.
      arms:
        range: Arm
        multivalued: true
        inlined_as_list: true
        description: >-
          Arm records extracted from the paper. Analyses and Groups refer to them by local_id,
          so an arm two cohorts were both allocated to is one record here, not two.
      timepoints:
        range: Timepoint
        multivalued: true
        inlined_as_list: true
        description: >-
          Timepoint records extracted from the paper. Analyses refer to them by local_id, so an
          occasion several analyses compare across is one record here, not several.
      tables:
        range: Table
        multivalued: true
        inlined_as_list: true
        description: Result tables extracted from the paper.
  ExternalDataset:
    description: Evidence-backed extraction of a named external dataset and its optional URL.
    attributes:
      name:
        range: ExtractedString
        required: true
        description: Dataset name as stated in the source.
      url:
        range: ExtractedString
        description: Dataset URL as stated in the source, when available.
  StudyDesign:
    description: Extracted record of how participants were assigned to what they received.
    attributes:
      allocation:
        range: ExtractedString
        description: >-
          How participants came to be in the arm they were in, verbatim or as judged --
          randomized, quasi-randomized, assigned by clinician or by self-selection, or a
          single-arm study where there was nothing to allocate; mapper normalizes.
      assignment_structure:
        range: ExtractedString
        description: >-
          Whether the arms were separate cohorts or the same participants passing through
          several arms, verbatim or as judged -- parallel-group, crossover, a within-subject
          pre-post design, or a single group measured once; mapper normalizes. This is what
          decides whether an arm is recorded on a Group or on a Condition.
      blinding:
        range: ExtractedString
        description: >-
          Who was kept unaware of the assignment, verbatim or as judged -- open-label,
          participant-blind, assessor- or rater-blind, or double-blind; mapper normalizes.
  Arm:
    description: Extracted record of one thing participants were assigned to receive.
    attributes:
      local_id:
        range: string
        required: true
        description: >-
          Short label assigned by the extractor (e.g., "active_tdcs", "placebo"). Used for
          cross-references in Condition and Group records; the mapper resolves it to a stable
          storage ID.
      name:
        range: ExtractedString
        required: true
        description: Arm label as stated in the paper.
      description:
        range: ExtractedString
        description: Definition of what this arm received, verbatim.
      arm_kind:
        range: ExtractedString
        required: true
        description: >-
          What class of thing this arm received, verbatim or as judged -- a drug, brain
          stimulation, a training or therapy programme, or a comparator such as a placebo, a
          sham, an active comparator, usual care, or no intervention; mapper normalizes. Type
          the comparator as carefully as the manipulation: a drug against an active comparator
          is not the same comparison as a drug against a placebo.
      agent:
        range: ExtractedString
        description: >-
          The drug, agent, or stimulation target, as the paper names it. The name only -- dose,
          route, and schedule are deliberately not extracted.
  Timepoint:
    description: Extracted record of one occasion on which data were collected.
    attributes:
      local_id:
        range: string
        required: true
        description: >-
          Short label assigned by the extractor (e.g., "baseline", "post_6wk"). Used for
          cross-references in Condition records; the mapper resolves it to a stable storage ID.
      name:
        range: ExtractedString
        required: true
        description: Occasion label as stated in the paper, such as baseline, post-treatment, or 6-month follow-up.
      relation_to_intervention:
        range: ExtractedString
        required: true
        description: >-
          Where this occasion sat relative to the intervention, verbatim or as judged --
          before, during (a scan under an acute challenge), after, or a later follow-up; mapper
          normalizes. Say so when the study collected data once, or when it collected data
          repeatedly with nothing administered, rather than leaving it out.
      order:
        range: ExtractedInteger
        description: >-
          Position of this occasion in the study's sequence, counting from 1; mapper parses to
          integer. Extract it when several occasions share a relation to the intervention.
      time_from_intervention:
        range: ExtractedString
        description: >-
          Elapsed time between the intervention and this occasion, in the paper's own words and
          units (e.g., "24 h", "6 weeks"). Extracted although other delivery timing is not,
          because a same-day and a one-year follow-up are not comparable.
  Group:
    description: An extracted participant group record. Source-derived attributes are ExtractedValues; local_id is a generated document-local identifier.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor, unique within this extraction document (e.g., "hc", "pd_patients"). Used for cross-references in Analysis and Task records. The mapper resolves these to stable storage IDs.
      name:
        range: ExtractedString
        required: true
        description: Group label as stated in the paper.
      description:
        range: ExtractedString
        description: Narrative definition of the group, verbatim.
      species:
        range: ExtractedString
        required: true
        description: >-
          Species of this cohort, verbatim, such as human, rhesus macaque, or Sprague-Dawley
          rat; mapper normalizes. Populate it for human cohorts too -- everything else on this
          record reads as human by default, so leaving it out is not the same as saying human.
      arm:
        range: string
        description: >-
          local_id of the Arm record this cohort was allocated to. Populate it for a
          parallel-group trial, where each arm is a separate cohort; when the same participants
          passed through several arms, the arm belongs on the Condition instead.
      approached_count:
        range: ExtractedInteger
        description: Participants approached as text or number; mapper parses to integer.
      consented_count:
        range: ExtractedInteger
        description: Participants consented as text or number; mapper parses to integer.
      enrolled_count:
        range: ExtractedInteger
        description: Participants enrolled as text or number; mapper parses to integer.
      acquired_count:
        range: ExtractedInteger
        description: Participants scanned as text or number; mapper parses to integer.
      excluded_count:
        range: ExtractedInteger
        description: Participants excluded as text or number; mapper parses to integer.
      inclusion_criteria:
        range: ExtractedValue
        description: Eligibility requirements, one per list entry, verbatim.
      exclusion_criteria:
        range: ExtractedValue
        description: Exclusion criteria, one per list entry, verbatim.
      recruitment_method:
        range: ExtractedString
        description: How participants were recruited, verbatim.
      recruitment_dates:
        range: ExtractedString
        description: Recruitment period as stated, verbatim.
      age_mean:
        range: ExtractedNumber
        description: Mean age as text (e.g., "32.4" or "32.4 years"); mapper parses float and unit separately.
      age_standard_deviation:
        range: ExtractedNumber
        description: Age SD as text; mapper parses float.
      age_minimum:
        range: ExtractedNumber
        description: Minimum reported age as text; mapper parses float.
      age_maximum:
        range: ExtractedNumber
        description: Maximum reported age as text; mapper parses float.
      age_median:
        range: ExtractedNumber
        description: Median age as text; mapper parses float.
      age_unit:
        range: ExtractedString
        description: Age unit as stated (e.g., "years", "months"); mapper normalizes to controlled vocabulary.
      sex_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Phenotypic sex distribution, one entry per category the source reports, each with
          its label and a count or percentage.
      gender_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Self-described gender distribution, kept separate from phenotypic sex. One entry
          per reported category.
      handedness_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Handedness distribution, one entry per reported category -- right, left,
          ambidextrous.
      race_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Racial distribution using the study's own category labels, one entry each.
      ethnicity_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Ethnic distribution using the study's own category labels, one entry each.
      medical_condition:
        range: ExtractedValue
        description: Medical, neurological, psychiatric, developmental, or physiological condition(s), verbatim, one per entry.
      diagnostic_system:
        range: ExtractedString
        description: Diagnostic system as stated (e.g., "DSM-5", "ICD-10"); mapper normalizes abbreviations.
      diagnostic_instrument:
        range: ExtractedValue
        description: Assessment instruments used, verbatim, one per entry.
      clinical_characteristics:
        range: ExtractedString
        description: Disease duration, severity, and related clinical summaries, verbatim.
      medication_status:
        range: ExtractedString
        description: Medication exposure and state during acquisition or testing, verbatim.
      education_summary:
        range: ExtractedString
        description: Education level aggregate, verbatim.
      socioeconomic_status_summary:
        range: ExtractedString
        description: SES aggregate, verbatim.
  CategoryDistribution:
    attributes:
      category:
        range: ExtractedString
        required: true
        description: >-
          Which bucket of the distribution this entry counts, verbatim as the paper labels it
          -- "female", "left-handed", "Hispanic or Latino". Not the name of the distribution:
          the slot this record sits in already says whether it is sex, gender, handedness,
          race, or ethnicity.
      count:
        range: ExtractedInteger
        description: >-
          How many participants fall in this category, when the source gives a count.
      percentage:
        range: ExtractedNumber
        description: >-
          The percentage in this category, when the source gives a percentage rather than a
          count.
      denominator:
        range: ExtractedInteger
        description: >-
          The total the count or percentage is out of, when it is not the whole group -- a
          distribution reported for the subset who answered, for instance.
      reporting_framework:
        range: ExtractedString
        description: >-
          The classification system behind these categories, verbatim, such as the OMB or
          NIH race and ethnicity categories or a named handedness inventory. Free-text
          categories only compare across studies when the scheme is known.
  Task:
    description: Extracted meaningful participant paradigm, such as a task, resting-state protocol, stimulation, or passive viewing.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor; resolved to a stable ID by the mapper.
      name:
        range: ExtractedString
        description: Task or paradigm label as stated in the paper, when applicable.
      description:
        range: ExtractedString
        description: Full narrative description of the paradigm, verbatim.
      conditions:
        range: string
        multivalued: true
        description: local_ids of Condition records belonging to this task.
      design_type:
        range: ExtractedString
        description: Design form as stated in the paper (e.g., "event-related", "block design"); mapper normalizes to controlled vocabulary.
      acquisitions:
        range: string
        multivalued: true
        description: >-
          local_ids of Acquisition records collected as part of this task.
          Use multiple entries for simultaneously collected modalities (e.g., EEG
          and fMRI) or for site-specific variants of the task acquisition.
          Do not attach structural or other non-paradigm scans merely because they
          were collected in the same session.
      presentation_software:
        range: ExtractedString
        description: Stimulus presentation software, verbatim.
      instructions:
        range: ExtractedString
        description: Task- or paradigm-specific instructions, verbatim.
      stimuli:
        range: ExtractedString
        description: Stimulus description, verbatim.
      response_mode:
        range: ExtractedValue
        description: >-
          How participants responded, verbatim or as judged, one per entry -- a button or keypad
          press, a hand movement that is itself the response, overt speech, a covert or imagined
          response, an eye movement, a foot or leg movement, a non-speech mouth action; mapper
          normalizes. Say so when the task required no response at all, as in passive viewing or
          resting state: that is a fact about the paradigm, not a missing value.
      performance_measures:
        range: ExtractedValue
        description: Behavioral outcome variables, verbatim, one per entry.
  Acquisition:
    description: Extracted technical acquisition protocol record, with or without an associated participant paradigm.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor; resolved to stable ID by mapper.
      modality:
        range: ExtractedString
        required: true
        description: >-
          Modality as stated in the paper (e.g., "functional MRI", "DTI"), verbatim; the mapper normalizes it to
          the storage Modality vocabulary. Do not translate it here, and do not omit a modality the vocabulary has
          no obvious slot for -- an unmatched label lands on `other` with the label preserved.
      acquisition_duration_seconds:
        range: ExtractedNumber
        description: >-
          How long the acquisition ran, in seconds. A run length, not the total across runs,
          unless the source gives only the total.
      instrument:
        range: Instrument
        inlined: true
        description: Scanner, amplifier, or recording system used for this acquisition.
      mri:
        range: MRI
        description: Fill in for an MRI acquisition of any kind, functional, structural, or diffusion.
      eeg:
        range: EEG
        description: >-
          Fill in for an EEG recording.
      fnirs:
        range: FNIRS
        description: >-
          Fill in for an fNIRS recording.
      pet:
        range: PET
        description: >-
          Fill in for a PET scan.
      other:
        range: OtherModality
        description: >-
          Fill in only for a modality none of the four above covers, such as MEG, SPECT, ultrasound, or
          intracranial EEG. Not a catch-all for extra parameters: a modality with a class of its own keeps
          its parameters there, and a reported parameter no field accepts has no home in this schema.
  Instrument:
    description: >-
      The scanner, amplifier, or recording system an acquisition was made on, split into the two parts
      a source reliably reports.
    attributes:
      manufacturer:
        range: ExtractedString
        description: >-
          Company that made the instrument, verbatim -- Siemens, GE, Philips, Brain Products, NIRx.
          Omit when the paper names only a model: "Prisma" with no vendor is common and inventing the
          vendor from the model is a guess.
      model:
        range: ExtractedString
        description: >-
          Model or product name, verbatim -- Prisma, Signa, Achieva, actiCHamp. Field strength, coil
          count and other parameters are not part of the model name; they have their own fields.
  MRI:
    attributes:
      magnetic_field_strength_tesla:
        range: ExtractedNumber
        description: >-
          Scanner field strength in tesla, as reported.
      pulse_sequence_type:
        range: ExtractedString
        description: >-
          Pulse sequence family, verbatim -- EPI, MPRAGE, SPGR, spin echo.
      mr_acquisition_type:
        range: ExtractedString
        description: >-
          Whether the sequence was acquired in 2D slices or as a 3D volume, verbatim.
          Distinguishes a slab-based EPI from a whole-volume acquisition.
      repetition_time_seconds:
        range: ExtractedNumber
        description: >-
          Repetition time in seconds. Convert a value the paper gives in milliseconds; the
          unit here is seconds.
      echo_time_seconds:
        range: ExtractedValue
        description: >-
          Echo time in seconds, as a list when the sequence is multi-echo -- one value per
          echo, in the order the source gives them.
      acquisition_voxel_size_mm:
        range: ExtractedValue
        description: >-
          Acquired voxel dimensions in millimetres, as a list of the three edge lengths. The
          size at acquisition, not after resampling in preprocessing.
      number_of_volumes:
        range: ExtractedInteger
        description: >-
          How many volumes the functional run contains, sometimes reported as time points or
          dynamics.
  EEG:
    attributes:
      sampling_frequency_hz:
        range: ExtractedNumber
        description: >-
          Sampling rate of the recording in hertz.
      eeg_reference:
        range: ExtractedString
        description: >-
          The reference the raw signal was recorded against, verbatim -- linked mastoids, a
          common average, a named electrode.
      eeg_placement_scheme:
        range: ExtractedString
        description: >-
          The electrode layout system, verbatim, such as the 10-20 or 10-10 system.
      recording_type:
        range: ExtractedString
        description: >-
          How the recording was organized, verbatim -- continuous, discontinuous, or already
          epoched.
      eeg_channel_count:
        range: ExtractedInteger
        description: >-
          How many recording channels were used, excluding reference and ground unless the
          source counts them.
  FNIRS:
    attributes:
      sampling_frequency_hz:
        range: ExtractedNumber
        description: >-
          Sampling rate of the recording in hertz.
      nirs_system_type:
        range: ExtractedString
        description: >-
          The instrument's measurement principle, verbatim -- continuous-wave, frequency-
          domain, or time-domain.
      nirs_channel_count:
        range: ExtractedInteger
        description: >-
          How many source-detector pairs were recorded, which is not the number of optodes.
      wavelengths_nm:
        range: ExtractedValue
        description: >-
          The nominal emitted wavelengths in nanometres, as a list.
      short_channel_count:
        range: ExtractedInteger
        description: >-
          How many short-separation channels were used, which measure scalp signal for
          regression rather than brain signal.
      source_detector_distances_mm:
        range: ExtractedValue
        description: >-
          Separation between each source and detector in millimetres, as a list. It sets the
          depth the channel is sensitive to.
      nirs_placement_scheme:
        range: ExtractedValue
        description: >-
          The optode layout, verbatim -- a standard system such as 10-20, or the listed
          positions.
      recorded_signal_types:
        range: ExtractedValue
        description: >-
          What the channels recorded, verbatim -- raw continuous-wave amplitude, optical
          density, or concentrations of oxygenated and deoxygenated haemoglobin.
  PET:
    attributes:
      image_units:
        range: ExtractedString
        description: >-
          The unit the image voxels are in, verbatim -- Bq/mL, SUV, a binding potential.
      tracer_name:
        range: ExtractedString
        description: >-
          The injected tracer compound as the paper names it, such as FDG or raclopride.
      tracer_radionuclide:
        range: ExtractedString
        description: >-
          The isotope labelling the tracer, verbatim -- C11, F18, O15.
      mode_of_administration:
        range: ExtractedString
        description: >-
          How the tracer was given, verbatim -- a bolus, a constant infusion, or a bolus
          plus infusion.
      scan_type:
        range: ExtractedString
        description: >-
          Whether the analysed data are a static image or a dynamic time series, verbatim.
          It decides whether kinetic modelling was possible.
      uptake_time_seconds:
        range: ExtractedNumber
        description: >-
          How long after administration the analysed data were acquired, in seconds.
      reconstructed_voxel_size_mm:
        range: ExtractedString
        description: >-
          Voxel dimensions after reconstruction, in millimetres, as a list of the three edge
          lengths.
      spatial_resolution_mm:
        range: ExtractedString
        description: >-
          The scanner's effective resolution, usually as a full width at half maximum in
          millimetres. Coarser than the voxel size, and the figure that limits localization.
  OtherModality:
    description: >-
      Extracted record of an acquisition whose modality none of MRI, EEG, FNIRS, or PET covers. Only its label
      and the reason no class fit are recorded: the schema normalizes no parameters for these modalities, and
      since the Acquisition-level free-text and JSON hatches were removed there is nowhere else for them.
    attributes:
      modality_label:
        range: ExtractedString
        required: true
        description: The paper's own name for the modality or recording technique, verbatim.
      reason_no_modality_class_used:
        range: ExtractedString
        description: Why the MRI, EEG, FNIRS, and PET fields do not describe this acquisition.
  Preprocessing:
    description: Extracted preprocessing pipeline record.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      description:
        range: ExtractedString
        description: Narrative pipeline overview, verbatim.
      software:
        range: ExtractedValue
        inlined_as_list: true
        description: Software packages used, verbatim, one per entry.
      steps:
        range: ExtractedValue
        description: >-
          Ordered preprocessing steps, verbatim, in execution order. Say that smoothing was applied,
          but put the kernel size in smoothing_fwhm_mm rather than only in the step's wording.
      smoothing_fwhm_mm:
        range: ExtractedValue
        description: >-
          Full width at half maximum of the spatial smoothing kernel in millimetres, as a number for
          an isotropic kernel and a list of three for an anisotropic one. Take it as the source gives
          it and do not convert from a sigma or a voxel count. Record 0 when the paper states that no
          smoothing was applied -- unsmoothed multivariate and searchlight analyses are common, and
          that is a statement about the pipeline rather than a missing value. Omit only when the
          paper does not say.
  ModelEstimation:
    description: >-
      Extracted record of how a model was specified and estimated, including the terms it
      was specified with. Every contrast comes from a model, so every Analysis names one of
      these; analyses whose contrasts come from the same model name the same record, and an
      analysis specified or estimated differently gets its own.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      terms:
        range: string
        multivalued: true
        description: >-
          local_ids of the Term records this model was specified with -- its design-matrix
          columns or equivalent predictors. Record every term the source states, including
          covariates no reported contrast tests. Which contrast uses which term is
          Analysis.term_uses.
      model_type:
        range: ExtractedString
        required: true
        description: Model family as stated (e.g., "GLM", "general linear model", "ICA"); mapper normalizes to controlled vocabulary.
      hrf_model:
        range: ExtractedString
        description: Haemodynamic response basis the design matrix used, verbatim, such as "canonical HRF",
          "canonical plus temporal derivative", or "FIR". Omit for a measure that models no timeseries.
      model_settings:
        range: ExtractedString
        description: Essential model settings, verbatim.
      level:
        range: ExtractedString
        description: Analysis level as stated (e.g., "first-level", "group-level"); mapper normalizes to run/session/subject/group vocabulary.
      estimator:
        range: ExtractedString
        description: Estimation method, verbatim.
      software:
        range: ExtractedValue
        description: Statistical software name and version, verbatim.
  InferenceSettings:
    attributes:
      inference_level:
        range: ExtractedString
        description: >-
          The element inference was drawn about, verbatim -- a voxel, a vertex, a cluster, a
          region, or a network; mapper normalizes. A voxelwise threshold followed by a
          cluster-extent criterion is cluster-level inference, not voxel-level.
      voxelwise_threshold_value:
        range: ExtractedNumber
        description: >-
          The per-element height threshold applied before any correction or cluster
          formation, as a number: p < 0.001 uncorrected gives 0.001, Z > 3.09 gives 3.09.
          voxelwise_threshold_type says which of those the number is.
      voxelwise_threshold_type:
        range: ExtractedString
        description: >-
          What voxelwise_threshold_value is a value of, verbatim -- an uncorrected p, an FDR
          q, or a t, z, or F statistic.
      cluster_forming_threshold_value:
        range: ExtractedNumber
        description: >-
          The threshold deciding which elements join a cluster, when the source reports it
          separately from voxelwise_threshold_value. In most software these are the same
          number and only one is populated; fill both only when the paper gives two distinct
          values.
      cluster_extent_threshold:
        range: ExtractedInteger
        description: >-
          The minimum surviving cluster size, in the unit the source uses -- contiguous
          voxels, vertices, or a volume. Record the number as given, without converting it.
      clusterwise_threshold_value:
        range: ExtractedNumber
        description: >-
          The cluster-level threshold a whole cluster had to pass, as distinct from the
          height threshold its elements passed. 'p < 0.001 voxelwise, cluster-level p <
          0.05' gives 0.001 above and 0.05 here.
      multiple_comparison_method:
        range: ExtractedString
        description: >-
          How the multiple-comparison problem was handled, verbatim -- FWE, FDR, Bonferroni,
          permutation, Monte Carlo simulation, small-volume correction, or none. Record
          every one a paper applies, not just the first.
      correction_scope:
        range: ExtractedString
        description: >-
          The space the correction was applied over, verbatim -- the whole brain, a mask, an
          ROI set, one hemisphere. A correction over a small mask is a weaker claim than the
          same method over the whole brain, which is why the scope is recorded and not only
          the method.
      search_volume:
        range: ExtractedString
        description: >-
          The size of the space searched, verbatim as reported -- a volume, a mask size, or
          a count of voxels or vertices.
      neighborhood_definition:
        range: ExtractedString
        description: >-
          The adjacency rule deciding whether two elements belong to one cluster, verbatim
          -- face, edge, or corner connectivity, often written as 6, 18, or 26 neighbours.
      tfce_used:
        range: ExtractedValue
        description: >-
          Whether threshold-free cluster enhancement was used, which replaces a height
          threshold with a weighting by cluster support.
      tfce_parameters:
        range: ExtractedString
        description: >-
          TFCE height and extent exponents, verbatim, when the source reports them.
      permutation_count:
        range: ExtractedInteger
        description: >-
          How many permutations, randomizations, or simulations the inference rested on.
      alpha_level:
        range: ExtractedNumber
        description: >-
          The error rate the test was held to -- the family-wise, false-discovery, or
          nominal alpha, usually 0.05. Distinct from a threshold value: alpha is the rate
          being controlled, a threshold is what implements it.
      number_of_tests:
        range: ExtractedInteger
        description: >-
          How many tests the correction accounted for, when the source states it.
  Analysis:
    description: Extracted analysis record, including direct links and analysis-level inference metadata.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        required: true
        description: Analysis label, verbatim.
      spatial_scope:
        range: ExtractedString
        required: true
        description: Spatial extent of the inference, verbatim -- whole brain, one or more regions of
          interest, or a searchlight; mapper normalizes.
      spatial_unit:
        range: ExtractedString
        description: The element the analysis ran over, verbatim -- voxels, surface vertices, averaged
          regions, or parcels; mapper normalizes. Distinct from spatial_scope, which gives the extent.
      roi_definition:
        range: ExtractedString
        required: true
        description: How a region of interest was defined, verbatim -- an atlas or parcellation, prior
          literature, an a priori anatomical region, a separate functional localizer, or this study's own
          earlier analysis; mapper normalizes. Omit for a whole-brain or searchlight analysis.
      roi_label:
        range: ExtractedString
        description: The atlas, parcellation, or region name, verbatim. Omit for a whole-brain analysis.
      acquisitions:
        range: string
        multivalued: true
        description: local_ids of Acquisition records supplying data to this analysis. Extract these explicitly, including for structural, diffusion, and other analyses without an associated Task.
      tasks:
        range: string
        multivalued: true
        description: >-
          local_ids of the Task records this analysis draws on. Multivalued because an
          analysis can span paradigms -- a cross-task conjunction, or a localizer plus a main
          task. Empty for an analysis with no paradigm, which is linked through acquisitions.
      conditions:
        range: ConditionTerm
        multivalued: true
        inlined_as_list: true
        description: The conditions entering this analysis and, for each, which side of the comparison it
          sits on. Every condition the analysis uses gets an entry, directional or not.
      timepoints:
        range: TimepointTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The occasions entering this analysis and, for each, which side of the comparison it
          sits on. This is how a pre-post comparison is recorded, including for a study with no
          paradigm at all: give the earlier occasion and the later one their roles and leave
          conditions empty.
      arms:
        range: ArmTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The arms entering this analysis and, for each, which side of the comparison it sits
          on. Use it when the same participants passed through several arms; when the arms are
          separate cohorts the comparison is between groups and each cohort's allocation is on
          the Group record.
      factors:
        range: FactorTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The levels of a categorical Term entering this analysis and, for each, which side of
          the comparison it sits on. Use this only for a factor whose levels are not entities
          of the study -- brain regions, hemispheres, tasks, frequency bands, acquisition
          sessions or modalities. A factor whose levels are conditions, cohorts, occasions or
          arms is recorded through conditions, groups, timepoints or arms instead.

          This is what to reach for when the source reports a dissociation: "a region by
          condition interaction" gives the two regions their sides here and the two conditions
          their sides in conditions. Putting the direction only on the conditions would state
          an ordering the source reports for one region and denies for the other.
      term_uses:
        range: TermUse
        multivalued: true
        inlined_as_list: true
        description: >-
          Which of the model's terms this analysis's contrast uses, and how. One entry per
          term the contrast tests or controls for; a term of the model this contrast does
          not weight is simply omitted. What each term *is* stays on the Term record.
      model_estimation:
        range: string
        required: true
        description: >-
          local_id of the ModelEstimation this contrast was taken from. Required: every
          contrast comes from a model, so a paper that describes a contrast and never names
          an estimator still gets a ModelEstimation record holding the terms it does state.
      groups:
        range: GroupTerm
        required: true
        multivalued: true
        inlined_as_list: true
        description: The participant cohorts in this analysis and, for each, which side of the comparison
          it sits on and how many of its participants this analysis included.
      preprocessing:
        range: string
        description: local_id of the Preprocessing pipeline used.
      definition:
        range: ExtractedString
        required: true
        description: Contrast specification, verbatim.
      prespecification:
        range: ExtractedString
        required: true
        description: >-
          Whether this contrast was planned before the data were seen, verbatim as the source frames
          it -- a registration identifier or registry name, a reference to a protocol or analysis
          plan, or wording calling the analysis exploratory, post hoc, or data-driven; mapper
          normalizes to exactly one of planned, not planned, or not said. Required, and
          `not_reported` for the many papers that say nothing, which is a fact about the paper.
          Take only what the source states: silence about registration is not a statement that an
          analysis was exploratory, and confident wording is not a statement that it was planned.
      measure:
        range: Measure
        required: true
        inlined: true
        description: The scientific quantity of the map, in the source's words.
      statistic:
        range: Statistic
        inlined: true
        description: The test statistic reported for this analysis and its degrees of freedom.
      baseline:
        range: ExtractedString
        description: >-
          What the map was tested against, verbatim -- a named condition such as rest or fixation,
          an implicit baseline, chance, or zero. Record the source's wording; the mapper routes it
          rather than normalizing it, because storage has no baseline field and each kind of
          reference belongs somewhere different.

          Do not invent a baseline condition. When the baseline *is* a modelled condition, also
          give it a condition term on the lesser side -- that term is what survives, and this
          field is the evidence for it.
      mediation_path:
        range: ExtractedString
        description: For a mediation analysis, which path was tested, verbatim -- the direct effect, the
          indirect or mediated path, or the total effect; mapper normalizes. Omit otherwise.
      tables:
        range: string
        multivalued: true
        description: local_ids of Table records reporting results.
      coordinate_space:
        range: ExtractedString
        description: >-
          Coordinate space the results are reported in, verbatim, such as "MNI space" or
          "Talairach"; mapper normalizes. Extract it from the Methods even when the tables state
          it, because table parsing does not always recover it.
      assessments:
        range: string
        multivalued: true
        description: local_ids of Assessment records used by this analysis.
      inference_settings:
        range: InferenceSettings
        inlined: true
        description: >-
          Thresholding and correction settings for this analysis. Fill this in per analysis,
          since papers routinely use one threshold for whole-brain tests and another inside
          an ROI.
      statistical_maps:
        range: StatisticalMap
        multivalued: true
        inlined_as_list: true
        description: >-
          Statistical images made available for this analysis, usually in a repository such
          as NeuroVault.
      decoding:
        range: DecodingDetails
        inlined: true
        description: Fill in for a classification or pattern-discriminability analysis.
      similarity:
        range: SimilarityDetails
        inlined: true
        description: Fill in for a representational-similarity analysis, where the association is at the
          level of dissimilarity matrices. A similarity regressor entered into a univariate GLM is a
          parametric modulation instead, recorded as a Term.
      connectivity:
        range: ConnectivityDetails
        inlined: true
        description: Fill in for a connectivity analysis -- PPI, gPPI, seed-based, DCM, Granger causality,
          or coherence.
      conjunction:
        range: ConjunctionDetails
        inlined: true
        description: Fill in for a logical combination of independently defined effects.
      component_decomposition:
        range: ComponentDecompositionDetails
        inlined: true
        description: Fill in for ICA and related component maps.
      partial_least_squares:
        range: PartialLeastSquaresDetails
        inlined: true
        description: >-
          Payload for a partial least squares analysis. One latent variable per Analysis: a second
          LV from the same decomposition is a second Analysis.
      not_structurable:
        range: NotStructurableDetails
        inlined: true
        description: >-
          Fill in only when the effect is grounded in the source but has no stable structured
          decomposition at all -- not merely a method outside the named families, which is
          other_method.
      other_method:
        range: OtherAnalysisDetails
        inlined: true
        description: Fill in for a method none of the five above covers, such as a mediation analysis. Leave
          all six empty for a mass-univariate analysis -- a voxelwise, vertexwise, or ROI-wise GLM,
          mixed-effects model, ANOVA, ANCOVA, or robust regression -- which needs no method payload.
      model_representation_notes:
        range: ExtractedString
        description: >-
          Model components this schema could not represent, verbatim -- random slopes,
          latent variables, custom basis functions, dependencies between terms. Fill this in
          rather than dropping a component; it is how the gap becomes visible.
      interpretations:
        range: ExtractedValue
        description: >-
          What the authors say the analysis measures, in their words. A claim about the
          paper's own reading, never the extractor's, and never a substitute for the
          definition.
  Assessment:
    attributes:
      local_id:
        range: string
        required: true
        description: >-
          Short label assigned by the extractor.
      name:
        range: ExtractedString
        required: true
        description: >-
          The instrument's name as the paper gives it, such as Digit Span, MMSE, or BDI-II.
      description:
        range: ExtractedString
        description: >-
          What the assessment measured and how, verbatim.
      assessment_type:
        range: ExtractedString
        description: >-
          Broad type, verbatim -- a cognitive test, clinical scale, questionnaire,
          behavioural task, physiological measure, or a biospecimen assay such as salivary
          cortisol.
  Term:
    description: >-
      One term of a statistical model, categorical or continuous -- a design-matrix column
      or equivalent predictor. Belongs to a ModelEstimation and is stated once there,
      however many analyses contrast it; how a given contrast uses it is a TermUse on that
      analysis.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        required: true
        description: >-
          Term label as the source names it, verbatim where the source names it at all.
          Papers routinely state the levels and not the axis -- 1-back, 2-back and 3-back
          conditions with no name for what varies -- so this may be a label supplied for a
          grouping the source does make, such as `load`. Supplying it is expected; the
          levels below must still be the source's own, and the name must not assert a
          comparison or a construct the paper does not make.
      source_definition:
        range: ExtractedString
        description: The source's own definition of the term, verbatim, including the origin of a continuous
          term that no Assessment supplies -- age, dose, a motion parameter, cardiac phase, scanner drift.
      type:
        range: ExtractedString
        required: true
        description: Whether the term is categorical or continuous, as stated or as evident from the model;
          mapper normalizes.
      assessment:
        range: string
        description: local_id of the Assessment supplying a continuous term's measurement.
      levels:
        range: FactorLevel
        multivalued: true
        inlined_as_list: true
        description: >-
          The levels of a categorical term, and for each the cohorts, conditions, occasions, or arms
          carrying it. Record every level the source names, including ones no reported contrast uses:
          a three-level factor contrasted at two levels is still a three-level factor. Leave empty for
          a continuous term.
      variation_level:
        range: ExtractedString
        description: >-
          Whether the term moves within a participant or only across the sample, verbatim -- within
          subject, between subjects, or both; mapper normalizes. Fill it for every term, categorical
          as well as continuous: a factor every participant met every level of is within-subject and
          one each participant sits in a single level of is between-subject, exactly as a trial-wise
          modulator and an age covariate are. For a continuous term this is also what separates a
          parametric modulation from a cross-subject regression. Papers state it plainly for factors
          -- "a within-subjects factor task", "a between-subjects factor group" -- so take that
          wording rather than inferring scope from the design.
      functional_form:
        range: ExtractedString
        description: >-
          Shape of the term's relationship to the measure, verbatim -- linear, quadratic, an absolute
          value, log-transformed, or a named transform; mapper normalizes. Do not report a non-linear
          or transformed term as linear. A model fitting both a linear and a quadratic form of the
          same measurement has two Term records, not one.

          Not where a product goes. That a term is a product of others is `interaction_with`, and
          saying it in both places means saying it twice.
      interaction_with:
        range: string
        multivalued: true
        description: >-
          local_ids of the other Term records this term is a product of, when the source names an
          interaction term. Populate it only for a term the source presents as its own column --
          "an age by group interaction term", "the PCL-R x diagnosis product".

          The case that needs it is a crossing involving a **continuous** measure. A continuous term
          has no levels, so an age-by-group interaction cannot be read off the compared levels the
          way a condition-by-group one can; the product term is the only record of it, and without
          it the analysis reads as a plain regression on age.

          A crossing of two **categorical** factors does not need it. Give each factor's levels their
          sides and the crossing is already stated; adding a product term on top says nothing further
          and is flagged for review. This is the most over-applied field in the schema -- of 19 bench
          disagreements on it, all 19 were a model setting it where the reference left it empty, and
          most were categorical crossings. When in doubt, record the levels and their sides and leave
          this empty.
      unit:
        range: ExtractedString
        description: Unit of a continuous term, verbatim, when meaningful.
  StatisticalMap:
    attributes:
      local_id:
        range: string
        required: true
        description: >-
          Short label assigned by the extractor.
      map_type:
        range: ExtractedString
        required: true
        description: >-
          What the image contains, verbatim -- a statistic map, an effect estimate, a
          variance map, or a thresholded label map.
      url:
        range: ExtractedString
        description: >-
          Where the map can be retrieved, or the landing page of the archive holding it.
      coordinate_space:
        range: ExtractedString
        description: >-
          The space the map is in, verbatim. May differ from the space the paper's tables
          report, which is why it is recorded per map.
      is_thresholded:
        range: ExtractedValue
        description: >-
          Whether the shared image has already had a threshold applied, which decides
          whether it can be re-analysed.
      statistic_type:
        range: ExtractedString
        description: >-
          The statistical quantity the map's values are, verbatim -- t, z, beta, a p value.
      description:
        range: ExtractedString
        description: >-
          Notes on where the map came from and how it relates to the reported analysis.
  Condition:
    description: Extracted condition record.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        required: true
        description: Condition label as stated in the paper.
      description:
        range: ExtractedString
        description: >-
          Condition definition, verbatim, including whether it was a rest, fixation, or control
          state. Only what happened inside the paradigm: when the data were collected and what
          the participant received are Timepoint and Arm records, and enter an analysis through
          Analysis.timepoints and Analysis.arms.

  Table:
    description: Extracted table record.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      table_number:
        range: ExtractedString
        description: Printed table identifier, verbatim (e.g., "Table 2", "Supplementary Table S4").
      title:
        range: ExtractedString
        description: Table title, verbatim.
      caption:
        range: ExtractedString
        description: Full table caption, verbatim.
      footer:
        range: ExtractedString
        description: Table notes and footnotes, verbatim.
      column_headings:
        range: ExtractedValue
        description: Ordered column headings, verbatim.
      description:
        range: ExtractedString
        description: Summary of the table's role in the study.
  GroupTerm:
    description: >-
      One participant cohort in an analysis, the side of the comparison it sits on, and how many of its
      participants the analysis included.
    attributes:
      group:
        range: string
        required: true
        description: local_id of the Group record.
      label:
        range: ExtractedString
        description: The source's wording for this cohort in this analysis, verbatim, when it differs from
          the Group name.
      role:
        range: ExtractedString
        required: true
        description: >-
          Which side of the comparison this cohort sits on, verbatim as the source frames it -- the greater
          side, the lesser side, or without a direction; mapper normalizes.

          A cohort with no side is the same three-way choice `FactorTerm.role` sets out, and for the
          same reason: say "weighted out", "held constant" for a comparison taken within this cohort,
          or "direction not reported". "Included" alone names all three and is flagged for review.
      n:
        range: ExtractedInteger
        description: Participants from this cohort included in this analysis, when reported per analysis.
  ConditionTerm:
    description: One experimental condition entering an analysis and the side of the comparison it sits on.
    attributes:
      condition:
        range: string
        required: true
        description: local_id of the Condition record.
      label:
        range: ExtractedString
        description: The source's wording for this condition in this analysis, verbatim, when it differs
          from the Condition name.
      role:
        range: ExtractedString
        required: true
        description: >-
          Which side of the comparison this condition sits on, verbatim as the source frames it; mapper
          normalizes. For an ordered contrast mark the extremes and leave the middle terms undirected,
          keeping the ordering in contrast_definition.
  TimepointTerm:
    description: One occasion entering an analysis and the side of the comparison it sits on.
    attributes:
      timepoint:
        range: string
        required: true
        description: local_id of the Timepoint record.
      label:
        range: ExtractedString
        description: The source's wording for this occasion in this analysis, verbatim, when it differs
          from the Timepoint name.
      role:
        range: ExtractedString
        required: true
        description: >-
          Which side of the comparison this occasion sits on, verbatim as the source frames it; mapper
          normalizes. A post-versus-pre increase makes the later occasion the greater side. For a series
          of follow-ups mark the extremes and leave the middle occasions undirected, keeping the ordering
          in contrast_definition.
  ArmTerm:
    description: One arm entering an analysis and the side of the comparison it sits on.
    attributes:
      arm:
        range: string
        required: true
        description: local_id of the Arm record.
      label:
        range: ExtractedString
        description: The source's wording for this arm in this analysis, verbatim, when it differs from
          the Arm name.
      role:
        range: ExtractedString
        required: true
        description: >-
          Which side of the comparison this arm sits on, verbatim as the source frames it; mapper
          normalizes. A drug-versus-placebo increase makes the drug arm the greater side. Type the
          comparator side as carefully as the manipulation.
  FactorTerm:
    description: >-
      One level of a categorical Term entering an analysis, and the side of the comparison it
      sits on. For a factor whose levels are not entities of the study -- a region, a
      hemisphere, a task, a frequency band, an acquisition session.
    attributes:
      term:
        range: string
        required: true
        description: >-
          local_id of the Term record this level belongs to. The Term must be one this
          analysis's ModelEstimation carries, and its type must be categorical.
      level:
        range: ExtractedString
        required: true
        description: >-
          The level's label, verbatim, matching one of the levels recorded on that Term. Copy
          the wording from the Term's FactorLevel rather than rephrasing it; the two are joined
          on this string.
      label:
        range: ExtractedString
        description: The source's wording for this level in this analysis, verbatim, when it differs
          from the level's own label.
      role:
        range: ExtractedString
        required: true
        description: >-
          Which side of the comparison this level sits on, verbatim as the source frames it;
          mapper normalizes. In a dissociation, the level in which the effect was found is the
          greater side and the level in which it was absent or reversed is the lesser side.

          **A level with no side is three different facts. Say which.** "Included" names all three
          and the mapper cannot resolve it, so a bare "included" is flagged for review:

          - **weighted out** -- a three-level factor compared at two of its levels. Say "weighted
            out" or "not weighted". Storage records a zero weight by having no entry for the level,
            so the mapper drops it.
          - **held constant** -- the contrast was taken *within* this level, as a group comparison
            run inside the incongruent condition is. Say "held constant", "held at", "within this
            level", or "restricted to". The level took part and sat on neither side, which is a
            different claim from either of the others: it keeps the factor out of the analysis's
            adjustment set, because it was not averaged over.
          - **direction unreported** -- the level was compared and the source does not say which
            way. Say "direction not reported".

          Guessing among them is an invention. Saying "weighted out" of a level whose direction was
          merely unreported denies a weight the contrast gave; saying "unstated" of a level held
          constant asserts a comparison the contrast did not make; and calling a held-constant level
          averaged-over puts a term in the adjustment set that the contrast never averaged.
  FactorLevel:
    description: >-
      One level of a categorical Term, and the entities carrying it. The factor is named
      once, by the Term this sits on, so nothing here repeats it.
    attributes:
      level:
        range: ExtractedString
        required: true
        description: The level's label, verbatim.
      order:
        range: ExtractedInteger
        description: >-
          Position of this level in the factor's sequence, counting from 1, for a factor whose levels
          are ordered -- a dose series, a load or difficulty series, an ordinal severity grading. The
          directional roles record only which levels a contrast put at its extremes, so without this
          the sequence of 1-back, 2-back and 3-back is lost. Omit for a nominal factor: an order the
          design does not have must not be invented.
      conditions:
        range: string
        multivalued: true
        description: local_ids of the Condition records carrying this level.
      groups:
        range: string
        multivalued: true
        description: local_ids of the Group records carrying this level.
      timepoints:
        range: string
        multivalued: true
        description: local_ids of the Timepoint records carrying this level.
      arms:
        range: string
        multivalued: true
        description: local_ids of the Arm records carrying this level.
  TermUse:
    description: >-
      One of a model's Terms as one analysis's contrast uses it. Holds only what can differ
      between two contrasts taken from the same model.
    attributes:
      term:
        range: string
        required: true
        description: local_id of the Term record, which must be one of the terms of this analysis's
          ModelEstimation.
      role:
        range: ExtractedString
        required: true
        description: >-
          How the term enters this contrast, verbatim or as evident -- a term of interest, a covariate
          controlled for, a mediator; mapper normalizes. Say "covariate" for something the paper
          controls for rather than tests in this particular contrast.

          Do not say "moderator". A moderated effect is recorded as the source describes it: the
          moderator and the effect it moderates are both terms of interest, and the moderation is a
          third Term with functional_form `product` naming the two in interaction_with. There is
          nowhere for a moderator role to go, because that structure already says it.
      association_direction:
        range: ExtractedString
        description: Reported sign of the term's coefficient in this contrast, verbatim; mapper
          normalizes. Omit when the source reports no direction.
  Measure:
    description: The scientific quantity of the map, in the source's own words.
    attributes:
      source_label:
        range: ExtractedString
        description: The paper's own term for the measure, verbatim, such as "BOLD signal change", "grey
          matter volume", or "fractional anisotropy". The mapper normalizes it to a family and a type.
      specific_metric:
        range: ExtractedString
        description: Named metric when the measure is a specific one, verbatim, such as fractional
          anisotropy, ALFF, or a named tracer binding potential.
      unit:
        range: ExtractedString
        description: Reported unit of the measure, verbatim, when meaningful.
  Statistic:
    description: The test statistic reported for an analysis and its degrees of freedom.
    attributes:
      family:
        range: ExtractedString
        required: true
        description: Test statistic as reported, verbatim -- t, z, F, chi-square, a likelihood ratio, a
          beta, or a correlation; mapper normalizes.
      degrees_of_freedom_numerator:
        range: ExtractedNumber
        description: Numerator degrees of freedom, as reported. Normally only an F or a likelihood ratio
          has one.
      degrees_of_freedom_denominator:
        range: ExtractedNumber
        description: >-
          Denominator degrees of freedom, as reported. For a single-degree-of-freedom statistic this is the
          only one -- t(151) is F(1,151), so record 151 here and leave the numerator out.
  DecodingDetails:
    description: Method payload for a classification or pattern-discriminability analysis.
    attributes:
      decoded_variable:
        range: ExtractedString
        required: true
        description: The variable the classifier or discriminability test predicted, verbatim.
      classes:
        range: DecodingClass
        multivalued: true
        inlined_as_list: true
        description: The classes discriminated.
      performance_metrics:
        range: PerformanceMetric
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          Every performance measure the paper reports for this analysis, one entry each, with
          its value. Record all of them -- a paper giving accuracy, sensitivity and specificity
          gets three entries, not one.
      validation_scheme:
        range: ExtractedString
        description: Cross-validation or resampling scheme, verbatim, such as leave-one-run-out.
      generalization:
        range: ExtractedString
        description: Train and test split for cross-decoding, verbatim, when the analysis generalized
          across sets.
  PerformanceMetric:
    description: One reported performance measure of a decoding analysis, and its value.
    attributes:
      name:
        range: ExtractedString
        required: true
        description: The measure as the source names it, verbatim, such as accuracy, AUC, d-prime,
          sensitivity, or specificity.
      value:
        range: ExtractedNumber
        description: The value as reported, verbatim in the source's own scale. Do not convert a
          percentage to a proportion or the reverse.
      reference_value:
        range: ExtractedNumber
        description: >-
          Numeric reference this measure was compared against, when reported -- chance for an
          accuracy, zero for a correlation. Each measure carries its own.
      relation:
        range: ExtractedString
        description: >-
          Whether this measure was above or below its reference, verbatim; mapper normalizes.
  DecodingClass:
    description: One class discriminated by a decoding analysis.
    attributes:
      label:
        range: ExtractedString
        required: true
        description: Class label as reported, verbatim.
      condition:
        range: string
        description: local_id of the Condition this class corresponds to, when it is one.
  SimilarityDetails:
    description: Method payload for a representational-similarity analysis.
    attributes:
      model:
        range: ExtractedString
        description: The model dissimilarity matrix tested, verbatim. Omit for a model-free test such as
          within- versus between-category pattern similarity.
      neural_representation:
        range: ExtractedString
        description: How the neural pattern was defined, verbatim, such as the voxel set or time window used.
      similarity_metric:
        range: ExtractedString
        description: Similarity or distance metric, verbatim.
      competing_models:
        range: ExtractedValue
        description: Other models the reported model was compared against, verbatim.
  ConnectivityDetails:
    description: Method payload for a connectivity analysis.
    attributes:
      connectivity_method:
        range: ExtractedString
        required: true
        description: Method used to estimate connectivity, verbatim -- PPI, gPPI, seed-based correlation,
          DCM, Granger causality, or coherence; mapper normalizes.
      seed_regions:
        range: ExtractedValue
        description: Seed or source regions, verbatim.
      target_regions:
        range: ExtractedValue
        description: Target regions, verbatim. Empty for a seed-to-whole-brain analysis.
      parameter_sign:
        range: ExtractedString
        description: Sign of the connectivity parameter itself, verbatim, such as a negative PPI; mapper
          normalizes.
      parameter_change:
        range: ExtractedString
        description: Whether the experimental effect raised or lowered the connectivity parameter, verbatim;
          mapper normalizes.
      edges:
        range: ConnectivityEdge
        multivalued: true
        inlined_as_list: true
        description: Named region pairs, when the source reports specific edges.
      modulatory_input:
        range: ExtractedString
        description: Modulatory input of the model, verbatim, for DCM and related methods.
      inference_target:
        range: ExtractedString
        description: What the analysis drew inference about, verbatim -- a connectivity parameter, a model
          comparison, or a network; mapper normalizes.
  ConnectivityEdge:
    description: One reported connection between two named regions.
    attributes:
      source_region:
        range: ExtractedString
        required: true
        description: Source region, verbatim.
      target_region:
        range: ExtractedString
        required: true
        description: Target region, verbatim.
      directionality:
        range: ExtractedString
        description: >-
          Whether this edge is directed, verbatim; mapper normalizes. Only a directed model such as DCM or
          Granger causality supports a direction -- never infer one the method cannot support.
      parameter_sign:
        range: ExtractedString
        description: Sign of this edge's parameter, verbatim, when reported per edge.
  ConjunctionDetails:
    description: Method payload for a logical combination of independently defined effects.
    attributes:
      components:
        range: ConjunctionComponent
        multivalued: true
        inlined_as_list: true
        description: The independently defined effects that were combined.
      null_hypothesis:
        range: ExtractedString
        description: Which null hypothesis was tested, verbatim -- the global null or the conjunction null;
          mapper normalizes.
      implementation:
        range: ExtractedString
        description: Procedure that computed the conjunction, verbatim, such as a minimum-statistic test,
          masking, or a logical OR; mapper normalizes.
  ConjunctionComponent:
    description: One component effect of a conjunction.
    attributes:
      analysis_id:
        range: string
        description: local_id of the sibling Analysis record for this component, when it is separately
          reported.
      analysis_type:
        range: ExtractedString
        description: The component's own method, verbatim, when it is known and differs from the others.
      definition:
        range: ExtractedString
        required: true
        description: Statement of the component effect, verbatim, including its direction.
  ComponentDecompositionDetails:
    description: Method payload for ICA and related component maps.
    attributes:
      method:
        range: ExtractedString
        description: Decomposition method, verbatim, such as ICA, tensor ICA, PCA, or dictionary learning;
          mapper normalizes.
      component_id:
        range: ExtractedString
        required: true
        description: Identifier of the component within the decomposition, as reported.
      component_label:
        range: ExtractedString
        description: The source's name for the component, verbatim, such as a network label.
      total_components:
        range: ExtractedInteger
        description: Number of components the decomposition produced.
      selection_criterion:
        range: ExtractedString
        description: How this component was selected for reporting, verbatim.
      map_quantity:
        range: ExtractedString
        description: What the values of the reported map represent, verbatim -- a loading, a weight, a
          z-score, or a spatial map; mapper normalizes.
      polarity_semantics:
        range: ExtractedString
        description: >-
          Whether the sign of the map carries meaning, verbatim; mapper normalizes. Decomposition methods
          can return components whose polarity is arbitrary, in which case a negative loading is not a
          decrease.
  OtherAnalysisDetails:
    description: Method payload for a method outside the first-class families, such as a mediation analysis.
    attributes:
      method_label:
        range: ExtractedString
        required: true
        description: The source's name for the method, verbatim.
      structured_details:
        range: ExtractedString
        description: JSON-encoded method-specific payload, when the method has structure worth keeping. A
          string because the schema has no free-form object range.
      reason_first_class_type_not_used:
        range: ExtractedString
        required: true
        description: Why none of the five named method payloads fits this analysis.
  PartialLeastSquaresDetails:
    description: >-
      Extracted partial least squares payload. PLS decomposes the covariance between the brain data
      and another block, so what that other block was is the thing to get right.
    attributes:
      pls_type:
        range: ExtractedString
        required: true
        description: >-
          What the brain data were decomposed against, verbatim -- the task or experimental design,
          behavioural or clinical measures, a seed region's activity, or more than one block at
          once; mapper normalizes. Say so when the paper reports PLS without saying which.
      latent_variable_id:
        range: ExtractedString
        required: true
        description: >-
          Which latent variable this analysis reports, as the source labels it, commonly "LV1".
          Required: without it two analyses from one decomposition cannot be told apart.
      latent_variable_label:
        range: ExtractedString
        description: The source's name for what the latent variable captures, verbatim, when it gives one.
      total_latent_variables:
        range: ExtractedInteger
        description: How many latent variables the decomposition produced.
      crossblock_covariance_percent:
        range: ExtractedNumber
        description: >-
          Percentage of crossblock covariance this latent variable accounts for, as reported. Record
          the number as given and do not convert a proportion.
      behavioral_variables:
        range: string
        multivalued: true
        description: local_ids of the Assessment records forming the behavioural block. Empty for a task PLS.
      seed_regions:
        range: ExtractedValue
        description: Regions whose activity formed the seed block, verbatim, one per entry. Empty otherwise.
      salience_threshold:
        range: ExtractedString
        description: >-
          The criterion for a reliable contributing voxel, verbatim -- conventionally a bootstrap
          ratio cutoff such as "|BSR| > 3.0". Do not record it as a voxelwise statistical threshold.
      polarity_semantics:
        range: ExtractedString
        description: >-
          What the sign of the salience map means, verbatim; mapper normalizes. A latent variable's
          sign is arbitrary up to a flip, so record what the paper says positive means.
  NotStructurableDetails:
    description: >-
      Payload for an effect that is grounded in the source but has no stable structured
      decomposition.
    attributes:
      reason:
        range: ExtractedString
        required: true
        description: >-
          Why the effect could not be structured, verbatim or as judged -- a method-specific
          derived metric, too little standard structure, or a source too vague; mapper
          normalizes.
      explanation:
        range: ExtractedString
        required: true
        description: What specifically could not be represented.
