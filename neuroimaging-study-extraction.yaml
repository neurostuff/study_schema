id: https://neurostuff.org/schemas/neuroimaging-study-extraction
name: neuroimaging-study-extraction
title: Neuroimaging Study Extraction Schema
description: 'Immutable, evidence-first structured output from extracting a neuroimaging publication.


  Source-derived attributes are ExtractedValue instances. Their extraction_status records whether a value was found, value holds the extracted or generated representation when found, value_source describes its relationship to the source, and evidence records exact supporting spans when available. Fields that require a scalar value type use an ExtractedValue subtype such as ExtractedString, ExtractedInteger, or ExtractedNumber. Pipeline metadata, generated local IDs, and local-ID relationship fields use native LinkML types because they are not source-derived extraction values.


  For extracted values, evidence is present when one or more independently sufficient EvidenceSets were found, or not_found when no support was located. For not_reported attributes, value is omitted and evidence.status is not_applicable. Entities use native document-local local_id strings for cross-references; ingestion resolves them and creates typed storage records. Do not manually correct an extraction record: create a new extraction version or a separate correction record.'
license: CC0-1.0
version: 0.4.0
see_also:
- https://github.com/neurostuff/study_schema/issues/3
- https://github.com/neurostuff/study_schema/issues/5
- https://github.com/neurostuff/study_schema/issues/6
- https://github.com/neurostuff/study_schema/issues/9
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy_ex: https://neurostuff.org/schemas/neuroimaging-study-extraction/
imports:
- linkml:types
- extraction-evidence
default_prefix: neurostudy_ex
default_range: string
classes:
  ExtractionMetadata:
    description: Pipeline provenance stamped onto the extraction record at generation time.
    attributes:
      extractor_model:
        range: string
        required: true
        description: Model identifier used for extraction, e.g. claude-sonnet-4-6.
      extractor_version:
        range: string
        required: true
        description: Version string of the extraction prompt or pipeline.
      source_text_hash:
        range: string
        description: SHA-256 of the paper text processed, for reproducibility checking.
      extraction_date:
        range: date
        description: ISO-8601 date of extraction.
      paper_sections:
        range: PaperSection
        multivalued: true
        inlined_as_list: true
        description: Complete deterministic index of all paper sections and subsections, including character spans.
  PaperSection:
    description: >-
      Deterministic document index entry for every section and subsection in the
      processed paper text. Character offsets use the same normalized source text
      and half-open interval convention [start_char, end_char).
    attributes:
      ordinal:
        range: integer
        required: true
        minimum_value: 0
        description: Zero-based document order of the section heading.
      title:
        range: string
        required: true
        description: Section or subsection heading text after deterministic normalization.
      level:
        range: integer
        required: true
        minimum_value: 0
        description: Heading depth; 0 is the document-level title, 1 is a top-level section.
      parent_section:
        range: string
        description: title of the immediately containing section, when applicable.
      start_char:
        range: integer
        required: true
        minimum_value: 0
        description: Inclusive character offset of the section heading in normalized source text.
      end_char:
        range: integer
        required: true
        minimum_value: 0
        description: Exclusive character offset immediately before the next same-or-higher-level heading or EOF.
  Study:
    tree_root: true
    description: Root extraction record for a single publication.
    attributes:
      extraction_metadata:
        range: ExtractionMetadata
        required: true
        inlined: true
        description: Provenance for this extraction record.
      doi:
        range: ExtractedString
        description: DOI as it appears in the paper or header; may be confirmed or corrected by the API layer.
      authors:
        range: ExtractedValue
        description: Authors in the published order when shown in the source.
      journal:
        range: ExtractedString
        description: Journal or publication venue when shown in the source.
      publication_year:
        range: ExtractedInteger
        description: Publication year as shown in the source.
      title:
        range: ExtractedString
        required: true
        description: Full title of the publication, verbatim.
      description:
        range: ExtractedString
        description: Brief summary of the study aims in the extractor's own words.
      design:
        range: ExtractedString
        description: Verbatim or closely paraphrased study design description.
      study_type:
        range: ExtractedString
        description: >-
          'LLM-assigned publication category. Expected values: primary, meta_analysis,
          systematic_review, narrative_review, case_report, methods_development, simulation,
          commentary. The mapper normalizes this to the StudyType enum in the storage schema. See
          issue #2.'
      external_datasets:
        range: ExternalDataset
        multivalued: true
        inlined_as_list: true
        description: Named external datasets used, cited, or made available by the study.
      assessments:
        range: Assessment
        multivalued: true
        inlined_as_list: true
      terms:
        range: Term
        multivalued: true
        inlined_as_list: true
      groups:
        range: Group
        multivalued: true
        inlined_as_list: true
        description: Participant groups extracted from the paper.
      experiments:
        range: Experiment
        multivalued: true
        inlined_as_list: true
        description: Tasks or paradigms extracted from the paper.
      acquisitions:
        range: Acquisition
        multivalued: true
        inlined_as_list: true
        description: Acquisition protocols extracted from the paper.
      preprocessings:
        range: Preprocessing
        multivalued: true
        inlined_as_list: true
        description: Preprocessing pipelines extracted from the paper.
      model_estimations:
        range: ModelEstimation
        multivalued: true
        inlined_as_list: true
        description: Model estimation records extracted from the paper.
      analyses:
        range: Analysis
        multivalued: true
        inlined_as_list: true
        description: Analyses extracted from the paper.
      conditions:
        range: Condition
        multivalued: true
        inlined_as_list: true
        description: Experimental conditions extracted from the paper.
      tables:
        range: Table
        multivalued: true
        inlined_as_list: true
        description: Result tables extracted from the paper.
  ExternalDataset:
    description: Evidence-backed extraction of a named external dataset and its optional URL.
    attributes:
      name:
        range: ExtractedString
        required: true
        description: Dataset name as stated in the source.
      url:
        range: ExtractedString
        description: Dataset URL as stated in the source, when available.
  Group:
    description: An extracted participant group record. Source-derived attributes are ExtractedValues; local_id is a generated document-local identifier.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor, unique within this extraction document (e.g., "hc", "pd_patients"). Used for cross-references in Analysis and Experiment records. The mapper resolves these to stable storage IDs.
      name:
        range: ExtractedString
        required: true
        description: Group label as stated in the paper.
      description:
        range: ExtractedString
        description: Narrative definition of the group, verbatim.
      approached_count:
        range: ExtractedInteger
        description: Participants approached as text or number; mapper parses to integer.
      consented_count:
        range: ExtractedInteger
        description: Participants consented as text or number; mapper parses to integer.
      enrolled_count:
        range: ExtractedInteger
        description: Participants enrolled as text or number; mapper parses to integer.
      acquired_count:
        range: ExtractedInteger
        description: Participants scanned as text or number; mapper parses to integer.
      analyzed_count:
        range: ExtractedInteger
        description: Participants analyzed as text or number; mapper parses to integer.
      excluded_count:
        range: ExtractedInteger
        description: Participants excluded as text or number; mapper parses to integer.
      attrition_description:
        range: ExtractedString
        description: Verbatim description of exclusions and dropouts.
      inclusion_criteria:
        range: ExtractedValue
        description: Eligibility requirements, one per list entry, verbatim.
      exclusion_criteria:
        range: ExtractedValue
        description: Exclusion criteria, one per list entry, verbatim.
      recruitment_method:
        range: ExtractedString
        description: How participants were recruited, verbatim.
      recruitment_dates:
        range: ExtractedString
        description: Recruitment period as stated, verbatim.
      age_mean:
        range: ExtractedNumber
        description: Mean age as text (e.g., "32.4" or "32.4 years"); mapper parses float and unit separately.
      age_standard_deviation:
        range: ExtractedNumber
        description: Age SD as text; mapper parses float.
      age_minimum:
        range: ExtractedNumber
        description: Minimum reported age as text; mapper parses float.
      age_maximum:
        range: ExtractedNumber
        description: Maximum reported age as text; mapper parses float.
      age_median:
        range: ExtractedNumber
        description: Median age as text; mapper parses float.
      age_unit:
        range: ExtractedString
        description: Age unit as stated (e.g., "years", "months"); mapper normalizes to controlled vocabulary.
      sex_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
      gender_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
      handedness_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
      race_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
      ethnicity_distribution:
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
      medical_condition:
        range: ExtractedValue
        description: Medical, neurological, psychiatric, developmental, or physiological condition(s), verbatim, one per entry.
      diagnostic_system:
        range: ExtractedString
        description: Diagnostic system as stated (e.g., "DSM-5", "ICD-10"); mapper normalizes abbreviations.
      diagnostic_instrument:
        range: ExtractedValue
        description: Assessment instruments used, verbatim, one per entry.
      clinical_characteristics:
        range: ExtractedString
        description: Disease duration, severity, and related clinical summaries, verbatim.
      medication_status:
        range: ExtractedString
        description: Medication exposure and state during acquisition or testing, verbatim.
      education_summary:
        range: ExtractedString
        description: Education level aggregate, verbatim.
      socioeconomic_status_summary:
        range: ExtractedString
        description: SES aggregate, verbatim.
  CategoryDistribution:
    attributes:
      category:
        range: ExtractedString
        required: true
      count:
        range: ExtractedInteger
      percentage:
        range: ExtractedNumber
      denominator:
        range: ExtractedInteger
      reporting_framework:
        range: ExtractedString
  Experiment:
    description: Extracted meaningful participant paradigm, such as a task, resting-state protocol, stimulation, or passive viewing.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor; resolved to a stable ID by the mapper.
      task_name:
        range: ExtractedString
        description: Task or paradigm label as stated in the paper, when applicable.
      task_description:
        range: ExtractedString
        description: Full narrative description of the paradigm, verbatim.
      conditions:
        range: string
        multivalued: true
        description: local_ids of Condition records belonging to this experiment.
      design_type:
        range: ExtractedString
        description: Design form as stated in the paper (e.g., "event-related", "block design"); mapper normalizes to controlled vocabulary.
      acquisitions:
        range: string
        multivalued: true
        description: >-
          local_ids of Acquisition records collected as part of this experiment.
          Use multiple entries for simultaneously collected modalities (e.g., EEG
          and fMRI) or for site-specific variants of the experimental acquisition.
          Do not attach structural or other non-paradigm scans merely because they
          were collected in the same session.
      presentation_software:
        range: ExtractedString
        description: Stimulus presentation software, verbatim.
      instructions:
        range: ExtractedString
        description: Task- or paradigm-specific instructions, verbatim.
      stimuli:
        range: ExtractedString
        description: Stimulus description, verbatim.
      task_performance_measures:
        range: ExtractedValue
        description: Behavioral outcome variables, verbatim, one per entry.
  Acquisition:
    description: Extracted technical acquisition protocol record, with or without an associated participant paradigm.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor; resolved to stable ID by mapper.
      name:
        range: ExtractedString
        description: Human-readable acquisition label.
      modality:
        range: ExtractedString
        description: >-
          Modality as stated in the paper (e.g., "functional MRI", "DTI"), verbatim; the mapper normalizes it to
          the storage Modality vocabulary. Do not translate it here, and do not omit a modality the vocabulary has
          no obvious slot for -- an unmatched label lands on `other` with the label preserved.
      acquisition_duration_seconds:
        range: ExtractedNumber
      instrument:
        range: ExtractedString
        description: Scanner, amplifier, or recording system, verbatim, including manufacturer and model.
      description:
        range: ExtractedString
        description: >-
          Narrative account of the acquisition, verbatim, holding whatever this schema has no field for. Fill this
          in rather than dropping a reported parameter, whatever the modality.
      structured_details:
        range: ExtractedString
        description: >-
          JSON-encoded acquisition parameters that no field below accepts, when the reported parameters have
          structure worth keeping. A string because the schema has no free-form object range.
      mri:
        range: MRI
        description: Fill in for an MRI acquisition of any kind, functional, structural, or diffusion.
      eeg:
        range: EEG
      fnirs:
        range: FNIRS
      pet:
        range: PET
      other:
        range: OtherModality
        description: >-
          Fill in only for a modality none of the four above covers, such as MEG, SPECT, ultrasound, or
          intracranial EEG. Extra parameters for a modality that does have a class go in description or
          structured_details, not here.
  MRI:
    attributes:
      magnetic_field_strength_tesla:
        range: ExtractedNumber
      pulse_sequence_type:
        range: ExtractedString
      mr_acquisition_type:
        range: ExtractedString
      repetition_time_seconds:
        range: ExtractedNumber
      echo_time_seconds:
        range: ExtractedValue
      acquisition_voxel_size_mm:
        range: ExtractedValue
      number_of_volumes:
        range: ExtractedInteger
  EEG:
    attributes:
      sampling_frequency_hz:
        range: ExtractedNumber
      eeg_reference:
        range: ExtractedString
      eeg_placement_scheme:
        range: ExtractedString
      recording_type:
        range: ExtractedString
      eeg_channel_count:
        range: ExtractedInteger
  FNIRS:
    attributes:
      sampling_frequency_hz:
        range: ExtractedNumber
      nirs_system_type:
        range: ExtractedString
      nirs_channel_count:
        range: ExtractedInteger
      wavelengths_nm:
        range: ExtractedValue
      short_channel_count:
        range: ExtractedInteger
      source_detector_distances_mm:
        range: ExtractedValue
      nirs_placement_scheme:
        range: ExtractedValue
      recorded_signal_types:
        range: ExtractedValue
  PET:
    attributes:
      image_units:
        range: ExtractedString
      tracer_name:
        range: ExtractedString
      tracer_radionuclide:
        range: ExtractedString
      mode_of_administration:
        range: ExtractedString
      scan_type:
        range: ExtractedString
      uptake_time_seconds:
        range: ExtractedNumber
      reconstructed_voxel_size_mm:
        range: ExtractedString
      spatial_resolution_mm:
        range: ExtractedString
  OtherModality:
    description: >-
      Extracted record of an acquisition whose modality none of MRI, EEG, FNIRS, or PET covers. Its parameters go in
      the enclosing Acquisition's description or structured_details, which no modality normalizes.
    attributes:
      modality_label:
        range: ExtractedString
        description: The paper's own name for the modality or recording technique, verbatim.
      reason_no_modality_class_used:
        range: ExtractedString
        description: Why the MRI, EEG, FNIRS, and PET fields do not describe this acquisition.
  Preprocessing:
    description: Extracted preprocessing pipeline record.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        required: true
        description: Pipeline name or label, verbatim.
      description:
        range: ExtractedString
        description: Narrative pipeline overview, verbatim.
      software:
        range: ExtractedString
        multivalued: true
        inlined_as_list: true
        description: Software packages used, verbatim, one per entry.
      steps:
        range: ExtractedValue
        description: Ordered preprocessing steps, verbatim, in execution order.
  ModelEstimation:
    description: Extracted record of how a model was specified and estimated.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        description: Model label, verbatim.
      model_type:
        range: ExtractedString
        required: true
        description: Model family as stated (e.g., "GLM", "general linear model", "ICA"); mapper normalizes to controlled vocabulary.
      hrf_model:
        range: ExtractedString
        description: Haemodynamic response basis the design matrix used, verbatim, such as "canonical HRF",
          "canonical plus temporal derivative", or "FIR". Omit for a measure that models no timeseries.
      model_settings:
        range: ExtractedString
        description: Essential model settings, verbatim.
      level:
        range: ExtractedString
        description: Analysis level as stated (e.g., "first-level", "group-level"); mapper normalizes to run/session/subject/group vocabulary.
      estimator:
        range: ExtractedString
        description: Estimation method, verbatim.
      software:
        range: ExtractedValue
        description: Statistical software name and version, verbatim.
  InferenceSettings:
    attributes:
      inference_level:
        range: ExtractedString
      voxelwise_threshold_value:
        range: ExtractedNumber
      voxelwise_threshold_type:
        range: ExtractedString
      cluster_forming_threshold_value:
        range: ExtractedNumber
      cluster_extent_threshold:
        range: ExtractedInteger
      clusterwise_threshold_value:
        range: ExtractedNumber
      multiple_comparison_method:
        range: ExtractedString
      correction_scope:
        range: ExtractedString
      search_volume:
        range: ExtractedString
      neighborhood_definition:
        range: ExtractedString
      tfce_used:
        range: ExtractedValue
      tfce_parameters:
        range: ExtractedString
      permutation_count:
        range: ExtractedInteger
      alpha_level:
        range: ExtractedNumber
      number_of_tests:
        range: ExtractedInteger
  Analysis:
    description: Extracted analysis record, including direct links and analysis-level inference metadata.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        description: Analysis label, verbatim.
      spatial_scope:
        range: ExtractedString
        description: Spatial extent of the inference, verbatim -- whole brain, one or more regions of
          interest, or a searchlight; mapper normalizes.
      spatial_unit:
        range: ExtractedString
        description: The element the analysis ran over, verbatim -- voxels, surface vertices, averaged
          regions, or parcels; mapper normalizes. Distinct from spatial_scope, which gives the extent.
      roi_definition:
        range: ExtractedString
        description: How a region of interest was defined, verbatim -- an atlas or parcellation, prior
          literature, an a priori anatomical region, a separate functional localizer, or this study's own
          earlier analysis; mapper normalizes. Omit for a whole-brain or searchlight analysis.
      roi_label:
        range: ExtractedString
        description: The atlas, parcellation, or region name, verbatim. Omit for a whole-brain analysis.
      acquisitions:
        range: string
        multivalued: true
        description: local_ids of Acquisition records supplying data to this analysis. Extract these explicitly, including for structural, diffusion, and other analyses without an associated Experiment.
      experiment:
        range: string
        description: local_id of the Experiment record associated with this analysis.
      condition_terms:
        range: ConditionTerm
        multivalued: true
        inlined_as_list: true
        description: The conditions entering this analysis and, for each, which side of the comparison it
          sits on. Every condition the analysis uses gets an entry, directional or not.
      terms:
        range: string
        multivalued: true
        description: local_ids of Term records entering this analysis.
      model_estimation:
        range: string
        description: local_id of the ModelEstimation used.
      group_terms:
        range: GroupTerm
        multivalued: true
        inlined_as_list: true
        description: The participant cohorts in this analysis and, for each, which side of the comparison
          it sits on and how many of its participants this analysis included.
      preprocessing:
        range: string
        description: local_id of the Preprocessing pipeline used.
      contrast_definition:
        range: ExtractedString
        description: Contrast specification, verbatim.
      measure:
        range: Measure
        inlined: true
        description: The scientific quantity of the map, in the source's words.
      statistic:
        range: Statistic
        inlined: true
        description: The test statistic reported for this analysis and its degrees of freedom.
      baseline:
        range: ExtractedString
        description: >-
          What the map was tested against, verbatim -- a named condition such as rest or fixation,
          an implicit baseline, chance, or zero; mapper normalizes. Do not invent a baseline
          condition: if the baseline is a modelled condition, give it a condition term on the lesser
          side instead.
      mediation_path:
        range: ExtractedString
        description: For a mediation analysis, which path was tested, verbatim -- the direct effect, the
          indirect or mediated path, or the total effect; mapper normalizes. Omit otherwise.
      independent_sample_key:
        range: ExtractedString
        description: Study-local key identifying the participant sample used by this analysis.
      tables:
        range: string
        multivalued: true
        description: local_ids of Table records reporting results.
      coordinate_space:
        range: ExtractedString
        description: Coordinate space as stated (e.g., "MNI space", "Talairach"); mapper normalizes.
      assessments:
        range: string
        multivalued: true
        description: local_ids of Assessment records used by this analysis.
      inference_settings:
        range: InferenceSettings
        inlined: true
      statistical_maps:
        range: StatisticalMap
        multivalued: true
        inlined_as_list: true
      decoding:
        range: DecodingDetails
        inlined: true
        description: Fill in for a classification or pattern-discriminability analysis.
      similarity:
        range: SimilarityDetails
        inlined: true
        description: Fill in for a representational-similarity analysis, where the association is at the
          level of dissimilarity matrices. A similarity regressor entered into a univariate GLM is a
          parametric modulation instead, recorded as a Term.
      connectivity:
        range: ConnectivityDetails
        inlined: true
        description: Fill in for a connectivity analysis -- PPI, gPPI, seed-based, DCM, Granger causality,
          or coherence.
      conjunction:
        range: ConjunctionDetails
        inlined: true
        description: Fill in for a logical combination of independently defined effects.
      component_decomposition:
        range: ComponentDecompositionDetails
        inlined: true
        description: Fill in for ICA and related component maps.
      other_method:
        range: OtherAnalysisDetails
        inlined: true
        description: Fill in for a method none of the five above covers, such as a mediation analysis. Leave
          all six empty for a mass-univariate analysis -- a voxelwise, vertexwise, or ROI-wise GLM,
          mixed-effects model, ANOVA, ANCOVA, or robust regression -- which needs no method payload.
      model_representation_status:
        range: ExtractedString
      model_representation_notes:
        range: ExtractedString
      analysis_interpretations:
        range: ExtractedValue
  Assessment:
    attributes:
      local_id:
        range: string
        required: true
      name:
        range: ExtractedString
        required: true
      description:
        range: ExtractedString
      assessment_type:
        range: ExtractedString
  Term:
    description: >-
      One term of a statistical model, categorical or continuous. Replaces the factor and
      predictor split: what matters is whether the term is categorical or continuous.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        required: true
        description: Term label as the source names it, verbatim. Also the factor's identity, referred to
          by FactorLevel.factor_name.
      description:
        range: ExtractedString
        description: The source's own definition of the term, verbatim, including the origin of a continuous
          term that no Assessment supplies -- age, dose, a motion parameter, cardiac phase, scanner drift.
      term_type:
        range: ExtractedString
        description: Whether the term is categorical or continuous, as stated or as evident from the model;
          mapper normalizes.
      role:
        range: ExtractedString
        description: How the term enters the model, verbatim or as evident -- a term of interest, a covariate
          controlled for, a moderator, a mediator; mapper normalizes. Say "covariate" for something the
          paper controls for rather than tests.
      conditions:
        range: string
        multivalued: true
        description: local_ids of Condition records a categorical term ranges over.
      groups:
        range: string
        multivalued: true
        description: local_ids of Group records a categorical term ranges over.
      assessment:
        range: string
        description: local_id of the Assessment supplying a continuous term's measurement.
      levels:
        range: ExtractedString
        multivalued: true
        description: The factor's level labels, verbatim, when they are not all present as condition or
          group terms of the analysis.
      variation_level:
        range: ExtractedString
        description: The level a continuous term varies at, verbatim -- within subject, between subjects,
          or both; mapper normalizes. This is what separates a parametric modulation from a cross-subject
          regression.
      association_direction:
        range: ExtractedString
        description: Reported sign of a continuous term's coefficient, verbatim; mapper normalizes. Omit
          when the source reports no direction.
      functional_form:
        range: ExtractedString
        description: Shape of the term's relationship to the measure, verbatim -- linear, quadratic, a
          product, an absolute value, log-transformed, or a named transform; mapper normalizes. Do not
          report a non-linear or transformed term as linear.
      interaction_with:
        range: string
        multivalued: true
        description: local_ids of the other Term records this term is a product of, when the source names
          an interaction term.
      unit:
        range: ExtractedString
        description: Unit of a continuous term, verbatim, when meaningful.
  StatisticalMap:
    attributes:
      local_id:
        range: string
        required: true
      map_type:
        range: ExtractedString
      url:
        range: ExtractedString
      coordinate_space:
        range: ExtractedString
      is_thresholded:
        range: ExtractedValue
      statistic_type:
        range: ExtractedString
      description:
        range: ExtractedString
      availability_status:
        range: ExtractedString
  Condition:
    description: Extracted condition record.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      name:
        range: ExtractedString
        required: true
        description: Condition label as stated in the paper.
      description:
        range: ExtractedString
        description: Condition definition, verbatim.
  Table:
    description: Extracted table record.
    attributes:
      local_id:
        range: string
        required: true
        description: Short label assigned by the extractor.
      table_number:
        range: ExtractedString
        description: Printed table identifier, verbatim (e.g., "Table 2", "Supplementary Table S4").
      title:
        range: ExtractedString
        description: Table title, verbatim.
      caption:
        range: ExtractedString
        description: Full table caption, verbatim.
      footer:
        range: ExtractedString
        description: Table notes and footnotes, verbatim.
      coordinate_space:
        range: ExtractedString
        description: Coordinate space from the table header or caption; mapper normalizes.
      column_headings:
        range: ExtractedValue
        description: Ordered column headings, verbatim.
      description:
        range: ExtractedString
        description: Summary of the table's role in the study.
  GroupTerm:
    description: >-
      One participant cohort in an analysis, the side of the comparison it sits on, and how many of its
      participants the analysis included.
    attributes:
      group:
        range: string
        required: true
        description: local_id of the Group record.
      role:
        range: ExtractedString
        description: >-
          Which side of the comparison this cohort sits on, verbatim as the source frames it -- the greater
          side, the lesser side, or simply included without a direction; mapper normalizes. Omit when the
          source compares the cohorts but does not report which way the effect went.
      factor_levels:
        range: FactorLevel
        multivalued: true
        inlined_as_list: true
        description: >-
          The factorial cell this cohort represents, for a crossed design such as genotype by diagnosis.
          Leave empty for the ordinary case of one cohort per group.
      n:
        range: ExtractedInteger
        description: Participants from this cohort included in this analysis, when reported per analysis.
  ConditionTerm:
    description: One experimental condition entering an analysis and the side of the comparison it sits on.
    attributes:
      condition:
        range: string
        required: true
        description: local_id of the Condition record.
      label:
        range: ExtractedString
        description: The source's wording for this condition in this analysis, verbatim, when it differs
          from the Condition name.
      role:
        range: ExtractedString
        description: >-
          Which side of the comparison this condition sits on, verbatim as the source frames it; mapper
          normalizes. For an ordered contrast mark the extremes and leave the middle terms undirected,
          keeping the ordering in contrast_definition.
      factor_levels:
        range: FactorLevel
        multivalued: true
        inlined_as_list: true
        description: >-
          The factorial cell this condition represents. Record a factor held constant across the directional
          terms as well, with its constant level.
  FactorLevel:
    description: One factor and the level of it that a cohort or condition represents.
    attributes:
      factor_name:
        range: ExtractedString
        required: true
        description: Name of the experimental or participant factor, verbatim. Must match the name of a
          categorical Term of this analysis.
      level:
        range: ExtractedString
        required: true
        description: The level of that factor which this cohort or condition carries, verbatim.
  Measure:
    description: The scientific quantity of the map, in the source's own words.
    attributes:
      source_label:
        range: ExtractedString
        description: The paper's own term for the measure, verbatim, such as "BOLD signal change", "grey
          matter volume", or "fractional anisotropy". The mapper normalizes it to a family and a type.
      specific_metric:
        range: ExtractedString
        description: Named metric when the measure is a specific one, verbatim, such as fractional
          anisotropy, ALFF, or a named tracer binding potential.
      unit:
        range: ExtractedString
        description: Reported unit of the measure, verbatim, when meaningful.
  Statistic:
    description: The test statistic reported for an analysis and its degrees of freedom.
    attributes:
      family:
        range: ExtractedString
        description: Test statistic as reported, verbatim -- t, z, F, chi-square, a likelihood ratio, a
          beta, or a correlation; mapper normalizes.
      degrees_of_freedom_numerator:
        range: ExtractedNumber
        description: Numerator degrees of freedom, as reported. Normally only an F or a likelihood ratio
          has one.
      degrees_of_freedom_denominator:
        range: ExtractedNumber
        description: >-
          Denominator degrees of freedom, as reported. For a single-degree-of-freedom statistic this is the
          only one -- t(151) is F(1,151), so record 151 here and leave the numerator out.
  DecodingDetails:
    description: Method payload for a classification or pattern-discriminability analysis.
    attributes:
      decoded_variable:
        range: ExtractedString
        required: true
        description: The variable the classifier or discriminability test predicted, verbatim.
      classes:
        range: DecodingClass
        multivalued: true
        inlined_as_list: true
        description: The classes discriminated.
      performance_metric:
        range: ExtractedString
        required: true
        description: Reported performance measure, verbatim, such as accuracy, AUC, or d-prime.
      reference_value:
        range: ExtractedNumber
        description: Numeric reference the metric was compared against, when reported. What kind of
          reference it is goes in the analysis baseline.
      performance_relation:
        range: ExtractedString
        description: Whether performance was above or below the reference, verbatim; mapper normalizes.
      validation_scheme:
        range: ExtractedString
        description: Cross-validation or resampling scheme, verbatim, such as leave-one-run-out.
      generalization:
        range: ExtractedString
        description: Train and test split for cross-decoding, verbatim, when the analysis generalized
          across sets.
  DecodingClass:
    description: One class discriminated by a decoding analysis.
    attributes:
      label:
        range: ExtractedString
        required: true
        description: Class label as reported, verbatim.
      condition:
        range: string
        description: local_id of the Condition this class corresponds to, when it is one.
  SimilarityDetails:
    description: Method payload for a representational-similarity analysis.
    attributes:
      model:
        range: ExtractedString
        description: The model dissimilarity matrix tested, verbatim. Omit for a model-free test such as
          within- versus between-category pattern similarity.
      neural_representation:
        range: ExtractedString
        description: How the neural pattern was defined, verbatim, such as the voxel set or time window used.
      similarity_metric:
        range: ExtractedString
        description: Similarity or distance metric, verbatim.
      competing_models:
        range: ExtractedString
        multivalued: true
        description: Other models the reported model was compared against, verbatim.
  ConnectivityDetails:
    description: Method payload for a connectivity analysis.
    attributes:
      connectivity_method:
        range: ExtractedString
        required: true
        description: Method used to estimate connectivity, verbatim -- PPI, gPPI, seed-based correlation,
          DCM, Granger causality, or coherence; mapper normalizes.
      seed_regions:
        range: ExtractedString
        multivalued: true
        description: Seed or source regions, verbatim.
      target_regions:
        range: ExtractedString
        multivalued: true
        description: Target regions, verbatim. Empty for a seed-to-whole-brain analysis.
      parameter_sign:
        range: ExtractedString
        description: Sign of the connectivity parameter itself, verbatim, such as a negative PPI; mapper
          normalizes.
      parameter_change:
        range: ExtractedString
        description: Whether the experimental effect raised or lowered the connectivity parameter, verbatim;
          mapper normalizes.
      edges:
        range: ConnectivityEdge
        multivalued: true
        inlined_as_list: true
        description: Named region pairs, when the source reports specific edges.
      modulatory_input:
        range: ExtractedString
        description: Modulatory input of the model, verbatim, for DCM and related methods.
      inference_target:
        range: ExtractedString
        description: What the analysis drew inference about, verbatim -- a connectivity parameter, a model
          comparison, or a network; mapper normalizes.
  ConnectivityEdge:
    description: One reported connection between two named regions.
    attributes:
      source_region:
        range: ExtractedString
        required: true
        description: Source region, verbatim.
      target_region:
        range: ExtractedString
        required: true
        description: Target region, verbatim.
      directionality:
        range: ExtractedString
        description: >-
          Whether this edge is directed, verbatim; mapper normalizes. Only a directed model such as DCM or
          Granger causality supports a direction -- never infer one the method cannot support.
      parameter_sign:
        range: ExtractedString
        description: Sign of this edge's parameter, verbatim, when reported per edge.
  ConjunctionDetails:
    description: Method payload for a logical combination of independently defined effects.
    attributes:
      components:
        range: ConjunctionComponent
        multivalued: true
        inlined_as_list: true
        description: The independently defined effects that were combined.
      null_hypothesis:
        range: ExtractedString
        description: Which null hypothesis was tested, verbatim -- the global null or the conjunction null;
          mapper normalizes.
      implementation:
        range: ExtractedString
        description: Procedure that computed the conjunction, verbatim, such as a minimum-statistic test,
          masking, or a logical OR; mapper normalizes.
  ConjunctionComponent:
    description: One component effect of a conjunction.
    attributes:
      analysis:
        range: string
        description: local_id of the sibling Analysis record for this component, when it is separately
          reported.
      method:
        range: ExtractedString
        description: The component's own method, verbatim, when it is known and differs from the others.
      definition:
        range: ExtractedString
        required: true
        description: Statement of the component effect, verbatim, including its direction.
  ComponentDecompositionDetails:
    description: Method payload for ICA and related component maps.
    attributes:
      method:
        range: ExtractedString
        description: Decomposition method, verbatim, such as ICA, tensor ICA, PCA, or dictionary learning;
          mapper normalizes.
      component_id:
        range: ExtractedString
        required: true
        description: Identifier of the component within the decomposition, as reported.
      component_label:
        range: ExtractedString
        description: The source's name for the component, verbatim, such as a network label.
      total_components:
        range: ExtractedInteger
        description: Number of components the decomposition produced.
      selection_criterion:
        range: ExtractedString
        description: How this component was selected for reporting, verbatim.
      map_quantity:
        range: ExtractedString
        description: What the values of the reported map represent, verbatim -- a loading, a weight, a
          z-score, or a spatial map; mapper normalizes.
      polarity_semantics:
        range: ExtractedString
        description: >-
          Whether the sign of the map carries meaning, verbatim; mapper normalizes. Decomposition methods
          can return components whose polarity is arbitrary, in which case a negative loading is not a
          decrease.
  OtherAnalysisDetails:
    description: Method payload for a method outside the first-class families, such as a mediation analysis.
    attributes:
      method_label:
        range: ExtractedString
        required: true
        description: The source's name for the method, verbatim.
      structured_details:
        range: ExtractedString
        description: JSON-encoded method-specific payload, when the method has structure worth keeping. A
          string because the schema has no free-form object range.
      reason_first_class_type_not_used:
        range: ExtractedString
        required: true
        description: Why none of the five named method payloads fits this analysis.
      not_structurable_reason:
        range: ExtractedString
        description: >-
          Set only when the effect is grounded in the source but has no stable structured decomposition at
          all, naming why -- a method-specific derived metric, too little standard structure, or a source
          too vague. Leave empty when the method is merely outside the named families.
