id: https://neurostuff.org/schemas/neuroimaging-paper-parse/parse_enums
name: neuroimaging-paper-parse-enums
title: Neuroimaging Paper Parse Vocabularies
description: >-
  The vocabularies of the parsed paper and the coordinate parse. Coordinate roles and
  anchor kinds are not here: they are the storage schema's `CoordinateRole` and
  `AnchorKind`, imported, so that the parse's proposal and the record's verdict are written
  in the same words.
prefixes:
  linkml: https://w3id.org/linkml/
  parse: https://neurostuff.org/schemas/neuroimaging-paper-parse/
imports:
  - linkml:types
default_prefix: parse
default_range: string

enums:

  ArtifactKind:
    description: Which of the two parse artifacts a header belongs to.
    permissible_values:
      parsed_paper:
        description: Contract C2, a ParsedPaper.
      coordinate_parse:
        description: Contract C3, a CoordinateParse, original or revision.

  DocumentSource:
    description: >-
      Where the parsed text came from. Open vocabulary: a new source is added here when it
      is added to the download order, not discovered by a consumer.
    permissible_values:
      pmc:
        description: PubMed Central OA web service.
      europepmc:
        description: Europe PMC full-text XML.
      pubget:
        description: pubget's PMC download and parse.
      elsevier:
        description: Elsevier full-text API.
      ace:
        description: ACE HTML scraping.
      pdf:
        description: A PDF converted to text.

  SectionKind:
    description: What a span of the text is.
    permissible_values:
      title:
      abstract:
      introduction:
      methods:
      results:
      discussion:
      figure_legend:
      table:
        description: A table's rows, inlined into the text.
      supplement:
      references:
      other:

  MetaAnalysisBasis:
    description: What `ParsedPaper.is_meta_analysis` was decided from.
    permissible_values:
      publication_type:
        description: A PubMed publication type such as Meta-Analysis or Systematic Review.
      title:
        description: The title, when no publication type says so.
      publication_type_and_title:
        description: Both agree.

  CoordinateOrigin:
    description: Where a parsed analysis's points were read from.
    permissible_values:
      table:
        description: Rows of a table in `ParsedPaper.tables`.
      text:
        description: Sentences of the text, outside any table.
      figure:
        description: >-
          A result shown only in a figure, located by its legend or the sentence citing it.
          Its points are whatever the legend or the image states, often none.

  ReportedSpace:
    description: >-
      The coordinate space a point is in, normalized to the values NiMARE transforms between
      by `study_schema.spaces.normalize_space`. Absent when no space is stated, or when the
      wording names both MNI and TAL; never defaulted to MNI: a rat study stored as MNI is
      a wrong coordinate, and a missing one is an honest gap. What the paper printed stays
      in `space_as_printed`.
    permissible_values:
      MNI:
        description: Any MNI template (MNI152, MNI305, ICBM152, SPM's MNI).
      TAL:
        description: Talairach space, including Talairach-transformed MNI coordinates the paper reports as Talairach.
      OTHER:
        description: A stated space that is neither, such as a native, surface, or non-human template space.

  SpaceBasis:
    description: Where a space was read from, most specific first.
    permissible_values:
      point:
        description: The row or sentence holding the point.
      table_header:
      caption:
      footer:
      methods:
      results:
      extractor:
        description: The download source's own structured guess.

  StatisticKind:
    description: >-
      The kind of a value reported at a point. One vocabulary for the parse, the extraction
      record's `Statistic.family`, and neurostore's `PointValue.kind`. The ingestion
      workflow's letters map one to one: T, Z, F, D, G, R, B, P.

      Which side of a sign split a point is on follows from its values:

      - A negative value is always on the inverse side, whatever its kind. A negative p, F
        or chi-square means the column is signed or mislabelled.
      - Only p, F and chi-square are non-directional. Every other kind is directional,
        `other` included.
      - A missing or unknown kind splits by the value's sign, like a directional kind.
      - A point whose values are all p, F or chi-square, or that has none, is unsigned.

      The parse stores no sign of its own; readers derive it from `values` with
      `study_schema.statistics`.
    permissible_values:
      t:
        description: Student's t. Ingestion letter T.
        annotations:
          directional: true
      z:
        description: A z score. Ingestion letter Z.
        annotations:
          directional: true
      f:
        description: An F statistic. Ingestion letter F. Not directional.
      chi_square:
        description: Not directional.
      d:
        description: Cohen's d. Ingestion letter D.
        annotations:
          directional: true
      g:
        description: Hedges' g. Ingestion letter G.
        annotations:
          directional: true
      r:
        description: A correlation coefficient. Ingestion letter R.
        annotations:
          directional: true
      beta:
        description: A regression coefficient or parameter estimate. Ingestion letter B.
        annotations:
          directional: true
      p:
        description: >-
          A p value. Ingestion letter P. A significance level, not a statistic: never
          directional, and never the basis of a sign split.
      other:
        description: >-
          A kind the paper names and this list does not; `kind_as_printed` keeps the wording.
          Directional: it splits by the value's sign.

  SplitHalf:
    description: Which half of a sign split an analysis is.
    permissible_values:
      original:
        description: The analysis as named.
      inverse:
        description: >-
          The reversed contrast of the original. A consumer records it as the original's
          conditions with their weights negated.

  SplitRule:
    description: The deterministic rule that split an analysis.
    permissible_values:
      sign_of_directional_statistic:
        description: >-
          Points with a negative value form the inverse half; every other point, unsigned
          ones included, forms the original half. An unsigned point's side is
          the half it was placed in.

  AuditVerdict:
    description: pondie's verdict on one analysis of the parse it revises.
    permissible_values:
      accept:
        description: The analysis stands as proposed. Its key is unchanged.
      relabel:
        description: >-
          The same points, in a different role: an analysis proposed as a result that is a
          region of interest, a seed, a stimulation target. Its key is unchanged.
      split:
        description: The points belong to more than one analysis. The replacements have new keys.
      merge:
        description: >-
          The points belong with another analysis's. The merged analysis has a new key, and
          every analysis merged into it carries this verdict.
      omit:
        description: >-
          Not an analysis at all: a demographics table, a duplicate, coordinates quoted from
          another study. No replacement.
      add:
        description: >-
          An analysis the revised parse did not have, found while extracting the record: a
          null result stated in the text, a result shown only in a figure, a contrast reported
          without coordinates. `key` names the new analysis; it revises nothing.

  ClusterMeasure:
    description: The unit of a reported cluster size.
    permissible_values:
      voxels:
      mm3:
      cm3:
      other:

  TableReadingKind:
    description: What reading a table for coordinates found.
    permissible_values:
      coordinates:
        description: Analyses with points were read from it.
      contrasts_without_coordinates:
        description: >-
          It lists tested contrasts but reports no coordinates for them -- rows reading
          "n.s." or "none". Its analyses are in `analyses` with cells and no points.
      no_coordinates:
        description: >-
          It holds no coordinates and lists no contrasts: demographics, behaviour,
          acquisition parameters. No analysis was read from it.
      rejected_by_triage:
        description: Triage judged it not worth reading, so it was not read.
      excluded_by_hand:
        description: A person marked it as not a coordinate table, so it was not read.

  CorrectionKind:
    description: A notice attached to a paper by its publisher or indexer.
    permissible_values:
      erratum:
      retraction:
      expression_of_concern:
      comment:
      update:

  ThresholdLevel:
    description: The level a threshold applies at.
    permissible_values:
      height:
        description: Voxel- or vertex-wise, the cluster-forming threshold.
      cluster_extent:
        description: A minimum cluster size.
      cluster_level:
        description: A cluster-wise corrected p.
      peak_level:
        description: A peak-wise corrected p, applied after a height threshold.
      tfce:
        description: Threshold-free cluster enhancement.

  ThresholdQuantity:
    description: What a threshold's value is.
    permissible_values:
      p:
      t:
      z:
      f:
      voxels:
      mm3:

  ValueLevel:
    description: What a value at a point describes.
    permissible_values:
      peak:
      cluster:

  CorrectionMethod:
    description: How a p value or threshold was corrected for multiple comparisons.
    permissible_values:
      uncorrected:
      fwe:
        description: Family-wise error, by random field theory unless stated otherwise.
      fdr:
      bonferroni:
      monte_carlo:
        description: Simulated cluster-size correction, such as 3dClustSim or AlphaSim.
      permutation:
      small_volume:
        description: A correction within a region, such as SPM's small-volume correction.

  ReferenceProvider:
    description: Where a reference-list entry came from.
    permissible_values:
      europepmc:
        description: The Europe PMC references endpoint.
      crossref:
      semantic_scholar:
      pubmed:
      source_xml:
        description: The downloaded full text's own reference list, such as JATS `ref-list`.
      parsed_text:
        description: Parsed from plain text, the least reliable.

  CitationAlignment:
    description: How an in-text citation was tied to its reference entries.
    permissible_values:
      xref:
        description: >-
          Exact: the source marks the citation with the entry's id, as JATS `xref
          ref-type="bibr"` and Elsevier cross-references do.
      numbered:
        description: A bracketed or superscript number read as a list position.
      author_year:
        description: >-
          An author-year marker matched to an entry by first author's surname and year,
          with a letter suffix ("2001a") breaking ties.
      unaligned:
        description: A citation marker found but tied to no entry.
