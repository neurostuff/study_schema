id: https://neurostuff.org/schemas/neuroimaging-study-storage/study
name: neuroimaging-study-storage-study
title: Neuroimaging Study Storage Study Module
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
  - design
  - group
  - task
  - assessment
  - region
  - acquisition
  - analysis
default_prefix: neurostudy
default_range: string

classes:

  Study:
    tree_root: true
    description: >-
      The publication-level record that contains the groups,
      tasks, design, acquisitions, preprocessing pipelines, model estimations,
      analyses, and reported result tables belonging to one
      study. Conditions belong to the task they are part of, not to the study.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier for the study record, such as a DOI-based or repository-local 
          identifier.
      title:
        in_subset: [mvp, deterministic]
        range: string
        required: true
        description: Full title of the study or publication.
      description:
        in_subset: [mvp, model_extracted]
        range: string
        description: Brief free-text summary of the study aims and scope.
      hypothesis:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          The study's own statement of what it expected to find, quoted from the paper --
          usually the closing paragraph of the Introduction, in the form "we hypothesized
          that" or "we predicted that". Verbatim but for citation markers, one entry per
          prediction, so a study stating several gets several.

          A prediction, not a purpose. "The aim of this study was to examine whether
          connectivity differs between patients and controls" says what was tested and takes no
          value here; "we expected connectivity to be lower in patients" says what was expected
          and does. Recording an aim as a hypothesis asserts a direction the study never
          committed to, which is precisely what a reader consults this field to check.

          Absent when the paper states no prediction, which is common: never paraphrase an aim,
          an abstract sentence, or a finding into one. Where the only statement is in the
          Discussion -- "consistent with our hypothesis that connectivity would be lower" --
          quote that clause, which is still the study's account of what it predicted rather
          than `Analysis.interpretations`, the source's account of what it found.
      design:
        in_subset: [mvp, model_extracted]
        range: StudyDesign
        inlined: true
        description: >-
          The study's design outside its tasks: how participants were assigned, the arms they
          were assigned to, and the occasions data were collected on. The narrative design
          description is this record's own `description`.
      authors:
        in_subset: [mvp, deterministic]
        range: string
        multivalued: true
        description: Authors of the study or publication, in published order.
      journal:
        in_subset: [mvp, deterministic]
        range: string
        description: Journal or other publication venue.
      doi:
        in_subset: [mvp, deterministic]
        range: string
        description: Digital Object Identifier, without requiring a particular URL form.
      publication_year:
        in_subset: [mvp, deterministic]
        range: integer
        minimum_value: 1600
        description: Year in which the study was first published or made publicly available.
      language:
        in_subset: [mvp, deterministic]
        range: string
        multivalued: true
        description: >-
          Languages of the article, as the E-utilities API reports them -- the three-letter
          codes PubMed assigns, `eng` and the rest. Filled from the same `esummary` call
          that fills `study_type`, and not read off the paper: the text a reader is given
          is in one language whatever the article is indexed as.

          At least six of the benchmark's sixteen meta-analyses state "English language" as
          an inclusion criterion, and it was unexpressible. On the 1,804 records measured it
          excludes exactly one paper, so it buys precision rather than recall; the criterion
          is stated, so the field states it.

      study_type:
        in_subset: [mvp, deterministic]
        any_of:
          - range: StudyType
          - range: string
        multivalued: true
        required: true
        description: >-
          PubMed publication types for this record, verbatim as the E-utilities API returns
          them (https://pubmed.ncbi.nlm.nih.gov/help/#publication-types). Multivalued because
          PubMed assigns several: every article is `Journal Article` and the design of the study
          motivates other labels.
      groups:
        in_subset: [mvp, model_extracted]
        range: Group
        multivalued: true
        inlined_as_list: true
        description: Participant or demographic groups.
      tasks:
        in_subset: [mvp, model_extracted]
        range: Task
        multivalued: true
        inlined_as_list: true
        description: >-
          Task, resting-state, stimulation, passive-viewing, or other meaningful
          participant paradigms associated with study acquisitions. Each holds the
          conditions it was made of.
      assessments:
        in_subset: [mvp, model_extracted]
        range: Assessment
        multivalued: true
        inlined_as_list: true
        description: Measures of participants that were taken independently of an acquisition.
      regions:
        in_subset: [mvp, model_extracted]
        range: Region
        multivalued: true
        inlined_as_list: true
        description: >-
          Brain regions the study delimited and then used -- as connectivity seeds or targets,
          as the search space an analysis was restricted to, as the levels of a factor
          comparing regions, or as the signal a model term carries. Declared here once and
          referenced by identifier wherever used.
      devices:
        in_subset: [model_extracted]
        range: Device
        multivalued: true
        inlined_as_list: true
        description: >-
          The scanners, amplifiers, or recording systems the study collected data on.
          Declared here once and referenced by identifier.
      acquisitions:
        in_subset: [mvp, model_extracted]
        range: Acquisition
        multivalued: true
        inlined_as_list: true
        description: Image or signal acquisition protocols used in the study.
      preprocessings:
        in_subset: [model_extracted]
        range: Preprocessing
        multivalued: true
        inlined_as_list: true
        description: Preprocessing pipelines applied before statistical analysis.
      model_estimations:
        in_subset: [mvp, model_extracted]
        range: ModelEstimation
        multivalued: true
        inlined_as_list: true
        description: Model estimation records used by one or more analyses.
      inference_settings:
        in_subset: [model_extracted]
        range: InferenceSettings
        multivalued: true
        inlined_as_list: true
        description: >-
          Thresholding and correction schemes used by one or more analyses. Declared here
          once and referenced by identifier.
      measures:
        in_subset: [mvp, model_extracted]
        range: Measure
        multivalued: true
        inlined_as_list: true
        description: >-
          The scientific quantities the study measured, used by one or more analyses.
          Declared here once and referenced by identifier.
      analyses:
        in_subset: [mvp, model_extracted]
        range: Analysis
        multivalued: true
        inlined_as_list: true
        description: >-
          Distinct analyses or inferential tests reported by the study, including those that
          found nothing (`Analysis.outcome: no_significant_effect`) and those reported without
          coordinates. Whether an empty list means the paper reports none is
          `result_reporting`'s to say, not the list's.
      result_reporting:
        in_subset: [mvp, model_extracted]
        range: ResultReporting
        description: >-
          Whether the paper reports inferential analyses of its own. An empty `analyses` list
          is otherwise ambiguous: a methods or data paper that tests nothing and a paper the
          extractor read badly look the same. With this set, `no_analyses_reported` asserts
          the emptiness, with the sentences that show it as evidence.

          Says nothing about whether the analyses found anything; that is each
          `Analysis.outcome`, summarised in `outcome_summary`.
      outcome_summary:
        in_subset: [mvp, deterministic]
        range: OutcomeSummary
        description: >-
          What the study's analyses found, taken together: derived from `result_reporting`
          and the `Analysis.outcome` of every result analysis, so a study whose every analysis is null can be found
          and described as such rather than vanishing with its missing coordinates.
      tables:
        in_subset: [mvp, model_extracted]
        range: Table
        multivalued: true
        inlined_as_list: true
        description: Publication tables from which results or analysis metadata were extracted.
      coordinate_sets:
        in_subset: [mvp, model_extracted]
        range: CoordinateSet
        multivalued: true
        inlined_as_list: true
        description: >-
          Every group of coordinates the paper reports, in its tables or its text, with what
          each is for.
      external_datasets:
        in_subset: [model_extracted]
        range: ExternalDataset
        multivalued: true
        inlined_as_list: true
        description: Named external datasets used, cited, or made available by the study.

  ExternalDataset:
    description: A named external dataset, with an optional public location.
    attributes:
      name:
        in_subset: [model_extracted]
        range: string
        description: Dataset name as reported by the study or its repository.
      url:
        in_subset: [model_extracted]
        range: uri
        description: Optional landing-page, repository, or direct-access URL for the dataset.

enums:

  ResultReporting:
    in_subset: [mvp, model_extracted]
    description: Whether a paper reports inferential analyses of its own.
    permissible_values:
      analyses_reported:
        in_subset: [mvp, model_extracted]
        description: >-
          The paper reports at least one inferential test of its own. `analyses` lists them,
          null and coordinate-free ones included.
      no_analyses_reported:
        in_subset: [mvp, model_extracted]
        description: >-
          The paper reports no inferential test of its own: a methods, protocol, data, or
          purely descriptive paper, a review, a commentary. `analyses` is empty by assertion.
      analyses_reported_elsewhere:
        in_subset: [mvp, model_extracted]
        description: >-
          The paper's tests exist but are not in the text read: deferred to a companion
          paper, or to a supplement that was not available. `analyses` lists only what the
          text itself reports.

  OutcomeSummary:
    in_subset: [mvp, deterministic]
    description: What a study's analyses found, taken together.
    permissible_values:
      some_significant_effects:
        in_subset: [mvp, deterministic]
        description: >-
          At least one analysis has `outcome: significant_effect`.
      only_null_effects:
        in_subset: [mvp, deterministic]
        description: >-
          Every analysis has `outcome: no_significant_effect`. The study tested and found
          nothing; it has no coordinates for that reason, not for want of extraction.
      no_analyses:
        in_subset: [mvp, deterministic]
        description: >-
          `result_reporting` is `no_analyses_reported` or `analyses_reported_elsewhere`, and
          `analyses` is empty.
      undetermined:
        in_subset: [mvp, deterministic]
        description: >-
          No analysis reports a significant effect and at least one outcome was not reported,
          or `result_reporting` was not reported.

  StudyType:
    in_subset: [mvp, deterministic]
    description: >-
      PubMed publication types, spelled as the E-utilities API returns them so that a value
      needs no translation. Only the design-relevant types are listed; PubMed also returns
      funding and indexing types, and the vocabulary is open, so any unlisted type passes
      through verbatim.
    permissible_values:
      "Journal Article":
        in_subset: [mvp, deterministic]
        description: Assigned to every article; carries no design information on its own.
      "Meta-Analysis":
        in_subset: [mvp, deterministic]
        description: >-
          A quantitative synthesis of published results.
      "Systematic Review":
        in_subset: [mvp, deterministic]
        description: A structured synthesis with a search protocol but no pooled effect estimate.
      "Review":
        in_subset: [mvp, deterministic]
        description: A review without a systematic search protocol.
      "Randomized Controlled Trial":
        in_subset: [mvp, deterministic]
      "Clinical Trial":
        in_subset: [mvp, deterministic]
      "Observational Study":
        in_subset: [mvp, deterministic]
      "Comparative Study":
        in_subset: [mvp, deterministic]
      "Multicenter Study":
        in_subset: [mvp, deterministic]
      "Validation Study":
        in_subset: [mvp, deterministic]
      "Case Reports":
        in_subset: [mvp, deterministic]
        description: PubMed's spelling is plural.
      "Editorial":
        in_subset: [mvp, deterministic]
      "Letter":
        in_subset: [mvp, deterministic]
      "Comment":
        in_subset: [mvp, deterministic]
      "Preprint":
        in_subset: [mvp, deterministic]
      "Retracted Publication":
        in_subset: [mvp, deterministic]
