id: https://neurostuff.org/schemas/neuroimaging-study-storage/assessment
name: neuroimaging-study-storage-assessment
title: Neuroimaging Study Storage Assessment Module
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
default_prefix: neurostudy
default_range: string

classes:

  Assessment:
    description: >-
      A behavioral, cognitive, biological, clinical, or questionnaire-based instrument or
      procedure that produces participant-level measurements independently of
      the neuroimaging acquisition or experimental conditions.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier.
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Name of the assessment, such as Digit Span, MMSE, or BDI.
      description:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Description of the assessment and the measurements it produced, including the purpose
          the source gives for administering it -- establishing a group's diagnosis, screening a
          comorbidity, grading severity, characterizing everyone. That purpose is what decides
          whether a group may name this assessment as its `diagnostic_instrument`, and it is
          often the only sentence distinguishing the two.
      assessment_type:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Broad type, such as cognitive test, clinical scale, diagnostic interview, questionnaire,
          behavioral task, physiological measure, or a biospecimen assay such as salivary cortisol
          or a plasma marker. Free text rather than a vocabulary: create a category if none of
          these fit.

