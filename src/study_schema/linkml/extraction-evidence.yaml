id: https://neurostuff.org/schemas/extraction-evidence
name: extraction-evidence
title: Extraction Evidence Support Schema
description: >-
  Shared evidence and value-provenance types for schemas that record structured
  information extracted from source documents.

license: CC0-1.0
version: 0.3.0

prefixes:
  linkml: https://w3id.org/linkml/
  extraction_evidence: https://neurostuff.org/schemas/extraction-evidence/

imports:
  - linkml:types

default_prefix: extraction_evidence
default_range: string

enums:

  ExtractionStatus:
    description: Outcome of explicitly examining a requested attribute during extraction.
    permissible_values:
      extracted:
        description: A usable value was extracted or generated from source-supported information.
      not_reported:
        description: The attribute was examined but no value was found in the available source.

  UnreportedReason:
    description: >-
      Why a slot carries no value, when the reason is not the plain one. A qualifier on
      `extraction_status: not_reported`, never a second way to record silence -- missingness
      keeps one encoding, and a query asking what is missing still asks `extraction_status`
      alone.
      Omitted for plain silence, and that is the whole of the plain case: `not_reported`
      already says the attribute was examined and no value was found in the available
      source, so a token repeating it would add a word and no fact. What these four add is
      the cases that reading alone does not settle -- the source discusses the attribute
      without resolving it, the value is on a page this pass cannot read, the source defers
      to another publication, or the pass could not work it out. The last is a defect and
      the first three are not, and before this they were all one answer.
    permissible_values:
      ambiguous:
        description: >-
          The source addresses the attribute but settles on no single value -- two figures
          that disagree, or a range where the slot takes a point value. Something was read
          here; it did not resolve.
      outside_text:
        description: >-
          Stated in a part of the source this pass cannot read: a figure, a table available
          only as an image, a supplement that was not fetched. The value exists on the page
          and the page was not legible, which is a fact about the input rather than about the
          article.
      cited_elsewhere:
        description: >-
          The source gives the attribute by reference to another publication rather than
          stating it -- "acquisition parameters as described in [12]". Common in methods
          sections, and not silence: the article says where the answer is.
      undetermined:
        description: >-
          The pass could not settle the attribute and is not claiming the article is silent.
          The one value here that reports on the extraction rather than on the source, and
          the one a later pass should revisit: recording it is how a pass declines without
          the decline being mistaken for a finding.

  NormalizationStatus:
    description: Outcome of one normalizer reading one value.
    permissible_values:
      mapped:
        description: The normalizer placed the value on a term of its vocabulary.
      unmapped:
        description: >-
          The normalizer read the value and could not place it. A wording worth a rule,
          which an unset `normalized` is not: unset says no normalizer ran.
      ambiguous:
        description: >-
          Several terms matched and the normalizer chose none, rather than guess between them.
      absent:
        description: >-
          The value states an absence -- "no history of psychiatric illness", "healthy older
          adults" -- and was read as one: placed, and on no term.

  ValueSource:
    description: Describes how an extracted value relates to the source material.
    permissible_values:
      reported:
        description: Explicitly stated in the source, allowing minor lexical or formatting adaptation.
      generated:
        description: Created by the extraction system; evidence supports the underlying entity or concept.

  EvidenceStatus:
    description: Indicates whether source-text evidence was identified for an extracted value.
    permissible_values:
      present:
        description: At least one complete evidence set was identified.
      not_found:
        description: A value was extracted or generated but no supporting source-text evidence was identified.
      not_applicable:
        description: No value was extracted because the attribute was not reported.

  EvidenceSource:
    description: Which locator placed a set of spans in the source text.
    permissible_values:
      model_quote:
        description: >-
          The extraction model was shown the paper and asked to copy the supporting
          sentence; `build` then resolved that quote to offsets.
      retriever:
        description: >-
          The cross-encoder ranked sentence and table-row units against the value and cleared
          its margin gate, contributing a second set the model's quote did not already cover.
      literal_match:
        description: >-
          The value occurs exactly once in the document and this is the clause around that
          one occurrence, found by search before any model was asked. Distinct from
          `model_quote` because nothing read the paper to choose it, and from `repair_pass`
          because it is the first thing tried rather than a later correction. The strongest
          of the four to read: the span provably contains the value, and re-running the
          pass returns the same span rather than another sample.
      repair_pass:
        description: >-
          A later pass over the built record placed this span: either resolving the value's
          own text against the document, or applying a resolution the extraction model gave
          with a quote. Distinct from `model_quote` because the extractor did not cite it,
          and from `retriever` because nothing ranked it -- so a reviewer weighing it knows
          it rests on a pass that came after the reading it supports.

classes:

  ExtractedValue:
    description: >-
      A schema attribute explicitly examined during extraction, including its
      value, source, and supporting evidence.
    attributes:
      extraction_status:
        range: ExtractionStatus
        required: true
      value:
        range: Any
        description: >-
          Extracted or generated value. Populate when extraction_status is
          extracted; omit when it is not_reported.
      value_source:
        range: ValueSource
      unreported_reason:
        range: UnreportedReason
        description: >-
          Why there is no value, where the reason is not the plain one. Populate when
          extraction_status is not_reported and one of the four applies; omit when it is
          extracted, where there is nothing to explain.
          Absent is the ordinary case and claims nothing beyond the status: the attribute was
          examined and the source carries no value. Reading absence as "no pass looked" would
          contradict what `not_reported` already asserts, so nothing should.
      evidence:
        range: Evidence
        required: true
        inlined: true
      normalized:
        range: Normalization
        multivalued: true
        inlined_as_list: true
        description: >-
          What normalizers made of the value: one entry per vocabulary, list item and head.
          Written by the normalization pass after the value and evidence passes, never
          extracted; the source's wording stays in `value`, so the comparable value and the
          words it was read from sit side by side and can be checked against each other.
          Unset where no normalizer covers the slot, which is not the same as an entry whose
          status is `unmapped`: that says a normalizer read the value and could not place it.

  Normalization:
    description: >-
      One normalizer's reading of an extracted value onto a vocabulary: an assertion about
      the value, kept beside it rather than written over it. The first two passes record what
      the source says and where; this records what that means in a shared vocabulary, and
      which code said so.
    attributes:
      vocabulary:
        required: true
        description: >-
          The answer set the value was placed on: a name from the package's vocabulary
          manifest (`study_schema.vocabularies`: mondo, onvoc, canonical_task, task_family,
          condition_atom, condition_phase, contrast_key, contrast_set,
          contrast_set_orientation, medical_role), whose ids resolve against the release
          the manifest pins, or an enum this schema defines (AgeUnit). Records written
          before the manifest carry the legacy strings it lists (MONDO, astra canonical
          task, ns-pond contrast set <fit_id>).
      status:
        range: NormalizationStatus
        required: true
      value:
        description: >-
          The term's identifier or permissible value, as the vocabulary spells it. Populate
          when status is mapped; omit otherwise.
      label:
        description: The term's preferred label in its vocabulary.
      item:
        range: integer
        minimum_value: 0
        description: >-
          Which item of a list-valued `value` this entry reads, counting from 0. Omitted
          for a scalar value. A list's items normalize independently -- one of a group's
          conditions maps and the next does not -- so an entry has to say which it is about.
      head:
        description: >-
          The part of the value this entry is about, when one value names several things:
          one diagnosis in a comorbidity list that arrived as a single string. Omitted when
          the entry reads the whole value.
      qualifiers:
        multivalued: true
        description: >-
          Course or state words lifted off the value before lookup -- first-episode,
          remitted, treatment-resistant -- so the term stays the diagnosis and the
          qualification is not lost with the words it came from.
      rollup:
        range: boolean
        description: >-
          True when the term was reached by dropping part of what the value said, so it is
          broader than the source. Omitted when nothing was dropped.
      method:
        description: >-
          How the normalizer reached the term, in its own words: a decisive rule, a lexical
          match, an exact label, an embedding neighbour, a cluster, a citation, a review.
      also_read:
        multivalued: true
        description: >-
          Other slots of the same object the normalizer read besides this one, such as a
          task's `description` and `conditions` when its `name` is placed on a canonical task.
          An entity-level normalization is recorded on the entity's name, and this is what
          keeps that from reading as a judgement on the name alone.
      mapping_tool:
        required: true
        description: >-
          The normalizer that wrote this entry and its version, such as
          `pondie.normalization.age_unit 16a42d8`. SSSOM's `mapping_tool`. A rerun of a
          normalizer replaces the entries carrying its name and leaves other normalizers'
          entries alone.
      confidence:
        range: float
        minimum_value: 0
        maximum_value: 1
        description: >-
          The normalizer's score for this entry, from 0 to 1, where its method produces one.
          SSSOM's `confidence`.

  ExtractedString:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is text.
    slot_usage:
      value:
        range: string

  ExtractedInteger:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a whole number.
    slot_usage:
      value:
        range: integer

  ExtractedNumber:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is numeric, including fractional values.
    slot_usage:
      value:
        range: float

  ExtractedBoolean:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is true or false.
    slot_usage:
      value:
        range: boolean

  # A multivalued fact is one wrapper holding a list, not a list of wrappers. The list
  # usually comes from one sentence, so one evidence record covers all of it, and a list
  # of wrappers would ask for evidence per item that the source does not separate.

  ExtractedStringList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of strings, under one evidence record.
    slot_usage:
      value:
        range: string
        multivalued: true

  ExtractedIntegerList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of whole numbers, under one evidence record.
    slot_usage:
      value:
        range: integer
        multivalued: true

  ExtractedNumberList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of numbers, under one evidence record.
    slot_usage:
      value:
        range: float
        multivalued: true

  ExtractedBooleanList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of booleans, under one evidence record.
    slot_usage:
      value:
        range: boolean
        multivalued: true

  Evidence:
    description: Evidence associated with an extracted value.
    attributes:
      status:
        range: EvidenceStatus
        required: true
      sets:
        range: EvidenceSet
        multivalued: true
        inlined_as_list: true
      unlocated_quotes:
        range: integer
        minimum_value: 1
        description: >-
          How many quotes were offered for this value that no locator could place in the
          source text. Set by `build` and omitted where none were, so its presence is the
          claim.

          It exists because `status: not_found` collapsed two opposite faults. A value with
          no quote at all is a recall failure -- the pass never proposed support. A value
          whose quote was rejected is a fidelity failure -- support was proposed and
          `spans.resolve` could not match it character-for-character. The two have opposite
          fixes, and over 1,817 records 32,500 fields carried `value_source: reported` with
          `not_found` and no way to tell which of the two had happened, so the warning that
          fires on 98.6% of papers could not be acted on.

          The same argument `EvidenceSource` was added for, one level up: a distinction the
          pipeline already knows and the record did not carry.

  EvidenceSet:
    description: One independently sufficient set of source-text spans supporting a value.
    attributes:
      source:
        range: EvidenceSource
        description: >-
          Which locator produced this set. Two sets on one field were already two different
          locators -- the model's quote and the cross-encoder's union -- but only positionally,
          so nothing downstream could tell them apart or count how often each was right. A
          set added by a later repair pass is a third kind again, and a reviewer weighing a
          span should know which of the three they are reading.
      spans:
        range: EvidenceSpan
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1

  EvidenceSpan:
    description: An exact source-text span used as evidence for an extracted value.
    attributes:
      text:
        required: true
      start_char:
        range: integer
        required: true
        minimum_value: 0
      end_char:
        range: integer
        required: true
        minimum_value: 0
