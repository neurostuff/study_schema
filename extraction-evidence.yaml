id: https://neurostuff.org/schemas/extraction-evidence
name: extraction-evidence
title: Extraction Evidence Support Schema
description: >-
  Shared evidence and value-provenance types for schemas that record structured
  information extracted from source documents.

license: CC0-1.0
version: 0.2.0

prefixes:
  linkml: https://w3id.org/linkml/
  extraction_evidence: https://neurostuff.org/schemas/extraction-evidence/

imports:
  - linkml:types

default_prefix: extraction_evidence
default_range: string

enums:

  ExtractionStatus:
    description: Outcome of explicitly examining a requested attribute during extraction.
    permissible_values:
      extracted:
        description: A usable value was extracted or generated from source-supported information.
      not_reported:
        description: The attribute was examined but no value was found in the available source.

  UnreportedReason:
    description: >-
      Why a slot carries no value. A qualifier on `extraction_status: not_reported`, never a
      second way to record silence -- missingness keeps one encoding, and a query asking what
      is missing still asks `extraction_status` alone.
      It exists because the four situations below were one answer. A slot the article never
      mentions, one it discusses without settling, one whose value sits in a figure this pass
      cannot read, and one the pass simply could not work out all wrote `not_reported`, and
      nothing downstream could tell them apart -- so a wrongly declared silence, which is the
      one of the four that is a defect, was indistinguishable from the three that are not.
    permissible_values:
      silent:
        description: >-
          The source does not mention the attribute. The plain case, and the only one that
          asserts the article itself is the reason there is no value.
      ambiguous:
        description: >-
          The source addresses the attribute but settles on no single value -- two figures
          that disagree, or a range where the slot takes a point value. Something was read
          here; it did not resolve.
      outside_text:
        description: >-
          Stated in a part of the source this pass cannot read: a figure, a table available
          only as an image, a supplement that was not fetched. The value exists on the page
          and the page was not legible, which is a fact about the input rather than about the
          article.
      cited_elsewhere:
        description: >-
          The source gives the attribute by reference to another publication rather than
          stating it -- "acquisition parameters as described in [12]". Common in methods
          sections, and not silence: the article says where the answer is.
      undetermined:
        description: >-
          The pass could not settle the attribute and is not claiming the article is silent.
          The one value here that reports on the extraction rather than on the source, and
          the one a later pass should revisit: recording it is how a pass declines without
          the decline being mistaken for a finding.

  ValueSource:
    description: Describes how an extracted value relates to the source material.
    permissible_values:
      reported:
        description: Explicitly stated in the source, allowing minor lexical or formatting adaptation.
      generated:
        description: Created by the extraction system; evidence supports the underlying entity or concept.

  EvidenceStatus:
    description: Indicates whether source-text evidence was identified for an extracted value.
    permissible_values:
      present:
        description: At least one complete evidence set was identified.
      not_found:
        description: A value was extracted or generated but no supporting source-text evidence was identified.
      not_applicable:
        description: No value was extracted because the attribute was not reported.

  EvidenceSource:
    description: Which locator placed a set of spans in the source text.
    permissible_values:
      model_quote:
        description: >-
          The extraction model was shown the paper and asked to copy the supporting
          sentence; `build` then resolved that quote to offsets.
      retriever:
        description: >-
          The cross-encoder ranked sentence and table-row units against the value and cleared
          its margin gate, contributing a second set the model's quote did not already cover.
      literal_match:
        description: >-
          The value occurs exactly once in the document and this is the clause around that
          one occurrence, found by search before any model was asked. Distinct from
          `model_quote` because nothing read the paper to choose it, and from `repair_pass`
          because it is the first thing tried rather than a later correction. The strongest
          of the four to read: the span provably contains the value, and re-running the
          pass returns the same span rather than another sample.
      repair_pass:
        description: >-
          A later pass over the built record placed this span: either resolving the value's
          own text against the document, or applying a resolution the extraction model gave
          with a quote. Distinct from `model_quote` because the extractor did not cite it,
          and from `retriever` because nothing ranked it -- so a reviewer weighing it knows
          it rests on a pass that came after the reading it supports.

classes:

  ExtractedValue:
    description: >-
      A schema attribute explicitly examined during extraction, including its
      value, source, and supporting evidence.
    attributes:
      extraction_status:
        range: ExtractionStatus
        required: true
      value:
        range: Any
        description: >-
          Extracted or generated value. Populate when extraction_status is
          extracted; omit when it is not_reported.
      value_source:
        range: ValueSource
      unreported_reason:
        range: UnreportedReason
        description: >-
          Why there is no value. Populate when extraction_status is not_reported; omit when
          it is extracted, where there is nothing to explain.
          Optional, and absent means no pass has recorded a reason -- which is distinct from
          `silent`, a pass having looked and found the article says nothing. A record written
          before this slot existed carries neither.
      evidence:
        range: Evidence
        required: true
        inlined: true

  ExtractedString:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is text.
    slot_usage:
      value:
        range: string

  ExtractedInteger:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a whole number.
    slot_usage:
      value:
        range: integer

  ExtractedNumber:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is numeric, including fractional values.
    slot_usage:
      value:
        range: float

  ExtractedBoolean:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is true or false.
    slot_usage:
      value:
        range: boolean

  # A multivalued fact is one wrapper holding a list, not a list of wrappers. The list
  # usually comes from one sentence, so one evidence record covers all of it, and a list
  # of wrappers would ask for evidence per item that the source does not separate.

  ExtractedStringList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of strings, under one evidence record.
    slot_usage:
      value:
        range: string
        multivalued: true

  ExtractedIntegerList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of whole numbers, under one evidence record.
    slot_usage:
      value:
        range: integer
        multivalued: true

  ExtractedNumberList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of numbers, under one evidence record.
    slot_usage:
      value:
        range: float
        multivalued: true

  ExtractedBooleanList:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is a list of booleans, under one evidence record.
    slot_usage:
      value:
        range: boolean
        multivalued: true

  Evidence:
    description: Evidence associated with an extracted value.
    attributes:
      status:
        range: EvidenceStatus
        required: true
      sets:
        range: EvidenceSet
        multivalued: true
        inlined_as_list: true

  EvidenceSet:
    description: One independently sufficient set of source-text spans supporting a value.
    attributes:
      source:
        range: EvidenceSource
        description: >-
          Which locator produced this set. Two sets on one field were already two different
          locators -- the model's quote and the cross-encoder's union -- but only positionally,
          so nothing downstream could tell them apart or count how often each was right. A
          set added by a later repair pass is a third kind again, and a reviewer weighing a
          span should know which of the three they are reading.
      spans:
        range: EvidenceSpan
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1

  EvidenceSpan:
    description: An exact source-text span used as evidence for an extracted value.
    attributes:
      text:
        required: true
      start_char:
        range: integer
        required: true
        minimum_value: 0
      end_char:
        range: integer
        required: true
        minimum_value: 0
