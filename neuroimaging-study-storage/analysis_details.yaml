id: https://neurostuff.org/schemas/neuroimaging-study-storage/analysis_details
name: neuroimaging-study-storage-analysis-details
title: Neuroimaging Study Storage Analysis Details Module
description: >-
  Method-specific payloads for an Analysis, ported from analysis-schema v0.1.0-alpha.11.
  Exactly one subclass of AnalysisDetails applies to an Analysis, and which one is filled
  states the method. A mass-univariate analysis takes MassUnivariateDetails, which adds no
  fields of its own.

  These classes carry method specifics only. What was tested about the map always lives in
  Effect, whatever the method, so a connectivity, decoding, RSA, or component analysis states
  its tested effect in exactly the same fields a voxelwise GLM does.

  This module must not import the analysis module: Analysis.details ranges on
  AnalysisDetails, so the dependency runs the other way. Shared vocabularies therefore live
  in analysis_enums, and ConjunctionComponent references a sibling analysis by plain id.

  See storage-schema-design-notes.md for the reasoning behind this shape.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
  - analysis_enums
  - task
default_prefix: neurostudy
default_range: string

classes:

  AnalysisDetails:
    abstract: true
    description: >-
      Base class for the method-specific payload of one Analysis, instantiated only
      through its subclasses. Analysis.details is required, so exactly one subclass always
      applies.
    attributes:
      details_type:
        range: string
        designates_type: true
        required: true
        description: >-
          The concrete details subclass carried by this payload. Populated from the class
          itself, not extracted.
  MassUnivariateDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a voxelwise, vertexwise, or ROI-wise GLM, mixed-effects model, ANOVA,
      ANCOVA, or robust regression -- the default family. It adds no fields: what was
      tested is in Effect and how it was estimated is in ModelEstimation.
    attributes: {}

  DecodingDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a classification or pattern-discriminability analysis. Above-chance
      decoding is a simple_effect with a `chance` baseline; a between-group accuracy
      comparison is a contrast on the group axis; accuracy regressed on a behavioural
      score is a cross_subject_regression. Spatial scope is recorded on the Analysis,
      including for searchlight analyses.
    attributes:
      decoded_variable:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: The variable the classifier or discriminability test predicted.
      classes:
        in_subset: [model_extracted]
        range: DecodingClass
        multivalued: true
        inlined_as_list: true
        description: >-
          The classes discriminated. These are non-directional: direction, where it
          exists, is carried by Effect.
      performance_metrics:
        in_subset: [mvp, model_extracted]
        range: PerformanceMetric
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          The performance measures reported for this map, one entry each. Papers routinely give
          several of the same analysis -- accuracy with sensitivity and specificity, or accuracy
          with AUC -- and each carries its own value, so a single field would keep whichever the
          extractor happened to read first.
      validation_scheme:
        in_subset: [model_extracted]
        range: string
        description: Cross-validation or resampling scheme, such as leave-one-run-out.
      generalization:
        in_subset: [model_extracted]
        range: string
        description: Train/test split for cross-decoding, when the analysis generalized across sets.

  PerformanceMetric:
    description: One reported performance measure of a decoding analysis, and its value.
    attributes:
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          The measure as the source names it, such as accuracy, balanced accuracy, AUC,
          d-prime, sensitivity, specificity, or a correlation between predicted and observed
          scores.
      value:
        in_subset: [mvp, model_extracted]
        range: float
        description: >-
          The value as reported, in the source's own scale: a percentage and a proportion are
          both recorded as written rather than converted, since the scale is not always stated
          and converting would invent precision.
      reference_value:
        in_subset: [model_extracted]
        range: float
        description: >-
          Numeric reference this measure was compared against, when reported -- chance for an
          accuracy, zero for a correlation. Each measure carries its own: accuracy against
          chance and AUC against 0.5 are two references, not one. What kind of reference it is
          lives in Effect.baseline.
      relation:
        in_subset: [model_extracted]
        range: PerformanceRelation
        description: Direction of this measure relative to its own reference_value.

  DecodingClass:
    description: One class discriminated by a decoding analysis.
    attributes:
      label:
        in_subset: [model_extracted]
        range: string
        required: true
        description: >-
          The class label as the source names it, such as `faces` or `left hand`.
      condition:
        in_subset: [model_extracted]
        range: Condition
        inlined: false
        description: The experimental condition this class corresponds to, when it is one.

  SimilarityDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a representational-similarity analysis. The direction of a model-brain
      association is a continuous Term in Effect, with the model RDM as the term. Before
      choosing this family, check that the association is at the RDM level: a similarity
      regressor entered into a univariate GLM is a parametric modulation, not RSA.
    attributes:
      model:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The model RDM tested. Unset for a genuinely model-free test, such as within-
          versus between-category pattern similarity or dissimilarity against zero, which
          takes a `zero` baseline in Effect.
      neural_representation:
        in_subset: [model_extracted]
        range: string
        description: How the neural pattern was defined, such as the voxel set or time window used.
      similarity_metric:
        in_subset: [model_extracted]
        range: string
        description: >-
          Similarity or distance metric. The RDM distance metric and the model-brain
          association method are different facts, and crossnobis values are not comparable
          with correlation-distance values.
      competing_models:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: Other models the reported model was compared against.

  ConnectivityDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for an analysis of a relationship between regions, whether that relationship is
      estimated from a signal or across subjects. Signal-based connectivity is the common case;
      structural covariance -- correlating cortical thickness or volume between a seed region
      and every other, across participants rather than within one -- shares the same shape of
      answer, so it takes this payload with `structural_covariance` as its method. The
      psychological term of a PPI is a directional condition list in Effect. Brain regions stay
      source-grounded strings.
    attributes:
      connectivity_method:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: ConnectivityMethod
          - range: string
        required: true
        description: Method used to estimate connectivity.
      seed_regions:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: Seed or source regions, as named in the source.
      target_regions:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: Target regions, as named in the source. Empty for a seed-to-whole-brain analysis.
      parameter_sign:
        in_subset: [model_extracted]
        range: AssociationDirection
        description: >-
          Sign of the connectivity parameter itself, such as a negative PPI. Applies to
          the whole map.
      parameter_change:
        in_subset: [model_extracted]
        range: ParameterChange
        description: >-
          Whether the experimental effect raised or lowered the connectivity parameter.
          Applies to the whole map.
      edges:
        in_subset: [model_extracted]
        range: ConnectivityEdge
        multivalued: true
        inlined_as_list: true
        description: Named region pairs, when the source reports specific edges.
      modulatory_input:
        in_subset: [model_extracted]
        range: string
        description: Modulatory input of the model, for DCM and related methods.
      inference_target:
        in_subset: [model_extracted]
        any_of:
          - range: InferenceTarget
          - range: string
        description: >-
          What the statistical test was about: the strength of a connection, which of
          several models fits better, or a network taken as a whole. A model comparison
          and a parameter test answer different questions and are not poolable.
  ConnectivityEdge:
    description: One reported connection between two named regions.
    attributes:
      source_region:
        in_subset: [model_extracted]
        range: string
        required: true
        description: Source region, as named in the source.
      target_region:
        in_subset: [model_extracted]
        range: string
        required: true
        description: Target region, as named in the source.
      directionality:
        in_subset: [model_extracted]
        range: EdgeDirectionality
        description: >-
          Whether this edge is genuinely directed. Never infer a direction the method
          cannot support.
      parameter_sign:
        in_subset: [model_extracted]
        range: AssociationDirection
        description: >-
          Sign of this edge's parameter, when reported per edge rather than for the whole
          map.
  ConjunctionDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a conjunction. Effect.kind is the kind shared by the components; when
      they differ it says so in free text.
    attributes:
      components:
        in_subset: [model_extracted]
        range: ConjunctionComponent
        multivalued: true
        inlined_as_list: true
        description: The independently defined effects that were combined.
      null_hypothesis:
        in_subset: [mvp, model_extracted]
        range: NullHypothesis
        description: Which null hypothesis was tested. Only the conjunction null licenses the strong reading.
      implementation:
        in_subset: [model_extracted]
        any_of:
          - range: ConjunctionImplementation
          - range: string
        description: >-
          Procedure that computed the conjunction, recorded separately from the hypothesis
          it tested.
  ConjunctionComponent:
    description: >-
      One component effect of a conjunction, carrying its own direction in its
      definition.
    attributes:
      analysis_id:
        in_subset: [model_extracted]
        range: string
        description: >-
          Identifier of the sibling Analysis record for this component, when it is
          separately reported.
      analysis_type:
        in_subset: [model_extracted]
        any_of:
          - range: AnalysisType
          - range: string
        description: >-
          The component's own method, when it is known and differs from the others. A
          method the vocabulary cannot name is written here as free text.
      definition:
        in_subset: [model_extracted]
        range: string
        required: true
        description: Source-grounded statement of the component effect, including its direction.

  ComponentDecompositionDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a component decomposition. A component map reported without an
      inferential test matches no kind in the vocabulary, so effect.kind describes it in
      free text; a loading compared between groups or correlated with behaviour takes a
      contrast or a cross_subject_regression. Being representable here does not imply
      eligibility for coordinate-based meta-analysis.
    attributes:
      method:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: ComponentMethod
          - range: string
        description: >-
          The algorithm that produced the components, which decides what their values and
          signs mean.
      component_id:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Identifier of the component within the decomposition, as reported.
      component_label:
        in_subset: [model_extracted]
        range: string
        description: The source's name for the component, such as a network label.
      total_components:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of components the decomposition produced.
      selection_criterion:
        in_subset: [model_extracted]
        range: string
        description: How this component was selected for reporting.
      map_quantity:
        in_subset: [model_extracted]
        any_of:
          - range: MapQuantity
          - range: string
        description: What the values of the reported map represent.
      polarity_semantics:
        in_subset: [model_extracted]
        range: PolaritySemantics
        description: Whether the sign of the map carries meaning.

  OtherAnalysisDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a method outside the first-class families, such as a mediation analysis.
      Available for any analysis, so an unusual design never has to delete true terms in
      order to validate.
    attributes:
      method_label:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          The method's name as the source gives it. This is the only record of what the
          method was, so write what the paper calls it rather than a paraphrase.
      structured_details:
        in_subset: [model_extracted]
        range: string
        description: >-
          JSON-encoded method-specific payload, when the method has structure worth
          keeping.
      reason_first_class_type_not_used:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          Why no first-class details subclass fits this method.
  NotStructurableDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for an effect that is grounded in the source but has no stable structured
      decomposition. Analysis.definition remains required, so the meaning survives even
      though the structure does not.
    attributes:
      reason:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: NotStructurableReason
          - range: string
        required: true
        description: >-
          Which kind of obstacle prevented structuring, from a short vocabulary. Pairs
          with `explanation`, which says what specifically was lost.
      explanation:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          What specifically could not be represented, in the source's own terms. The
          reason gives the category; this gives the instance, so a reader can judge
          whether the effect is usable.
