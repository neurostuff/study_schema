id: https://neurostuff.org/schemas/neuroimaging-study-storage/task
name: neuroimaging-study-storage-task
title: Neuroimaging Study Storage Task Module
description: >-
  The paradigm participants performed, and the conditions it was made of.

prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
  - acquisition
  - design
default_prefix: neurostudy
default_range: string

classes:

  Task:
    description: >-
      A meaningful participant paradigm, such as a task, resting-state protocol,
      stimulation, or passive viewing, performed in association with an acquisition.
      A Task record is required wherever the study models conditions, a resting-state
      protocol included. Acquisitions with no paradigm do not require one, even in a
      longitudinal or interventional study: a structural comparison across occasions is
      carried by the Effect's timepoint terms and linked through Analysis.acquisitions.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
      name:
        in_subset: [mvp, model_extracted]
        range: string
        description: Short, unique label for the task or paradigm; corresponds conceptually to BIDS TaskName
          when applicable.
      description:
        in_subset: [mvp, model_extracted]
        range: string
        description: Complete narrative description of what participants experienced and did.
      conditions:
        in_subset: [mvp, model_extracted]
        range: Condition
        multivalued: true
        inlined_as_list: true
        description: >-
          The conditions this task was made of. These are the different states/modes of the task.
      design_type:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: DesignType
          - range: string
        description: >-
          How the task's events were modelled in time. Open vocabulary: write the source's
          own wording in the field when nothing here fits.
      acquisitions:
        in_subset: [mvp, model_extracted]
        range: Acquisition
        multivalued: true
        inlined: false
        description: >-
          The acquisition protocols used to collect data for this task.
          Exclude structural scans unless they are part of the task itself.
      presentation_software:
        in_subset: [model_extracted]
        range: string
        description: Stimulus-presentation software name, version, and operating system when reported.
      instructions:
        in_subset: [model_extracted]
        range: string
        description: Task- or paradigm-specific instructions given to participants.
      references:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          Works the source cites for this task, exactly as it writes them: an author-year
          citation or a bracketed reference number, kept in the source's own punctuation.
          Copy the in-text citation; do not resolve, expand or look it up.

          Multivalued -- a task may cite the paradigm's origin, an adaptation, and the
          stimulus set separately. Empty when the source cites nothing for the task.
      stimuli:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: >-
          The materials presented to participants, in the source's own terms -- the stimulus
          set, its name, how many items. One entry per distinct material;
          `stimulus_modality` carries the sensory channel.
      stimulus_type:
        in_subset: [mvp, model_extracted]
        range: StimulusType
        description: >-
          Standardized classification of the type of stimulus presented
          to participants. If more than one stimulus type is used in the
          task, use `Mixed`.

      response_modality:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: ResponseModality
          - range: string
        multivalued: true
        description: >-
          How participants responded. Multivalued because a paradigm often collects more than
          one -- a button press for accuracy and a spoken report afterwards.
      performance_measures:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: Behavioral variables recorded and summaries used to verify task performance.
      duration_seconds:
        in_subset: [mvp, model_extracted]
        range: string # Use string (or any_of: [float, string]) to support plain seconds, "EST: <val>", or "NS"
        description: >-
          Duration of the task inside the scanner in seconds for one scanning session.
          Recorded as reported value in seconds, estimated with 'EST: <value>', or 'NS' if not reliably determinable.
      combined_task_category:
        in_subset: [mvp, model_extracted]
        multivalued: true
        any_of:
          - range: CombinedTaskCategory
          - range: string
        description: >-
          The standardized category of any additional cognitive or behavioral task administered 
          alongside the primary Drug Cue Reactivity (FDCR) paradigm. Do not use this field to 
          classify the FDCR task itself; it is intended exclusively to capture secondary or 
          combined tasks performed concurrently within the same scanning session.

  Condition:
    description: >-
      A named condition of a task: a modelled state, event type, or baseline that an analysis
      can contrast against another. Only what happened inside the paradigm -- the occasion the
      task was run on and the arm it was run under are Timepoints and Arms, and enter an
      analysis as levels of their own model terms, compared by `Cell`s on the Effect.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier.
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Short condition label that distinguishes the condition from other task periods or modeled
          effects.
      stimulus_content:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          What this condition's stimuli were about -- their category, not the channel
          (`Task.stimulus_modality`) or the materials (`Task.stimuli`): a cigarette
          photograph is `cigarettes`. Faces, scenes, words, tones, music, food, money --
          examples, not a vocabulary.

          Leave unset where the stimulus does not distinguish this condition from the
          others: every n-back load level shows the same letters.
      condition_kind:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: ConditionKind
          - range: string
        description: >-
          What kind of state this was: an active task state, a rest or fixation period, or a
          state the source calls a control or neutral condition. A field of its own rather
          than a phrase in `description`, which a consumer cannot reliably read it out of.
      description:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Complete definition of the condition, including whether it put a demand on the
          participant. Whether it was a rest, fixation, or control state belongs in
          `condition_kind`.

          A rest or fixation period inside another paradigm is a Condition of that paradigm's
          Task. A standalone resting-state run is not: it is its own Task, with one condition or
          none. The distinction is which paradigm the participant was in, not what they were
          doing -- a fixation baseline between working-memory blocks belongs to the
          working-memory Task.

          What a tested effect was measured against is not recorded here: a contrast against this
          condition gives it a `negative` cell, and a contrast against the unmodelled implicit
          baseline has no second cell.

enums:

  ConditionKind:
    in_subset: [mvp, model_extracted]
    description: >-
      What kind of state a condition was, in itself. Open vocabulary: write the source's own
      wording in the field when nothing here fits.

      Intrinsic to the condition and not its role in any one contrast. What a tested effect
      was measured against is carried by `Cell.direction`, which a contrast fills for each
      side; a condition can be the comparator in one analysis and the target in another, and
      recording that here would make it a property of the wrong thing.
    permissible_values:
      task_state:
        description: >-
          An active state the paradigm put the participant in -- viewing cues, performing a
          trial, responding. The default, and the one most conditions are.
      rest:
        description: >-
          A period with no task demand, in which the participant was asked only to rest. A
          rest block inside another paradigm; a standalone resting-state run is its own Task.
      fixation:
        description: >-
          A period spent fixating a cross or point, with no other demand. Distinguished from
          `rest` because papers report them separately and use them differently.
      control_state:
        description: >-
          A state the source itself calls a control, neutral, or comparison condition --
          matched to the state of interest on everything but the manipulation. Recorded
          because the source labelled it so, not because a contrast used it that way.

  DesignType:
    in_subset: [mvp, model_extracted]
    description: >-
      How a task's events were modelled in time -- not what the task was or what it showed.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      block:
        in_subset: [mvp, model_extracted]
        description: >-
          Conditions presented in extended runs of like trials and modelled as those runs.
          Covers `blocked`, `block design` and a randomised or alternating block order:
          randomisation is how the blocks were sequenced, not a different design. In cases where the cue has a dynamic nature, such as a video or a script, and has been presented for more than 10 seconds, it should be classified as block.
      event_related:
        in_subset: [mvp, model_extracted]
        description: >-
          Individual trials modelled as separate events. Rapid, slow and fast variants are
          this design at different inter-stimulus intervals; write the source's phrase in
          the field when that distinction matters. In cases where the cue has a dynamic nature, such as a video or a script, and has been presented for more than 10 seconds, it should be classified as block.
      mixed:
        in_subset: [mvp, model_extracted]
        description: >-
          Both in one run -- events modelled within blocks that are themselves modelled.
          Only where the source says it used both, not where a block design happens to have
          trials.
      continuous:
        in_subset: [mvp, model_extracted]
        description: >-
          No discrete events modelled: resting state, film or music played through,
          naturalistic viewing. The task ran continuously and the analysis is of that run.

  StimulusModality:
    in_subset: [mvp, model_extracted]
    description: >-
      The sensory channel a task's stimuli were delivered through.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      visual:
        in_subset: [mvp, model_extracted]
        description: >-
          Anything seen -- photographs, faces, scenes, words on a screen, film clips,
          gratings, a fixation cross. The commonest modality in the literature by a wide
          margin, and the one a named stimulus set usually implies.
      auditory:
        in_subset: [mvp, model_extracted]
        description: Anything heard -- speech, tones, music, environmental sounds, noise bursts.
      tactile:
        in_subset: [mvp, model_extracted]
        description: >-
          Touch or somatosensory delivery -- brushing, vibration, pressure, temperature,
          electrical or noxious stimulation of the skin.
      olfactory:
        in_subset: [mvp, model_extracted]
        description: An odour delivered to the nose.
      gustatory:
        in_subset: [mvp, model_extracted]
        description: A taste delivered to the mouth -- sucrose, quinine, juice, a tasteless control.
      interoceptive:
        in_subset: [mvp, model_extracted]
        description: >-
          A stimulus acting on internal state rather than an external sense -- gastric or
          bladder distension, inspiratory load, infusion, induced hunger or thirst.
      none:
        in_subset: [mvp, model_extracted]
        description: >-
          A positive assertion that no stimulus was presented -- resting state, or a task
          driven entirely by instruction or self-generated thought. Not the same as leaving
          the field empty, which says nobody looked.

  ResponseModality:
    in_subset: [mvp, model_extracted]
    description: >-
      How participants responded during a task.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      button_press:
        in_subset: [mvp, model_extracted]
        description: >-
          A discrete report on a button box, keypad, keyboard, joystick, or mouse. The
          commonest response in the literature by a wide margin.
      hand_movement:
        in_subset: [mvp, model_extracted]
        description: >-
          A hand or arm movement that is itself the response rather than a report -- finger
          tapping, a sequence, grasping, reaching, writing, drawing.
      speech:
        in_subset: [mvp, model_extracted]
        description: An overt vocal response -- naming, reading aloud, answering, generating words.
      covert_response:
        in_subset: [mvp, model_extracted]
        description: >-
          A response made silently and not emitted -- covert naming, subvocal rehearsal,
          imagined movement, counting to oneself. CogPO's covert response: real, instructed, and
          unobservable, so no accuracy comes with it.
      eye_movement:
        in_subset: [mvp, model_extracted]
        description: A saccade, antisaccade, smooth pursuit, fixation shift, or instructed blink.
      foot_or_leg_movement:
        in_subset: [mvp, model_extracted]
        description: A pedal press, foot or toe tapping, or ankle or leg movement.
      oral_nonspeech:
        in_subset: [mvp, model_extracted]
        description: >-
          A mouth or airway action that is not speech -- swallowing, chewing, tongue or jaw
          movement, a breath hold.
      none:
        in_subset: [mvp, model_extracted]
        description: >-
          The task required no response: passive viewing or listening, film watching, resting
          state. A positive statement, and not the same as leaving the field empty.
  StimulusType:
    in_subset: [mvp, model_extracted]
    description: >-
      Standardized classification of the type of stimulus presented
      to participants.
    permissible_values:
      semantic:
        description: >-
          Semantic or conceptual stimuli, such as words or other
          meaning-based information, where the presentation type is not
          better classified as visual, auditory, etc.
      visual_picture:
        description: A static visual image or picture.
      visual_video_without_audio:
        description: A visual video presented without an audio component.
      visual_video_with_audio:
        description: A visual video presented with an audio component.
      auditory:
        description: Auditory stimuli presented through sound.
      olfactory:
        description: Odor or smell stimuli.
      taste:
        description: Taste or gustatory stimuli.
      tactile:
        description: Touch or somatosensory stimuli.
      imaginary:
        description: Stimuli generated through instructed imagery or imagination.
      mixed:
        description: >-
          More than one stimulus type is used in the task.
  CombinedTaskCategory:
    permissible_values:
      working_memory:
        description: Working Memory
      perception:
        description: Perception
      interference_resolution:
        description: Interference Resolution
      decision_reward:
        description: Decision / Reward
      attention:
        description: Attention
      approach:
        description: Approach
      avoidance:
        description: Avoidance
      response_inhibition:
        description: Response Inhibition

