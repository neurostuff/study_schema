id: https://neurostuff.org/schemas/neuroimaging-study-storage/group
name: neuroimaging-study-storage-group
title: Neuroimaging Study Storage Group Module
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
  - design
  - assessment
default_prefix: neurostudy
default_range: string

classes:
  ExtractedMainDesignType:
    is_a: ExtractedValue
    description: >-
      Standardized main experimental design type extracted from the study.
    slot_usage:
      value:
        range: MainDesignType
        required: true
        description: >-
          Strictly one of Block, Event-Related, or NS. Follow coding guidelines
          for continuous/dynamic cues (classify as Block).


  Group:
    description: >-
      An aggregate participant group and its reported demographics.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Study-local group label, for example healthy controls or patients with Parkinson disease.
      description:
        in_subset: [mvp, model_extracted]
        range: string
        description: Narrative definition of the group and its role in the study.
      species:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: Species
          - range: string
        required: true
        description: >-
          The species of this cohort.
      arm:
        in_subset: [mvp, model_extracted]
        range: Arm
        inlined: false
        description: >-
          The arm this cohort was allocated to. Set it whenever a cohort was allocated to one,
          which is the parallel-group case: every participant of this cohort received this arm
          and no other. A crossover study allocates nobody to one arm, so its cohorts leave this
          empty and an arm reaches an analysis only as a level of a model term, through
          `FactorLevel.arms`. Distinct from `medication_status`, which is the on/off state during
          acquisition rather than the allocation.
      approached_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of prospective participants approached for this group.
      consented_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number who consented or assented to participate.
      enrolled_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number enrolled after screening and before acquisition.
      acquired_count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number for whom data were acquired or who were scanned.
      excluded_count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number excluded after consent, enrollment, acquisition, and quality control.
      inclusion_criteria:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: Eligibility requirements that a participant had to satisfy for membership in this group.
      exclusion_criteria:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: Screening, imaging-safety, clinical, behavioral, or quality-control criteria causing 
          exclusion.
      recruitment_method:
        in_subset: [model_extracted]
        range: string
        description: How, where, and from what setting participants were recruited.
      recruitment_dates:
        in_subset: [model_extracted]
        range: string
        description: >-
          Free-text recruitment period when the source does not support a precise
          normalized date range; examples include January 2021 to June 2022,
          2018-2020, or autumn 2023.
      age_mean:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Mean participant age in the unit given by age_unit.
      age_standard_deviation:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Standard deviation of participant age in the unit given by age_unit.
      age_minimum:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Youngest age reported for the group.
      age_maximum:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Oldest age reported for the group.
      age_median:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Median participant age for the group.
      age_unit:
        in_subset: [mvp, model_extracted]
        range: string
        description: Unit used for age summaries, normally years but potentially months, weeks, or gestational
          weeks.
      age_unit_normalized:
        in_subset: [deterministic]
        range: AgeUnit
        description: >-
          `age_unit` folded onto a fixed set. **Derived, not extracted**:
          `pondie.normalization.age_unit` sets it from the source's own wording, which is
          kept in `age_unit`.

          Without it the age fields are not comparable across studies: `6` under "months"
          and `6` under "years" are the same number, and a filter on age reads every
          neonatal and infant cohort wrong. `UNKNOWN` where the wording does not say --
          not `years`, because assuming the common case is what makes that error silent.
      sex_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Aggregate phenotypic sex distribution. Use one entry per reported category,
          with the study's category label and a count and/or percentage.
          A cohort described wholly as one sex reports its distribution without ever
          printing a breakdown: "22 male smokers", "young women (n = 8)" and "ten male
          patients" are each one entry whose count is the whole group, plus a second
          entry for the absent sex with a count of zero. Read a demographics table row
          ("N female | 5") exactly as you would read the same fact in a sentence. Extract the participant count whenever it is available, including from Table 1, demographic tables, or the Methods section. Do not leave sex missing when the article reports the numbers of male and female participants.
      gender_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Aggregate self-described gender distribution, kept separate from
          phenotypic sex. Use one entry per reported category.
      handedness_distribution:
        in_subset: [model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Aggregate handedness distribution. Use one entry per reported category,
          such as right-handed, left-handed, or ambidextrous.
      race_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: Aggregate racial distribution using the study-reported category labels.
      ethnicity_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: Aggregate ethnic distribution using the study-reported category labels.
      is_healthy:
        in_subset: [mvp, deterministic]
        range: boolean
        description: >-
          Whether this cohort is free of medical, neurological and psychiatric conditions.
          **Derived, not extracted**: code sets it from `medical_condition`, so it cannot
          disagree with it.

          True when the group records no condition, or records only an assertion of absence
          ("no neurological or psychiatric disorder", "healthy controls"). False when any
          entry is a condition. Unset when `medical_condition` was never extracted -- that
          is not a healthy cohort, it is an unread one.

          Derived rather than asked because the source's own wording does not settle it: the
          addiction and obesity literature says "healthy" to mean free of comorbidity.
      population_characteristics:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          How this cohort **deviates from the typical**, where no other field covers it:
          habitual exposure (heavy caffeine use, social drinkers, smoking status), training
          or expertise (athletes, musicians, bilinguals, gamers), occupation or social role
          (veterans, undergraduates, shift workers), lifestyle (sedentary, vegetarian,
          meditation practitioners), and body habitus where it is atypical (obese,
          overweight, underweight).

          Deviation is the test, and it is what makes this field worth querying. A study
          selects its cohort for something; that something is what belongs here. The
          unremarkable does not: "normal weight", "healthy weight", "typically developing",
          "right-handed", "no hearing loss" and an ordinary age range describe a cohort that
          was not selected for anything, and recording them fills the field with the absence
          of information. If every plausible cohort could carry the value, leave it out.

          **Every other Group slot takes priority.** Nothing here that belongs in `age_mean`,
          `age_minimum`, `age_maximum`, `age_median`, `sex_distribution`,
          `gender_distribution`, `handedness_distribution`, `race_distribution`,
          `ethnicity_distribution`, `education_summary`, `socioeconomic_status_summary`,
          `medications`, `medication_status`, `recruitment_method`, `species`,
          `inclusion_criteria`, `exclusion_criteria` or `medical_condition`. "All Caucasian"
          is `race_distribution`; "children aged 8-11" is `age_minimum` and `age_maximum`;
          "five participants were female" is `sex_distribution`.

          Not a diagnosis either. Where a trait is also the cohort's condition -- alcohol
          dependence, obesity as a diagnosed disease -- `medical_condition` takes it alone,
          which is where a clinician would look.

          What was screened out is not a characteristic. "Excluding caffeine" in an exclusion
          list says nothing about caffeine use in the cohort.
      other_characteristics:
        in_subset: [mvp, deterministic]
        range: string
        multivalued: true
        description: >-
          Cohort traits that are true but not selective: the entries moved out of
          `population_characteristics` because every plausible cohort could carry them.
          "normal weight", "typically developing", "right-handed", "normal or
          corrected-to-normal vision", "no history of neurological illness", "MRI
          compatible", "native English speakers" are the recurring forms.

          **Derived, not extracted.** `pondie.normalization.population_characteristics`
          partitions the extracted list and code writes this side of it, so the slot is
          never put to a model. It exists because the alternative to moving these values is
          dropping them, which loses a cohort detail a reader auditing the study wants to
          see.

          The partition is by selectivity, not by truth. A value here is not wrong; it is
          a value no query can usefully filter on, which is the only reason it cannot share
          a field with the trait a study chose its cohort for.

          Asymmetric where the literature is: "right-handed" is normative and "left-handed"
          or "mixed-handed" is selective, because a study recruiting left-handers recruited
          for that. Likewise a negated *condition* is normative ("no psychiatric history")
          and a negated *exposure* is not ("no history of smoking" defines the control arm
          of a smoking study).
      drug_or_behaviour:
        in_subset: [mvp, model_extracted]
        range: DrugOrBehaviour
        description: >-
          The primary substance, addictive behaviour, or special category
          defining the participant group. Use only the standardized terms
          in DrugOrBehaviour. If the group includes more than one substance
          or addictive behaviour, use `Multiple`. Use `Healthy` for healthy
          control groups.
      group_type:
        in_subset: [mvp, model_extracted]
        range: GroupType
        description: >-
          Standardized classification of the participant group based on
          addiction status and treatment/abstinence status. Select the
          category that best represents the primary and most comprehensive
          group represented in the study.
          

      diagnostic_system:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Classification system and edition under which this group's `medical_condition` was
          diagnosed, such as DSM-5 or ICD-10. An edition that appears only inside an
          instrument's title does not establish it: "SCID for DSM-IV Axis II Disorders",
          administered to screen comorbidities, says nothing about the system used to diagnose
          the condition that defines the group.
      diagnostic_instrument:
        in_subset: [mvp, model_extracted]
        range: Assessment
        multivalued: true
        inlined: false
        description: >-
          The study assessment that established this group's defining condition -- the
          `medical_condition` entries, or for a healthy group its confirmed absence. Naming one
          here claims it classified this cohort, which is narrower than having been administered
          to it: an interview screening a comorbidity the group is not defined by, or grading
          the severity of a diagnosis made elsewhere, is recorded in `assessments` and pointed
          at from nowhere. Groups defined by enrollment or history rather than by an assessment
          -- a treatment programme's patients, self-reported users -- name nothing, as do
          sources reporting a diagnostic system but never the instrument applying it. Every
          entry must also appear in the study's `assessments`.
      clinical_characteristics:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Disease duration, severity, treatment status, or other clinically relevant summaries.
      medications:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: >-
          The drugs or other agents this cohort was taking, as the source names them, one agent
          per entry. Names only.
      medication_status:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Whether the cohort was medicated, unmedicated, drug-naive, or withdrawn, and the on/off
          medication state during acquisition or testing. The state, not the agents: which drugs
          they were taking is `medications`.
      education_summary:
        in_subset: [model_extracted]
        range: string
        description: Aggregate education level and the measurement or coding system used.
      socioeconomic_status_summary:
        in_subset: [model_extracted]
        range: string
        description: Aggregate socioeconomic status and the instrument or proxy used to measure it.
      sample_source:
        in_subset: [mvp, model_extracted]
        range: SampleSource
        description: >-
          Where this group's participants came from. `recruited` when they were enrolled for
          this study and no other source is stated; `public_dataset` when they were drawn
          from a named public or consortium dataset; `previously_reported` when the same or
          an overlapping sample was already reported in another publication.

          On the group and not the study, because overlap is routinely partial: a study may
          scan a fresh patient group against controls taken from an existing dataset, and a
          study-level flag cannot say which. `Study.external_datasets` remains the place for
          a named dataset the study as a whole used.

          A protocol, preprocessing pipeline or analysis "described previously" is a shared
          METHOD and leaves this `recruited`; so does comparing findings to earlier
          literature in the discussion. Only a statement that these same people were
          scanned, studied or reported before counts, and a source that means it normally
          says so in one sentence.

          `recruited` is an assertion and not the absence of one. A meta-analysis excluding
          overlapping samples has to distinguish a study that recruited freshly from one
          nobody checked, and an unfilled field cannot.
      sample_source_reference:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The dataset name, or the prior publication as the source cites it: an author-year
          citation, a bracketed reference number, or a trial registration number, copied as
          written. Without it the overlap is known but not actionable -- deciding whether two
          papers are one independent sample needs the identity of the other one.
      sample_overlap_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: >-
          How many of this group were in that prior report, when the source says so. It is
          the difference between two papers being one sample and their sharing part of one,
          which is the difference between dropping a study and down-weighting it.

  CategoryDistribution:
    description: >-
      One category in an aggregate participant distribution. Labels are free text, kept in
      the study's own terminology. At least one of count or percentage should be supplied
      when the source reports a quantitative distribution.
    attributes:
      category:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          The distribution bucket counted by this entry, labelled as the study writes it
          and not normalized to any external scheme: `female`, `left-handed`, `Hispanic or
          Latino`.
      category_normalized:
        in_subset: [deterministic]
        range: string
        description: >-
          `category` folded onto the answer set for the distribution this entry belongs to.
          **Derived, not extracted**: `pondie.normalization.sex_distribution` and
          `pondie.normalization.handedness_distribution` set it, and `category` keeps the
          study's own wording.

          The answer set depends on the slot, which is why the range is open here rather
          than an enum: sex folds to MALE/FEMALE/OTHER/UNKNOWN, handedness to
          RIGHT/LEFT/AMBIDEXTROUS/OTHER/UNKNOWN. A distribution with no normalizer --
          gender, race, ethnicity -- leaves this unset rather than guessing.

          Unset is not UNKNOWN. UNKNOWN says a normalizer read the wording and could not
          place it, which is a wording worth a rule; unset says none ran.
      count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number of participants assigned to this category.
      percentage:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: Percentage of the relevant group in this category.
      denominator:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number of participants used as the denominator for the percentage.
      reporting_framework:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The classification system the study used for these categories, in its own
          words, such as the OMB or NIH race and ethnicity categories, a named
          handedness inventory, or a self-report question's answer set.

enums:

  DrugOrBehaviour:
    in_subset: [mvp, model_extracted]
    description: >-
      Standardized substance, addictive behaviour, or special category
      defining the participant group.
    permissible_values:
      Alcohol:
        description: Alcohol-related use or addiction.
      Cannabis:
        description: Cannabis-related use or addiction.
      Cocaine:
        description: Cocaine-related use or addiction.
      Heroin:
        description: Heroin-related use or addiction.
      Inhalant:
        description: Inhalant-related use or addiction.
      Methamphetamine:
        description: Methamphetamine-related use or addiction.
      Nicotine:
        description: Nicotine-related use or addiction.
      Opioids:
        description: Opioid-related use or addiction, excluding heroin when heroin is specifically identified.
      Gambling:
        description: Gambling-related behavioural addiction.
      Videogaming:
        description: Videogaming-related behavioural addiction.
      Multiple:
        description: >-
          More than one substance or addictive behaviour is represented
          in the primary group.
      Healthy:
        description: Healthy control participants with no addiction.


  GroupType:
    in_subset: [mvp, model_extracted]
    description: >-
      Standardized participant-group classification for addiction-related
      studies.
    permissible_values:
      healthy:
        description: >-
          Participants with no addiction or healthy control participants.

      User:
        description: >-
          Substance users without a clinical addiction diagnosis.

      Ad_Treated:
        description: >-
          Participants with addiction who are receiving treatment or were
          recruited from a treatment setting.

      AD-Untreated:
        description: >-
          Participants with addiction who are not currently receiving treatment.

      LTA:
        description: >-
          Long-term abstinent participants with a history of substance use
          disorder who are currently abstinent and not receiving treatment.



  AgeUnit:
    in_subset: [deterministic]
    description: >-
      The unit the age summaries are in, folded from the source's wording. Closed, because
      the point of the field is that two studies' ages are comparable, and an open range
      would put that back where it started.
    permissible_values:
      years:
        description: The default in adult and most developmental work.
      months:
        description: Infant and toddler cohorts, and some clinical follow-up.
      weeks:
        description: Postnatal weeks.
      gestational_weeks:
        description: >-
          Weeks since the last menstrual period, not since birth. Kept apart from `weeks`
          because the two count from different zeros and a preterm cohort reports both.
      UNKNOWN:
        description: >-
          The wording does not say. Distinct from `years`: assuming the common case is
          what makes a misread infant cohort silent.

  SampleSource:
    in_subset: [mvp, model_extracted]
    description: >-
      Where a participant group came from. Closed, because the three cases carry different
      consequences for pooling and a fourth would be a judgement rather than a source.
    permissible_values:
      recruited:
        in_subset: [mvp, model_extracted]
        description: Enrolled for this study, with no other source stated.
      public_dataset:
        in_subset: [mvp, model_extracted]
        description: Drawn from a named public or consortium dataset.
      previously_reported:
        in_subset: [mvp, model_extracted]
        description: >-
          The same or an overlapping sample was already reported in another publication.

  Species:
    in_subset: [mvp, model_extracted]
    description: >-
      Species of a participant cohort. The listed values are the ones neuroimaging uses often;
      open vocabulary, so write the source's own wording in the field for anything else.
    permissible_values:
      human:
        in_subset: [mvp, model_extracted]
      macaque:
        in_subset: [mvp, model_extracted]
      marmoset:
        in_subset: [mvp, model_extracted]
      baboon:
        in_subset: [mvp, model_extracted]
      rat:
        in_subset: [mvp, model_extracted]
      mouse:
        in_subset: [mvp, model_extracted]
  

