id: https://neurostuff.org/schemas/neuroimaging-study-storage/group
name: neuroimaging-study-storage-group
title: Neuroimaging Study Storage Group Module
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
default_prefix: neurostudy
default_range: string

classes:

  Group:
    description: >-
      An aggregate participant group and its reported demographics. The counts here follow the
      recruitment funnel down to acquisition; how many of the cohort a given analysis included is
      GroupTerm.n, so the analysed size of a cohort is the sum over its terms rather than a field
      of its own.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Study-local group label, for example healthy controls or patients with Parkinson disease.
      description:
        in_subset: [mvp, model_extracted]
        range: string
        description: Narrative definition of the group and its role in the study.
      species:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: Species
          - range: string
        required: true
        description: >-
          The species of this cohort. Required, and populated for human cohorts as well as
          animal ones: everything else on this class -- age in years, a DSM-5 diagnosis, a
          handedness distribution -- reads as human by default, so an empty value cannot be
          told apart from a question never asked.
      approached_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of prospective participants approached for this group.
      consented_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number who consented or assented to participate.
      enrolled_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number enrolled after screening and before acquisition.
      acquired_count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number for whom data were acquired or who were scanned.
      excluded_count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number excluded after consent, enrollment, acquisition, and quality control.
      inclusion_criteria:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: Eligibility requirements that a participant had to satisfy for membership in this group.
      exclusion_criteria:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: Screening, imaging-safety, clinical, behavioral, or quality-control criteria causing 
          exclusion.
      recruitment_method:
        in_subset: [model_extracted]
        range: string
        description: How, where, and from what setting participants were recruited.
      recruitment_dates:
        in_subset: [model_extracted]
        range: string
        description: >-
          Free-text recruitment period when the source does not support a precise
          normalized date range; examples include January 2021 to June 2022,
          2018-2020, or autumn 2023.
      age_mean:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Mean participant age in the unit given by age_unit.
      age_standard_deviation:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Standard deviation of participant age in the unit given by age_unit.
      age_minimum:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Youngest age reported for the group.
      age_maximum:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Oldest age reported for the group.
      age_median:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Median participant age when reported instead of or in addition to the mean.
      age_unit:
        in_subset: [mvp, model_extracted]
        range: string
        description: Unit used for age summaries, normally years but potentially months, weeks, or gestational
          weeks.
      sex_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Aggregate phenotypic sex distribution. Use one entry per reported category,
          with the study's category label and a count and/or percentage.
      gender_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Aggregate self-described gender distribution, kept separate from
          phenotypic sex. Use one entry per reported category.
      handedness_distribution:
        in_subset: [model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: >-
          Aggregate handedness distribution. Use one entry per reported category,
          such as right-handed, left-handed, or ambidextrous.
      race_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: Aggregate racial distribution using the study-reported category labels.
      ethnicity_distribution:
        in_subset: [mvp, model_extracted]
        range: CategoryDistribution
        multivalued: true
        inlined_as_list: true
        description: Aggregate ethnic distribution using the study-reported category labels.
      medical_condition:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          Medical, neurological, psychiatric, developmental, or physiological
          condition(s) defining or characterizing the group.
      diagnostic_system:
        in_subset: [mvp, model_extracted]
        range: string
        description: Diagnostic classification system and edition, such as DSM-5 or ICD-10.
      diagnostic_instrument:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: Interview, inventory, test, or other instrument used to establish diagnosis.
      clinical_characteristics:
        in_subset: [mvp, model_extracted]
        range: string
        description: Disease duration, severity, treatment status, comorbidities, or other clinically relevant
          summaries.
      medication_status:
        in_subset: [mvp, model_extracted]
        range: string
        description: Medication exposure and on/off medication state during acquisition or testing.
      education_summary:
        in_subset: [model_extracted]
        range: string
        description: Aggregate education level and the measurement or coding system used.
      socioeconomic_status_summary:
        in_subset: [model_extracted]
        range: string
        description: Aggregate socioeconomic status and the instrument or proxy used to measure it.

  CategoryDistribution:
    description: >-
      One category in an aggregate participant distribution. Category labels are
      free text so the schema can preserve study-specific terminology without
      imposing a closed vocabulary. At least one of count or percentage should be
      supplied when the source reports a quantitative distribution.
    attributes:
      category:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Free-text category label used by the study.
      count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number of participants assigned to this category.
      percentage:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: Percentage of the relevant group in this category.
      denominator:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number of participants used as the denominator for the percentage.
      reporting_framework:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The classification system the study used for these categories, in its own
          words, such as the OMB or NIH race and ethnicity categories, a named
          handedness inventory, or a self-report question's answer set. Free-text
          categories are only comparable across studies when the scheme behind them is
          known, which is what this records.

enums:

  Species:
    in_subset: [mvp, model_extracted]
    description: >-
      Species of a participant cohort. The listed values are the ones neuroimaging uses often;
      open vocabulary, so write the source's own wording in the field for anything else.
    permissible_values:
      human:
        in_subset: [mvp, model_extracted]
      macaque:
        in_subset: [mvp, model_extracted]
      marmoset:
        in_subset: [mvp, model_extracted]
      baboon:
        in_subset: [mvp, model_extracted]
      rat:
        in_subset: [mvp, model_extracted]
      mouse:
        in_subset: [mvp, model_extracted]
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source does not identify the species.
