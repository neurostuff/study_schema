id: https://neurostuff.org/schemas/neuroimaging-study-storage/analysis
name: neuroimaging-study-storage-analysis
title: Neuroimaging Study Storage Analysis Module
description: >-
  A reported analysis and the effect it tested.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
  - acquisition
  - design
  - task
  - group
  - assessment
  - analysis_enums
  - analysis_details
default_prefix: neurostudy
default_range: string

classes:

  Analysis:
    description: >-
      A distinct reported inferential map or tested effect, linking its source
      acquisitions, sample, paradigm context, tested effect, preprocessing, model
      estimation, inference settings, and source result tables.

      Create one Analysis for each distinct tested effect. Separate Analyses are required
      when normalized direction, participant-group comparison, method, effect.kind, seed or
      connectivity model, decoded variable, component identity, or spatial_scope differ, and
      when an omnibus effect and its directional post-hoc contrast are both reported. ROI
      definitions, acquisition summaries, descriptive sample tables, and masks without
      inferential effects are not Analyses.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Study-local label for the analysis or inferential result, in the source's words.
      definition:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          Precise statement of the tested effect in the source's own words, minimally
          cleaned. Always source-grounded. For an interaction it must state the direction of
          the interaction as the source states it; for an ordered contrast it must keep the
          ordering that the greater and lesser roles cannot express.
      prespecification:
        in_subset: [mvp, model_extracted]
        range: Prespecification
        required: true
        description: >-
          Whether this contrast was planned before the data were seen or arrived at
          afterwards.
      interpretations:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: >-
          Model-inferred reading of what the analysis measures, typically the process the
          authors assert this contrast or model measures. Never treated as a source claim:
          being in this slot is what marks a reading as inferred.
      spatial_scope:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: SpatialScope
          - range: string
        required: true
        description: Spatial domain of the analysis.
      spatial_unit:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: SpatialUnit
          - range: string
        description: >-
          The element the analysis was carried out over. Distinct from spatial_scope, which
          gives the extent: a whole-brain analysis can be voxelwise or vertexwise, and an ROI
          analysis can average a region or test its parcels. Record it rather than inferring
          it from coordinate_space.
      roi_definition:
        in_subset: [mvp, model_extracted]
        range: RoiDefinition
        required: true
        description: >-
          How the region of interest was defined, which is primarily a statement about
          independence. Must be not_applicable for whole-brain and searchlight analyses,
          and must not be not_applicable when spatial_scope is roi.
      roi_label:
        in_subset: [model_extracted]
        range: string
        description: >-
          The atlas, parcellation, or region name, in the source's words.
      measure:
        in_subset: [mvp, model_extracted]
        range: Measure
        inlined: true
        required: true
        description: The scientific quantity of the map, independent of the statistic used to test it.
      groups:
        in_subset: [mvp, model_extracted]
        range: GroupTerm
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          The participant cohorts in the analysis and the side of the comparison each sits
          on. Groups are participant cohorts only: a task state is a Condition, an occasion
          is a Timepoint, an arm the same participants crossed into is an Arm, and each has
          its own directional term on the Effect.
      effect:
        in_subset: [mvp, model_extracted]
        range: Effect
        inlined: true
        required: true
        description: What was tested about the map. Universal across every method.
      details:
        in_subset: [mvp, model_extracted]
        range: AnalysisDetails
        inlined: true
        required: true
        description: >-
          The method that produced the map, and its method-specific payload. Which subclass
          is filled states the method. A voxelwise, vertexwise, or ROI-wise GLM,
          mixed-effects model, ANOVA, ANCOVA, or robust regression takes
          MassUnivariateDetails; a method outside the first-class families takes
          OtherAnalysisDetails and names itself in method_label.
      acquisitions:
        in_subset: [mvp, model_extracted]
        range: Acquisition
        multivalued: true
        inlined: false
        description: >-
          Acquisition protocols supplying data to this analysis. Structural, diffusion,
          and other non-paradigm analyses are linked directly through this field.
      tasks:
        in_subset: [mvp, model_extracted]
        range: Task
        multivalued: true
        inlined: false
        description: >-
          The participant paradigms that contextualize this analysis. An analysis can span
          paradigms, as a cross-task conjunction or a localizer-plus-main-task analysis does.
          Analyses without a paradigm leave this empty and are linked through acquisitions.
      model_estimation:
        in_subset: [mvp, model_extracted]
        range: ModelEstimation
        inlined: false
        required: true
        description: >-
          The model this analysis's contrast was taken from: its family, estimator, stage,
          software, and the terms it was specified with. What was selected out of those
          terms is `effect`. Required, because every contrast comes from a model -- a paper
          that describes a contrast and never names an estimator still takes a record, with
          the terms it does state and `unstated` elsewhere. Analyses sharing one design
          reference one record; an analysis specified or estimated differently takes its
          own.
      inference_settings:
        in_subset: [model_extracted]
        range: InferenceSettings
        inlined: true
        description: Structured thresholding and correction metadata for this reported analysis.
      preprocessing:
        in_subset: [model_extracted]
        range: Preprocessing
        inlined: false
        description: The preprocessing pipeline that produced the analyzed data.
      tables:
        in_subset: [mvp, deterministic]
        range: Table
        multivalued: true
        inlined: false
        description: The source tables reporting results for this analysis.
      statistical_maps:
        in_subset: [deterministic]
        range: StatisticalMap
        multivalued: true
        inlined_as_list: true
        description: Statistical maps made available for this analysis.
      coordinate_space:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Coordinate reference space or template the spatial results are reported in, such as
          MNI152 or Talairach. The fallback of two places this can live: populated only when no
          table of this analysis gives the space, which happens when the parse does not recover
          one or the analysis is reported without a coordinate table. Exactly one of the two is
          filled, never both, so a value here means the tables were silent. An analysis on a
          surface reports a surface template, which is why the space does not follow from
          spatial_unit.
      assessments:
        in_subset: [mvp, model_extracted]
        range: Assessment
        multivalued: true
        inlined: false
        description: Assessments whose measurements were used in or selected the sample for this analysis.
      model_representation_notes:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Model components that could not be represented or were represented only
          approximately, for an analysis whose method is otherwise first-class. Examples
          include random slopes, latent variables, dynamic connectivity, and dependencies
          between terms. An analysis whose method has no stable structured decomposition
          at all takes NotStructurableDetails instead.
    rules:
      - description: Whole-brain and searchlight analyses have no region of interest to define.
        preconditions:
          slot_conditions:
            spatial_scope:
              any_of:
                - equals_string: whole_brain
                - equals_string: searchlight
        postconditions:
          slot_conditions:
            roi_definition:
              equals_string: not_applicable
      - description: An ROI analysis must say how the region was defined.
        preconditions:
          slot_conditions:
            spatial_scope:
              equals_string: roi
        postconditions:
          none_of:
            - slot_conditions:
                roi_definition:
                  equals_string: not_applicable

  Effect:
    description: >-
      The inferential quantity tested about a map. Applies unchanged to every
      method, so the method and the effect never compete for the same field.
      Estimation facts -- model family, estimator, stage, software -- are not here: they
      belong to the model that produced the map and live on ModelEstimation.
    attributes:
      kind:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: EffectKind
          - range: string
        required: true
        description: >-
          The kind of effect tested, which follows from which terms carry direction: mark
          the directions visible in the source and the kind follows.

          The derivation counts *axes* carrying direction. There are
          four -- the cohorts on Analysis.groups and the conditions, occasions and arms on
          this Effect -- and they are treated alike: a primary continuous term makes the
          effect a modulation or a regression whatever else is directional, one directional
          axis makes it a contrast, and two or more make it an interaction.

          "A primary continuous term" is now a join: a `TermUse` here with role `primary`
          whose referenced `ModelTerm` has type `continuous`. The role is a fact about this
          contrast and the type a fact about the model, which is why they sit apart.

          A term pattern matching no kind in the vocabulary takes a short characterization
          of the tested effect instead -- a mediated path, a dose-response curve, a
          component map reported with no inferential test. Never delete true terms to make
          a kind fit.
      baseline:
        in_subset: [mvp, model_extracted]
        range: Baseline
        description: >-
          What the map was tested against. not_applicable unless the effect is a
          one-sample test or a contrast against a baseline condition. Do not invent a
          baseline condition: if the baseline is a modelled condition such as rest or
          fixation, give it a `lesser` condition term, which makes the effect a contrast.
      path:
        in_subset: [mvp, model_extracted]
        range: EffectPath
        description: >-
          Whether the tested quantity is a mediated path. not_applicable in the normal
          case. A value other than not_applicable requires a term with role `mediator`,
          and such a term requires such a path; the structural validator enforces the
          pair.
      conditions:
        in_subset: [mvp, model_extracted]
        range: ConditionTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The experimental conditions entering the effect and the side of the comparison
          each sits on. When the map being tested is itself a contrast, its condition terms
          go here with their roles, so the contrast stays queryable whatever the effect
          kind is.
      timepoints:
        in_subset: [mvp, model_extracted]
        range: TimepointTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The occasions entering the effect and the side of the comparison each sits on. This
          is what makes a pre-post comparison expressible without a task: a longitudinal
          structural contrast carries two directional timepoint terms and no conditions at all.
      arms:
        in_subset: [mvp, model_extracted]
        range: ArmTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The arms entering the effect and the side of the comparison each sits on. Use it when
          the same participants passed through several arms; when the arms are separate
          cohorts, the comparison is between Groups and the allocation is on `Group.arm`.
      terms:
        in_subset: [mvp, model_extracted]
        range: TermUse
        multivalued: true
        inlined_as_list: true
        description: >-
          Which of the model's terms this contrast uses, and how. The terms themselves --
          what they are, what they range over, what they are measured in -- are
          `ModelEstimation.terms`, stated once for the model; this slot says only what
          differs contrast to contrast. A term of the model that this contrast neither
          tests nor controls for is simply absent here.
      statistic:
        in_subset: [mvp, model_extracted]
        range: Statistic
        inlined: true
        required: true
        description: >-
          The statistic this effect was tested with, and its degrees of freedom. Not the
          value of the statistic at any location -- peak magnitudes belong to the reported
          coordinates.
  Statistic:
    description: >-
      A test statistic and its degrees of freedom. Statistic values -- peak magnitudes,
      p-values, cluster extents -- belong to the reported coordinates.
    attributes:
      family:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: StatisticFamily
          - range: string
        required: true
        description: >-
          Which statistic was used. Independent of the thresholding procedure: a t-test
          corrected by permutation is still a `t`.
      degrees_of_freedom_numerator:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: >-
          Numerator degrees of freedom, normally populated only for f and
          likelihood_ratio. A single-degree-of-freedom statistic leaves this unset, since
          t(151) is F(1,151).
      degrees_of_freedom_denominator:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: >-
          Denominator degrees of freedom, used alone for t, correlation, and chi_square.
          Both are unset for z. Float, so corrected degrees of freedom such as a
          Greenhouse-Geisser adjustment can be recorded as reported.
  Measure:
    description: >-
      The scientific quantity of the map, independent of the statistic used to test it.
      When a paper alternates terms for the same map -- grey matter concentration in
      Methods and volume in Results -- take the Methods term for type and keep both
      wordings in source_label.
    attributes:
      family:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: MeasureFamily
          - range: string
        required: true
        description: Broad imaging or signal family, for coarse filtering.
      type:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: MeasureType
          - range: string
        required: true
        description: Normalized quantity, for cross-study queries.
      source_label:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The paper's own term for the measure. Unset only when the source does not
          identify the measure.
      specific_metric:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Named metric when type is intentionally broad, such as fractional anisotropy,
          ALFF, fALFF, or a specific tracer binding potential.
      unit:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The unit the measure is reported in, when the source gives one and it carries
          information -- mm for a thickness, mL for a volume. Omitted for a unitless
          quantity such as a correlation or a normalized index.
  DirectionalTerm:
    abstract: true
    description: >-
      One entity entering a comparison, and the side of it that entity sits on. The four
      directional axes -- cohort, condition, occasion, arm -- differ only in what they
      point at, so what they share is stated once here and each subclass adds its own
      pointer. Which cell of a factorial design the entity occupies is not here: that is a
      property of the model, held by the `ModelTerm` whose levels name the entity.
    attributes:
      label:
        in_subset: [model_extracted]
        range: string
        description: >-
          The source's wording for this entity in this comparison, when it differs from
          the entity record's own name.
      role:
        in_subset: [mvp, model_extracted]
        range: DirectionalRole
        required: true
        description: >-
          Which side of the comparison this entity sits on. Direction is normalized to
          roles, never numeric contrast weights. For an ordered comparison, mark the
          extremes greater and lesser, leave intermediate entries `included`, and keep the
          ordering in Analysis.definition.

  GroupTerm:
    is_a: DirectionalTerm
    description: >-
      One participant cohort in an analysis, and the side of the comparison it sits on.
    unique_keys:
      group_per_analysis:
        unique_key_slots:
          - group
    attributes:
      group:
        in_subset: [mvp, model_extracted]
        range: Group
        required: true
        inlined: false
        description: >-
          The cohort this term refers to, by identifier. The cohort's own properties are
          on the Group record; what is here is its part in this analysis.
      n:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: >-
          Number of participants from this cohort included in this analysis. This is where a
          cohort's analysed size lives -- Group carries the recruitment funnel down to
          acquisition and nothing past it -- so populate it whenever the source gives a number,
          and expect it to be smaller than the acquired count when an analysis drops
          participants for motion or missing data.
  ConditionTerm:
    is_a: DirectionalTerm
    description: >-
      One condition entering an effect, and the side of the comparison it sits on.
    slot_usage:
      label:
        in_subset: [mvp, model_extracted]
    unique_keys:
      condition_per_effect:
        unique_key_slots:
          - condition
    attributes:
      condition:
        in_subset: [mvp, model_extracted]
        range: Condition
        required: true
        inlined: false
        description: >-
          The condition this term refers to, by identifier. The condition's own
          properties, including what kind of thing it is, are on the Condition record.
  TimepointTerm:
    is_a: DirectionalTerm
    description: >-
      One occasion entering an effect, and the side of the comparison it sits on. A directional
      pair of these is what separates a within-person change from a cross-sectional comparison,
      and it needs no Condition and no Task: a longitudinal structural analysis has occasions
      but no paradigm.
    unique_keys:
      timepoint_per_effect:
        unique_key_slots:
          - timepoint
    attributes:
      timepoint:
        in_subset: [mvp, model_extracted]
        range: Timepoint
        required: true
        inlined: false
        description: >-
          The occasion this term refers to, by identifier. The occasion's own properties are
          on the Timepoint record; what is here is its part in this effect.

  ArmTerm:
    is_a: DirectionalTerm
    description: >-
      One arm entering an effect, and the side of the comparison it sits on. Used for a
      within-subject comparison of arms, as in a crossover; when the arms are separate cohorts
      the comparison is carried by GroupTerm and the allocation by `Group.arm`.
    unique_keys:
      arm_per_effect:
        unique_key_slots:
          - arm
    attributes:
      arm:
        in_subset: [mvp, model_extracted]
        range: Arm
        required: true
        inlined: false
        description: >-
          The arm this term refers to, by identifier. The arm's own properties, including what
          class of thing it delivered, are on the Arm record.

  TermUse:
    description: >-
      One of the model's terms as this contrast uses it. Everything about what the term
      *is* lives on the referenced ModelTerm, stated once for the model; what is here is
      only what can differ between two contrasts taken from the same design matrix.
    unique_keys:
      term_per_effect:
        unique_key_slots:
          - term
    attributes:
      term:
        in_subset: [mvp, model_extracted]
        range: ModelTerm
        required: true
        inlined: false
        description: >-
          The model term this use refers to, by identifier. It must be one of the terms on
          the ModelEstimation the containing Analysis references; the structural validator
          enforces that, which is what the old match between FactorLevel.factor_name and a
          Term name became.
      role:
        in_subset: [mvp, model_extracted]
        range: TermRole
        required: true
        description: >-
          How the term enters *this* contrast, not a statement about importance. Per
          contrast rather than per model: a factorial model yields both a main-effect and an
          interaction contrast, and a factor tested by one is merely controlled for by the
          other. The derived effect kind reads only `primary` uses, so marking a controlled
          covariate primary asserts that the paper tested it. More than one primary use is
          allowed.

          A `nuisance` use is recorded rather than left implicit. The model's full term list
          is on ModelEstimation, so a term absent from this slot could be one the contrast
          did not weight or one the extractor never reached; saying `nuisance` is what
          distinguishes them, on the same grounds as `ResponseMode: none`.
      association_direction:
        in_subset: [mvp, model_extracted]
        range: AssociationDirection
        description: >-
          Sign of the term's coefficient as this contrast reports it, or of the interaction
          coefficient for a product term. A result rather than a specification.

  Preprocessing:
    description: >-
      An ordered preprocessing pipeline applied to acquired data before or as
      part of statistical modeling. The fields cover the core COBIDAS reporting areas.
    attributes:
      id:
        in_subset: [deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      description:
        in_subset: [model_extracted]
        range: string
        description: Narrative overview of the pipeline, its inputs, outputs, and intended purpose.
      software:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: Software packages or methods used, including version and revision identifiers.
      steps:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: >-
          Ordered free-text preprocessing operation names, listed in execution order;
          examples include slice-timing correction, motion correction, distortion
          correction, spatial normalization, and smoothing. The smoothing kernel itself is
          `smoothing_fwhm_mm` rather than a phrase in this list, because it is the one
          preprocessing parameter a synthesis filters on.
      smoothing_fwhm_mm:
        in_subset: [mvp, model_extracted]
        range: float
        multivalued: true
        minimum_value: 0
        description: >-
          Full width at half maximum of the applied spatial smoothing kernel, in
          millimetres: a list of one value for an isotropic kernel and of three for an
          anisotropic [x, y, z] one. Record 0 when the source states that no smoothing was applied.

  ModelEstimation:
    see_also:
      - https://cdisc-org.github.io/analysis-results-standard/
      - https://bids-standard.github.io/stats-models/spec.html
      - https://nidm.nidash.org/specs/nidm-results_120.html
    description: >-
      How a model was specified in software and estimated: its terms, the family, the
      source's wording for it, the estimator, the stage, and the software. Accommodates
      both BIDS Stats Models GLMs and other model families. One record may be referenced by
      several Analyses, so every field must hold for all of them; an analysis specified or
      estimated differently takes its own record.

      This is the model specification. The contrast specification -- which of these terms a
      given comparison selects, on which side, and with what reported sign -- is the Effect
      of each Analysis referencing this record. One model, many contrasts.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      model_family:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: ModelFamily
          - range: string
        required: true
        description: >-
          Normalized statistical model family, which is the queryable form. Required, so
          `unstated` is the value for a paper that never says. A method the vocabulary
          cannot name -- ICA, representational similarity, a decoder -- is written here as
          free text; the Analysis.details subclass also identifies the method.
      model_type:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          The source's own wording for the model, minimally cleaned, such as mass-
          univariate GLM, meta-analysis, multivariate, predictive model, ICA, or
          representational similarity analysis.
      hrf_model:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The haemodynamic response basis the design matrix was built with: a canonical
          HRF, a canonical plus temporal or dispersion derivatives, an FIR or gamma basis,
          or a named alternative. Unset for a measure that models no timeseries --
          morphometry, diffusion, static PET.
      model_settings:
        in_subset: [model_extracted]
        range: string
        description: >-
          Essential estimator, variance, autocorrelation, covariance, regularization, and
          software-specific settings.
      level:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Unit or stage of analysis, such as run, session, subject, or group. Normalized to
          controlled vocabulary.
      estimator:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Estimation method, such as OLS, WLS, maximum likelihood, restricted maximum
          likelihood, permutation, or Bayesian estimation.
      software:
        in_subset: [mvp, model_extracted]
        range: string
        description: Statistical software name, version, and relevant implementation details.
      terms:
        in_subset: [mvp, model_extracted]
        range: ModelTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The terms the model was specified with -- the columns of the design matrix, in
          the general sense that covers a GLM's regressors and the predictors of any other
          family. Stated once here however many contrasts are taken from them. Record the
          terms the source states, including ones no reported contrast tests: a covariate
          the model controls for is part of the specification whether or not a contrast
          weights it.

  ModelTerm:
    description: >-
      One term of the model: a column of the design matrix, or the equivalent predictor in
      a family with no design matrix. A categorical term names its levels and the entities
      carrying them; a continuous term carries the facts that make a slope interpretable.
      Nothing here is a fact about any one contrast -- how a contrast uses this term is a
      `TermUse` on that contrast's Effect.
    unique_keys:
      name_per_model:
        unique_key_slots:
          - name
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier used by TermUse and by interaction references.
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          Term label, unique within the model: a name appearing twice is one term recorded
          twice. For a categorical term this is the factor's identity.

          Often a label the source never writes. A paper reporting 1-back, 2-back and
          3-back conditions states the levels and states that they vary together, but
          frequently names no axis; `load` is then a name supplied for a grouping the
          source does make. That is permitted, and is not the kind of invention the schema
          forbids elsewhere -- the levels must be source-stated, and the name must not
          assert a comparison or a construct the paper does not.
      type:
        in_subset: [mvp, model_extracted]
        range: TermType
        required: true
        description: Whether the term is categorical or continuous.
      levels:
        in_subset: [mvp, model_extracted]
        range: FactorLevel
        multivalued: true
        inlined_as_list: true
        description: >-
          The levels of a categorical term, and for each the entities carrying it. This is
          the whole of what a factor is: its level vocabulary, and which cohort, condition,
          occasion, or arm occupies each cell. Record a level the source names even when no
          reported contrast uses it -- a three-level factor contrasted at two levels is
          still a three-level factor. Empty for a continuous term.
      assessment:
        in_subset: [mvp, model_extracted]
        range: Assessment
        inlined: false
        description: >-
          The assessment whose participant-level measurement supplies a continuous term.
          Unset when the values come from somewhere the study does not record as an
          Assessment -- age, dose, a motion parameter, cardiac phase, scanner drift -- in
          which case source_definition names the origin.
      variation_level:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: VariationLevel
          - range: string
        description: >-
          Whether this term moves within a participant or only across the sample. Populate
          it for **any** term: a repeated-measures factor is within-subject and a diagnosis
          factor is between-subject in exactly the sense a trial-wise modulator and an age
          covariate are.

          For a continuous term it is what separates a parametric modulation from a
          cross-subject regression, and `Effect.kind` is derived from it on that basis. For
          a categorical factor it feeds no derivation, so setting it changes no other value;
          it is the factor's scope, and two studies that crossed a factor within
          participants and between them did not estimate the same thing.

          A categorical factor's levels usually settle it, and the two should agree: levels
          naming `groups` are between-subject, since a participant belongs to one cohort;
          levels naming `timepoints` are within-subject, since an occasion is when the same
          people were measured again; levels naming `conditions` are within-subject in the
          ordinary repeated-measures case; levels naming `arms` follow
          `StudyDesign.assignment_structure`, crossover being within and parallel between.

          A level the vocabulary cannot name is written here as free text; the derivation of
          effect.kind then has no row to apply, so the kind is unrecomputable for that
          record rather than wrong.
      functional_form:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: FunctionalForm
          - range: string
        description: >-
          Shape of the term's relationship to the measure. A squared term with a negative
          coefficient is an inverted-U relationship, not a negative association, so
          non-linear and transformed terms must not be recorded as linear. A model fitting
          both a linear and a quadratic form of the same measurement has two terms, not
          one.
      interaction_with:
        in_subset: [mvp, model_extracted]
        range: ModelTerm
        multivalued: true
        inlined: false
        description: >-
          The other terms of this model that this term is a product of. Populate it when
          the source names an interaction term in one model; leave it empty when the source
          describes a regression on a contrast. Both readings collapse in the derived
          views, so the choice affects only the effect kind, and it is checkable against
          the paper's own wording.
      unit:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The unit a continuous term is measured in, when the source gives one -- years
          for age, mg for a dose. It is what makes a reported slope interpretable.
      source_definition:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The source's own definition of the term, and the origin of a continuous term
          that no Assessment supplies, such as age, dose, a motion parameter, cardiac
          phase, or scanner drift. A transform the FunctionalForm vocabulary cannot name
          goes in functional_form itself.

  FactorLevel:
    description: >-
      One level of a categorical model term, and the entities that carry it. Which cell of
      the design a cohort or condition occupies is a property of the design, not of any
      contrast drawn from it, which is why this hangs off the ModelTerm rather than off the
      directional terms of an Effect.

      Its four entity slots are the same four axes an Effect carries direction on. A factor
      normally ranges over one of them -- conditions for a task factor, cohorts for a
      participant factor -- so the others stay empty; a level realized by a crossing, such
      as a drug given at follow-up, fills more than one.
    unique_keys:
      level_per_factor:
        unique_key_slots:
          - level
    attributes:
      level:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          The level's label, as the source words it. Unique within its term: a level
          appearing twice is one level recorded twice.
      order:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 1
        description: >-
          Position of this level in the factor's sequence, counting from 1, for a factor
          whose levels are ordered. Carries the ordering that DirectionalRole cannot: a
          contrast marks only its extremes greater and lesser and leaves everything between
          them `included`, so 1-back, 2-back and 3-back arrive as an unordered set and the
          monotonic load manipulation they encode survives only in Analysis.definition.

          Populate it whenever the levels have an order the source states or plainly
          implies -- a dose series, a load or difficulty series, an ordinal severity
          grading. Leave it unset for a nominal factor, where imposing an order would
          assert a structure the design does not have. Timepoint.order is the same
          device for occasions.
      conditions:
        in_subset: [mvp, model_extracted]
        range: Condition
        multivalued: true
        inlined: false
        description: The conditions carrying this level, by identifier.
      groups:
        in_subset: [mvp, model_extracted]
        range: Group
        multivalued: true
        inlined: false
        description: The participant cohorts carrying this level, by identifier.
      timepoints:
        in_subset: [model_extracted]
        range: Timepoint
        multivalued: true
        inlined: false
        description: The occasions carrying this level, by identifier.
      arms:
        in_subset: [model_extracted]
        range: Arm
        multivalued: true
        inlined: false
        description: The arms carrying this level, by identifier.

  InferenceSettings:
    description: >-
      Structured inferential procedure for one reported analysis. This is the canonical
      storage home for thresholding, correction, and cluster-inference metadata. The test
      statistic itself belongs to the tested effect and lives in Effect.statistic.
    attributes:
      inference_level:
        in_subset: [model_extracted]
        range: string
        description: Level at which inference is made, such as voxel, vertex, cluster, region, network or other.
      voxelwise_threshold_value:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        description: Numeric voxelwise or vertexwise threshold before correction or cluster formation.
      voxelwise_threshold_type:
        in_subset: [model_extracted]
        range: string
        description: Meaning of voxelwise_threshold_value, such as p, q, t, z, or F.
      cluster_forming_threshold_value:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        description: Numeric threshold used to form candidate clusters.
      cluster_extent_threshold:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Minimum surviving cluster extent in voxels, vertices, or the unit stated in the source.
      clusterwise_threshold_value:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        description: Numeric cluster-level threshold for retaining clusters.
      multiple_comparison_method:
        in_subset: [model_extracted]
        range: string
        description: Correction method, such as FWE, FDR, Bonferroni, permutation, Monte Carlo, or none.
      correction_scope:
        in_subset: [model_extracted]
        range: string
        description: >-
          Domain over which correction was applied, such as whole brain, ROI set,
          hemisphere, or mask.
      search_volume:
        in_subset: [model_extracted]
        range: string
        description: Reported search volume, mask size, or number of vertices or voxels used for inference.
      neighborhood_definition:
        in_subset: [model_extracted]
        range: string
        description: Voxel or vertex adjacency or connectivity rule used for cluster formation.
      tfce_used:
        in_subset: [model_extracted]
        range: boolean
        description: Whether threshold-free cluster enhancement was used.
      tfce_parameters:
        in_subset: [model_extracted]
        range: string
        description: TFCE parameters such as height and extent exponents when reported.
      permutation_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of permutations, randomizations, or simulations used for inference.
      alpha_level:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        maximum_value: 1
        description: Family-wise, false-discovery, or nominal alpha threshold when reported.
      number_of_tests:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of statistical tests considered by the multiple-comparison procedure.

  StatisticalMap:
    description: >-
      A machine-readable statistical image or derivative made available for one
      analysis, whether hosted with the study, in a repository, or by a data archive.
    attributes:
      id:
        in_subset: [deterministic]
        range: string
        identifier: true
        required: true
        description: >-
          Stable identifier for this map record, assigned by the pipeline.
      map_type:
        in_subset: [deterministic]
        range: string
        required: true
        description: >-
          Content type, such as statistic, effect estimate, variance, z-score, t-score, or
          thresholded label map.
      url:
        in_subset: [deterministic]
        range: uri
        description: Resolvable location of the map or its archive landing page.
      coordinate_space:
        in_subset: [deterministic]
        range: string
        description: >-
          The space this image is in. Recorded per map because a study can share maps in a
          different space from the one its tables report.
      is_thresholded:
        in_subset: [deterministic]
        range: boolean
        description: Whether the available map has already been thresholded.
      statistic_type:
        in_subset: [deterministic]
        range: string
        description: Statistical quantity encoded by the map, when applicable.
      description:
        in_subset: [deterministic]
        range: string
        description: Notes about map provenance, processing, or relation to the reported result.

  Table:
    description: >-
      A publication table that supplies coordinates, statistics, or contextual
      metadata. Raw cell structure and point-level provenance may remain in the
      repository's coordinate-table representation and be linked with source_path.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable table identifier used by Analysis foreign-key references.
      table_number:
        in_subset: [mvp, deterministic]
        range: string
        description: Printed identifier such as Table 2 or Supplementary Table S4.
      title:
        in_subset: [mvp, deterministic]
        range: string
        description: Table title, when distinct from the caption.
      caption:
        in_subset: [mvp, deterministic]
        range: string
        description: >-
          Table caption describing the table's contents.
      footer:
        in_subset: [mvp, deterministic]
        range: string
        description: Table notes, abbreviations, threshold statements, and footnotes.
      source_path:
        in_subset: [mvp, deterministic]
        range: string
        description: >-
          Repository path or external location of the raw or normalized table
          representation. Set by the ingestion pipeline.
      coordinate_space:
        in_subset: [mvp, deterministic]
        range: string
        description: >-
          Coordinate reference space applying to points in the table, from the table parser. The
          preferred of the two places the space can live: when this is populated,
          Analysis.coordinate_space is left blank.
      column_headings:
        in_subset: [mvp, deterministic]
        range: string
        multivalued: true
        description: Ordered leaf column headings retained to aid interpretation of extracted values.
      description:
        in_subset: [mvp, deterministic]
        range: string
        description: Summary of the table contents and its role in the reported analyses.
      coordinate_count:
        in_subset: [mvp, deterministic]
        range: integer
        minimum_value: 0
        description: Number of reported coordinate rows or points in the normalized table representation.
