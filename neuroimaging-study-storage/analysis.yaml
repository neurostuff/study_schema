id: https://neurostuff.org/schemas/neuroimaging-study-storage/analysis
name: neuroimaging-study-storage-analysis
title: Neuroimaging Study Storage Analysis Module
description: >-
  A reported analysis and the effect it tested.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
  - acquisition
  - experiment
  - group
  - assessment
  - analysis_enums
  - analysis_details
default_prefix: neurostudy
default_range: string

classes:

  Analysis:
    description: >-
      A distinct reported inferential map or tested effect, linking its source
      acquisitions, sample, paradigm context, tested effect, preprocessing, model
      estimation, inference settings, and source result tables.

      Create one Analysis for each distinct tested effect. Separate Analyses are required
      when normalized direction, participant-group comparison, method, effect.kind, seed or
      connectivity model, decoded variable, component identity, or spatial_scope differ, and
      when an omnibus effect and its directional post-hoc contrast are both reported. ROI
      definitions, acquisition summaries, descriptive sample tables, and masks without
      inferential effects are not Analyses.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: >-
          Stable identifier for the analysis. Must be a deterministic function of the
          source location, so that re-extracting a paper produces the same identifier and
          externally stored source evidence still joins. A workable recipe is
          study, table or figure identifier, and analysis label slug or index.
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: Study-local label for the analysis or inferential result, in the source's words.
      definition:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          Precise statement of the tested effect in the source's own words, minimally
          cleaned. Always source-grounded. For an interaction it must state the direction of
          the interaction as the source states it; for an ordered contrast it must keep the
          ordering that the greater and lesser roles cannot express.
      interpretations:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: >-
          Model-inferred reading of what the analysis measures, typically the process the
          authors assert this contrast or model measures. Never treated as a source claim:
          being in this slot is what marks a reading as inferred.
      spatial_scope:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: SpatialScope
          - range: string
        required: true
        description: Spatial domain of the analysis. An inclusion criterion, not preprocessing metadata.
      spatial_unit:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: SpatialUnit
          - range: string
        description: >-
          The element the analysis was carried out over. Distinct from spatial_scope, which
          gives the extent: a whole-brain analysis can be voxelwise or vertexwise, and an ROI
          analysis can average a region or test its parcels. Record it rather than inferring
          it from coordinate_space.
      roi_definition:
        in_subset: [model_extracted]
        range: RoiDefinition
        required: true
        description: >-
          How the region of interest was defined, which is primarily a statement about
          independence. Must be not_applicable for whole-brain and searchlight analyses,
          and must not be not_applicable when spatial_scope is roi.
      roi_label:
        in_subset: [model_extracted]
        range: string
        description: >-
          The atlas, parcellation, or region name, in the source's words. Unset for
          whole-brain analyses.
      measure:
        in_subset: [mvp, model_extracted]
        range: Measure
        inlined: true
        required: true
        description: The scientific quantity of the map, independent of the statistic used to test it.
      groups:
        in_subset: [mvp, model_extracted]
        range: GroupTerm
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          The participant cohorts in the analysis and the side of the comparison each sits
          on. Groups are participant cohorts only: experimental roles, task states, and
          time points are Conditions or factor levels.
      effect:
        in_subset: [mvp, model_extracted]
        range: Effect
        inlined: true
        required: true
        description: What was tested about the map. Universal across every method.
      details:
        in_subset: [mvp, model_extracted]
        range: AnalysisDetails
        inlined: true
        required: true
        description: >-
          The method that produced the map, and its method-specific payload. Which subclass
          is filled states the method. A voxelwise, vertexwise, or ROI-wise GLM,
          mixed-effects model, ANOVA, ANCOVA, or robust regression takes
          MassUnivariateDetails; a method outside the first-class families takes
          OtherAnalysisDetails and names itself in method_label.
      acquisitions:
        in_subset: [mvp, model_extracted]
        range: Acquisition
        multivalued: true
        inlined: false
        description: >-
          Acquisition protocols supplying data to this analysis. Structural, diffusion,
          and other non-paradigm analyses are linked directly through this field.
      experiments:
        in_subset: [mvp, model_extracted]
        range: Experiment
        multivalued: true
        inlined: false
        description: >-
          The participant paradigms that contextualize this analysis. An analysis can span
          paradigms, as a cross-task conjunction or a localizer-plus-main-task analysis does.
          Analyses without a paradigm leave this empty and are linked through acquisitions.
      model_estimation:
        in_subset: [mvp, model_extracted]
        range: ModelEstimation
        inlined: false
        description: >-
          How this analysis was estimated: the model family, estimator, stage, and
          software. What was tested is `effect`.
      inference_settings:
        range: InferenceSettings
        inlined: true
        description: Structured thresholding and correction metadata for this reported analysis.
      preprocessing:
        range: Preprocessing
        inlined: false
        description: The preprocessing pipeline that produced the analyzed data.
      tables:
        in_subset: [mvp, deterministic]
        range: Table
        multivalued: true
        inlined: false
        description: The source tables reporting results for this analysis.
      statistical_maps:
        in_subset: [deterministic]
        range: StatisticalMap
        multivalued: true
        inlined_as_list: true
        description: Statistical maps made available for this analysis.
      coordinate_space:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Coordinate reference space or template the spatial results are reported in, such as
          MNI152 or Talairach. The fallback of two places this can live: populated only when no
          table of this analysis gives the space, which happens when the parse does not recover
          one or the analysis is reported without a coordinate table. Exactly one of the two is
          filled, never both, so a value here means the tables were silent. An analysis on a
          surface reports a surface template, which is why the space does not follow from
          spatial_unit.
      assessments:
        in_subset: [mvp, model_extracted]
        range: Assessment
        multivalued: true
        inlined: false
        description: Assessments whose measurements were used in or selected the sample for this analysis.
      model_representation_notes:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Model components that could not be represented or were represented only
          approximately, for an analysis whose method is otherwise first-class. Examples
          include random slopes, latent variables, dynamic connectivity, and dependencies
          between terms. An analysis whose method has no stable structured decomposition
          at all takes NotStructurableDetails instead.
    rules:
      - description: Whole-brain and searchlight analyses have no region of interest to define.
        preconditions:
          slot_conditions:
            spatial_scope:
              any_of:
                - equals_string: whole_brain
                - equals_string: searchlight
        postconditions:
          slot_conditions:
            roi_definition:
              equals_string: not_applicable
      - description: An ROI analysis must say how the region was defined.
        preconditions:
          slot_conditions:
            spatial_scope:
              equals_string: roi
        postconditions:
          none_of:
            - slot_conditions:
                roi_definition:
                  equals_string: not_applicable

  Effect:
    description: >-
      The inferential quantity tested about a map. Applies unchanged to every
      method, so the method and the effect never compete for the same field.
      Estimation facts -- model family, estimator, stage, software -- are not here: they
      belong to the model that produced the map and live on ModelEstimation, reached
      through Analysis.model_estimation.
    attributes:
      kind:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: EffectKind
          - range: string
        required: true
        description: >-
          The kind of effect tested, which follows from which terms carry direction: mark
          the directions visible in the source and the kind follows. The structural
          validator recomputes it and rejects contradictions, checking membership in the
          compatible set where a term pattern admits more than one kind.

          A term pattern matching no kind in the vocabulary takes a short characterization
          of the tested effect instead -- a mediated path, a dose-response curve, a
          component map reported with no inferential test. Never delete true terms to make
          a kind fit.
      baseline:
        in_subset: [mvp, model_extracted]
        range: Baseline
        description: >-
          What the map was tested against. not_applicable unless the effect is a
          one-sample test or a contrast against a baseline condition. Do not invent a
          baseline condition: if the baseline is a modelled condition such as rest or
          fixation, give it a `lesser` condition term, which makes the effect a contrast.
      path:
        in_subset: [mvp, model_extracted]
        range: EffectPath
        description: >-
          Whether the tested quantity is a mediated path. not_applicable in the normal
          case. A value other than not_applicable requires a term with role `mediator`,
          and such a term requires such a path; the structural validator enforces the
          pair.
      conditions:
        in_subset: [mvp, model_extracted]
        range: ConditionTerm
        multivalued: true
        inlined_as_list: true
        description: >-
          The experimental conditions entering the effect and the side of the comparison
          each sits on. When the map being tested is itself a contrast, its condition terms
          go here with their roles, so the contrast stays queryable whatever the effect
          kind is.
      terms:
        in_subset: [mvp, model_extracted]
        range: Term
        multivalued: true
        inlined_as_list: true
        description: >-
          The model terms, categorical and continuous alike. A categorical term points at
          the Groups or Conditions it ranges over; a continuous term carries the slope
          facts.
      statistic:
        in_subset: [mvp, model_extracted]
        range: Statistic
        inlined: true
        required: true
        description: >-
          The statistic this effect was tested with, and its degrees of freedom. Not the
          value of the statistic at any location -- peak magnitudes belong to the reported
          coordinates.
  Statistic:
    description: >-
      A test statistic and its degrees of freedom. Statistic values -- peak magnitudes,
      p-values, cluster extents -- belong to the reported coordinates.
    attributes:
      family:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: StatisticFamily
          - range: string
        required: true
        description: >-
          Which statistic was used. Independent of the thresholding procedure: a t-test
          corrected by permutation is still a `t`.
      degrees_of_freedom_numerator:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: >-
          Numerator degrees of freedom, normally populated only for f and
          likelihood_ratio. A single-degree-of-freedom statistic leaves this unset, since
          t(151) is F(1,151).
      degrees_of_freedom_denominator:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: >-
          Denominator degrees of freedom, used alone for t, correlation, and chi_square.
          Both are unset for z. Float, so corrected degrees of freedom such as a
          Greenhouse-Geisser adjustment can be recorded as reported.
  Measure:
    description: >-
      The scientific quantity of the map, independent of the statistic used to test it.
      When a paper alternates terms for the same map -- grey matter concentration in
      Methods and volume in Results -- take the Methods term for type and keep both
      wordings in source_label.
    attributes:
      family:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: MeasureFamily
          - range: string
        required: true
        description: Broad imaging or signal family, for coarse filtering.
      type:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: MeasureType
          - range: string
        required: true
        description: Normalized quantity, for cross-study queries.
      source_label:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The paper's own term for the measure. Unset only when the source does not
          identify the measure.
      specific_metric:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Named metric when type is intentionally broad, such as fractional anisotropy,
          ALFF, fALFF, or a specific tracer binding potential.
      unit:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The unit the measure is reported in, when the source gives one and it carries
          information -- mm for a thickness, mL for a volume. Omitted for a unitless
          quantity such as a correlation or a normalized index.
  GroupTerm:
    description: >-
      One participant cohort in an analysis, and the side of the comparison it sits on.
    unique_keys:
      group_per_analysis:
        unique_key_slots:
          - group
    attributes:
      group:
        in_subset: [mvp, model_extracted]
        range: Group
        required: true
        inlined: false
        description: >-
          The cohort this term refers to, by identifier. The cohort's own properties are
          on the Group record; what is here is its part in this analysis.
      role:
        range: DirectionalRole
        in_subset: [mvp, model_extracted]
        required: true
        description: >-
          Which side of the comparison this cohort sits on. Direction is normalized to
          roles, never numeric contrast weights.
      factor_levels:
        in_subset: [mvp, model_extracted]
        range: FactorLevel
        multivalued: true
        inlined_as_list: true
        description: >-
          The factorial cell this cohort represents, for crossed designs such as genotype
          by diagnosis: four cohorts each carry one level of each factor, which is what
          makes a group-by-group interaction expressible. Leave empty for the ordinary
          case of one cohort per group.
      n:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: >-
          Number of participants from this cohort included in this analysis. This is where a
          cohort's analysed size lives -- Group carries the recruitment funnel down to
          acquisition and nothing past it -- so populate it whenever the source gives a number,
          and expect it to be smaller than the acquired count when an analysis drops
          participants for motion or missing data.
  ConditionTerm:
    description: >-
      One experimental condition entering an effect, and the side of the comparison it
      sits on. A condition may be an experimental condition, task state, time point,
      within-subject role, or composite factorial cell.
    unique_keys:
      condition_per_effect:
        unique_key_slots:
          - condition
    attributes:
      condition:
        in_subset: [mvp, model_extracted]
        range: Condition
        required: true
        inlined: false
        description: >-
          The condition this term refers to, by identifier. The condition's own
          properties, including what kind of thing it is, are on the Condition record.
      label:
        in_subset: [mvp, model_extracted]
        range: string
        description: The source's wording for this condition in this effect, when it differs from the Condition name.
      role:
        in_subset: [mvp, model_extracted]
        range: DirectionalRole
        required: true
        description: >-
          Which side of the comparison this condition sits on. For an ordered contrast,
          mark the extremes greater and lesser, leave intermediate conditions `included`,
          and keep the ordering in Analysis.definition.
      factor_levels:
        in_subset: [mvp, model_extracted]
        range: FactorLevel
        multivalued: true
        inlined_as_list: true
        description: >-
          The factorial cell this condition represents. Conditions varying over two or
          more factors named here, each taking at least two distinct levels, make the
          effect an interaction. A factor held constant across the directional terms --
          males only, or a contrast taken within one level of another factor -- does not,
          but record it and its constant level anyway.
  FactorLevel:
    description: >-
      One factor and the level of it that an entity represents: which cell of the design a
      particular cohort or condition occupies. A Term declares that the factor is in the
      model at all and lists its level vocabulary; this says which entity carries which
      level.
    unique_keys:
      factor_per_entity:
        unique_key_slots:
          - factor_name
    attributes:
      factor_name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          Name of the experimental or participant factor, which must equal the `name` of a
          categorical Term in the same effect: the factor is declared once, as that Term,
          and this slot assigns a level of it. The structural validator enforces the
          match.
      level:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: The level of that factor which this entity carries.

  Term:
    description: >-
      One term of the statistical model. A categorical term points at the Groups or
      Conditions it ranges over and takes association_direction not_applicable; its
      direction, where it exists, is on those group or condition terms. A continuous term
      carries the slope facts.
    unique_keys:
      name_per_effect:
        unique_key_slots:
          - name
    attributes:
      name:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          Term label, unique within an effect: a name appearing twice is one term recorded
          twice. For a categorical term it is also the factor's identity, referred to by
          FactorLevel.factor_name.
      type:
        in_subset: [mvp, model_extracted]
        range: TermType
        required: true
        description: Whether the term is categorical or continuous.
      role:
        in_subset: [mvp, model_extracted]
        range: TermRole
        required: true
        description: >-
          How the term enters the model, not a statement about importance. The derived
          effect kind reads only `primary` terms, so marking a controlled covariate
          primary asserts that the paper tested it. More than one primary term is allowed.
      conditions:
        in_subset: [mvp, model_extracted]
        range: Condition
        multivalued: true
        inlined: false
        description: >-
          The experimental conditions a categorical term ranges over -- the Conditions
          themselves, not the directional ConditionTerms of the effect. This slot says
          which conditions the factor groups together; Effect.conditions says which side
          of the comparison each sits on.
      groups:
        in_subset: [mvp, model_extracted]
        range: Group
        multivalued: true
        inlined: false
        description: >-
          The participant cohorts a categorical term ranges over, on the same footing as
          `conditions`. Direction stays on Analysis.groups.
      assessment:
        in_subset: [mvp, model_extracted]
        range: Assessment
        inlined: false
        description: >-
          The assessment whose participant-level measurement supplies a continuous term.
          Unset when the values come from somewhere the study does not record as an
          Assessment -- age, dose, a motion parameter, cardiac phase, scanner drift -- in
          which case source_definition names the origin.
      levels:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          The factor's level vocabulary, needed when the levels are not all present as
          directional group or condition terms -- a three-level factor where only two
          appear in the contrast, for instance. Which entity carries which level is
          FactorLevel's job.
      variation_level:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: VariationLevel
          - range: string
        description: >-
          The level at which a continuous term varies, which is what separates a parametric
          modulation from a cross-subject regression. A level the vocabulary cannot name is
          written here as free text; the derivation of effect.kind then has no row to apply, so
          the kind is unrecomputable for that record rather than wrong.
      association_direction:
        in_subset: [mvp, model_extracted]
        range: AssociationDirection
        description: >-
          Sign of a continuous term's coefficient, or of the interaction coefficient for a
          product term.
      functional_form:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: FunctionalForm
          - range: string
        description: >-
          Shape of the term's relationship to the measure. A squared term with a negative
          coefficient is an inverted-U relationship, not a negative association, so
          non-linear and transformed terms must not be recorded as linear.
      interaction_with:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          Names of the other Terms this term is a product of. Populate it when the source
          names an interaction term in one model; leave it empty when the source describes
          a regression on a contrast. Both readings collapse in the derived views, so the
          choice affects only the effect kind, and it is checkable against the paper's own
          wording.
      unit:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The unit a continuous term is measured in, when the source gives one -- years
          for age, mg for a dose. It is what makes a reported slope interpretable.
      source_definition:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The source's own definition of the term, and the origin of a continuous term
          that no Assessment supplies, such as age, dose, a motion parameter, cardiac
          phase, or scanner drift. A transform the FunctionalForm vocabulary cannot name
          goes in functional_form itself.
  Preprocessing:
    description: >-
      An ordered preprocessing pipeline applied to acquired data before or as
      part of statistical modeling. The fields cover the core COBIDAS reporting areas.
    attributes:
      id:
        in_subset: [deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      description:
        in_subset: [model_extracted]
        range: string
        description: Narrative overview of the pipeline, its inputs, outputs, and intended purpose.
      software:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: Software packages or methods used, including version and revision identifiers.
      steps:
        in_subset: [model_extracted]
        range: string
        multivalued: true
        description: >-
          Ordered free-text preprocessing operation names, listed in execution order;
          examples include slice-timing correction, motion correction, distortion
          correction, spatial normalization, and smoothing.

  ModelEstimation:
    description: >-
      How a model was specified in software and estimated: the family, the source's
      wording for it, the estimator, the stage, and the software. Accommodates both BIDS
      Stats Models GLMs and other model families. One record may be referenced by several
      Analyses, so every field must hold for all of them; an analysis estimated
      differently takes its own record.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      model_family:
        in_subset: [mvp, model_extracted]
        any_of:
          - range: ModelFamily
          - range: string
        required: true
        description: >-
          Normalized statistical model family, which is the queryable form. Required, so
          `unstated` is the value for a paper that never says. A method the vocabulary
          cannot name -- ICA, representational similarity, a decoder -- is written here as
          free text; the Analysis.details subclass also identifies the method.
      model_type:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          The source's own wording for the model, minimally cleaned, such as mass-
          univariate GLM, meta-analysis, multivariate, predictive model, ICA, or
          representational similarity analysis.
      hrf_model:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          The haemodynamic response basis the design matrix was built with: a canonical
          HRF, a canonical plus temporal or dispersion derivatives, an FIR or gamma basis,
          or a named alternative. Unset for a measure that models no timeseries --
          morphometry, diffusion, static PET.
      model_settings:
        in_subset: [model_extracted]
        range: string
        description: >-
          Essential estimator, variance, autocorrelation, covariance, regularization, and
          software-specific settings.
      level:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Unit or stage of analysis, such as run, session, subject, or group. Normalized to
          controlled vocabulary.
      estimator:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Estimation method, such as OLS, WLS, maximum likelihood, restricted maximum
          likelihood, permutation, or Bayesian estimation.
      software:
        in_subset: [mvp, model_extracted]
        range: string
        description: Statistical software name, version, and relevant implementation details.

  InferenceSettings:
    description: >-
      Structured inferential procedure for one reported analysis. This is the canonical
      storage home for thresholding, correction, and cluster-inference metadata. The test
      statistic itself belongs to the tested effect and lives in Effect.statistic.
    attributes:
      inference_level:
        in_subset: [model_extracted]
        range: string
        description: Level at which inference is made, such as voxel, vertex, cluster, region, network or other.
      voxelwise_threshold_value:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        description: Numeric voxelwise or vertexwise threshold before correction or cluster formation.
      voxelwise_threshold_type:
        in_subset: [model_extracted]
        range: string
        description: Meaning of voxelwise_threshold_value, such as p, q, t, z, or F.
      cluster_forming_threshold_value:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        description: Numeric threshold used to form candidate clusters.
      cluster_extent_threshold:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Minimum surviving cluster extent in voxels, vertices, or the unit stated in the source.
      clusterwise_threshold_value:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        description: Numeric cluster-level threshold for retaining clusters.
      multiple_comparison_method:
        in_subset: [model_extracted]
        range: string
        description: Correction method, such as FWE, FDR, Bonferroni, permutation, Monte Carlo, or none.
      correction_scope:
        in_subset: [model_extracted]
        range: string
        description: >-
          Domain over which correction was applied, such as whole brain, ROI set,
          hemisphere, or mask.
      search_volume:
        in_subset: [model_extracted]
        range: string
        description: Reported search volume, mask size, or number of vertices or voxels used for inference.
      neighborhood_definition:
        in_subset: [model_extracted]
        range: string
        description: Voxel or vertex adjacency or connectivity rule used for cluster formation.
      tfce_used:
        in_subset: [model_extracted]
        range: boolean
        description: Whether threshold-free cluster enhancement was used.
      tfce_parameters:
        in_subset: [model_extracted]
        range: string
        description: TFCE parameters such as height and extent exponents when reported.
      permutation_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of permutations, randomizations, or simulations used for inference.
      alpha_level:
        in_subset: [model_extracted]
        range: float
        minimum_value: 0
        maximum_value: 1
        description: Family-wise, false-discovery, or nominal alpha threshold when reported.
      number_of_tests:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of statistical tests considered by the multiple-comparison procedure.

  StatisticalMap:
    description: >-
      A machine-readable statistical image or derivative made available for one
      analysis, whether hosted with the study, in a repository, or by a data archive.
    attributes:
      id:
        in_subset: [deterministic]
        range: string
        identifier: true
        required: true
        description: >-
          Stable identifier for this map record, assigned by the pipeline.
      map_type:
        in_subset: [deterministic]
        range: string
        required: true
        description: >-
          Content type, such as statistic, effect estimate, variance, z-score, t-score, or
          thresholded label map.
      url:
        in_subset: [deterministic]
        range: uri
        description: Resolvable location of the map or its archive landing page.
      coordinate_space:
        in_subset: [deterministic]
        range: string
        description: >-
          The space this image is in. Recorded per map because a study can share maps in a
          different space from the one its tables report.
      is_thresholded:
        in_subset: [deterministic]
        range: boolean
        description: Whether the available map has already been thresholded.
      statistic_type:
        in_subset: [deterministic]
        range: string
        description: Statistical quantity encoded by the map, when applicable.
      description:
        in_subset: [deterministic]
        range: string
        description: Notes about map provenance, processing, or relation to the reported result.

  Table:
    description: >-
      A publication table that supplies coordinates, statistics, or contextual
      metadata. Raw cell structure and point-level provenance may remain in the
      repository's coordinate-table representation and be linked with source_path.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable table identifier used by Analysis foreign-key references.
      table_number:
        in_subset: [mvp, deterministic]
        range: string
        description: Printed identifier such as Table 2 or Supplementary Table S4.
      title:
        in_subset: [mvp, deterministic]
        range: string
        description: Table title, when distinct from the caption.
      caption:
        in_subset: [mvp, deterministic]
        range: string
        description: >-
          Table caption describing the table's contents.
      footer:
        in_subset: [mvp, deterministic]
        range: string
        description: Table notes, abbreviations, threshold statements, and footnotes.
      source_path:
        in_subset: [mvp, deterministic]
        range: string
        description: >-
          Repository path or external location of the raw or normalized table
          representation. Set by the ingestion pipeline.
      coordinate_space:
        in_subset: [mvp, deterministic]
        range: string
        description: >-
          Coordinate reference space applying to points in the table, from the table parser. The
          preferred of the two places the space can live: when this is populated,
          Analysis.coordinate_space is left blank.
      column_headings:
        in_subset: [mvp, deterministic]
        range: string
        multivalued: true
        description: Ordered leaf column headings retained to aid interpretation of extracted values.
      description:
        in_subset: [mvp, deterministic]
        range: string
        description: Summary of the table contents and its role in the reported analyses.
      coordinate_count:
        in_subset: [mvp, deterministic]
        range: integer
        minimum_value: 0
        description: Number of reported coordinate rows or points in the normalized table representation.
