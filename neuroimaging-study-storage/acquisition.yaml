id: https://neurostuff.org/schemas/neuroimaging-study-storage/acquisition
name: neuroimaging-study-storage-acquisition
title: Neuroimaging Study Storage Acquisition Module
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
default_prefix: neurostudy
default_range: string

classes:

  Acquisition:
    description: >-
      A modality-agnostic protocol used to acquire neuroimaging or associated physiological data, holding only what
      every modality has in common. One Acquisition carries one modality: simultaneous recordings such as EEG+fMRI
      are separate Acquisition records that an Experiment lists together. Everything modality-specific lives in the
      class the Modality value instantiates -- MRI, EEG, FNIRS, PET, or OtherModality.
    attributes:
      id:
        in_subset: [mvp, deterministic]
        range: string
        identifier: true
        required: true
        description: Stable identifier used by Experiment and Analysis foreign-key references.
      acquisition_type:
        in_subset: [mvp, deterministic]
        range: string
        designates_type: true
        required: true
        description: >-
          The concrete subclass this record instantiates. Derived by the mapper from the
          modality value's `instantiates`, never extracted.
      modality:
        in_subset: [mvp, model_extracted]
        range: Modality
        required: true
        description: >-
          Imaging or recording modality, from the closed Modality vocabulary. The value also names the class
          holding this acquisition's modality-specific parameters, through that value's `instantiates`.
      acquisition_duration_seconds:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Total usable acquisition or recording duration in seconds. Useful for filtering studies
          by the amount of data contributing to an analysis, especially resting-state and continuous
          recordings.
      instrument:
        in_subset: [model_extracted]
        range: string
        description: Scanner, amplifier, or recording system as reported, including manufacturer and model.
      description:
        in_subset: [model_extracted]
        range: string
        description: >-
          Narrative account of the acquisition, holding whatever the source reports that
          no typed field in this schema accepts. Available on every modality, not only
          OtherModality.
      structured_details:
        in_subset: [model_extracted]
        range: string
        description: >-
          JSON-encoded acquisition parameters that no typed field accepts, when they have
          structure worth keeping in queryable form.
  MRI:
    is_a: Acquisition
    description: >-
      An MRI acquisition of any kind -- functional, structural, or diffusion, as modality records. Its own
      attributes are the ones commonly useful for study selection, subgrouping, or sensitivity analyses in
      coordinate- or image-based meta-analysis.
    attributes:
      magnetic_field_strength_tesla:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Nominal static magnetic field strength in tesla.
      pulse_sequence_type:
        in_subset: [mvp, model_extracted]
        range: string
        description: General pulse sequence family, such as EPI, MPRAGE, SPGR, or spin echo.
      mr_acquisition_type:
        in_subset: [model_extracted]
        range: string
        description: Acquisition dimensionality, such as 2D or 3D; useful for distinguishing protocols with 
          materially different spatial sampling.
      repetition_time_seconds:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Time between the start of successive acquired volumes, in seconds.
      echo_time_seconds:
        in_subset: [mvp, model_extracted]
        range: float
        multivalued: true
        minimum_value: 0
        description: >-
          Echo time in seconds, as a list of one value per echo. A multi-echo sequence has
          several; a single-echo one has a list of length one.
      acquisition_voxel_size_mm:
        in_subset: [mvp, model_extracted]
        range: float
        multivalued: true
        minimum_value: 0
        description: Original acquisition voxel size [x, y, z] in millimeters, before interpolation or 
          resampling.
      number_of_volumes:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number of acquired volumes contributing to the recording, when reported; a proxy for scan
          length and temporal sampling in functional acquisitions.
  EEG:
    is_a: Acquisition
    description: >-
      A scalp EEG acquisition. Its own attributes are the ones that materially distinguish recordings used in
      source-localized coordinate or image-based meta-analyses.
    attributes:
      sampling_frequency_hz:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Sampling frequency of the recording in hertz.
      eeg_reference:
        in_subset: [mvp, model_extracted]
        range: string
        description: Reference scheme and location used for the raw recording.
      eeg_placement_scheme:
        in_subset: [mvp, model_extracted]
        range: string
        description: Electrode placement system, such as the 10-20 or 10-10 system.
      recording_type:
        in_subset: [mvp, model_extracted]
        range: string
        description: Recording organization, such as continuous, discontinuous, or epoched.
      eeg_channel_count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Number of simultaneously recorded EEG channels.
  FNIRS:
    is_a: Acquisition
    description: >-
      An fNIRS acquisition. Its own attributes are the ones affecting cortical sensitivity, spatial sampling, or
      comparability, and so can support study filtering or moderator analyses.
    attributes:
      sampling_frequency_hz:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Sampling frequency of the fNIRS data in hertz.
      nirs_system_type:
        in_subset: [mvp, model_extracted]
        range: string
        description: Instrument principle, such as continuous-wave, frequency-domain, or time-domain NIRS.
      nirs_channel_count:
        in_subset: [mvp, model_extracted]
        range: integer
        minimum_value: 0
        description: Total number of NIRS channels, including short-separation channels.
      wavelengths_nm:
        in_subset: [model_extracted]
        range: float
        multivalued: true
        minimum_value: 0
        description: Nominal emitted wavelengths in nanometers.
      short_channel_count:
        in_subset: [model_extracted]
        range: integer
        minimum_value: 0
        description: Number of short-separation channels; zero indicates none.
      source_detector_distances_mm:
        in_subset: [model_extracted]
        range: float
        multivalued: true
        minimum_value: 0
        description: Reported source-detector separations in millimeters.
      nirs_placement_scheme:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: Standard placement system or listed optode positions, such as 10-20, Cz, or Pz.
      recorded_signal_types:
        in_subset: [mvp, model_extracted]
        range: string
        multivalued: true
        description: >-
          Raw or derived channel signal types, such as continuous-wave amplitude,
          optical density, oxygenated hemoglobin, or deoxygenated hemoglobin.
  PET:
    is_a: Acquisition
    description: >-
      A PET acquisition. Its own attributes are the ones defining the biological signal or spatial comparability,
      and so are likely to be useful for study selection, subgrouping, or image harmonization.
    attributes:
      image_units:
        in_subset: [mvp, model_extracted]
        range: string
        description: Units encoded in the PET image, such as Bq/mL or SUV.
      tracer_name:
        in_subset: [mvp, model_extracted]
        range: string
        description: Name of the injected tracer compound.
      tracer_radionuclide:
        in_subset: [mvp, model_extracted]
        range: string
        description: Radioisotope labeling the tracer, such as C11, F18, or O15.
      mode_of_administration:
        in_subset: [model_extracted]
        range: string
        description: Tracer administration mode, such as bolus, infusion, or bolus plus infusion.
      scan_type:
        in_subset: [model_extracted]
        range: string
        description: Whether the analyzed PET data were acquired or summarized as a static or dynamic scan.
      uptake_time_seconds:
        in_subset: [mvp, model_extracted]
        range: float
        minimum_value: 0
        description: Interval from tracer administration to the start of the analyzed scan window, in seconds.
      reconstructed_voxel_size_mm:
        in_subset: [mvp, model_extracted]
        range: float
        multivalued: true
        minimum_value: 0
        description: Reconstructed PET voxel size [x, y, z] in millimeters.
      spatial_resolution_mm:
        in_subset: [mvp, model_extracted]
        range: float
        multivalued: true
        minimum_value: 0
        description: Reported reconstructed spatial resolution, such as FWHM dimensions, in millimeters.
  OtherModality:
    is_a: Acquisition
    description: >-
      An acquisition whose modality has no class of its own: MEG, SPECT, and `other`.
      Nothing here is normalized, so this is where a modality the schema does not name
      keeps its parameters. A parameter that MRI, EEG, FNIRS, or PET has no field for
      belongs on that sibling class instead.
    attributes:
      modality_label:
        in_subset: [mvp, model_extracted]
        range: string
        required: true
        description: >-
          The source's own name for the modality or recording technique, verbatim. Always
          populated, since the Modality vocabulary is coarser than what a source reports.
      reason_no_modality_class_used:
        in_subset: [mvp, model_extracted]
        range: string
        description: >-
          Why this is not an MRI, EEG, FNIRS, or PET record.
enums:

  Modality:
    in_subset: [mvp]
    description: >-
      Imaging or recording modality of one Acquisition, and through `instantiates` the
      class in this module holding that modality's parameters. fMRI, sMRI, dMRI, and MRI
      all instantiate MRI; EEG, fNIRS, and PET instantiate their namesakes; MEG, SPECT,
      and other instantiate OtherModality. `instantiates` carries a CURIE against this
      module's own `neurostudy` prefix, so `neurostudy:MRI` resolves to the MRI class
      below.
    permissible_values:
      fMRI:
        in_subset: [mvp]
        instantiates: [neurostudy:MRI]
        description: Functional MRI, whether BOLD, ASL perfusion, or cerebral blood volume weighted.
      sMRI:
        in_subset: [mvp]
        instantiates: [neurostudy:MRI]
        description: >-
          Structural MRI, such as a T1- or T2-weighted anatomical scan, used for morphometry or as a
          coregistration target.
      dMRI:
        in_subset: [mvp]
        instantiates: [neurostudy:MRI]
        description: Diffusion-weighted MRI, including DTI and DWI.
      MRI:
        in_subset: [mvp]
        instantiates: [neurostudy:MRI]
        description: >-
          An MRI acquisition whose functional, structural, or diffusion role the source does not make clear. Use a
          more specific value whenever the source supports one.
      EEG:
        in_subset: [mvp]
        instantiates: [neurostudy:EEG]
        description: Scalp electroencephalography.
      fNIRS:
        in_subset: [mvp]
        instantiates: [neurostudy:FNIRS]
        description: Functional near-infrared spectroscopy.
      PET:
        in_subset: [mvp]
        instantiates: [neurostudy:PET]
        description: Positron emission tomography.
      MEG:
        in_subset: [mvp]
        instantiates: [neurostudy:OtherModality]
        description: >-
          Magnetoencephalography. A first-class value with no compact class of its own.
      SPECT:
        in_subset: [mvp]
        instantiates: [neurostudy:OtherModality]
        description: Single-photon emission computed tomography.
      other:
        in_subset: [mvp]
        instantiates: [neurostudy:OtherModality]
        description: >-
          A modality none of the above names, such as intracranial EEG, ultrasound, or a physiological recording
          analysed on its own. OtherModality holds both its label and its parameters.
      unstated:
        in_subset: [mvp]
        description: >-
          The source does not report the modality clearly enough to choose a value, not
          even MRI. Instantiates nothing. Distinct from `other`, which means the modality
          is known and unlisted.
