id: https://neurostuff.org/schemas/neuroimaging-study-storage/analysis_enums
name: neuroimaging-study-storage-analysis-enums
title: Neuroimaging Study Storage Analysis Vocabularies
description: >-
  Controlled vocabularies for the tested effect represented by an Analysis.
  This module holds enumerations only, so that both the
  analysis module and the analysis-details module can bind to them without either importing
  the other.

  Three conventions run through every enumeration. `unstated` means the fact could exist but
  the source does not clearly report it. `not_applicable` means the concept does not apply to
  this analysis. They are not interchangeable, and there is no record-level confidence tier
  alongside them.

  Third, most of these vocabularies are open rather than carrying a catch-all value. An
  attribute binding an open enumeration declares `any_of: [{range: <Enum>}, {range: string}]`
  instead of a range, so the same field holds either a controlled value or the source's own
  words: when nothing fits, write the wording. Modality is the exception and keeps `other`,
  where the value selects the OtherModality payload class. A value outside a vocabulary is a
  signal for review rather than a validation failure; canonicalization is the mapper's job,
  in the `normalize_enum` derivations of extraction-to-storage.map.yaml.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
default_prefix: neurostudy
default_range: string

enums:

  AnalysisType:
    in_subset: [mvp, model_extracted]
    description: >-
      The method that produced the statistical map, independent of what was tested about
      it. A between-group comparison of connectivity, decoding accuracy, or component
      loadings keeps the method here and records the comparison in Effect. Bound only by
      ConjunctionComponent.analysis_type; an Analysis states its method by which
      AnalysisDetails subclass it fills. Open vocabulary: write the source's own wording
      in the field when nothing here fits.
    permissible_values:
      mass_univariate:
        in_subset: [mvp, model_extracted]
        description: >-
          Voxelwise, vertexwise, or ROI-wise GLM, mixed-effects model, ANOVA or ANCOVA,
          or robust regression. This is the default family and takes no details payload.
      multivariate_decoding:
        in_subset: [mvp, model_extracted]
        description: Classification or pattern discriminability.
      representational_similarity:
        in_subset: [mvp, model_extracted]
        description: >-
          Association at the level of representational dissimilarity matrices. A
          trial-wise similarity or model-fit regressor entered into a univariate GLM is
          mass_univariate with a parametric_modulation effect, not this.
      connectivity:
        in_subset: [mvp, model_extracted]
        description: >-
          PPI, gPPI, seed-based connectivity, DCM, covariance, or Granger causality.
          PPI stays here even when the software estimates it with a GLM.
      conjunction:
        in_subset: [mvp, model_extracted]
        description: Logical combination of independently defined effects.
      latent_decomposition:
        in_subset: [mvp, model_extracted]
        description: >-
          One component or latent variable of a decomposition -- ICA, PCA, NMF, PLS, CCA, or
          a multimodal fusion. Covers what `component_decomposition` and
          `partial_least_squares` named separately: the two were merged because the fact that
          separates them is how many blocks were decomposed, which is
          `LatentDecompositionDetails.second_block` and not a method family. A conjunction
          component that needs the distinction states it in this field's free-text escape
          hatch.
      not_structurable:
        in_subset: [mvp, model_extracted]
        description: >-
          The effect is grounded in the source but has no stable structured
          decomposition.

  SpatialScope:
    in_subset: [mvp, model_extracted]
    description: >-
      Spatial domain of the analysis, and a meta-analysis inclusion criterion. Open
      vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      whole_brain:
        in_subset: [mvp, model_extracted]
        description: Inference across the whole acquired volume or surface.
      roi:
        in_subset: [mvp, model_extracted]
        description: Inference restricted to one or more regions of interest.
      searchlight:
        in_subset: [mvp, model_extracted]
        description: Moving-window multivariate analysis across the whole search space.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source does not report the spatial domain.

  SpatialUnit:
    in_subset: [mvp, model_extracted]
    description: >-
      The element an analysis was carried out over: the surface-versus-volume distinction
      as well as the univariate-versus-parcellated one. Gives the element, where
      SpatialScope gives the extent. Open vocabulary: write the source's own wording in
      the field when nothing here fits.
    permissible_values:
      voxel:
        in_subset: [mvp, model_extracted]
        description: Volumetric voxels.
      vertex:
        in_subset: [mvp, model_extracted]
        description: >-
          Surface vertices, on a reconstructed cortical mesh. Results are vertex indices in
          a surface template rather than stereotactic coordinates.
      roi:
        in_subset: [mvp, model_extracted]
        description: >-
          One value per region, from an averaged or extracted regional summary rather than
          an element-wise map.
      parcel:
        in_subset: [mvp, model_extracted]
        description: >-
          Parcels of a parcellation covering the search space, as distinct from a small set
          of named regions of interest.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source does not report which element the analysis ran over.

  # RoiDefinition moved to region.yaml as `RegionDefinition`, where it is a property of the
  # Region rather than of the Analysis: independence is a fact about how a region was
  # delimited, and one analysis may use an atlas mask and a functional ROI at once. Its
  # `not_applicable` value went with the move -- a whole-brain analysis now has no Region to
  # mark, rather than a Region claiming to have no definition.

  EffectKind:
    in_subset: [mvp, model_extracted]
    description: >-
      The vocabulary of the derived kind view. **No slot has this as a range** -- an `Effect`
      does not record what kind of thing it is, because that follows entirely from its cells.
      This enum is here so that a query layer, a facet list, or a reader has one place to see
      the labels that derivation produces, and one statement of what each means.

      The rule, in full: a term with cells of both signs is a *crossed* term. Two or more
      crossed terms is an `interaction`, one is a `contrast`, and none -- with some cell still
      signed -- is a `simple_effect`, a quantity tested against zero. Cells present but none
      signed is an `omnibus`. A cell on a continuous term overrides all of that and gives a
      `parametric_modulation` or a `cross_subject_regression` by the term's `variation_level`.

      `contrast` covers both a condition comparison and a group comparison; which one it is
      follows from what the crossed term's levels range over, which `FactorLevel` states once on
      the model. There is no free-text branch: a cell pattern always yields one of these labels
      or none, and a pattern yielding none is a record whose cells do not describe a test.
    permissible_values:
      simple_effect:
        in_subset: [mvp, model_extracted]
        description: >-
          A quantity tested against zero rather than against another level: signed cells, no
          crossed term. Covers activation and deactivation against the unmodelled implicit
          baseline, decoding accuracy above chance, dissimilarity above zero, and connectivity
          different from zero. A single `positive` cell *is* this -- a lone +1 weight tests that
          coefficient against zero, and zero is what the implicit baseline is.
      contrast:
        in_subset: [mvp, model_extracted]
        description: >-
          Exactly one crossed term -- one term carrying both a positive and a negative cell.
          Whether it reads as a group comparison, a condition comparison, a pre-post change or a
          region comparison follows from what that term's levels range over, not from a
          different field. Other terms may carry cells of one sign without making it an
          interaction: a cohort comparison of an activation contrast is a comparison of cohorts,
          which is what crossing rather than mere signedness captures.
      interaction:
        in_subset: [mvp, model_extracted]
        description: >-
          Two or more crossed terms at once -- a group factor and a condition factor together,
          occasions and arms, or either of those and a factor whose levels are not entities at
          all, such as region, hemisphere, task or frequency band. Each side of each comparison
          must be signed: a difference of differences needs two terms compared against
          themselves, not two terms merely present with a direction.

          Also the kind of a **moderation**, which reaches it a different way. A crossing that
          involves a continuous term cannot be two crossed terms, because a continuous term has no
          levels to cross; there the interaction column carries the cell, and a celled term with a
          non-empty `interaction_with` derives this kind before `variation_level` is consulted. That
          is what stops an `age x group` interaction reading as a plain cross-subject regression.

          A multi-degree-of-freedom interaction F-test carries no direction on any term and is
          `omnibus`, not this; what marks it as an interaction rather than a main effect is the
          product `ModelTerm` in the model, not the kind.
      parametric_modulation:
        in_subset: [mvp, model_extracted]
        description: A tested continuous term varying within subject.
      cross_subject_regression:
        in_subset: [mvp, model_extracted]
        description: A tested continuous term varying between subject or mixed.
      omnibus:
        in_subset: [mvp, model_extracted]
        description: >-
          A multi-degree-of-freedom test with no direction: cells present, none of them signed.
          Its levels take `direction: not_applicable`, which is what keeps the term tested rather
          than falling into the derived adjustment set.

  EffectPath:
    in_subset: [mvp, model_extracted]
    description: >-
      Which path through a mediation model an effect's map is. Without it, an indirect-effect
      map is structurally identical to a plain regression on the same predictor, and a synthesis
      would pool the two.

      There is no `not_applicable`: an effect that is not a mediated path has no `Mediation`
      object, so there is no slot to fill. That is what moving the pair into a class bought.
    permissible_values:
      direct:
        in_subset: [mvp, model_extracted]
        description: The effect of the primary term with the mediator controlled.
      indirect:
        in_subset: [mvp, model_extracted]
        description: The mediated path, for example a product of coefficients.
      total:
        in_subset: [mvp, model_extracted]
        description: The unmediated total effect.

  ModelFamily:
    in_subset: [mvp, model_extracted]
    description: >-
      Statistical model family used to estimate the effect. Open vocabulary: write the
      source's own wording in the field when nothing here fits.
    permissible_values:
      glm:
        in_subset: [mvp, model_extracted]
        description: >-
          An ordinary least-squares general linear model, including the summary-statistics
          two-stage approach that fMRI calls a random-effects analysis: the group stage is
          still a GLM on contrast images.
      mixed_effects:
        in_subset: [mvp, model_extracted]
        description: >-
          A model estimating random effects directly, rather than by summarizing a first
          stage -- a linear mixed model, a hierarchical model.
      anova:
        in_subset: [mvp, model_extracted]
        description: >-
          Analysis of variance, with no continuous covariate.
      ancova:
        in_subset: [mvp, model_extracted]
        description: >-
          Analysis of covariance: a factorial design with a continuous covariate controlled
          for.
      robust_regression:
        in_subset: [mvp, model_extracted]
        description: >-
          A regression fitted to resist outliers, such as an iteratively reweighted or
          M-estimator fit.
      unstated:
        in_subset: [mvp, model_extracted]

  StatisticFamily:
    in_subset: [mvp, model_extracted]
    description: >-
      Test statistic family for the tested effect, independent of the thresholding
      procedure recorded in InferenceSettings. Open vocabulary: write the source's own
      wording in the field when nothing here fits.
    permissible_values:
      "t":
        in_subset: [mvp, model_extracted]
        description: >-
          Student's t. A single-degree-of-freedom statistic, so only the denominator degrees
          of freedom are populated.
      "z":
        in_subset: [mvp, model_extracted]
        description: Has no degrees of freedom, so both numerator and denominator stay unset.
      "f":
        in_subset: [mvp, model_extracted]
        description: Normally the only family besides likelihood_ratio to populate the numerator.
      chi_square:
        in_subset: [mvp, model_extracted]
        description: >-
          A chi-square statistic.
      likelihood_ratio:
        in_subset: [mvp, model_extracted]
        description: >-
          A likelihood-ratio statistic, from comparing a model against a nested one.
      beta:
        in_subset: [mvp, model_extracted]
        description: >-
          A regression coefficient reported as the test statistic itself, which some papers
          do instead of giving a t or z.
      correlation:
        in_subset: [mvp, model_extracted]
        description: >-
          A correlation coefficient reported as the statistic, r or rho.
      unstated:
        in_subset: [mvp, model_extracted]
        description: >-
          A test was run and the source does not name its statistic. There is no value for "no
          test was run", a map reported without an inferential test not being an Analysis.

  MeasureFamily:
    in_subset: [mvp, model_extracted]
    description: >-
      Broad imaging or signal family, for coarse filtering. A BOLD-derived connectivity or
      decoding result stays functional_bold: derived measures take the family of the
      underlying signal. Open vocabulary: write the source's own wording in the field when
      nothing here fits.
    permissible_values:
      functional_bold:
        in_subset: [mvp, model_extracted]
        description: >-
          The BOLD signal and anything derived from it, including connectivity, decoding
          performance, and amplitude measures.
      structural_morphometry:
        in_subset: [mvp, model_extracted]
        description: >-
          Measures of tissue shape and quantity from a structural image -- volume,
          thickness, surface area, density.
      diffusion:
        in_subset: [mvp, model_extracted]
        description: >-
          Measures from diffusion-weighted imaging.
      perfusion:
        in_subset: [mvp, model_extracted]
        description: >-
          Blood flow and volume measures, from ASL or a contrast agent.
      molecular_imaging:
        in_subset: [mvp, model_extracted]
        description: >-
          PET and SPECT measures of a tracer's distribution or binding.
      electrophysiology:
        in_subset: [mvp, model_extracted]
        description: >-
          EEG, MEG, and intracranial electrical measures.
      unstated:
        in_subset: [mvp, model_extracted]

  MeasureType:
    in_subset: [mvp, model_extracted]
    description: >-
      Normalized scientific quantity of the map, for cross-study queries. Activation and
      deactivation are directions rather than measure types; both are bold_response and
      the directional roles carry the direction. Gray-matter density is not collapsed into
      volume. Use `unstated` only when the paper does not identify the measure. Open
      vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      bold_response:
        in_subset: [mvp, model_extracted]
        description: BOLD activation, task activation, or task-evoked response.
      bold_derived_metric:
        in_subset: [mvp, model_extracted]
        description: ALFF, fALFF, regional homogeneity, and similar derived BOLD metrics.
      gray_matter_volume:
        in_subset: [mvp, model_extracted]
        description: >-
          The quantity of grey matter, from voxel-based or region-based morphometry.
      gray_matter_density:
        in_subset: [mvp, model_extracted]
        description: Gray-matter density or concentration, kept distinct from volume.
      white_matter_volume:
        in_subset: [mvp, model_extracted]
        description: >-
          The quantity of white matter.
      cortical_thickness:
        in_subset: [mvp, model_extracted]
        description: >-
          The distance between the grey-white boundary and the pial surface.
      surface_area:
        in_subset: [mvp, model_extracted]
        description: >-
          The area of a cortical surface or one of its parcels.
      structural_morphometry_other:
        in_subset: [mvp, model_extracted]
        description: >-
          A structural measure none of the named ones covers -- gyrification, sulcal depth,
          a shape descriptor.
      diffusion_metric:
        in_subset: [mvp, model_extracted]
        description: Fractional anisotropy, mean diffusivity, and similar; name the metric in specific_metric.
      cerebral_blood_flow:
        in_subset: [mvp, model_extracted]
        description: >-
          Perfusion as a flow rate, from ASL or a tracer.
      cerebral_blood_volume:
        in_subset: [mvp, model_extracted]
        description: >-
          The fraction of tissue occupied by blood, distinct from the rate at which it
          flows.
      metabolic_rate:
        in_subset: [mvp, model_extracted]
        description: >-
          A rate of consumption or turnover, such as the glucose metabolic rate from FDG-
          PET.
      receptor_binding:
        in_subset: [mvp, model_extracted]
        description: PET receptor-binding potential.
      tracer_uptake:
        in_subset: [mvp, model_extracted]
        description: >-
          How much tracer accumulated, as an uptake value rather than a modelled rate or
          binding parameter.
      electrophysiological_amplitude:
        in_subset: [mvp, model_extracted]
        description: >-
          The size of a voltage or field deflection in the time domain, such as an evoked-
          potential peak.
      electrophysiological_power:
        in_subset: [mvp, model_extracted]
        description: >-
          Signal power in a frequency band. The band itself is not a field here; name it in
          specific_metric.
      connectivity_strength:
        in_subset: [mvp, model_extracted]
        description: PPI, seed correlation, or DCM parameter.
      decoding_performance:
        in_subset: [mvp, model_extracted]
        description: Classifier accuracy or other pattern-discriminability performance.
      representational_similarity:
        in_subset: [mvp, model_extracted]
        description: Model-brain similarity from an RDM-level association.
      component_loading:
        in_subset: [mvp, model_extracted]
        description: ICA or PCA spatial loading.
      unstated:
        in_subset: [mvp, model_extracted]

  Prespecification:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether a contrast was planned before the data were seen. The distinction has a query
      behind it: a preregistered primary contrast and a post-hoc sweep from the same paper
      are not equivalent evidence, and a synthesis that cannot tell them apart cannot
      address selective reporting.

      Closed, and exhaustive by construction rather than by survey. The question admits
      three answers -- the source says it was planned, the source says it was not, the
      source does not say -- and every paper falls in one. That is why this enum takes no
      free-text binding while most others do: an open vocabulary earns its place by
      collecting the wording that reveals a missing category, and there is no category here
      left to find.
    permissible_values:
      preregistered:
        in_subset: [mvp, model_extracted]
        description: >-
          The source states the analysis was planned before the data were seen. A public
          registration is the strongest form -- a registry entry, a trial identifier, a
          registered report -- but a stated protocol or analysis plan counts, since what
          matters for pooling is that the contrast was fixed in advance rather than where
          it was deposited. The claim must be the source's, and a registration covering the
          study does not by itself cover every contrast reported from it.
      exploratory:
        in_subset: [mvp, model_extracted]
        description: >-
          The source presents the analysis as exploratory, post hoc, data-driven, or
          follow-up to something else it found. A positive statement by the authors, not an
          inference from an absent registration.
      unstated:
        in_subset: [mvp, model_extracted]
        description: >-
          The source says nothing either way. The expected value for most of the
          literature, and distinct from `exploratory`: an unregistered analysis the authors
          never characterize is not thereby an admitted post-hoc one.

  TermType:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether a model term is categorical or continuous.
    permissible_values:
      categorical:
        in_subset: [mvp, model_extracted]
        description: >-
          A factor, defined by its levels and the cohorts, conditions, occasions, or arms
          carrying them. Its cells name a `level`, and a cell's `direction` is the sign of the
          contrast weight put on that level -- something the analyst specified.
      continuous:
        in_subset: [mvp, model_extracted]
        description: >-
          Carries the slope facts, and has no levels. Its cell names no `level`, there being no
          level for a slope to be, and the cell's `direction` is the sign of the fitted
          coefficient -- something the data produced rather than something specified.

  # There is no enum for a term's role in a contrast. A term is tested iff it has a `Cell`,
  # adjusted for iff it is a term of the model with no cell, a moderator iff it is a component of
  # a product term whose components carry cells, and the mediator is named by `Effect.mediation`.

  VariationLevel:
    in_subset: [mvp, model_extracted]
    description: >-
      The level at which a term varies -- whether it moves within a participant or only
      across the sample. A property of **any** term, categorical or continuous: a
      repeated-measures factor and a trial-wise modulator are both within-subject, and a
      diagnosis factor and an age covariate are both between-subject.

      For a continuous term it is what separates a parametric modulation from a
      cross-subject regression, and the derived kind of an effect testing it reads this.
      For a categorical factor it is what the literature calls the factor's scope, and it
      feeds no derivation -- it is recorded because it is a fact about the design that
      decides whether two studies estimated the same thing.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      within_subject:
        in_subset: [mvp, model_extracted]
        description: >-
          The term moves within a participant: a continuous term taking many values trial to
          trial or scan to scan, which is the level a parametric modulation is estimated at,
          or a categorical factor every participant met every level of -- a repeated-measures
          or crossover design.
      between_subject:
        in_subset: [mvp, model_extracted]
        description: >-
          The term varies only across the sample: one value per participant for a continuous
          term, or a categorical factor each participant sits in exactly one level of, as a
          diagnosis or a parallel-group allocation does.
      mixed:
        in_subset: [mvp, model_extracted]
        description: >-
          The term varies both within and between participants: age in a longitudinal study,
          where each person ages and people also differ in age at entry, or a partially
          crossed factor some participants met every level of and others did not.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source does not report the level at which the term varies.

  Direction:
    in_subset: [mvp, model_extracted]
    description: >-
      Which way a term entered or came out of an analysis, in one vocabulary for every kind of
      term. It is a sign, not a magnitude: the schema records signs and never numeric contrast
      weights, so `[1, -1/2, -1/2]` and `[1, -1, 0]` over the same three levels are both one
      positive level against two others, and a contrast whose magnitudes matter keeps them in
      Analysis.definition.

      There is no value for a zero weight: a zero weight is a level with no `Cell`. A level of a
      tested term that a contrast did not weight is absent from `cells`, as a term the contrast did
      not test is absent entirely, and both are read by subtraction -- from the term's
      `FactorLevel`s and from `ModelEstimation.terms` respectively.

      One vocabulary serves both kinds of term. A categorical level put on the plus side of a
      comparison and a continuous term whose coefficient came out positive are both `positive`, and
      "A greater than B" is a positive cell and a negative cell on one term. Which of the two a
      given cell carries follows from the referenced term's `type`.

      On a cell over a **product** term it is the sign of the interaction coefficient -- a fact
      about the crossing, such as "the age-related decline was steeper in patients", rather than
      about either component's own slope. When simple slopes differ by moderator level and no
      single sign is reported, use `unstated` and state the pattern in Analysis.definition.

      Only `positive` and `negative` count as directional, so a cell recording no sign never
      silently changes the derived kind. Two values record no sign, and what separates them is
      whether a sign exists at all: `unstated` is one the source withheld, `not_applicable` is
      a level the contrast put on both sides at once, which no report could have signed.
    permissible_values:
      positive:
        in_subset: [mvp, model_extracted]
        description: >-
          A level on the plus side of the comparison, or a coefficient under which the measure
          rises as the term rises.
      negative:
        in_subset: [mvp, model_extracted]
        description: >-
          A level on the minus side of the comparison, or a coefficient under which the measure
          falls as the term rises.
      unstated:
        in_subset: [mvp, model_extracted]
        description: >-
          A sign exists and the source does not report it. This is what an **undirected test**
          looks like on a cell: an F or chi-square over a factor compares that factor's levels
          against each other and reports no sign, so each of its levels takes a cell with this
          value, and an interaction F takes it on the cell over the product column. Giving them
          cells rather than omitting them keeps the term out of the derived adjustment set -- it
          was tested, not controlled for -- while contributing nothing to the directional count,
          which is what makes such an effect an `omnibus`.

          Also the value when simple slopes differ by moderator level and no single sign is
          given: state the pattern in Analysis.definition.

          Distinct from omitting the cell, which says the contrast weighted this level out, and
          from `not_applicable`, which says no sign could apply here at all.
      not_applicable:
        in_subset: [mvp, model_extracted]
        description: >-
          No sign could apply. On a `Cell` exactly one shape means this: a level the contrast was
          taken *within*, which appears on **both sides** of the comparison and so has no net sign
          -- "patients versus controls, in the task condition" has task on the plus side and the
          minus side at once. The effect stays a `contrast` on whatever else is crossed, and the
          factor stays out of the adjustment set: it took part, at one level.

          It is not `unstated`, which is a sign that exists and was withheld. The question that
          separates them is whether a fuller report could have signed this cell. For a level an
          F-test spanned, it could -- the level entered the comparison and the paper gave no
          direction, which is `unstated`. For a level held constant, it could not, because the
          contrast put that level on both sides.

          A held level leaves its factor's other levels **absent**, which is also how the two read
          apart in a record: an undirected test cells every level of the factor, a held factor
          cells one and omits the rest. A cell that names no level -- on a slope or a product
          column -- can never sit on both sides, so it can never take this value.

          Off a `Cell`, on a parameter-sign slot of a method payload, it is the same claim about a
          different quantity: the method yields no signed parameter to report.
  # No `product` value: a column is a product iff `ModelTerm.interaction_with` is non-empty.
  FunctionalForm:
    in_subset: [mvp, model_extracted]
    description: >-
      Shape of a term's relationship to the measure. A squared term with a negative
      coefficient is an inverted-U relationship, not a negative association, so non-linear
      and transformed terms must not be reported as linear. Open vocabulary: write the
      source's own wording in the field when nothing here fits.
    permissible_values:
      linear:
        in_subset: [mvp, model_extracted]
        description: >-
          The measure changes by a constant amount per unit of the term.
      quadratic:
        in_subset: [mvp, model_extracted]
        description: >-
          A squared term. With a negative coefficient this is an inverted-U, not a negative
          association.
      absolute:
        in_subset: [mvp, model_extracted]
        description: >-
          Unsigned-magnitude regressors such as an absolute prediction error or an
          unsigned log-evidence.
      log:
        in_subset: [mvp, model_extracted]
        description: >-
          The term was log-transformed before entering the model.
      unstated:
        in_subset: [mvp, model_extracted]

  ConnectivityMethod:
    in_subset: [mvp, model_extracted]
    description: >-
      Method used to estimate connectivity. Open vocabulary: write the source's own
      wording in the field when nothing here fits.
    permissible_values:
      ppi:
        in_subset: [mvp, model_extracted]
        description: >-
          Psychophysiological interaction: connectivity with a seed that changes with a
          psychological condition.
      gppi:
        in_subset: [mvp, model_extracted]
        description: >-
          Generalized PPI, which models every condition rather than a single contrast.
      seed_based:
        in_subset: [mvp, model_extracted]
        description: >-
          Correlation between a seed's time series and every other element, with no
          interaction term.
      dcm:
        in_subset: [mvp, model_extracted]
        description: >-
          Dynamic causal modelling, which estimates directed influence from a generative
          model.
      granger:
        in_subset: [mvp, model_extracted]
        description: >-
          Granger causality, which infers direction from temporal precedence.
      coherence:
        in_subset: [mvp, model_extracted]
        description: >-
          Frequency-domain coupling between two signals.
      structural_covariance:
        in_subset: [mvp, model_extracted]
        description: >-
          Correlation of a structural measure between regions across participants, rather than
          of a signal within one. The seed and target are regions as in any other method here,
          but the correlation runs over subjects, so there is no time series.
      multivariate:
        in_subset: [mvp, model_extracted]
        description: >-
          Pattern-based connectivity: multivoxel or informational connectivity between
          ensembles of voxels rather than between averaged time series.
      unstated:
        in_subset: [mvp, model_extracted]

  ParameterChange:
    in_subset: [mvp, model_extracted]
    description: Whether the experimental effect raised or lowered a connectivity parameter.
    permissible_values:
      increased:
        in_subset: [mvp, model_extracted]
        description: >-
          The experimental effect raised the parameter.
      decreased:
        in_subset: [mvp, model_extracted]
        description: >-
          The experimental effect lowered the parameter.
      unstated:
        in_subset: [mvp, model_extracted]
      not_applicable:
        in_subset: [mvp, model_extracted]
        description: Direction is carried by condition or group roles instead.

  InferenceTarget:
    in_subset: [mvp, model_extracted]
    description: >-
      What the connectivity analysis drew inference about. Open vocabulary: write the
      source's own wording in the field when nothing here fits.
    permissible_values:
      connectivity_parameter:
        in_subset: [mvp, model_extracted]
        description: >-
          The test was on the strength of a connection.
      model_comparison:
        in_subset: [mvp, model_extracted]
        description: >-
          The test was on which of several models fits better, not on any one parameter.
      network:
        in_subset: [mvp, model_extracted]
        description: >-
          The test was on a set of connections treated as a unit, rather than on individual
          edges.
      unstated:
        in_subset: [mvp, model_extracted]

  EdgeDirectionality:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether a connectivity edge is genuinely directed. Only directed models such as DCM
      and Granger causality qualify; a seed-to-voxel PPI or correlation is undirected, and
      its sign travels with the edge rather than implying a direction.
    permissible_values:
      directed:
        in_subset: [mvp, model_extracted]
        description: >-
          The method supports a claim about which region influences which.
      undirected:
        in_subset: [mvp, model_extracted]
        description: >-
          The method gives a symmetric relationship only, whatever the wording of the paper.
      unstated:
        in_subset: [mvp, model_extracted]

  PerformanceRelation:
    in_subset: [mvp, model_extracted]
    description: Direction of a decoding performance metric relative to its reference value.
    permissible_values:
      above_reference:
        in_subset: [mvp, model_extracted]
        description: >-
          Performance exceeded its reference value.
      below_reference:
        in_subset: [mvp, model_extracted]
        description: >-
          Performance fell below its reference value.
      unstated:
        in_subset: [mvp, model_extracted]
      not_applicable:
        in_subset: [mvp, model_extracted]

        description: >-
          The measure has no reference to compare against.
  NullHypothesis:
    in_subset: [mvp, model_extracted]
    description: >-
      Which null hypothesis a conjunction tested. Only the conjunction null licenses the
      interpretation that every component effect is present, so the hypothesis is
      recorded separately from the procedure that implemented it.
    permissible_values:
      global_null:
        in_subset: [mvp, model_extracted]
        description: At least one component effect is present at a voxel (Friston et al.).
      conjunction_null:
        in_subset: [mvp, model_extracted]
        description: Every component effect is present at a voxel (Nichols et al.).
      unstated:
        in_subset: [mvp, model_extracted]

  ConjunctionImplementation:
    in_subset: [mvp, model_extracted]
    description: >-
      Procedure used to compute the conjunction, which is not the same statement as the
      null hypothesis it tested: a minimum-statistic test is the usual implementation of
      the conjunction null. Open vocabulary: write the source's own wording in the field
      when nothing here fits.
    permissible_values:
      minimum_statistic:
        in_subset: [mvp, model_extracted]
        description: >-
          Each element takes the smaller of its statistics, so a conjunction survives only
          where both effects do.
      masking:
        in_subset: [mvp, model_extracted]
        description: >-
          One effect's map was thresholded and used to mask the other.
      logical_or:
        in_subset: [mvp, model_extracted]
        description: >-
          Elements surviving either effect were combined, which tests the global null rather
          than the conjunction null.
      unstated:
        in_subset: [mvp, model_extracted]

  SecondBlock:
    in_subset: [mvp, model_extracted]
    description: >-
      What a decomposition crossed the brain block with, one value per block. This decides
      whether two decompositions answer the same question, so it is the payload's one
      required vocabulary -- a task PLS and a behavioural PLS are not poolable, and neither
      is a one-block ICA with either of them.

      Multivalued, and `none` is a value rather than an absent field: a one-block
      decomposition is a positive assertion, not a gap. The old `PlsType: multiblock` is
      gone, because it named the *number* of blocks where its siblings named their
      *contents*, so a design-plus-behaviour PLS had to select it and thereby discard both
      facts. Two blocks is now `[design, behavioral]`, and the count is derived from the
      list's length.

      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      none:
        in_subset: [mvp, model_extracted]
        description: >-
          The brain data were decomposed alone -- ordinary ICA, PCA, or a related
          single-block method. The commonest case by a wide margin.
      design:
        in_subset: [mvp, model_extracted]
        description: >-
          The experimental design, as in mean-centred task PLS, including the
          spatiotemporal variant that carries a time dimension.
      behavioral:
        in_subset: [mvp, model_extracted]
        description: >-
          Participant-level behavioural or clinical measures. Where those measures are
          `Assessment` records of this study, `second_block_assessments` names them.
      seed_activity:
        in_subset: [mvp, model_extracted]
        description: >-
          Activity in one or more seed regions, named in `second_block_detail`. A
          connectivity question asked with decomposition machinery.
      other_imaging_modality:
        in_subset: [mvp, model_extracted]
        description: >-
          A second (or third) imaging measure of the same participants -- the multimodal
          fusion case. Joint, linked and parallel ICA and mCCA+jICA all land here, and a
          three-modality fusion carries this value once per additional modality.
      genetic:
        in_subset: [mvp, model_extracted]
        description: >-
          Genotype data such as a SNP array. Not an `Assessment`, so its contents belong in
          `second_block_detail`.
      unstated:
        in_subset: [mvp, model_extracted]
        description: >-
          The source says the decomposition crossed two blocks but does not say what the
          second held. Distinct from `none`, which asserts there was only one.

  DecompositionMethod:
    in_subset: [mvp, model_extracted]
    description: >-
      The algorithm that produced the components or latent variables, which decides what
      their values and signs mean. Independent of `second_block`: the block structure is
      what a synthesis filters on, and the same block structure is reachable by several
      algorithms -- a brain-behaviour covariance can be decomposed by PLS or by CCA, and
      those results pool with each other more readily than a task PLS pools with a
      behavioural one.

      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      ica:
        in_subset: [mvp, model_extracted]
        description: >-
          Independent component analysis.
      tensor_ica:
        in_subset: [mvp, model_extracted]
        description: >-
          ICA over a subject-by-time-by-space tensor, giving one shared spatial map with
          per-subject loadings.
      joint_ica:
        in_subset: [mvp, model_extracted]
        description: >-
          ICA on features concatenated across modalities, sharing one mixing matrix. Takes
          `other_imaging_modality` in `second_block`.
      parallel_ica:
        in_subset: [mvp, model_extracted]
        description: >-
          ICA run on two blocks at once with their mixing profiles linked, so a component
          of one block is paired with a component of the other. Covers linked ICA.
      pca:
        in_subset: [mvp, model_extracted]
        description: >-
          Principal component analysis, whose components are orthogonal rather than
          independent.
      nmf:
        in_subset: [mvp, model_extracted]
        description: >-
          Non-negative matrix factorization, whose components cannot take negative values.
      dictionary_learning:
        in_subset: [mvp, model_extracted]
        description: >-
          A sparse decomposition learning an overcomplete set of components.
      pls:
        in_subset: [mvp, model_extracted]
        description: >-
          Partial least squares, where the source does not distinguish the correlation and
          regression variants.
      pls_correlation:
        in_subset: [mvp, model_extracted]
        description: >-
          PLS correlation (PLS-C), decomposing the cross-block correlation matrix by SVD.
          The variant most fMRI work means by "PLS".
      pls_regression:
        in_subset: [mvp, model_extracted]
        description: >-
          PLS regression, which predicts one block from the other rather than decomposing
          their shared covariance symmetrically.
      cca:
        in_subset: [mvp, model_extracted]
        description: >-
          Canonical correlation analysis, which maximizes correlation between blocks where
          PLS maximizes covariance.
      mcca:
        in_subset: [mvp, model_extracted]
        description: >-
          Multi-set CCA, over three or more blocks. Frequently chained into joint ICA as
          mCCA+jICA, which takes this value with `joint_ica` noted in
          `Analysis.model_representation_notes` when the chaining matters.
      unstated:
        in_subset: [mvp, model_extracted]

  MapQuantity:
    in_subset: [mvp, model_extracted]
    description: >-
      What the values of a component or latent-variable map represent. Open vocabulary:
      write the source's own wording in the field when nothing here fits.
    permissible_values:
      loading:
        in_subset: [mvp, model_extracted]
        description: >-
          How strongly each participant or time point expresses the component.
      weight:
        in_subset: [mvp, model_extracted]
        description: >-
          The component's contribution at each element, in the decomposition's own scale.
      salience:
        in_subset: [mvp, model_extracted]
        description: >-
          A PLS salience: the element's contribution to a latent variable. Kept distinct
          from `weight` because saliences are conventionally reported as bootstrap ratios,
          which are stability measures rather than test statistics -- the threshold applied
          to them is `salience_threshold`, not a voxelwise statistic threshold.
      z_score:
        in_subset: [mvp, model_extracted]
        description: >-
          The component map after standardizing its values.
      spatial_map:
        in_subset: [mvp, model_extracted]
        description: >-
          The component's spatial pattern, where the source does not say what the values
          are.
      unstated:
        in_subset: [mvp, model_extracted]

  PolaritySemantics:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether the sign of a component map carries meaning. Decomposition methods can
      return components whose polarity is arbitrary, in which case a negative loading is
      not a decrease.
    permissible_values:
      meaningful:
        in_subset: [mvp, model_extracted]
        description: >-
          The sign is interpretable: a negative value means a decrease.
      arbitrary:
        in_subset: [mvp, model_extracted]
        description: >-
          The method could have returned the component with its sign flipped, so a negative
          value does not mean a decrease.
      unsigned:
        in_subset: [mvp, model_extracted]
        description: >-
          The values carry no sign at all.
      unstated:
        in_subset: [mvp, model_extracted]

  NotStructurableReason:
    in_subset: [mvp, model_extracted]
    description: >-
      Why a grounded effect has no stable structured decomposition. Open vocabulary: write
      the source's own wording in the field when nothing here fits.
    permissible_values:
      method_specific_derived_metric:
        in_subset: [mvp, model_extracted]
        description: >-
          The tested quantity is a metric peculiar to one method, with no counterpart in the
          shared vocabulary.
      insufficient_standard_structure:
        in_subset: [mvp, model_extracted]
        description: >-
          The design has too little of the usual structure -- no conditions, no groups, no
          terms -- to decompose.
      source_too_vague:
        in_subset: [mvp, model_extracted]
        description: >-
          The paper reports an effect without saying enough about it to structure.
