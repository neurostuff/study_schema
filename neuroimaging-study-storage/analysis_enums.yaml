id: https://neurostuff.org/schemas/neuroimaging-study-storage/analysis_enums
name: neuroimaging-study-storage-analysis-enums
title: Neuroimaging Study Storage Analysis Vocabularies
description: >-
  Controlled vocabularies for the tested effect represented by an Analysis, ported
  from analysis-schema v0.1.0-alpha.11. This module holds enumerations only, so that
  both the analysis module and the analysis-details module can bind to them without
  either importing the other.

  Two conventions run through every enumeration here. `unstated` means the fact could
  exist but the source does not clearly report it; `not_applicable` means the concept
  does not apply to this analysis. They are not interchangeable, and neither is a
  substitute for the record-level Analysis.certainty.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
default_prefix: neurostudy
default_range: string

enums:

  AnalysisType:
    description: >-
      The method that produced the statistical map, which is independent of what was
      tested about it. A between-group comparison of connectivity, decoding accuracy,
      or component loadings keeps the derived type here and records the comparison in
      Effect.
    permissible_values:
      mass_univariate:
        description: >-
          Voxelwise, vertexwise, or ROI-wise GLM, mixed-effects model, ANOVA or ANCOVA,
          or robust regression. This is the default family and takes no details payload.
      multivariate_decoding:
        description: Classification or pattern discriminability.
      representational_similarity:
        description: >-
          Association at the level of representational dissimilarity matrices. A
          trial-wise similarity or model-fit regressor entered into a univariate GLM is
          mass_univariate with a parametric_modulation effect, not this.
      connectivity:
        description: >-
          PPI, gPPI, seed-based connectivity, DCM, or Granger causality. PPI stays here
          even when the software estimates it with a GLM.
      conjunction:
        description: Logical combination of independently defined effects.
      component_decomposition:
        description: ICA and related component maps.
      other:
        description: >-
          A method outside the first-class families. Permits an effect kind of `other`
          whatever the terms are, so an unusual design never has to delete true terms.
      not_structurable:
        description: >-
          The effect is grounded in the source but has no stable structured
          decomposition.

  SpatialScope:
    description: >-
      Spatial domain of the analysis. Inside this vocabulary rather than treated as
      preprocessing metadata because it is a meta-analysis inclusion criterion.
    permissible_values:
      whole_brain:
        description: Inference across the whole acquired volume or surface.
      roi:
        description: Inference restricted to one or more regions of interest.
      searchlight:
        description: Moving-window multivariate analysis across the whole search space.
      other:
        description: A spatial domain that none of the above describes.
      unstated:
        description: The source does not report the spatial domain.

  RoiDefinition:
    description: >-
      How a region of interest was defined. This records independence, which is why the
      distinction matters more than the atlas name: an ROI drawn from the study's own
      prior contrast is not independent of the effect being tested.
    permissible_values:
      atlas:
        description: An atlas or parcellation.
      prior_literature:
        description: Coordinates or regions taken from previously published work.
      anatomical_a_priori:
        description: Anatomically defined regions specified in advance.
      functional_localizer:
        description: A separate localizer scan or run.
      same_study_analysis:
        description: >-
          Defined from another analysis in the same study, so the region is not
          independent of the reported effect.
      unstated:
        description: The source restricts inference to a region but does not say how it was defined.
      not_applicable:
        description: >-
          Required for whole-brain and searchlight analyses, and forbidden when
          spatial_scope is roi.

  Certainty:
    description: >-
      How the record's design classification was arrived at. A three-level ordinal
      rather than a probability, because the tiers are auditable: a reviewer can check
      whether the source states the design. Its purpose is routing, so that stated
      records can go to hard filtering and uncertain ones to human review.
    permissible_values:
      stated:
        description: The design is named in the source, for example "group x condition interaction F-test".
      inferred:
        description: Assembled from Methods prose rather than named.
      uncertain:
        description: A judgement call between two defensible readings.

  DirectionalRole:
    description: >-
      Which side of a comparison an entity sits on. Direction is normalized to roles
      rather than numeric contrast weights. Only `greater` and `lesser` count as
      directional, so an unreported direction never silently changes the effect kind.
    permissible_values:
      included:
        description: Participates in the analysis without a directional comparison.
      greater:
        description: The greater-than side of the comparison.
      lesser:
        description: The lesser-than side of the comparison.
      unstated:
        description: The entity is compared but the source does not report which side.

  EffectKind:
    description: >-
      The kind of effect tested. This is a function of which terms carry direction, and
      is recomputed from the terms by the structural validator rather than being an
      independent judgement call. `contrast` covers both a condition comparison and a
      group comparison; which one it is follows from which entities carry direction.
    permissible_values:
      simple_effect:
        description: >-
          A one-sample test of a map against a reference. Covers activation and
          deactivation against an implicit baseline, decoding accuracy above chance,
          dissimilarity above zero, and connectivity different from zero.
      contrast:
        description: >-
          A greater/lesser pair on exactly one axis. On the group axis it is a group
          comparison; on the condition axis a condition comparison. Directional terms on
          both axes are an interaction.
      interaction:
        description: >-
          Direction carried by groups and conditions together, by composite conditions
          with factor levels, by crossed group cells, or by a product term.
      parametric_modulation:
        description: A primary continuous term varying within subject.
      cross_subject_regression:
        description: A primary continuous term varying between subject or mixed.
      omnibus:
        description: >-
          A multi-degree-of-freedom test with no direction. When computed on a
          directional contrast, that contrast is recorded as a categorical term with its
          levels and the conditions stay non-directional.
      other:
        description: >-
          No other kind fits. Includes component maps reported without an inferential
          test, and mediated paths. The meaning stays in Analysis.definition.

  Baseline:
    description: >-
      What the map was tested against, in the same field for every analysis family.
      Whether a baseline was modelled is what separates a simple effect from a condition
      contrast, and papers state it only about half the time, so `unstated` keeps that
      uncertainty visible instead of burying it in the effect kind.
    permissible_values:
      modelled_condition:
        description: >-
          An explicit condition such as rest, fixation, or a control task is a term of
          the contrast.
      implicit:
        description: The unmodelled implicit baseline of the design.
      chance:
        description: A classification or discriminability metric tested against chance.
      zero:
        description: A similarity, dissimilarity, or connectivity parameter tested against zero.
      unstated:
        description: The source says "versus baseline" without saying which.
      not_applicable:
        description: >-
          The tested effect has no reference: group contrasts, interactions, slopes, and
          omnibus tests.

  EffectPath:
    description: >-
      Separates a mediated effect from an ordinary one. Without this, an indirect-effect
      map is structurally identical to a plain regression on the same predictor, and a
      synthesis would pool the two.
    permissible_values:
      direct:
        description: The effect of the primary term with the mediator controlled.
      indirect:
        description: The mediated path, for example a product of coefficients.
      total:
        description: The unmediated total effect.
      not_applicable:
        description: No mediation model. This is the normal case.

  ModelFamily:
    description: Statistical model family used to estimate the effect.
    permissible_values:
      glm:
      mixed_effects:
      anova:
      ancova:
      robust_regression:
      other:
      unstated:

  StatisticFamily:
    description: >-
      Test statistic family for the tested effect, independent of the thresholding
      procedure recorded in InferenceSettings.
    permissible_values:
      "t":
      "z":
        description: Has no degrees of freedom, so both numerator and denominator stay unset.
      "f":
        description: Normally the only family besides likelihood_ratio to populate the numerator.
      chi_square:
      likelihood_ratio:
      beta:
      correlation:
      other:
      unstated:

  MeasureFamily:
    description: >-
      Broad imaging or signal family, for coarse filtering. A BOLD-derived connectivity
      or decoding result stays functional_bold: derived measures take the family of the
      underlying signal.
    permissible_values:
      functional_bold:
      structural_morphometry:
      diffusion:
      perfusion:
      molecular_imaging:
      electrophysiology:
      other:
      unstated:

  MeasureType:
    description: >-
      Normalized scientific quantity of the map, for cross-study queries. Activation and
      deactivation are directions rather than measure types; both are bold_response and
      the directional roles carry the direction. Gray-matter density is not collapsed
      into volume. Use `unstated` only when the paper does not identify the measure.
    permissible_values:
      bold_response:
        description: BOLD activation, task activation, or task-evoked response.
      bold_derived_metric:
        description: ALFF, fALFF, regional homogeneity, and similar derived BOLD metrics.
      gray_matter_volume:
      gray_matter_density:
        description: Gray-matter density or concentration, kept distinct from volume.
      white_matter_volume:
      cortical_thickness:
      surface_area:
      structural_morphometry_other:
      diffusion_metric:
        description: Fractional anisotropy, mean diffusivity, and similar; name the metric in specific_metric.
      cerebral_blood_flow:
      cerebral_blood_volume:
      metabolic_rate:
      receptor_binding:
        description: PET receptor-binding potential.
      tracer_uptake:
      electrophysiological_amplitude:
      electrophysiological_power:
      connectivity_strength:
        description: PPI, seed correlation, or DCM parameter.
      decoding_performance:
        description: Classifier accuracy or other pattern-discriminability performance.
      representational_similarity:
        description: Model-brain similarity from an RDM-level association.
      component_loading:
        description: ICA or PCA spatial loading.
      other:
        description: No controlled term fits; keep the quantity in Measure.source_label.
      unstated:

  TermType:
    description: >-
      Whether a model term is categorical or continuous. This is the only distinction
      that matters statistically, which is why factors and predictors are one list.
    permissible_values:
      categorical:
        description: >-
          A pointer to the Groups or Conditions it ranges over. Takes
          association_direction not_applicable; its direction, if any, lives on the
          group or condition terms.
      continuous:
        description: Carries the slope facts.

  TermRole:
    description: >-
      How a term enters the model. This is load-bearing rather than descriptive: the
      derivation of Effect.kind reads only `primary` terms, so the role decides whether a
      continuous term makes the effect a parametric modulation, a cross-subject
      regression, or neither.
    permissible_values:
      primary:
        description: >-
          A term of interest -- part of what the analysis tested. More than one is
          allowed: a multiple regression reports more than one effect of interest, and
          product terms need their components.
      nuisance:
        description: >-
          Controlled for, not tested. Recorded so a reader knows what was in the model,
          and deliberately invisible to the derivation of Effect.kind: marking a covariate
          such as age, head motion, or total intracranial volume primary would assert that
          the paper tested an effect of it.
      moderator:
        description: >-
          A variable whose level changes the size or sign of a primary effect. Rarely the
          right choice, and unused in the source specification's development corpus: the
          canonical encoding of moderation gives the moderator and the effect it moderates
          both `primary`, and puts the moderation in a third term with functional_form
          `product` and interaction_with naming the two.
      mediator:
        description: >-
          The intervening variable of a mediation model. Requires an Effect.path other
          than not_applicable, and is required by one.

  VariationLevel:
    description: >-
      The level at which a continuous term varies. This is what separates a parametric
      modulation from a cross-subject regression.
    permissible_values:
      within_subject:
      between_subject:
      mixed:
      unstated:

  AssociationDirection:
    description: >-
      Sign of a continuous term's coefficient, or of a connectivity parameter. For a
      product term it is the sign of the interaction coefficient. When simple slopes
      differ by moderator level and no single sign is reported, use `unstated` and state
      the pattern in Analysis.definition.
    permissible_values:
      positive:
      negative:
      unstated:
      not_applicable:
        description: >-
          The term or parameter has no sign to report. Covers categorical terms, whose
          direction lives on the group or condition roles they point at; connectivity
          parameters whose direction is carried by those roles instead; and continuous
          nuisance terms, which are controlled for rather than interpreted, so no
          coefficient sign is reported for them. Use `unstated` instead when a sign exists
          and the source simply does not give it.

  FunctionalForm:
    description: >-
      Shape of a term's relationship to the measure. This prevents a normalization
      error: a squared term with a negative coefficient is an inverted-U relationship,
      not a negative association. Non-linear and transformed terms must not be reported
      as linear.
    permissible_values:
      linear:
      quadratic:
      product:
        description: An interaction term.
      absolute:
        description: >-
          Unsigned-magnitude regressors such as an absolute prediction error or an
          unsigned log-evidence.
      log:
      other:
        description: Anything else, with the transform named in Term.source_definition.
      unstated:

  ConnectivityMethod:
    description: Method used to estimate connectivity.
    permissible_values:
      ppi:
      gppi:
      seed_based:
      dcm:
      granger:
      coherence:
      multivariate:
        description: >-
          Pattern-based connectivity: multivoxel or informational connectivity between
          ensembles of voxels rather than between averaged time series.
      other:
      unstated:

  ParameterChange:
    description: Whether the experimental effect raised or lowered a connectivity parameter.
    permissible_values:
      increased:
      decreased:
      unstated:
      not_applicable:
        description: Direction is carried by condition or group roles instead.

  InferenceTarget:
    description: What the connectivity analysis drew inference about.
    permissible_values:
      connectivity_parameter:
      model_comparison:
      network:
      other:
      unstated:

  EdgeDirectionality:
    description: >-
      Whether a connectivity edge is genuinely directed. Only directed models such as
      DCM and Granger causality qualify; a seed-to-voxel PPI or correlation is
      undirected, and its sign travels with the edge rather than implying a direction.
      This is an enumeration rather than a boolean because the source may not report it.
    permissible_values:
      directed:
      undirected:
      unstated:

  PerformanceRelation:
    description: Direction of a decoding performance metric relative to its reference value.
    permissible_values:
      above_reference:
      below_reference:
      unstated:
      not_applicable:

  NullHypothesis:
    description: >-
      Which null hypothesis a conjunction tested. Only the conjunction null licenses the
      interpretation that every component effect is present, so the hypothesis is
      recorded separately from the procedure that implemented it.
    permissible_values:
      global_null:
        description: At least one component effect is present at a voxel (Friston et al.).
      conjunction_null:
        description: Every component effect is present at a voxel (Nichols et al.).
      unstated:

  ConjunctionImplementation:
    description: >-
      Procedure used to compute the conjunction. A minimum-statistic test is the usual
      implementation of the conjunction null, but the two are not the same statement.
    permissible_values:
      minimum_statistic:
      masking:
      logical_or:
      other:
      unstated:

  ComponentMethod:
    description: Decomposition method that produced the component map.
    permissible_values:
      ica:
      tensor_ica:
      pca:
      nmf:
      dictionary_learning:
      other:
      unstated:

  MapQuantity:
    description: What the values of a component map represent.
    permissible_values:
      loading:
      weight:
      z_score:
      spatial_map:
      other:
      unstated:

  PolaritySemantics:
    description: >-
      Whether the sign of a component map carries meaning. Decomposition methods can
      return components whose polarity is arbitrary, in which case a negative loading is
      not a decrease.
    permissible_values:
      meaningful:
      arbitrary:
      unsigned:
      unstated:

  NotStructurableReason:
    description: Why a grounded effect has no stable structured decomposition.
    permissible_values:
      method_specific_derived_metric:
      insufficient_standard_structure:
      source_too_vague:
      other:
