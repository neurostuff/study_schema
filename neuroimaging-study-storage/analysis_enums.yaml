id: https://neurostuff.org/schemas/neuroimaging-study-storage/analysis_enums
name: neuroimaging-study-storage-analysis-enums
title: Neuroimaging Study Storage Analysis Vocabularies
description: >-
  Controlled vocabularies for the tested effect represented by an Analysis.
  This module holds enumerations only, so that both the
  analysis module and the analysis-details module can bind to them without either importing
  the other.

  Three conventions run through every enumeration. `unstated` means the fact could exist but
  the source does not clearly report it. `not_applicable` means the concept does not apply to
  this analysis. They are not interchangeable, and there is no record-level confidence tier
  alongside them.

  Third, most of these vocabularies are open rather than carrying a catch-all value. An
  attribute binding an open enumeration declares `any_of: [{range: <Enum>}, {range: string}]`
  instead of a range, so the same field holds either a controlled value or the source's own
  words: when nothing fits, write the wording. Modality is the exception and keeps `other`,
  where the value selects the OtherModality payload class. A value outside a vocabulary is a
  signal for review rather than a validation failure; canonicalization is the mapper's job,
  in the `normalize_enum` derivations of extraction-to-storage.map.yaml.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy: https://neurostuff.org/schemas/neuroimaging-study-storage/
imports:
  - linkml:types
  - subsets
default_prefix: neurostudy
default_range: string

enums:

  AnalysisType:
    in_subset: [mvp, model_extracted]
    description: >-
      The method that produced the statistical map, independent of what was tested about
      it. A between-group comparison of connectivity, decoding accuracy, or component
      loadings keeps the method here and records the comparison in Effect. Bound only by
      ConjunctionComponent.analysis_type; an Analysis states its method by which
      AnalysisDetails subclass it fills. Open vocabulary: write the source's own wording
      in the field when nothing here fits.
    permissible_values:
      mass_univariate:
        in_subset: [mvp, model_extracted]
        description: >-
          Voxelwise, vertexwise, or ROI-wise GLM, mixed-effects model, ANOVA or ANCOVA,
          or robust regression. This is the default family and takes no details payload.
      multivariate_decoding:
        in_subset: [mvp, model_extracted]
        description: Classification or pattern discriminability.
      representational_similarity:
        in_subset: [mvp, model_extracted]
        description: >-
          Association at the level of representational dissimilarity matrices. A
          trial-wise similarity or model-fit regressor entered into a univariate GLM is
          mass_univariate with a parametric_modulation effect, not this.
      connectivity:
        in_subset: [mvp, model_extracted]
        description: >-
          PPI, gPPI, seed-based connectivity, DCM, covariance, or Granger causality.
          PPI stays here even when the software estimates it with a GLM.
      conjunction:
        in_subset: [mvp, model_extracted]
        description: Logical combination of independently defined effects.
      component_decomposition:
        in_subset: [mvp, model_extracted]
        description: ICA and related component maps.
      partial_least_squares:
        in_subset: [mvp, model_extracted]
        description: >-
          Task, behavioural, seed, or multiblock PLS. Distinct from
          component_decomposition: PLS decomposes a covariance between the brain data and
          another block, not the brain data alone.
      not_structurable:
        in_subset: [mvp, model_extracted]
        description: >-
          The effect is grounded in the source but has no stable structured
          decomposition.

  SpatialScope:
    in_subset: [mvp, model_extracted]
    description: >-
      Spatial domain of the analysis, and a meta-analysis inclusion criterion. Open
      vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      whole_brain:
        in_subset: [mvp, model_extracted]
        description: Inference across the whole acquired volume or surface.
      roi:
        in_subset: [mvp, model_extracted]
        description: Inference restricted to one or more regions of interest.
      searchlight:
        in_subset: [mvp, model_extracted]
        description: Moving-window multivariate analysis across the whole search space.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source does not report the spatial domain.

  SpatialUnit:
    in_subset: [mvp, model_extracted]
    description: >-
      The element an analysis was carried out over: the surface-versus-volume distinction
      as well as the univariate-versus-parcellated one. Gives the element, where
      SpatialScope gives the extent. Open vocabulary: write the source's own wording in
      the field when nothing here fits.
    permissible_values:
      voxel:
        in_subset: [mvp, model_extracted]
        description: Volumetric voxels.
      vertex:
        in_subset: [mvp, model_extracted]
        description: >-
          Surface vertices, on a reconstructed cortical mesh. Results are vertex indices in
          a surface template rather than stereotactic coordinates.
      roi:
        in_subset: [mvp, model_extracted]
        description: >-
          One value per region, from an averaged or extracted regional summary rather than
          an element-wise map.
      parcel:
        in_subset: [mvp, model_extracted]
        description: >-
          Parcels of a parcellation covering the search space, as distinct from a small set
          of named regions of interest.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source does not report which element the analysis ran over.

  RoiDefinition:
    in_subset: [mvp, model_extracted]
    description: >-
      How a region of interest was defined, which records independence: an ROI drawn from
      the study's own prior contrast is not independent of the effect being tested.
    permissible_values:
      atlas:
        in_subset: [mvp, model_extracted]
        description: An atlas or parcellation.
      prior_literature:
        in_subset: [mvp, model_extracted]
        description: Coordinates or regions taken from previously published work.
      anatomical_a_priori:
        in_subset: [mvp, model_extracted]
        description: Anatomically defined regions specified in advance.
      functional_localizer:
        in_subset: [mvp, model_extracted]
        description: A separate localizer scan or run.
      same_study_analysis:
        in_subset: [mvp, model_extracted]
        description: >-
          Defined from another analysis in the same study, so the region is not
          independent of the reported effect.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source restricts inference to a region but does not say how it was defined.
      not_applicable:
        in_subset: [mvp, model_extracted]
        description: >-
          Required for whole-brain and searchlight analyses, and forbidden when
          spatial_scope is roi.

  DirectionalRole:
    in_subset: [mvp, model_extracted]
    description: >-
      Which side of a comparison an entity sits on, as a role rather than a numeric
      contrast weight. Only `greater` and `lesser` count as directional, so an unreported
      direction never silently changes the effect kind.
    permissible_values:
      included:
        in_subset: [mvp, model_extracted]
        description: Participates in the analysis without a directional comparison.
      greater:
        in_subset: [mvp, model_extracted]
        description: The greater-than side of the comparison.
      lesser:
        in_subset: [mvp, model_extracted]
        description: The lesser-than side of the comparison.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The entity is compared but the source does not report which side.

  EffectKind:
    in_subset: [mvp, model_extracted]
    description: >-
      The kind of effect tested, a function of which terms carry direction and recomputed
      from them by the structural validator. `contrast` covers both a condition comparison
      and a group comparison; which one it is follows from which entities carry direction.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      simple_effect:
        in_subset: [mvp, model_extracted]
        description: >-
          A one-sample test of a map against a reference. Covers activation and
          deactivation against an implicit baseline, decoding accuracy above chance,
          dissimilarity above zero, and connectivity different from zero.
      contrast:
        in_subset: [mvp, model_extracted]
        description: >-
          A greater/lesser pair on exactly one axis. On the group axis it is a group
          comparison; on the condition axis a condition comparison. Directional terms on
          both axes are an interaction.
      interaction:
        in_subset: [mvp, model_extracted]
        description: >-
          Direction carried by groups and conditions together, by composite conditions
          with factor levels, by crossed group cells, or by a product term.
      parametric_modulation:
        in_subset: [mvp, model_extracted]
        description: A primary continuous term varying within subject.
      cross_subject_regression:
        in_subset: [mvp, model_extracted]
        description: A primary continuous term varying between subject or mixed.
      omnibus:
        in_subset: [mvp, model_extracted]
        description: >-
          A multi-degree-of-freedom test with no direction. When computed on a
          directional contrast, that contrast is recorded as a categorical term with its
          levels and the conditions stay non-directional.

  Baseline:
    in_subset: [mvp, model_extracted]
    description: >-
      What the map was tested against, in the same field for every analysis family.
      Whether a baseline was modelled separates a simple effect from a condition contrast;
      use `unstated` when the source says only "versus baseline".
    permissible_values:
      modelled_condition:
        in_subset: [mvp, model_extracted]
        description: >-
          An explicit condition such as rest, fixation, or a control task is a term of
          the contrast.
      implicit:
        in_subset: [mvp, model_extracted]
        description: The unmodelled implicit baseline of the design.
      chance:
        in_subset: [mvp, model_extracted]
        description: A classification or discriminability metric tested against chance.
      zero:
        in_subset: [mvp, model_extracted]
        description: A similarity, dissimilarity, or connectivity parameter tested against zero.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source says "versus baseline" without saying which.
      not_applicable:
        in_subset: [mvp, model_extracted]
        description: >-
          The tested effect has no reference: group contrasts, interactions, slopes, and
          omnibus tests.

  EffectPath:
    in_subset: [mvp, model_extracted]
    description: >-
      Separates a mediated effect from an ordinary one. Without this, an indirect-effect
      map is structurally identical to a plain regression on the same predictor, and a
      synthesis would pool the two.
    permissible_values:
      direct:
        in_subset: [mvp, model_extracted]
        description: The effect of the primary term with the mediator controlled.
      indirect:
        in_subset: [mvp, model_extracted]
        description: The mediated path, for example a product of coefficients.
      total:
        in_subset: [mvp, model_extracted]
        description: The unmediated total effect.
      not_applicable:
        in_subset: [mvp, model_extracted]
        description: No mediation model. This is the normal case.

  ModelFamily:
    in_subset: [mvp, model_extracted]
    description: >-
      Statistical model family used to estimate the effect. Open vocabulary: write the
      source's own wording in the field when nothing here fits.
    permissible_values:
      glm:
        in_subset: [mvp, model_extracted]
        description: >-
          An ordinary least-squares general linear model, including the summary-statistics
          two-stage approach that fMRI calls a random-effects analysis: the group stage is
          still a GLM on contrast images.
      mixed_effects:
        in_subset: [mvp, model_extracted]
        description: >-
          A model estimating random effects directly, rather than by summarizing a first
          stage -- a linear mixed model, a hierarchical model.
      anova:
        in_subset: [mvp, model_extracted]
        description: >-
          Analysis of variance, with no continuous covariate.
      ancova:
        in_subset: [mvp, model_extracted]
        description: >-
          Analysis of covariance: a factorial design with a continuous covariate controlled
          for.
      robust_regression:
        in_subset: [mvp, model_extracted]
        description: >-
          A regression fitted to resist outliers, such as an iteratively reweighted or
          M-estimator fit.
      unstated:
        in_subset: [mvp, model_extracted]

  StatisticFamily:
    in_subset: [mvp, model_extracted]
    description: >-
      Test statistic family for the tested effect, independent of the thresholding
      procedure recorded in InferenceSettings. Open vocabulary: write the source's own
      wording in the field when nothing here fits.
    permissible_values:
      "t":
        in_subset: [mvp, model_extracted]
        description: >-
          Student's t. A single-degree-of-freedom statistic, so only the denominator degrees
          of freedom are populated.
      "z":
        in_subset: [mvp, model_extracted]
        description: Has no degrees of freedom, so both numerator and denominator stay unset.
      "f":
        in_subset: [mvp, model_extracted]
        description: Normally the only family besides likelihood_ratio to populate the numerator.
      chi_square:
        in_subset: [mvp, model_extracted]
        description: >-
          A chi-square statistic.
      likelihood_ratio:
        in_subset: [mvp, model_extracted]
        description: >-
          A likelihood-ratio statistic, from comparing a model against a nested one.
      beta:
        in_subset: [mvp, model_extracted]
        description: >-
          A regression coefficient reported as the test statistic itself, which some papers
          do instead of giving a t or z.
      correlation:
        in_subset: [mvp, model_extracted]
        description: >-
          A correlation coefficient reported as the statistic, r or rho.
      unstated:
        in_subset: [mvp, model_extracted]

  MeasureFamily:
    in_subset: [mvp, model_extracted]
    description: >-
      Broad imaging or signal family, for coarse filtering. A BOLD-derived connectivity or
      decoding result stays functional_bold: derived measures take the family of the
      underlying signal. Open vocabulary: write the source's own wording in the field when
      nothing here fits.
    permissible_values:
      functional_bold:
        in_subset: [mvp, model_extracted]
        description: >-
          The BOLD signal and anything derived from it, including connectivity, decoding
          performance, and amplitude measures.
      structural_morphometry:
        in_subset: [mvp, model_extracted]
        description: >-
          Measures of tissue shape and quantity from a structural image -- volume,
          thickness, surface area, density.
      diffusion:
        in_subset: [mvp, model_extracted]
        description: >-
          Measures from diffusion-weighted imaging.
      perfusion:
        in_subset: [mvp, model_extracted]
        description: >-
          Blood flow and volume measures, from ASL or a contrast agent.
      molecular_imaging:
        in_subset: [mvp, model_extracted]
        description: >-
          PET and SPECT measures of a tracer's distribution or binding.
      electrophysiology:
        in_subset: [mvp, model_extracted]
        description: >-
          EEG, MEG, and intracranial electrical measures.
      unstated:
        in_subset: [mvp, model_extracted]

  MeasureType:
    in_subset: [mvp, model_extracted]
    description: >-
      Normalized scientific quantity of the map, for cross-study queries. Activation and
      deactivation are directions rather than measure types; both are bold_response and
      the directional roles carry the direction. Gray-matter density is not collapsed into
      volume. Use `unstated` only when the paper does not identify the measure. Open
      vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      bold_response:
        in_subset: [mvp, model_extracted]
        description: BOLD activation, task activation, or task-evoked response.
      bold_derived_metric:
        in_subset: [mvp, model_extracted]
        description: ALFF, fALFF, regional homogeneity, and similar derived BOLD metrics.
      gray_matter_volume:
        in_subset: [mvp, model_extracted]
        description: >-
          The quantity of grey matter, from voxel-based or region-based morphometry.
      gray_matter_density:
        in_subset: [mvp, model_extracted]
        description: Gray-matter density or concentration, kept distinct from volume.
      white_matter_volume:
        in_subset: [mvp, model_extracted]
        description: >-
          The quantity of white matter.
      cortical_thickness:
        in_subset: [mvp, model_extracted]
        description: >-
          The distance between the grey-white boundary and the pial surface.
      surface_area:
        in_subset: [mvp, model_extracted]
        description: >-
          The area of a cortical surface or one of its parcels.
      structural_morphometry_other:
        in_subset: [mvp, model_extracted]
        description: >-
          A structural measure none of the named ones covers -- gyrification, sulcal depth,
          a shape descriptor.
      diffusion_metric:
        in_subset: [mvp, model_extracted]
        description: Fractional anisotropy, mean diffusivity, and similar; name the metric in specific_metric.
      cerebral_blood_flow:
        in_subset: [mvp, model_extracted]
        description: >-
          Perfusion as a flow rate, from ASL or a tracer.
      cerebral_blood_volume:
        in_subset: [mvp, model_extracted]
        description: >-
          The fraction of tissue occupied by blood, distinct from the rate at which it
          flows.
      metabolic_rate:
        in_subset: [mvp, model_extracted]
        description: >-
          A rate of consumption or turnover, such as the glucose metabolic rate from FDG-
          PET.
      receptor_binding:
        in_subset: [mvp, model_extracted]
        description: PET receptor-binding potential.
      tracer_uptake:
        in_subset: [mvp, model_extracted]
        description: >-
          How much tracer accumulated, as an uptake value rather than a modelled rate or
          binding parameter.
      electrophysiological_amplitude:
        in_subset: [mvp, model_extracted]
        description: >-
          The size of a voltage or field deflection in the time domain, such as an evoked-
          potential peak.
      electrophysiological_power:
        in_subset: [mvp, model_extracted]
        description: >-
          Signal power in a frequency band. The band itself is not a field here; name it in
          specific_metric.
      connectivity_strength:
        in_subset: [mvp, model_extracted]
        description: PPI, seed correlation, or DCM parameter.
      decoding_performance:
        in_subset: [mvp, model_extracted]
        description: Classifier accuracy or other pattern-discriminability performance.
      representational_similarity:
        in_subset: [mvp, model_extracted]
        description: Model-brain similarity from an RDM-level association.
      component_loading:
        in_subset: [mvp, model_extracted]
        description: ICA or PCA spatial loading.
      unstated:
        in_subset: [mvp, model_extracted]

  Prespecification:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether a contrast was planned before the data were seen. The distinction has a query
      behind it: a preregistered primary contrast and a post-hoc sweep from the same paper
      are not equivalent evidence, and a synthesis that cannot tell them apart cannot
      address selective reporting.

      Closed, and exhaustive by construction rather than by survey. The question admits
      three answers -- the source says it was planned, the source says it was not, the
      source does not say -- and every paper falls in one. That is why this enum takes no
      free-text binding while most others do: an open vocabulary earns its place by
      collecting the wording that reveals a missing category, and there is no category here
      left to find.
    permissible_values:
      preregistered:
        in_subset: [mvp, model_extracted]
        description: >-
          The source states the analysis was planned before the data were seen. A public
          registration is the strongest form -- a registry entry, a trial identifier, a
          registered report -- but a stated protocol or analysis plan counts, since what
          matters for pooling is that the contrast was fixed in advance rather than where
          it was deposited. The claim must be the source's, and a registration covering the
          study does not by itself cover every contrast reported from it.
      exploratory:
        in_subset: [mvp, model_extracted]
        description: >-
          The source presents the analysis as exploratory, post hoc, data-driven, or
          follow-up to something else it found. A positive statement by the authors, not an
          inference from an absent registration.
      unstated:
        in_subset: [mvp, model_extracted]
        description: >-
          The source says nothing either way. The expected value for most of the
          literature, and distinct from `exploratory`: an unregistered analysis the authors
          never characterize is not thereby an admitted post-hoc one.

  TermType:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether a model term is categorical or continuous.
    permissible_values:
      categorical:
        in_subset: [mvp, model_extracted]
        description: >-
          A factor, defined by its levels and the cohorts, conditions, occasions, or arms
          carrying them. Takes association_direction not_applicable; its direction, where
          it has one, lives on the directional terms of an Effect.
      continuous:
        in_subset: [mvp, model_extracted]
        description: Carries the slope facts, and has no levels.

  TermRole:
    in_subset: [mvp, model_extracted]
    description: >-
      How a term enters one contrast -- a property of the TermUse, not of the ModelTerm,
      since a covariate controlled for in one contrast can be the term of interest in
      another taken from the same model. The derivation of Effect.kind reads only `primary`
      uses, so the role decides whether a continuous term makes the effect a parametric
      modulation, a cross-subject regression, or neither.
    permissible_values:
      primary:
        in_subset: [mvp, model_extracted]
        description: >-
          A term of interest -- part of what the analysis tested. More than one is
          allowed: a multiple regression reports more than one effect of interest, and
          product terms need their components.
      nuisance:
        in_subset: [mvp, model_extracted]
        description: >-
          Controlled for, not tested, and invisible to the derivation of Effect.kind.
          Marking a covariate such as age, head motion, or total intracranial volume
          primary would assert that the paper tested an effect of it.
      moderator:
        in_subset: [mvp, model_extracted]
        description: >-
          A variable whose level changes the size or sign of a primary effect. Rarely the
          right choice: the canonical encoding of moderation gives the moderator and the
          effect it moderates both `primary`, and puts the moderation in a third term with
          functional_form `product` and interaction_with naming the two.
      mediator:
        in_subset: [mvp, model_extracted]
        description: >-
          The intervening variable of a mediation model. Requires an Effect.path other
          than not_applicable, and is required by one.

  VariationLevel:
    in_subset: [mvp, model_extracted]
    description: >-
      The level at which a term varies -- whether it moves within a participant or only
      across the sample. A property of **any** term, categorical or continuous: a
      repeated-measures factor and a trial-wise modulator are both within-subject, and a
      diagnosis factor and an age covariate are both between-subject.

      For a continuous term it is what separates a parametric modulation from a
      cross-subject regression, and the derivation of `Effect.kind` reads it on that basis.
      For a categorical factor it is what the literature calls the factor's scope, and it
      feeds no derivation -- it is recorded because it is a fact about the design that
      decides whether two studies estimated the same thing.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      within_subject:
        in_subset: [mvp, model_extracted]
        description: >-
          The term moves within a participant: a continuous term taking many values trial to
          trial or scan to scan, which is the level a parametric modulation is estimated at,
          or a categorical factor every participant met every level of -- a repeated-measures
          or crossover design.
      between_subject:
        in_subset: [mvp, model_extracted]
        description: >-
          The term varies only across the sample: one value per participant for a continuous
          term, or a categorical factor each participant sits in exactly one level of, as a
          diagnosis or a parallel-group allocation does.
      mixed:
        in_subset: [mvp, model_extracted]
        description: >-
          The term varies both within and between participants: age in a longitudinal study,
          where each person ages and people also differ in age at entry, or a partially
          crossed factor some participants met every level of and others did not.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source does not report the level at which the term varies.

  AssociationDirection:
    in_subset: [mvp, model_extracted]
    description: >-
      Sign of a continuous term's coefficient, or of a connectivity parameter. For a
      product term it is the sign of the interaction coefficient. When simple slopes
      differ by moderator level and no single sign is reported, use `unstated` and state
      the pattern in Analysis.definition.
    permissible_values:
      positive:
        in_subset: [mvp, model_extracted]
        description: >-
          The measure rises as the term rises.
      negative:
        in_subset: [mvp, model_extracted]
        description: >-
          The measure falls as the term rises.
      unstated:
        in_subset: [mvp, model_extracted]
      not_applicable:
        in_subset: [mvp, model_extracted]
        description: >-
          The term or parameter has no sign to report: categorical terms, whose direction
          lives on the group or condition roles they point at; connectivity parameters
          carrying their direction the same way; and continuous nuisance terms, which are
          controlled for rather than interpreted. Use `unstated` when a sign exists and
          the source simply does not give it.
  FunctionalForm:
    in_subset: [mvp, model_extracted]
    description: >-
      Shape of a term's relationship to the measure. A squared term with a negative
      coefficient is an inverted-U relationship, not a negative association, so non-linear
      and transformed terms must not be reported as linear. Open vocabulary: write the
      source's own wording in the field when nothing here fits.
    permissible_values:
      linear:
        in_subset: [mvp, model_extracted]
        description: >-
          The measure changes by a constant amount per unit of the term.
      quadratic:
        in_subset: [mvp, model_extracted]
        description: >-
          A squared term. With a negative coefficient this is an inverted-U, not a negative
          association.
      product:
        in_subset: [mvp, model_extracted]
        description: An interaction term.
      absolute:
        in_subset: [mvp, model_extracted]
        description: >-
          Unsigned-magnitude regressors such as an absolute prediction error or an
          unsigned log-evidence.
      log:
        in_subset: [mvp, model_extracted]
        description: >-
          The term was log-transformed before entering the model.
      unstated:
        in_subset: [mvp, model_extracted]

  ConnectivityMethod:
    in_subset: [mvp, model_extracted]
    description: >-
      Method used to estimate connectivity. Open vocabulary: write the source's own
      wording in the field when nothing here fits.
    permissible_values:
      ppi:
        in_subset: [mvp, model_extracted]
        description: >-
          Psychophysiological interaction: connectivity with a seed that changes with a
          psychological condition.
      gppi:
        in_subset: [mvp, model_extracted]
        description: >-
          Generalized PPI, which models every condition rather than a single contrast.
      seed_based:
        in_subset: [mvp, model_extracted]
        description: >-
          Correlation between a seed's time series and every other element, with no
          interaction term.
      dcm:
        in_subset: [mvp, model_extracted]
        description: >-
          Dynamic causal modelling, which estimates directed influence from a generative
          model.
      granger:
        in_subset: [mvp, model_extracted]
        description: >-
          Granger causality, which infers direction from temporal precedence.
      coherence:
        in_subset: [mvp, model_extracted]
        description: >-
          Frequency-domain coupling between two signals.
      structural_covariance:
        in_subset: [mvp, model_extracted]
        description: >-
          Correlation of a structural measure between regions across participants, rather than
          of a signal within one. The seed and target are regions as in any other method here,
          but the correlation runs over subjects, so there is no time series.
      multivariate:
        in_subset: [mvp, model_extracted]
        description: >-
          Pattern-based connectivity: multivoxel or informational connectivity between
          ensembles of voxels rather than between averaged time series.
      unstated:
        in_subset: [mvp, model_extracted]

  ParameterChange:
    in_subset: [mvp, model_extracted]
    description: Whether the experimental effect raised or lowered a connectivity parameter.
    permissible_values:
      increased:
        in_subset: [mvp, model_extracted]
        description: >-
          The experimental effect raised the parameter.
      decreased:
        in_subset: [mvp, model_extracted]
        description: >-
          The experimental effect lowered the parameter.
      unstated:
        in_subset: [mvp, model_extracted]
      not_applicable:
        in_subset: [mvp, model_extracted]
        description: Direction is carried by condition or group roles instead.

  InferenceTarget:
    in_subset: [mvp, model_extracted]
    description: >-
      What the connectivity analysis drew inference about. Open vocabulary: write the
      source's own wording in the field when nothing here fits.
    permissible_values:
      connectivity_parameter:
        in_subset: [mvp, model_extracted]
        description: >-
          The test was on the strength of a connection.
      model_comparison:
        in_subset: [mvp, model_extracted]
        description: >-
          The test was on which of several models fits better, not on any one parameter.
      network:
        in_subset: [mvp, model_extracted]
        description: >-
          The test was on a set of connections treated as a unit, rather than on individual
          edges.
      unstated:
        in_subset: [mvp, model_extracted]

  EdgeDirectionality:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether a connectivity edge is genuinely directed. Only directed models such as DCM
      and Granger causality qualify; a seed-to-voxel PPI or correlation is undirected, and
      its sign travels with the edge rather than implying a direction.
    permissible_values:
      directed:
        in_subset: [mvp, model_extracted]
        description: >-
          The method supports a claim about which region influences which.
      undirected:
        in_subset: [mvp, model_extracted]
        description: >-
          The method gives a symmetric relationship only, whatever the wording of the paper.
      unstated:
        in_subset: [mvp, model_extracted]

  PerformanceRelation:
    in_subset: [mvp, model_extracted]
    description: Direction of a decoding performance metric relative to its reference value.
    permissible_values:
      above_reference:
        in_subset: [mvp, model_extracted]
        description: >-
          Performance exceeded its reference value.
      below_reference:
        in_subset: [mvp, model_extracted]
        description: >-
          Performance fell below its reference value.
      unstated:
        in_subset: [mvp, model_extracted]
      not_applicable:
        in_subset: [mvp, model_extracted]

        description: >-
          The measure has no reference to compare against.
  NullHypothesis:
    in_subset: [mvp, model_extracted]
    description: >-
      Which null hypothesis a conjunction tested. Only the conjunction null licenses the
      interpretation that every component effect is present, so the hypothesis is
      recorded separately from the procedure that implemented it.
    permissible_values:
      global_null:
        in_subset: [mvp, model_extracted]
        description: At least one component effect is present at a voxel (Friston et al.).
      conjunction_null:
        in_subset: [mvp, model_extracted]
        description: Every component effect is present at a voxel (Nichols et al.).
      unstated:
        in_subset: [mvp, model_extracted]

  ConjunctionImplementation:
    in_subset: [mvp, model_extracted]
    description: >-
      Procedure used to compute the conjunction, which is not the same statement as the
      null hypothesis it tested: a minimum-statistic test is the usual implementation of
      the conjunction null. Open vocabulary: write the source's own wording in the field
      when nothing here fits.
    permissible_values:
      minimum_statistic:
        in_subset: [mvp, model_extracted]
        description: >-
          Each element takes the smaller of its statistics, so a conjunction survives only
          where both effects do.
      masking:
        in_subset: [mvp, model_extracted]
        description: >-
          One effect's map was thresholded and used to mask the other.
      logical_or:
        in_subset: [mvp, model_extracted]
        description: >-
          Elements surviving either effect were combined, which tests the global null rather
          than the conjunction null.
      unstated:
        in_subset: [mvp, model_extracted]

  PlsType:
    in_subset: [mvp, model_extracted]
    description: >-
      What a partial least squares analysis crossed the brain block with. This is what
      decides whether two PLS maps answer the same question, so it is the payload's one
      required vocabulary.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      task:
        in_subset: [mvp, model_extracted]
        description: >-
          The brain block is decomposed against the experimental design -- mean-centred
          task PLS, including the spatiotemporal variant that carries a time dimension.
          The commonest form in the literature.
      behavioral:
        in_subset: [mvp, model_extracted]
        description: >-
          The brain block is decomposed against participant-level behavioural or clinical
          measures, which are named in `behavioral_variables`.
      seed:
        in_subset: [mvp, model_extracted]
        description: >-
          The brain block is decomposed against activity in one or more seed regions, which
          are named in `seed_regions`. A connectivity question asked with PLS machinery.
      multiblock:
        in_subset: [mvp, model_extracted]
        description: >-
          More than one non-brain block enters at once, such as design and behaviour
          together. Also called multiblock or contrast-behaviour PLS.
      unstated:
        in_subset: [mvp, model_extracted]
        description: The source says it ran PLS but not which block the brain data were crossed with.

  ComponentMethod:
    in_subset: [mvp, model_extracted]
    description: >-
      Decomposition method that produced the component map. Open vocabulary: write the
      source's own wording in the field when nothing here fits.
    permissible_values:
      ica:
        in_subset: [mvp, model_extracted]
        description: >-
          Independent component analysis.
      tensor_ica:
        in_subset: [mvp, model_extracted]
        description: >-
          ICA over a subject-by-time-by-space tensor, giving one shared spatial map with
          per-subject loadings.
      pca:
        in_subset: [mvp, model_extracted]
        description: >-
          Principal component analysis, whose components are orthogonal rather than
          independent.
      nmf:
        in_subset: [mvp, model_extracted]
        description: >-
          Non-negative matrix factorization, whose components cannot take negative values.
      dictionary_learning:
        in_subset: [mvp, model_extracted]
        description: >-
          A sparse decomposition learning an overcomplete set of components.
      unstated:
        in_subset: [mvp, model_extracted]

  MapQuantity:
    in_subset: [mvp, model_extracted]
    description: >-
      What the values of a component map represent. Open vocabulary: write the source's
      own wording in the field when nothing here fits.
    permissible_values:
      loading:
        in_subset: [mvp, model_extracted]
        description: >-
          How strongly each participant or time point expresses the component.
      weight:
        in_subset: [mvp, model_extracted]
        description: >-
          The component's contribution at each element, in the decomposition's own scale.
      z_score:
        in_subset: [mvp, model_extracted]
        description: >-
          The component map after standardizing its values.
      spatial_map:
        in_subset: [mvp, model_extracted]
        description: >-
          The component's spatial pattern, where the source does not say what the values
          are.
      unstated:
        in_subset: [mvp, model_extracted]

  PolaritySemantics:
    in_subset: [mvp, model_extracted]
    description: >-
      Whether the sign of a component map carries meaning. Decomposition methods can
      return components whose polarity is arbitrary, in which case a negative loading is
      not a decrease.
    permissible_values:
      meaningful:
        in_subset: [mvp, model_extracted]
        description: >-
          The sign is interpretable: a negative value means a decrease.
      arbitrary:
        in_subset: [mvp, model_extracted]
        description: >-
          The method could have returned the component with its sign flipped, so a negative
          value does not mean a decrease.
      unsigned:
        in_subset: [mvp, model_extracted]
        description: >-
          The values carry no sign at all.
      unstated:
        in_subset: [mvp, model_extracted]

  NotStructurableReason:
    in_subset: [mvp, model_extracted]
    description: >-
      Why a grounded effect has no stable structured decomposition. Open vocabulary: write
      the source's own wording in the field when nothing here fits.
    permissible_values:
      method_specific_derived_metric:
        in_subset: [mvp, model_extracted]
        description: >-
          The tested quantity is a metric peculiar to one method, with no counterpart in the
          shared vocabulary.
      insufficient_standard_structure:
        in_subset: [mvp, model_extracted]
        description: >-
          The design has too little of the usual structure -- no conditions, no groups, no
          terms -- to decompose.
      source_too_vague:
        in_subset: [mvp, model_extracted]
        description: >-
          The paper reports an effect without saying enough about it to structure.
