# extraction-to-storage.map.yaml
#
# Transformation specification from neuroimaging-study-extraction to
# neuroimaging-study-storage. Inspired by linkml-map TransformationSpecification
# with extensions for external API lookups and multi-step parses.
#
# TRANSFORM TYPES
# ---------------
# verbatim        Copy value unchanged. ExtractedValue.evidence preserved in audit log.
# parse_float     Extract numeric value from string text, cast to float.
# parse_int       Extract integer from string text.
# parse_bool      Normalize yes/no/true/false variants to boolean.
# parse_counts    Parse "N group1 and M group2" prose into GroupSampleSize list.
#                 One-to-many: one source field → N typed target records.
# local_id_to_id  Resolve extraction local_id string to storage stable ID.
# normalize_enum  Fuzzy-match raw string to closed-vocabulary enum value using
#                 value_mappings as a lookup table; unmatched values are flagged.
# api_lookup      Populate a value through an external API lookup.
#                 No extraction-schema field exists for these outputs.
# derive          Compute a value deterministically from an ingestion artifact or
#                 normalized representation; no LLM extraction field is needed.
# infer           Derive from document-level context; algorithm documented in notes.
# generate        Assign by the ingestion pipeline (UUIDs, DOI-derived IDs, paths).
#
# READING EXTRACTION FIELDS
# -------------------------
# For ExtractedValue fields, use dotted paths:
#   field.value              The raw extracted value
#   field.evidence           Structured evidence sets and exact character offsets
#   field.extraction_status  ExtractionStatus (extracted/not_reported)
# Fields may use a typed ExtractedValue subtype (e.g., ExtractedInteger) as
# their range. The type is a schema constraint, not a property of the
# extracted record.
# Source-derived attributes are ExtractedValues, so reference field.value.
# Generated local IDs and local-ID relationship fields are native strings;
# local_id_to_id resolves those strings directly.

id: https://neurostuff.org/schemas/extraction-to-storage-map
name: extraction-to-storage-map
title: Neuroimaging Study Extraction-to-Storage Transformation Map
version: 0.2.0
source_schema: https://neurostuff.org/schemas/neuroimaging-study-extraction
target_schema: https://neurostuff.org/schemas/neuroimaging-study-storage

class_derivations:

  Study:
    populated_from: Study
    slot_derivations:

      id:
        transform: generate
        notes: Assigned by the ingestion pipeline; typically DOI-derived (doi:10.../record) or a UUID.

      title:
        transform: api_lookup
        notes: >-
          Article title for the record's PMID, from the E-utilities API. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      description:
        populated_from: description.value
        transform: verbatim

      design:
        populated_from: design.value
        transform: verbatim

      authors:
        transform: api_lookup
        notes: >-
          Author list for the record's PMID, from the E-utilities API, in published order. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      journal:
        transform: api_lookup
        notes: >-
          Journal title for the record's PMID, from the E-utilities API. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      doi:
        transform: api_lookup
        notes: >-
          DOI from the record's identifiers, resolved at ingest. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      publication_year:
        transform: api_lookup
        notes: >-
          Publication year for the record's PMID, from the E-utilities API. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      external_datasets:
        populated_from: external_datasets
        transform: verbatim

      study_type:
        transform: api_lookup
        notes: >-
          PubMed publication types for the record's PMID, from the E-utilities API, stored
          verbatim and multivalued. Not extracted: the LLM would be guessing a bibliographic
          fact the API states, and the value gates extraction rather than following it -- a
          record whose types include `Meta-Analysis` is skipped before any text is read.

  # ───────────────────────────────────────────────────────────────────────────

  ExternalDataset:
    populated_from: ExternalDataset
    slot_derivations:

      name:
        populated_from: name.value
        transform: verbatim

      url:
        populated_from: url.value
        source_evidence: url.evidence
        status_field: url.extraction_status
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Group:
    populated_from: Group
    slot_derivations:

      id:
        transform: generate
        notes: UUID assigned by mapper; extraction local_id stored in audit log.

      name:
        populated_from: name.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

      species:
        populated_from: species.value
        source_evidence: species.evidence
        status_field: species.extraction_status
        transform: normalize_enum
        value_mappings:
          human: human
          humans: human
          adult human: human
          macaque: macaque
          rhesus macaque: macaque
          rhesus monkey: macaque
          Macaca mulatta: macaque
          cynomolgus macaque: macaque
          marmoset: marmoset
          common marmoset: marmoset
          baboon: baboon
          Papio anubis: baboon
          rat: rat
          rats: rat
          Sprague-Dawley rat: rat
          Wistar rat: rat
          mouse: mouse
          mice: mouse
        notes: >-
          Wording this table does not cover passes through verbatim, since the slot accepts free
          text; an absent or empty species becomes `unstated`.

      approached_count:
        populated_from: approached_count.value
        source_evidence: approached_count.evidence
        status_field: approached_count.extraction_status
        transform: parse_int

      consented_count:
        populated_from: consented_count.value
        source_evidence: consented_count.evidence
        status_field: consented_count.extraction_status
        transform: parse_int

      enrolled_count:
        populated_from: enrolled_count.value
        source_evidence: enrolled_count.evidence
        status_field: enrolled_count.extraction_status
        transform: parse_int

      acquired_count:
        populated_from: acquired_count.value
        source_evidence: acquired_count.evidence
        status_field: acquired_count.extraction_status
        transform: parse_int

      excluded_count:
        populated_from: excluded_count.value
        source_evidence: excluded_count.evidence
        status_field: excluded_count.extraction_status
        transform: parse_int

      inclusion_criteria:
        populated_from: inclusion_criteria.value
        transform: verbatim

      exclusion_criteria:
        populated_from: exclusion_criteria.value
        transform: verbatim

      recruitment_method:
        populated_from: recruitment_method.value
        transform: verbatim

      recruitment_dates:
        populated_from: recruitment_dates.value
        transform: verbatim

      age_mean:
        populated_from: age_mean.value
        source_evidence: age_mean.evidence
        status_field: age_mean.extraction_status
        transform: parse_float
        notes: Strip any trailing unit suffix before parsing.

      age_standard_deviation:
        populated_from: age_standard_deviation.value
        source_evidence: age_standard_deviation.evidence
        status_field: age_standard_deviation.extraction_status
        transform: parse_float

      age_minimum:
        populated_from: age_minimum.value
        source_evidence: age_minimum.evidence
        status_field: age_minimum.extraction_status
        transform: parse_float

      age_maximum:
        populated_from: age_maximum.value
        source_evidence: age_maximum.evidence
        status_field: age_maximum.extraction_status
        transform: parse_float

      age_median:
        populated_from: age_median.value
        source_evidence: age_median.evidence
        status_field: age_median.extraction_status
        transform: parse_float

      age_unit:
        populated_from: age_unit.value
        source_evidence: age_unit.evidence
        status_field: age_unit.extraction_status
        transform: normalize_enum
        value_mappings:
          year: years
          yr: years
          yrs: years
          y: years
          month: months
          mo: months
          mos: months
          week: weeks
          wk: weeks
          wks: weeks
          gestational week: gestational_weeks
          gestational weeks: gestational_weeks
          gw: gestational_weeks
        notes: Defaults to "years" when status is not_reported, per COBIDAS convention.

      sex_distribution:
        populated_from: sex_distribution
        transform: verbatim

      gender_distribution:
        populated_from: gender_distribution
        transform: verbatim

      handedness_distribution:
        populated_from: handedness_distribution
        transform: verbatim

      race_distribution:
        populated_from: race_distribution
        transform: verbatim

      ethnicity_distribution:
        populated_from: ethnicity_distribution
        transform: verbatim

      medical_condition:
        populated_from: medical_condition.value
        transform: verbatim

      diagnostic_system:
        populated_from: diagnostic_system.value
        source_evidence: diagnostic_system.evidence
        status_field: diagnostic_system.extraction_status
        transform: normalize_enum
        value_mappings:
          DSM-IV: DSM-IV
          DSM-IV-TR: DSM-IV-TR
          DSM-V: DSM-5
          DSM5: DSM-5
          DSM 5: DSM-5
          ICD-9: ICD-9
          ICD-10: ICD-10
          ICD-11: ICD-11
          RDoC: RDoC

      diagnostic_instrument:
        populated_from: diagnostic_instrument.value
        transform: verbatim

      clinical_characteristics:
        populated_from: clinical_characteristics.value
        transform: verbatim

      medication_status:
        populated_from: medication_status.value
        transform: verbatim

      education_summary:
        populated_from: education_summary.value
        transform: verbatim

      socioeconomic_status_summary:
        populated_from: socioeconomic_status_summary.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Experiment:
    populated_from: Experiment
    slot_derivations:

      id:
        transform: generate

      task_name:
        populated_from: task_name.value
        transform: verbatim

      task_description:
        populated_from: task_description.value
        transform: verbatim

      conditions:
        populated_from: conditions
        transform: local_id_to_id
        notes: Each string in the list is resolved from extraction local_id to storage Condition.id.

      design_type:
        populated_from: design_type.value
        source_evidence: design_type.evidence
        status_field: design_type.extraction_status
        transform: normalize_enum
        value_mappings:
          event related: event-related
          event-related design: event-related
          ER: event-related
          block design: block
          blocked: block
          block: block
          mixed design: mixed
          mixed block/event: mixed
          mixed block-event: mixed
          naturalistic: naturalistic
          continuous: continuous
          resting state: resting-state
          resting-state: resting-state

      acquisitions:
        populated_from: acquisitions
        transform: local_id_to_id
        notes: >-
          Resolves every experiment acquisition local_id to a storage Acquisition
          ID. Entries may represent simultaneous modalities or site-specific
          variants; structural scans are excluded unless part of the paradigm.

      presentation_software:
        populated_from: presentation_software.value
        transform: verbatim

      stimuli:
        populated_from: stimuli.value
        transform: verbatim

      task_performance_measures:
        populated_from: task_performance_measures.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Acquisition:
    populated_from: Acquisition
    slot_derivations:

      id:
        transform: generate

      acquisition_type:
        transform: derive
        notes: >-
          The storage subclass to emit, read off the normalized modality through that
          permissible value's `instantiates`: MRI for fMRI, sMRI, dMRI, and MRI;
          OtherModality for MEG, SPECT, and other; the namesake class otherwise. A modality
          of `unstated` instantiates nothing and emits a bare Acquisition. Every derivation
          below this one belongs to whichever subclass this names.

      modality:
        populated_from: modality.value
        source_evidence: modality.evidence
        status_field: modality.extraction_status
        transform: normalize_enum
        target_enum: Modality
        notes: >-
          An unmatched label becomes `other` rather than being flagged and dropped: the raw
          label survives in OtherModality.modality_label, so no modality is ever lost for
          want of a vocabulary entry. `unstated` is reserved for
          extraction_status = not_reported.
        value_mappings:
          functional MRI: fMRI
          functional magnetic resonance imaging: fMRI
          fMRI: fMRI
          bold fMRI: fMRI
          arterial spin labeling: fMRI
          ASL: fMRI
          diffusion MRI: dMRI
          diffusion-weighted MRI: dMRI
          diffusion tensor imaging: dMRI
          DTI: dMRI
          DWI: dMRI
          structural MRI: sMRI
          anatomical MRI: sMRI
          T1-weighted: sMRI
          T1w: sMRI
          T2-weighted: sMRI
          T2w: sMRI
          positron emission tomography: PET
          PET: PET
          electroencephalography: EEG
          EEG: EEG
          magnetoencephalography: MEG
          MEG: MEG
          fNIRS: fNIRS
          functional near-infrared spectroscopy: fNIRS
          NIRS: fNIRS
          MRI: MRI
          magnetic resonance imaging: MRI
          single-photon emission computed tomography: SPECT
          SPECT: SPECT
          intracranial EEG: other
          iEEG: other
          electrocorticography: other
          ECoG: other
          ultrasound: other
          functional ultrasound: other

      acquisition_duration_seconds:
        populated_from: acquisition_duration_seconds.value
        source_evidence: acquisition_duration_seconds.evidence
        status_field: acquisition_duration_seconds.extraction_status
        transform: parse_float

      instrument:
        populated_from: instrument.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

      structured_details:
        populated_from: structured_details.value
        transform: verbatim

  # The five Acquisition subclasses. Each inherits the derivations above through `is_a`
  # and adds only its own attributes, read out of the matching nested extraction object:
  # storage subclasses what extraction nests, so this is where that shape change happens.
  # Exactly one of these runs per record, chosen by Acquisition.acquisition_type.

  MRI:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      magnetic_field_strength_tesla:
        populated_from: mri.magnetic_field_strength_tesla.value
        source_evidence: mri.magnetic_field_strength_tesla.evidence
        status_field: mri.magnetic_field_strength_tesla.extraction_status
        transform: parse_float

      pulse_sequence_type:
        populated_from: mri.pulse_sequence_type.value
        transform: verbatim

      mr_acquisition_type:
        populated_from: mri.mr_acquisition_type.value
        transform: verbatim

      repetition_time_seconds:
        populated_from: mri.repetition_time_seconds.value
        source_evidence: mri.repetition_time_seconds.evidence
        status_field: mri.repetition_time_seconds.extraction_status
        transform: parse_float

      echo_time_seconds:
        populated_from: mri.echo_time_seconds.value
        source_evidence: mri.echo_time_seconds.evidence
        status_field: mri.echo_time_seconds.extraction_status
        transform: parse_float

      acquisition_voxel_size_mm:
        populated_from: mri.acquisition_voxel_size_mm.value
        source_evidence: mri.acquisition_voxel_size_mm.evidence
        status_field: mri.acquisition_voxel_size_mm.extraction_status
        transform: parse_float

      number_of_volumes:
        populated_from: mri.number_of_volumes.value
        source_evidence: mri.number_of_volumes.evidence
        status_field: mri.number_of_volumes.extraction_status
        transform: parse_int

  # ───────────────────────────────────────────────────────────────────────────

  EEG:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      sampling_frequency_hz:
        populated_from: eeg.sampling_frequency_hz.value
        source_evidence: eeg.sampling_frequency_hz.evidence
        status_field: eeg.sampling_frequency_hz.extraction_status
        transform: parse_float

      eeg_reference:
        populated_from: eeg.eeg_reference.value
        transform: verbatim

      eeg_placement_scheme:
        populated_from: eeg.eeg_placement_scheme.value
        transform: verbatim

      recording_type:
        populated_from: eeg.recording_type.value
        transform: verbatim

      eeg_channel_count:
        populated_from: eeg.eeg_channel_count.value
        source_evidence: eeg.eeg_channel_count.evidence
        status_field: eeg.eeg_channel_count.extraction_status
        transform: parse_int

  # ───────────────────────────────────────────────────────────────────────────

  FNIRS:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      sampling_frequency_hz:
        populated_from: fnirs.sampling_frequency_hz.value
        source_evidence: fnirs.sampling_frequency_hz.evidence
        status_field: fnirs.sampling_frequency_hz.extraction_status
        transform: parse_float

      nirs_system_type:
        populated_from: fnirs.nirs_system_type.value
        transform: verbatim

      nirs_channel_count:
        populated_from: fnirs.nirs_channel_count.value
        source_evidence: fnirs.nirs_channel_count.evidence
        status_field: fnirs.nirs_channel_count.extraction_status
        transform: parse_int

      wavelengths_nm:
        populated_from: fnirs.wavelengths_nm.value
        source_evidence: fnirs.wavelengths_nm.evidence
        status_field: fnirs.wavelengths_nm.extraction_status
        transform: parse_float

      short_channel_count:
        populated_from: fnirs.short_channel_count.value
        source_evidence: fnirs.short_channel_count.evidence
        status_field: fnirs.short_channel_count.extraction_status
        transform: parse_int

      source_detector_distances_mm:
        populated_from: fnirs.source_detector_distances_mm.value
        source_evidence: fnirs.source_detector_distances_mm.evidence
        status_field: fnirs.source_detector_distances_mm.extraction_status
        transform: parse_float

      nirs_placement_scheme:
        populated_from: fnirs.nirs_placement_scheme.value
        transform: verbatim

      recorded_signal_types:
        populated_from: fnirs.recorded_signal_types.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  PET:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      image_units:
        populated_from: pet.image_units.value
        transform: verbatim

      tracer_name:
        populated_from: pet.tracer_name.value
        transform: verbatim

      tracer_radionuclide:
        populated_from: pet.tracer_radionuclide.value
        transform: verbatim

      mode_of_administration:
        populated_from: pet.mode_of_administration.value
        transform: verbatim

      scan_type:
        populated_from: pet.scan_type.value
        transform: verbatim

      uptake_time_seconds:
        populated_from: pet.uptake_time_seconds.value
        source_evidence: pet.uptake_time_seconds.evidence
        status_field: pet.uptake_time_seconds.extraction_status
        transform: parse_float

      reconstructed_voxel_size_mm:
        populated_from: pet.reconstructed_voxel_size_mm.value
        source_evidence: pet.reconstructed_voxel_size_mm.evidence
        status_field: pet.reconstructed_voxel_size_mm.extraction_status
        transform: parse_float

      spatial_resolution_mm:
        populated_from: pet.spatial_resolution_mm.value
        source_evidence: pet.spatial_resolution_mm.evidence
        status_field: pet.spatial_resolution_mm.extraction_status
        transform: parse_float

  # ───────────────────────────────────────────────────────────────────────────

  OtherModality:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      modality_label:
        populated_from: other.modality_label.value
        source_evidence: other.modality_label.evidence
        transform: verbatim
        notes: >-
          Falls back to the raw modality.value when the extractor left it unset, so a record
          whose modality normalized to `other` still names what the source called it. The
          field is required in storage, so the fallback is not optional.

      reason_no_modality_class_used:
        populated_from: other.reason_no_modality_class_used.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Preprocessing:
    populated_from: Preprocessing
    slot_derivations:

      id:
        transform: generate

      description:
        populated_from: description.value
        transform: verbatim

      software:
        populated_from: software.value
        transform: verbatim

      steps:
        populated_from: steps.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  ModelEstimation:
    populated_from: ModelEstimation
    slot_derivations:

      id:
        transform: generate

      model_family:
        populated_from: model_type.value
        source_evidence: model_type.evidence
        status_field: model_type.extraction_status
        transform: normalize_enum
        notes: >-
          The extraction schema records only the source's wording, so the normalized
          family is derived from the same field that model_type keeps verbatim. ModelFamily
          has no `other` value and the slot accepts free text, so wording this table does
          not cover passes through verbatim rather than collapsing to a catch-all; an
          absent or empty model_type becomes `unstated`. Neither is guessed from
          surrounding prose. That is why the method families the vocabulary cannot name --
          ICA, representational similarity, decoding, effective connectivity,
          coordinate-based meta-analysis -- have no mappings here: they survive as their
          own wording, and the Analysis.details subclass identifies the method.
        value_mappings:
          GLM: glm
          general linear model: glm
          mass univariate GLM: glm
          mass-univariate GLM: glm
          mass univariate: glm
          multiple regression: glm
          linear regression: glm
          regression: glm
          fixed effects model: glm
          random effects model: glm
          PPI: glm
          psychophysiological interaction: glm
          mixed effects model: mixed_effects
          mixed-effects model: mixed_effects
          linear mixed model: mixed_effects
          linear mixed effects model: mixed_effects
          LME: mixed_effects
          hierarchical model: mixed_effects
          multilevel model: mixed_effects
          ANOVA: anova
          analysis of variance: anova
          repeated measures ANOVA: anova
          rmANOVA: anova
          ANCOVA: ancova
          analysis of covariance: ancova
          robust regression: robust_regression

      model_type:
        populated_from: model_type.value
        source_evidence: model_type.evidence
        status_field: model_type.extraction_status
        transform: verbatim
        notes: >-
          Verbatim by design. This slot is the method detail the ModelFamily enum drops,
          so normalizing it here would lose the only record of it; the normalized value is
          model_family, derived from this same source field.

      model_settings:
        populated_from: model_settings.value
        transform: verbatim

      level:
        populated_from: level.value
        source_evidence: level.evidence
        status_field: level.extraction_status
        transform: normalize_enum
        value_mappings:
          run: run
          first level: run
          first-level: run
          1st level: run
          session: session
          subject: subject
          individual: subject
          single-subject: subject
          within-subject: subject
          second level: group
          second-level: group
          2nd level: group
          group: group
          group level: group
          group-level: group
          random effects: group
          population: group

      estimator:
        populated_from: estimator.value
        transform: verbatim

      software:
        populated_from: software.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Measure:
    populated_from: Measure
    slot_derivations:

      source_label:
        populated_from: source_label.value
        transform: verbatim

      specific_metric:
        populated_from: specific_metric.value
        transform: verbatim

      unit:
        populated_from: unit.value
        transform: verbatim

      type:
        populated_from: source_label.value
        transform: normalize_enum
        notes: >-
          Normalized from the paper's own term for the measure; extraction records no vocabulary
          of its own. Wording this schema's MeasureType cannot name passes through verbatim.

      family:
        populated_from: source_label.value
        transform: normalize_enum
        notes: >-
          Derived from the same wording as `type`. A derived measure takes the family of the
          underlying signal, so a BOLD-derived connectivity or decoding result is
          functional_bold.

  # ───────────────────────────────────────────────────────────────────────────

  Analysis:
    populated_from: Analysis
    # PENDING: the alpha.11 fields of the storage Analysis have no derivation yet,
    # because the extraction schema has no counterpart for them. Missing here:
    # spatial_scope, roi_definition, measure, details, effect
    # (kind, baseline, path, conditions, terms, statistic), details,
    # and the directional roles and factor levels of groups. The derivations below
    # are the pre-alpha.11 set, retargeted so the map still resolves against the
    # storage schema; they populate structure, not direction.
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      roi_label:
        populated_from: roi_label.value
        transform: verbatim
        notes: >-
          The verbatim spatial domain is the source-grounded region label. The
          normalized spatial_scope and roi_definition enums that accompany it have no
          derivation yet.

      acquisitions:
        populated_from: acquisitions
        transform: local_id_to_id
        notes: >-
          Each extraction Acquisition.local_id is resolved to a storage Acquisition.id.
          Source acquisitions are explicit for all analysis types, including structural
          and diffusion analyses without an Experiment.

      effect:
        transform: derive
        notes: >-
          Assembled rather than copied: extraction holds the effect's parts flat on Analysis,
          because a flat record is what an extractor fills and a nested one is what a query
          wants. conditions <- conditions, terms <- terms (resolved from Study.terms by
          local_id), statistic <- statistic, baseline <- baseline, path <- mediation_path, and
          kind is derived from the term pattern by the derivation table.

      effect.terms:
        populated_from: terms
        transform: local_id_to_id
        notes: Each local_id resolves to the Study-level Term record and is inlined into the effect.

      effect.statistic:
        populated_from: statistic
        transform: verbatim

      effect.baseline:
        populated_from: baseline.value
        source_evidence: baseline.evidence
        status_field: baseline.extraction_status
        transform: normalize_enum
        value_mappings:
          rest: modelled_condition
          fixation: modelled_condition
          control task: modelled_condition
          implicit baseline: implicit
          implicit: implicit
          chance: chance
          chance level: chance
          zero: zero

      effect.path:
        populated_from: mediation_path.value
        transform: normalize_enum
        value_mappings:
          direct effect: direct
          direct: direct
          indirect effect: indirect
          indirect: indirect
          mediated: indirect
          total effect: total
          total: total

      details:
        transform: derive
        notes: >-
          Which of the seven payload slots on the extraction Analysis is filled selects the
          AnalysisDetails subclass. All seven empty means MassUnivariateDetails, which carries
          no fields -- that is how a mass-univariate analysis is asserted rather than inferred
          from an absence.

      effect.conditions:
        populated_from: conditions
        transform: local_id_to_id
        notes: >-
          Each local_id becomes a ConditionTerm whose condition is the resolved
          Condition. The extraction schema reports no direction, so role is `unstated`
          until it does; it must not be guessed, because an invented role would change
          the derived effect kind.

      model_estimation:
        populated_from: model_estimation
        transform: local_id_to_id
        notes: >-
          The extraction schema still calls this record a StatisticalModel; the storage
          class it populates is ModelEstimation.

      inference_settings:
        populated_from: inference_settings
        transform: verbatim
        notes: Structured inference settings are extracted at the analysis level.

      groups:
        populated_from: groups
        transform: local_id_to_id
        notes: >-
          Each local_id becomes a GroupTerm whose group is the resolved Group and whose
          role is `unstated`, on the same grounds as effect.conditions above.
          factor_levels stays empty.

      preprocessing:
        populated_from: preprocessing
        transform: local_id_to_id

      definition:
        populated_from: definition.value
        transform: verbatim
        notes: >-
          The verbatim contrast specification is the source-grounded definition (layer L2),
          and its only source. An Analysis has a definition and no description, on either
          side of the map: one field states the tested effect, so there is no second
          narrative field to prefer it over and no fallback to reach for.

      tables:
        populated_from: tables
        transform: local_id_to_id


      coordinate_space:
        populated_from: coordinate_space.value
        source_evidence: coordinate_space.evidence
        status_field: coordinate_space.extraction_status
        transform: normalize_enum
        value_mappings:
          MNI: MNI152
          MNI152: MNI152
          MNI space: MNI152
          MNI152NLin2009cAsym: MNI152
          Montreal Neurological Institute: MNI152
          MNI305: MNI305
          fsaverage: fsaverage
          Talairach: Talairach
          Talairach space: Talairach
          TAL: Talairach
          subject native: native
          native space: native
        notes: >-
          Fallback for the space when the table parse did not recover one. Prefer
          Table.coordinate_space where it is populated; the two disagreeing is a review signal.

      experiments:
        transform: infer
        notes: >-
          Algorithm: match the Condition IDs in Analysis.effect.conditions against
          Experiment.conditions for each experiment in the study.
          (1) Assign every experiment whose conditions are a superset of a non-empty
              subset of the analysis conditions.
          (2) If the analysis has no conditions, leave experiments empty; source data
            are represented by Analysis.acquisitions.
          (3) Matching more than one experiment is a normal result now that this slot is
            multivalued -- a cross-task conjunction or a localizer-plus-main-task
            analysis genuinely spans paradigms -- so it no longer nulls the link or
            flags the analysis.
          See issue #1.

      groups.n:
        populated_from: groups
        transform: verbatim
        notes: >-
          Per-analysis counts no longer form a parallel list. Each extraction
          GroupSampleSize resolves its group local_id to a storage Group and writes `n`
          onto that Group's existing GroupTerm in `groups` above. A count naming a group
          the analysis does not include has nowhere to go, which is the point of the
          merge: previously the two lists could disagree silently.

  # ───────────────────────────────────────────────────────────────────────────

  Term:
    populated_from: Term
    slot_derivations:

      name:
        populated_from: name.value
        transform: verbatim

      source_definition:
        populated_from: source_definition.value
        transform: verbatim

      type:
        populated_from: type.value
        source_evidence: type.evidence
        status_field: type.extraction_status
        transform: normalize_enum
        value_mappings:
          categorical: categorical
          factor: categorical
          grouping variable: categorical
          continuous: continuous
          covariate: continuous
          regressor: continuous
          parametric: continuous

      role:
        populated_from: role.value
        source_evidence: role.evidence
        status_field: role.extraction_status
        transform: normalize_enum
        value_mappings:
          term of interest: primary
          effect of interest: primary
          predictor of interest: primary
          primary: primary
          covariate: nuisance
          nuisance: nuisance
          controlled for: nuisance
          confound: nuisance
          moderator: moderator
          mediator: mediator

      conditions:
        populated_from: conditions
        transform: local_id_to_id

      groups:
        populated_from: groups
        transform: local_id_to_id

      assessment:
        populated_from: assessment
        transform: local_id_to_id

      levels:
        populated_from: levels.value
        transform: verbatim

      variation_level:
        populated_from: variation_level.value
        source_evidence: variation_level.evidence
        status_field: variation_level.extraction_status
        transform: normalize_enum
        value_mappings:
          within subject: within_subject
          within-subject: within_subject
          trial-wise: within_subject
          trial by trial: within_subject
          across trials: within_subject
          within run: within_subject
          between subjects: between_subject
          between-subject: between_subject
          across participants: between_subject
          across subjects: between_subject
          one value per participant: between_subject
          both: mixed
          within and between: mixed
        notes: >-
          Wording this table does not cover passes through verbatim, since the slot accepts free
          text -- "across sessions" for a longitudinal within-person term is the case that
          recurs. A value outside the vocabulary leaves effect.kind unrecomputable, so the
          structural validator checks membership in the compatible set rather than rejecting the
          record.

      association_direction:
        populated_from: association_direction.value
        transform: normalize_enum
        value_mappings:
          positive: positive
          positively: positive
          increased: positive
          negative: negative
          negatively: negative
          decreased: negative

      functional_form:
        populated_from: functional_form.value
        transform: normalize_enum
        value_mappings:
          linear: linear
          quadratic: quadratic
          squared: quadratic
          product: product
          interaction: product
          absolute: absolute
          unsigned: absolute
          log: log
          log-transformed: log

      interaction_with:
        populated_from: interaction_with
        transform: local_id_to_id

      unit:
        populated_from: unit.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Condition:
    populated_from: Condition
    slot_derivations:

      condition_kind:
        populated_from: condition_kind.value
        source_evidence: condition_kind.evidence
        status_field: condition_kind.extraction_status
        transform: normalize_enum
        value_mappings:
          task: task_state
          task condition: task_state
          block: task_state
          encoding: task_state
          retrieval: task_state
          stimulus: stimulus
          stimulus category: stimulus
          image category: stimulus
          rest: rest
          resting state: rest
          fixation: rest
          baseline: timepoint
          pre-treatment: timepoint
          post-treatment: timepoint
          follow-up: timepoint
          session: timepoint
          timepoint: timepoint
          drug: pharmacological
          drug administration: pharmacological
          infusion: pharmacological
          pharmacological: pharmacological
          TMS: stimulation
          rTMS: stimulation
          tDCS: stimulation
          stimulation: stimulation
          training: behavioural_intervention
          therapy: behavioural_intervention
          CBT: behavioural_intervention
          intervention: behavioural_intervention
          placebo: placebo
          saline: placebo
          vehicle: placebo
          sham: sham
          sham stimulation: sham
          active comparator: active_comparator
          active control: active_comparator
          usual care: usual_care
          treatment as usual: usual_care
          waitlist: no_intervention
          wait-list: no_intervention
          no treatment: no_intervention
        notes: >-
          Wording this table does not cover passes through verbatim; an absent or empty value
          becomes `unstated`.

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Table:
    populated_from: Table
    slot_derivations:

      id:
        transform: generate

      table_number:
        populated_from: table_number.value
        transform: verbatim

      title:
        populated_from: title.value
        transform: verbatim

      caption:
        populated_from: caption.value
        transform: verbatim

      footer:
        populated_from: footer.value
        transform: verbatim

      source_path:
        transform: generate
        notes: Set by the ingestion pipeline to the repository path of the raw table file.

      coordinate_space:
        transform: derive
        notes: >-
          Normalized from the coordinate space the table parser recovered, not extracted. This is
          the first of the two places the space can live, and the preferred one: fill it when the
          parse yields a space, and leave Analysis.coordinate_space blank in that case.

      column_headings:
        populated_from: column_headings.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

      coordinate_count:
        transform: derive
        source_representation: normalized_table
        notes: >-
          Count coordinate rows or points in the normalized table
          representation. Set zero when the table has no coordinates.
