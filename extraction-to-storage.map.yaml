# extraction-to-storage.map.yaml
#
# Transformation specification from neuroimaging-study-extraction to
# neuroimaging-study-storage. Inspired by linkml-map TransformationSpecification
# with extensions for external API lookups and multi-step parses.
#
# TRANSFORM TYPES
# ---------------
# verbatim        Copy value unchanged. ExtractedValue.evidence preserved in audit log.
# parse_float     Extract numeric value from string text, cast to float.
# parse_int       Extract integer from string text.
# parse_bool      Normalize yes/no/true/false variants to boolean.
# parse_counts    Parse "N group1 and M group2" prose into GroupSampleSize list.
#                 One-to-many: one source field → N typed target records.
# local_id_to_id  Resolve extraction local_id string to storage stable ID.
# local_id_to_record
#                 Resolve extraction local_id string to the storage record itself and
#                 inline it, for a slot whose target owns its children rather than
#                 referencing them.
# normalize_enum  Fuzzy-match raw string to closed-vocabulary enum value using
#                 value_mappings as a lookup table; unmatched values are flagged.
# api_lookup      Populate a value through an external API lookup.
#                 No extraction-schema field exists for these outputs.
# derive          Compute a value deterministically from an ingestion artifact or
#                 normalized representation; no LLM extraction field is needed.
# infer           Derive from document-level context; algorithm documented in notes.
# generate        Assign by the ingestion pipeline (UUIDs, DOI-derived IDs, paths).
#
# ABSORBED SOURCES
# ----------------
# `class_derivations` is keyed by *storage* path, so it can only record extraction fields that
# have a storage field to land in. Extraction fields that are collapsed, routed to more than one
# place, or deliberately not carried have no such key, and were previously documented only in
# prose comments -- which is to say, not checkably. `absorbed_sources` at the end of this file
# records each of them explicitly, so that the completeness check in
# check_extraction_to_storage_map.py can assert that every extraction field is either mapped by a
# derivation or accounted for there.
#
# READING EXTRACTION FIELDS
# -------------------------
# For ExtractedValue fields, use dotted paths:
#   field.value              The raw extracted value
#   field.evidence           Structured evidence sets and exact character offsets
#   field.extraction_status  ExtractionStatus (extracted/not_reported)
# Fields may use a typed ExtractedValue subtype (e.g., ExtractedInteger) as
# their range. The type is a schema constraint, not a property of the
# extracted record.
# Source-derived attributes are ExtractedValues, so reference field.value.
# Generated local IDs and local-ID relationship fields are native strings;
# local_id_to_id resolves those strings directly.

id: https://neurostuff.org/schemas/extraction-to-storage-map
name: extraction-to-storage-map
title: Neuroimaging Study Extraction-to-Storage Transformation Map
version: 0.3.0
source_schema: https://neurostuff.org/schemas/neuroimaging-study-extraction
target_schema: https://neurostuff.org/schemas/neuroimaging-study-storage

class_derivations:

  Study:
    populated_from: Study
    slot_derivations:

      id:
        transform: generate
        notes: Assigned by the ingestion pipeline; typically DOI-derived (doi:10.../record) or a UUID.

      title:
        transform: api_lookup
        notes: >-
          Article title for the record's PMID, from the E-utilities API. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      description:
        populated_from: description.value
        transform: verbatim

      design:
        transform: derive
        notes: >-
          The StudyDesign record, assembled from `Study.design`, `Study.study_design`,
          `Study.arms` and `Study.timepoints` by the StudyDesign derivation below. Held inline
          on Study, so there is no identifier to resolve.

      authors:
        transform: api_lookup
        notes: >-
          Author list for the record's PMID, from the E-utilities API, in published order. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      journal:
        transform: api_lookup
        notes: >-
          Journal title for the record's PMID, from the E-utilities API. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      doi:
        transform: api_lookup
        notes: >-
          DOI from the record's identifiers, resolved at ingest. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      publication_year:
        transform: api_lookup
        notes: >-
          Publication year for the record's PMID, from the E-utilities API. Not extracted: a bibliographic fact the API states is not one a model
          should be asked to read off the page.

      external_datasets:
        populated_from: external_datasets
        transform: verbatim

      study_type:
        transform: api_lookup
        notes: >-
          PubMed publication types for the record's PMID, from the E-utilities API, stored
          verbatim and multivalued. Not extracted: the LLM would be guessing a bibliographic
          fact the API states, and the value gates extraction rather than following it -- a
          record whose types include `Meta-Analysis` is skipped before any text is read.

  # ───────────────────────────────────────────────────────────────────────────

  ExternalDataset:
    populated_from: ExternalDataset
    slot_derivations:

      name:
        populated_from: name.value
        transform: verbatim

      url:
        populated_from: url.value
        source_evidence: url.evidence
        status_field: url.extraction_status
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Group:
    populated_from: Group
    slot_derivations:

      id:
        transform: generate
        notes: UUID assigned by mapper; extraction local_id stored in audit log.

      name:
        populated_from: name.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

      species:
        populated_from: species.value
        source_evidence: species.evidence
        status_field: species.extraction_status
        transform: normalize_enum
        value_mappings:
          human: human
          humans: human
          adult human: human
          macaque: macaque
          rhesus macaque: macaque
          rhesus monkey: macaque
          Macaca mulatta: macaque
          cynomolgus macaque: macaque
          marmoset: marmoset
          common marmoset: marmoset
          baboon: baboon
          Papio anubis: baboon
          rat: rat
          rats: rat
          Sprague-Dawley rat: rat
          Wistar rat: rat
          mouse: mouse
          mice: mouse
        notes: >-
          Wording this table does not cover passes through verbatim, since the slot accepts free
          text; an absent or empty species becomes `unstated`.

      arm:
        populated_from: arm
        transform: local_id_to_id

      approached_count:
        populated_from: approached_count.value
        source_evidence: approached_count.evidence
        status_field: approached_count.extraction_status
        transform: parse_int

      consented_count:
        populated_from: consented_count.value
        source_evidence: consented_count.evidence
        status_field: consented_count.extraction_status
        transform: parse_int

      enrolled_count:
        populated_from: enrolled_count.value
        source_evidence: enrolled_count.evidence
        status_field: enrolled_count.extraction_status
        transform: parse_int

      acquired_count:
        populated_from: acquired_count.value
        source_evidence: acquired_count.evidence
        status_field: acquired_count.extraction_status
        transform: parse_int

      excluded_count:
        populated_from: excluded_count.value
        source_evidence: excluded_count.evidence
        status_field: excluded_count.extraction_status
        transform: parse_int

      inclusion_criteria:
        populated_from: inclusion_criteria.value
        transform: verbatim

      exclusion_criteria:
        populated_from: exclusion_criteria.value
        transform: verbatim

      recruitment_method:
        populated_from: recruitment_method.value
        transform: verbatim

      recruitment_dates:
        populated_from: recruitment_dates.value
        transform: verbatim

      age_mean:
        populated_from: age_mean.value
        source_evidence: age_mean.evidence
        status_field: age_mean.extraction_status
        transform: parse_float
        notes: Strip any trailing unit suffix before parsing.

      age_standard_deviation:
        populated_from: age_standard_deviation.value
        source_evidence: age_standard_deviation.evidence
        status_field: age_standard_deviation.extraction_status
        transform: parse_float

      age_minimum:
        populated_from: age_minimum.value
        source_evidence: age_minimum.evidence
        status_field: age_minimum.extraction_status
        transform: parse_float

      age_maximum:
        populated_from: age_maximum.value
        source_evidence: age_maximum.evidence
        status_field: age_maximum.extraction_status
        transform: parse_float

      age_median:
        populated_from: age_median.value
        source_evidence: age_median.evidence
        status_field: age_median.extraction_status
        transform: parse_float

      age_unit:
        populated_from: age_unit.value
        source_evidence: age_unit.evidence
        status_field: age_unit.extraction_status
        transform: normalize_enum
        value_mappings:
          year: years
          yr: years
          yrs: years
          y: years
          month: months
          mo: months
          mos: months
          week: weeks
          wk: weeks
          wks: weeks
          gestational week: gestational_weeks
          gestational weeks: gestational_weeks
          gw: gestational_weeks
        notes: Defaults to "years" when status is not_reported, per COBIDAS convention.

      sex_distribution:
        populated_from: sex_distribution
        transform: verbatim

      gender_distribution:
        populated_from: gender_distribution
        transform: verbatim

      handedness_distribution:
        populated_from: handedness_distribution
        transform: verbatim

      race_distribution:
        populated_from: race_distribution
        transform: verbatim

      ethnicity_distribution:
        populated_from: ethnicity_distribution
        transform: verbatim

      medical_condition:
        populated_from: medical_condition.value
        transform: verbatim

      diagnostic_system:
        populated_from: diagnostic_system.value
        source_evidence: diagnostic_system.evidence
        status_field: diagnostic_system.extraction_status
        transform: normalize_enum
        value_mappings:
          DSM-IV: DSM-IV
          DSM-IV-TR: DSM-IV-TR
          DSM-V: DSM-5
          DSM5: DSM-5
          DSM 5: DSM-5
          ICD-9: ICD-9
          ICD-10: ICD-10
          ICD-11: ICD-11
          RDoC: RDoC

      diagnostic_instrument:
        populated_from: diagnostic_instrument.value
        transform: verbatim

      clinical_characteristics:
        populated_from: clinical_characteristics.value
        transform: verbatim

      medication_status:
        populated_from: medication_status.value
        transform: verbatim

      education_summary:
        populated_from: education_summary.value
        transform: verbatim

      socioeconomic_status_summary:
        populated_from: socioeconomic_status_summary.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  CategoryDistribution:
    populated_from: CategoryDistribution
    slot_derivations:

      category:
        populated_from: category.value
        source_evidence: category.evidence
        status_field: category.extraction_status
        transform: verbatim
        notes: >-
          The study's own label, not normalized. Required on both sides: the Group
          distribution slots copy the list, so without this the count would arrive with
          nothing saying what it counts.

      count:
        populated_from: count.value
        source_evidence: count.evidence
        status_field: count.extraction_status
        transform: parse_int

      percentage:
        populated_from: percentage.value
        source_evidence: percentage.evidence
        status_field: percentage.extraction_status
        transform: parse_float

      denominator:
        populated_from: denominator.value
        source_evidence: denominator.evidence
        status_field: denominator.extraction_status
        transform: parse_int

      reporting_framework:
        populated_from: reporting_framework.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Task:
    populated_from: Task
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

      conditions:
        populated_from: conditions
        transform: local_id_to_record
        notes: >-
          Each local_id in the list is resolved against the flat extraction Study.conditions
          list and the Condition record is inlined here, because storage gives a condition one
          owning task. Extraction keeps the records flat so the extractor addresses them by
          local_id from anywhere; a local_id claimed by two tasks is an error the mapper
          reports rather than duplicating the record.

      design_type:
        populated_from: design_type.value
        source_evidence: design_type.evidence
        status_field: design_type.extraction_status
        transform: normalize_enum
        value_mappings:
          event related: event-related
          event-related design: event-related
          ER: event-related
          block design: block
          blocked: block
          block: block
          mixed design: mixed
          mixed block/event: mixed
          mixed block-event: mixed
          naturalistic: naturalistic
          continuous: continuous
          resting state: resting-state
          resting-state: resting-state

      acquisitions:
        populated_from: acquisitions
        transform: local_id_to_id
        notes: >-
          Resolves every task acquisition local_id to a storage Acquisition
          ID. Entries may represent simultaneous modalities or site-specific
          variants; structural scans are excluded unless part of the paradigm.

      presentation_software:
        populated_from: presentation_software.value
        transform: verbatim

      instructions:
        populated_from: instructions.value
        transform: verbatim

      stimuli:
        populated_from: stimuli.value
        transform: verbatim

      response_mode:
        populated_from: response_mode.value
        source_evidence: response_mode.evidence
        status_field: response_mode.extraction_status
        transform: normalize_enum
        value_mappings:
          button press: button_press
          button-press: button_press
          button box: button_press
          keypad: button_press
          key press: button_press
          keyboard: button_press
          response box: button_press
          joystick: button_press
          mouse click: button_press
          finger tapping: hand_movement
          tapping: hand_movement
          sequence tapping: hand_movement
          grasp: hand_movement
          reaching: hand_movement
          writing: hand_movement
          drawing: hand_movement
          hand movement: hand_movement
          overt speech: speech
          speech: speech
          naming: speech
          reading aloud: speech
          vocal response: speech
          verbal response: speech
          word generation: speech
          covert: covert_response
          covert naming: covert_response
          silent: covert_response
          subvocal: covert_response
          imagined movement: covert_response
          motor imagery: covert_response
          mental counting: covert_response
          saccade: eye_movement
          antisaccade: eye_movement
          eye movement: eye_movement
          smooth pursuit: eye_movement
          blink: eye_movement
          pedal press: foot_or_leg_movement
          foot tapping: foot_or_leg_movement
          ankle movement: foot_or_leg_movement
          leg movement: foot_or_leg_movement
          swallowing: oral_nonspeech
          chewing: oral_nonspeech
          tongue movement: oral_nonspeech
          jaw movement: oral_nonspeech
          breath hold: oral_nonspeech
          no response: none
          passive viewing: none
          passive listening: none
          resting state: none
          film watching: none
        notes: >-
          One wording per entry, since the slot is multivalued on both sides. `none` is a
          positive statement that the paradigm asked for no response and is not the same as an
          absent value, so do not synthesize it: an empty or absent field stays empty rather
          than becoming `none` or `unstated`. Wording this table does not cover passes through
          verbatim.

      performance_measures:
        populated_from: performance_measures.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Acquisition:
    populated_from: Acquisition
    slot_derivations:

      id:
        transform: generate

      acquisition_type:
        transform: derive
        notes: >-
          The storage subclass to emit, read off the normalized modality through that
          permissible value's `instantiates`: MRI for fMRI, sMRI, dMRI, and MRI;
          OtherModality for MEG, SPECT, and other; the namesake class otherwise. A modality
          of `unstated` instantiates nothing and emits a bare Acquisition. Every derivation
          below this one belongs to whichever subclass this names.

      modality:
        populated_from: modality.value
        source_evidence: modality.evidence
        status_field: modality.extraction_status
        transform: normalize_enum
        target_enum: Modality
        notes: >-
          An unmatched label becomes `other` rather than being flagged and dropped: the raw
          label survives in OtherModality.modality_label, so no modality is ever lost for
          want of a vocabulary entry. `unstated` is reserved for
          extraction_status = not_reported.
        value_mappings:
          functional MRI: fMRI
          functional magnetic resonance imaging: fMRI
          fMRI: fMRI
          bold fMRI: fMRI
          arterial spin labeling: fMRI
          ASL: fMRI
          diffusion MRI: dMRI
          diffusion-weighted MRI: dMRI
          diffusion tensor imaging: dMRI
          DTI: dMRI
          DWI: dMRI
          structural MRI: sMRI
          anatomical MRI: sMRI
          T1-weighted: sMRI
          T1w: sMRI
          T2-weighted: sMRI
          T2w: sMRI
          positron emission tomography: PET
          PET: PET
          electroencephalography: EEG
          EEG: EEG
          magnetoencephalography: MEG
          MEG: MEG
          fNIRS: fNIRS
          functional near-infrared spectroscopy: fNIRS
          NIRS: fNIRS
          MRI: MRI
          magnetic resonance imaging: MRI
          single-photon emission computed tomography: SPECT
          SPECT: SPECT
          intracranial EEG: other
          iEEG: other
          electrocorticography: other
          ECoG: other
          ultrasound: other
          functional ultrasound: other

      acquisition_duration_seconds:
        populated_from: acquisition_duration_seconds.value
        source_evidence: acquisition_duration_seconds.evidence
        status_field: acquisition_duration_seconds.extraction_status
        transform: parse_float

      instrument:
        populated_from: instrument
        transform: verbatim
        notes: >-
          The Instrument record, copied through by the derivation below. Held inline on
          Acquisition, so there is no identifier to resolve. Extraction splits manufacturer
          from model at the point of reading, rather than the mapper splitting one verbatim
          string afterwards: the extractor has the sentence in front of it and the mapper
          would only have the phrase.

  # The five Acquisition subclasses. Each inherits the derivations above through `is_a`
  # and adds only its own attributes, read out of the matching nested extraction object:
  # storage subclasses what extraction nests, so this is where that shape change happens.
  # Exactly one of these runs per record, chosen by Acquisition.acquisition_type.

  MRI:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      magnetic_field_strength_tesla:
        populated_from: mri.magnetic_field_strength_tesla.value
        source_evidence: mri.magnetic_field_strength_tesla.evidence
        status_field: mri.magnetic_field_strength_tesla.extraction_status
        transform: parse_float

      pulse_sequence_type:
        populated_from: mri.pulse_sequence_type.value
        transform: verbatim

      mr_acquisition_type:
        populated_from: mri.mr_acquisition_type.value
        transform: verbatim

      repetition_time_seconds:
        populated_from: mri.repetition_time_seconds.value
        source_evidence: mri.repetition_time_seconds.evidence
        status_field: mri.repetition_time_seconds.extraction_status
        transform: parse_float

      echo_time_seconds:
        populated_from: mri.echo_time_seconds.value
        source_evidence: mri.echo_time_seconds.evidence
        status_field: mri.echo_time_seconds.extraction_status
        transform: parse_float

      acquisition_voxel_size_mm:
        populated_from: mri.acquisition_voxel_size_mm.value
        source_evidence: mri.acquisition_voxel_size_mm.evidence
        status_field: mri.acquisition_voxel_size_mm.extraction_status
        transform: parse_float

      number_of_volumes:
        populated_from: mri.number_of_volumes.value
        source_evidence: mri.number_of_volumes.evidence
        status_field: mri.number_of_volumes.extraction_status
        transform: parse_int

  # ───────────────────────────────────────────────────────────────────────────

  EEG:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      sampling_frequency_hz:
        populated_from: eeg.sampling_frequency_hz.value
        source_evidence: eeg.sampling_frequency_hz.evidence
        status_field: eeg.sampling_frequency_hz.extraction_status
        transform: parse_float

      eeg_reference:
        populated_from: eeg.eeg_reference.value
        transform: verbatim

      eeg_placement_scheme:
        populated_from: eeg.eeg_placement_scheme.value
        transform: verbatim

      recording_type:
        populated_from: eeg.recording_type.value
        transform: verbatim

      eeg_channel_count:
        populated_from: eeg.eeg_channel_count.value
        source_evidence: eeg.eeg_channel_count.evidence
        status_field: eeg.eeg_channel_count.extraction_status
        transform: parse_int

  # ───────────────────────────────────────────────────────────────────────────

  FNIRS:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      sampling_frequency_hz:
        populated_from: fnirs.sampling_frequency_hz.value
        source_evidence: fnirs.sampling_frequency_hz.evidence
        status_field: fnirs.sampling_frequency_hz.extraction_status
        transform: parse_float

      nirs_system_type:
        populated_from: fnirs.nirs_system_type.value
        transform: verbatim

      nirs_channel_count:
        populated_from: fnirs.nirs_channel_count.value
        source_evidence: fnirs.nirs_channel_count.evidence
        status_field: fnirs.nirs_channel_count.extraction_status
        transform: parse_int

      wavelengths_nm:
        populated_from: fnirs.wavelengths_nm.value
        source_evidence: fnirs.wavelengths_nm.evidence
        status_field: fnirs.wavelengths_nm.extraction_status
        transform: parse_float

      short_channel_count:
        populated_from: fnirs.short_channel_count.value
        source_evidence: fnirs.short_channel_count.evidence
        status_field: fnirs.short_channel_count.extraction_status
        transform: parse_int

      source_detector_distances_mm:
        populated_from: fnirs.source_detector_distances_mm.value
        source_evidence: fnirs.source_detector_distances_mm.evidence
        status_field: fnirs.source_detector_distances_mm.extraction_status
        transform: parse_float

      nirs_placement_scheme:
        populated_from: fnirs.nirs_placement_scheme.value
        transform: verbatim

      recorded_signal_types:
        populated_from: fnirs.recorded_signal_types.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  PET:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      image_units:
        populated_from: pet.image_units.value
        transform: verbatim

      tracer_name:
        populated_from: pet.tracer_name.value
        transform: verbatim

      tracer_radionuclide:
        populated_from: pet.tracer_radionuclide.value
        transform: verbatim

      mode_of_administration:
        populated_from: pet.mode_of_administration.value
        transform: verbatim

      scan_type:
        populated_from: pet.scan_type.value
        transform: verbatim

      uptake_time_seconds:
        populated_from: pet.uptake_time_seconds.value
        source_evidence: pet.uptake_time_seconds.evidence
        status_field: pet.uptake_time_seconds.extraction_status
        transform: parse_float

      reconstructed_voxel_size_mm:
        populated_from: pet.reconstructed_voxel_size_mm.value
        source_evidence: pet.reconstructed_voxel_size_mm.evidence
        status_field: pet.reconstructed_voxel_size_mm.extraction_status
        transform: parse_float

      spatial_resolution_mm:
        populated_from: pet.spatial_resolution_mm.value
        source_evidence: pet.spatial_resolution_mm.evidence
        status_field: pet.spatial_resolution_mm.extraction_status
        transform: parse_float

  # ───────────────────────────────────────────────────────────────────────────

  OtherModality:
    populated_from: Acquisition
    is_a: Acquisition
    slot_derivations:

      modality_label:
        populated_from: other.modality_label.value
        source_evidence: other.modality_label.evidence
        transform: verbatim
        notes: >-
          Falls back to the raw modality.value when the extractor left it unset, so a record
          whose modality normalized to `other` still names what the source called it. The
          field is required in storage, so the fallback is not optional.

      reason_no_modality_class_used:
        populated_from: other.reason_no_modality_class_used.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Instrument:
    populated_from: Instrument
    slot_derivations:

      manufacturer:
        populated_from: manufacturer.value
        source_evidence: manufacturer.evidence
        status_field: manufacturer.extraction_status
        transform: verbatim

      model:
        populated_from: model.value
        source_evidence: model.evidence
        status_field: model.extraction_status
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Preprocessing:
    populated_from: Preprocessing
    slot_derivations:

      id:
        transform: generate

      description:
        populated_from: description.value
        transform: verbatim

      software:
        populated_from: software.value
        transform: verbatim

      steps:
        populated_from: steps.value
        transform: verbatim

      smoothing_fwhm_mm:
        populated_from: smoothing_fwhm_mm.value
        source_evidence: smoothing_fwhm_mm.evidence
        status_field: smoothing_fwhm_mm.extraction_status
        transform: parse_float
        notes: >-
          A scalar becomes a list of length one; three values pass through as [x, y, z].
          Zero is a value and not an empty list: it says the source reported unsmoothed
          data, which an absent field does not. Nothing here reads `steps` to recover a
          kernel a phrase mentions -- parsing "smoothed with an 8 mm Gaussian" out of free
          text is the mapper inventing a measurement, and an unpopulated field is the
          honest result.

  # ───────────────────────────────────────────────────────────────────────────

  ModelEstimation:
    populated_from: ModelEstimation
    slot_derivations:

      id:
        transform: generate

      terms:
        populated_from: terms
        transform: local_id_to_id
        notes: >-
          Each local_id resolves to a Term record and is inlined here as a ModelTerm. This
          is the model specification, stated once however many analyses take contrasts from
          it; each of those analyses records its own selection over these terms in
          effect.cells.

          It is also the **adjustment set** of every contrast taken from this model, because a
          contrast's adjustment set is this list minus the terms its cells name. Two mapper
          obligations follow. First, a `term_uses` entry naming a term absent from this list
          means the extraction found a covariate the model's term list missed; add the term here
          from the term_use rather than dropping it, because a covariate missing here becomes a
          derived claim that the model did not adjust for it. Second, analyses whose design
          matrices differ must not share one record -- one term list behind two design matrices
          makes the derived adjustment set wrong for both, which the old per-contrast list would
          have hidden.

      model_family:
        populated_from: model_type.value
        source_evidence: model_type.evidence
        status_field: model_type.extraction_status
        transform: normalize_enum
        notes: >-
          The extraction schema records only the source's wording, so the normalized
          family is derived from the same field that model_type keeps verbatim. ModelFamily
          has no `other` value and the slot accepts free text, so wording this table does
          not cover passes through verbatim rather than collapsing to a catch-all; an
          absent or empty model_type becomes `unstated`. Neither is guessed from
          surrounding prose. That is why the method families the vocabulary cannot name --
          ICA, representational similarity, decoding, effective connectivity,
          coordinate-based meta-analysis -- have no mappings here: they survive as their
          own wording, and the Analysis.details subclass identifies the method.
        value_mappings:
          GLM: glm
          general linear model: glm
          mass univariate GLM: glm
          mass-univariate GLM: glm
          mass univariate: glm
          multiple regression: glm
          linear regression: glm
          regression: glm
          fixed effects model: glm
          random effects model: glm
          PPI: glm
          psychophysiological interaction: glm
          mixed effects model: mixed_effects
          mixed-effects model: mixed_effects
          linear mixed model: mixed_effects
          linear mixed effects model: mixed_effects
          LME: mixed_effects
          hierarchical model: mixed_effects
          multilevel model: mixed_effects
          ANOVA: anova
          analysis of variance: anova
          repeated measures ANOVA: anova
          rmANOVA: anova
          ANCOVA: ancova
          analysis of covariance: ancova
          robust regression: robust_regression

      model_type:
        populated_from: model_type.value
        source_evidence: model_type.evidence
        status_field: model_type.extraction_status
        transform: verbatim
        notes: >-
          Verbatim by design. This slot is the method detail the ModelFamily enum drops,
          so normalizing it here would lose the only record of it; the normalized value is
          model_family, derived from this same source field.

      hrf_model:
        populated_from: hrf_model.value
        transform: verbatim
        notes: >-
          Verbatim: the basis set is reported as a name, and the storage slot is a string
          with no vocabulary to normalize against. Unset for a measure that models no
          timeseries, which the extractor leaves empty rather than guessing.

      model_settings:
        populated_from: model_settings.value
        transform: verbatim

      level:
        populated_from: level.value
        source_evidence: level.evidence
        status_field: level.extraction_status
        transform: normalize_enum
        value_mappings:
          run: run
          first level: run
          first-level: run
          1st level: run
          session: session
          subject: subject
          individual: subject
          single-subject: subject
          within-subject: subject
          second level: group
          second-level: group
          2nd level: group
          group: group
          group level: group
          group-level: group
          random effects: group
          population: group

      estimator:
        populated_from: estimator.value
        transform: verbatim

      software:
        populated_from: software.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  Measure:
    populated_from: Measure
    slot_derivations:

      source_label:
        populated_from: source_label.value
        transform: verbatim

      specific_metric:
        populated_from: specific_metric.value
        transform: verbatim

      unit:
        populated_from: unit.value
        transform: verbatim

      type:
        populated_from: source_label.value
        transform: normalize_enum
        notes: >-
          Normalized from the paper's own term for the measure; extraction records no vocabulary
          of its own. Wording this schema's MeasureType cannot name passes through verbatim.

      family:
        populated_from: source_label.value
        transform: normalize_enum
        notes: >-
          Derived from the same wording as `type`. A derived measure takes the family of the
          underlying signal, so a BOLD-derived connectivity or decoding result is
          functional_bold.

  # ───────────────────────────────────────────────────────────────────────────

  Analysis:
    populated_from: Analysis
    # PENDING: some alpha.11 fields of the storage Analysis have no derivation yet,
    # because the extraction schema has no counterpart for them. Missing here:
    # spatial_scope, roi_definition, measure, and details. The derivations below populate
    # structure and, where extraction reports it, direction. There is no effect.kind to
    # populate: the kind is read off the cells at query time, not stored.
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      roi_label:
        populated_from: roi_label.value
        transform: verbatim
        notes: >-
          The verbatim spatial domain is the source-grounded region label. The
          normalized spatial_scope and roi_definition enums that accompany it have no
          derivation yet.

      acquisitions:
        populated_from: acquisitions
        transform: local_id_to_id
        notes: >-
          Each extraction Acquisition.local_id is resolved to a storage Acquisition.id.
          Source acquisitions are explicit for all analysis types, including structural
          and diffusion analyses without a Task.

      effect:
        transform: derive
        notes: >-
          Assembled rather than copied, and this is the one place the two schemas differ in
          shape rather than in wording. Extraction keeps the paper's own language: a contrast
          is a list of conditions, a list of cohorts, a list of occasions, a list of arms and a
          list of factor levels, because those are the things a paper names and an extractor
          can point at. Storage keeps one of them: `Effect.cells`, each naming a `ModelTerm`
          and a level of it. The collapse happens here.

          `statistic <- statistic`, and `mediation <- mediation_path` plus the term_use whose
          role was mediator. Nothing else: the five directional lists and `term_uses` all become
          `cells` by the derivation below, the adjustment set is read off the model, the kind is
          read off the cells, and the baseline is routed to whichever of those three already
          holds it.

          What the effect does *not* assemble is the terms themselves. Those belong to the
          ModelEstimation this analysis references, which several analyses may share; the
          effect records only which of them this contrast used, and how.

      effect.statistic:
        populated_from: statistic
        transform: verbatim

      # There is no effect.baseline to populate; `Analysis.baseline` is routed rather than mapped.
      # See absorbed_sources at the end of this file.

      effect.mediation:
        transform: derive
        notes: >-
          One object rather than two slots, assembled from two extraction sources, so no single
          `populated_from`. `path` normalizes from `mediation_path` and `mediator` is the term_use
          whose role normalized to `mediator`; the Mediation is created only when
          both are present, and an extraction with one and not the other is a structural error to
          report rather than a half-filled object to write. That pairing used to be a validator
          check against `Effect.path`; inside a class it is just two required slots.
        value_mappings:
          direct effect: direct
          direct: direct
          indirect effect: indirect
          indirect: indirect
          mediated: indirect
          total effect: total
          total: total

      details:
        transform: derive
        notes: >-
          Which of the eight payload slots on the extraction Analysis is filled selects the
          AnalysisDetails subclass. All seven empty means MassUnivariateDetails, which carries
          no fields -- that is how a mass-univariate analysis is asserted rather than inferred
          from an absence.

      effect.cells:
        transform: derive
        notes: >-
          The collapse. Six extraction slots -- `conditions`, `groups`, `timepoints`, `arms`,
          `factors` and `term_uses` -- become one storage slot, and every cell names the
          `ModelTerm` whose level it is. No single `populated_from`, because the whole point is
          that six shapes converge on one.

          A `factors` entry already names its term, so it maps straight across: `term` resolved
          to a ModelTerm of this analysis's ModelEstimation, `level` verbatim, `direction`
          normalized, `label` verbatim.

          An entity entry -- a condition, cohort, occasion or arm -- names no term, so the
          mapper finds one: the term of this analysis's ModelEstimation with a `FactorLevel`
          whose matching entity slot contains that entity, and the cell's `level` is that
          FactorLevel's label. Exactly one term must match. **No match** is a structural error,
          not a cell to invent: it means the extraction recorded a comparison whose model
          column it never recorded, and inventing a term here would put a design-matrix
          parameterization into the record that no one read off the paper. **More than one**
          match is the same error from the other side -- two overlapping carvings of the same
          regressors -- and the model needs fixing, not the contrast.

          A `term_uses` entry whose role was a term of interest becomes a cell on a continuous
          term: `term` resolved, no `level` (a slope has no levels), `direction` from its
          `association_direction`. A categorical term of interest needs no cell from here,
          because the entity or factor axis that gave it direction already made one.

          A `term_uses` entry whose role was a covariate produces **no cell at all**, and that is
          the whole of how a controlled-for term is recorded on the contrast side. It still has to
          land somewhere: the term must appear in `ModelEstimation.terms`, because a covariate
          missing from the model's term list would be a term the derived adjustment set denies
          the model adjusted for. See ModelEstimation.terms.

          The direction on an entity-derived cell is `unstated` until extraction reports one.
          It must not be guessed: an invented sign would change the derived kind, and would do
          it silently.

      # There is no effect.adjusted_for to populate. Adjustment is not a fact about a contrast
      # in this schema: it is what being a column of the design matrix means, so the adjustment
      # set is `ModelEstimation.terms` minus the terms the cells name, and it is computed at
      # read time. What a nuisance `term_use` maps to is therefore a **model** obligation, not
      # an effect one -- see ModelEstimation.terms below.

      model_estimation:
        populated_from: model_estimation
        transform: local_id_to_id
        notes: >-
          Required on both sides: every contrast comes from a model. The record carries the
          terms; this analysis's effect says which of them its contrast used.

      inference_settings:
        populated_from: inference_settings
        transform: verbatim
        notes: Structured inference settings are extracted at the analysis level.

      groups:
        populated_from: groups
        transform: local_id_to_id
        notes: >-
          Each local_id becomes an AnalysisGroup whose `group` is the resolved Group and whose
          `n` is the extraction GroupTerm's n. The extraction role does **not** come here:
          storage keeps cohort membership and cohort comparison apart, so a directional
          extraction GroupTerm also produces a cell on the term whose levels name that cohort,
          by the rule in effect.cells. A cohort the analysis merely ran on produces only this
          entry.

      preprocessing:
        populated_from: preprocessing
        transform: local_id_to_id

      prespecification:
        populated_from: prespecification.value
        source_evidence: prespecification.evidence
        status_field: prespecification.extraction_status
        transform: normalize_enum
        value_mappings:
          preregistered: preregistered
          pre-registered: preregistered
          prospectively registered: preregistered
          registered on ClinicalTrials.gov: preregistered
          registered on OSF: preregistered
          registered report: preregistered
          prespecified in the protocol: preregistered
          specified in the statistical analysis plan: preregistered
          planned a priori: preregistered
          confirmatory: preregistered
          exploratory: exploratory
          exploratory analysis: exploratory
          post hoc: exploratory
          post-hoc: exploratory
          data-driven: exploratory
          follow-up analysis: exploratory
          unplanned: exploratory
        notes: >-
          An absent or empty value becomes `unstated`, never `exploratory`: a paper that
          does not mention registration has not thereby called its analysis post hoc, and
          collapsing the two would manufacture a selective-reporting signal out of silence.

          The target enum is closed, so unlike every other normalize_enum here there is no
          verbatim fallback: wording this table does not cover must still resolve to one of
          the three, and the resolution is the same question the extractor already answered
          -- does the source say the contrast was planned, say it was not, or say nothing.
          `prespecified in the protocol` and its kin map to `preregistered` because what
          matters for pooling is that the contrast was fixed before the data were seen, not
          where the plan was deposited.

      definition:
        populated_from: definition.value
        transform: verbatim
        notes: >-
          The verbatim contrast specification is the source-grounded definition (layer L2),
          and its only source. An Analysis has a definition and no description, on either
          side of the map: one field states the tested effect, so there is no second
          narrative field to prefer it over and no fallback to reach for.

      tables:
        populated_from: tables
        transform: local_id_to_id


      coordinate_space:
        populated_from: coordinate_space.value
        source_evidence: coordinate_space.evidence
        status_field: coordinate_space.extraction_status
        transform: normalize_enum
        value_mappings:
          MNI: MNI152
          MNI152: MNI152
          MNI space: MNI152
          MNI152NLin2009cAsym: MNI152
          Montreal Neurological Institute: MNI152
          MNI305: MNI305
          fsaverage: fsaverage
          Talairach: Talairach
          Talairach space: Talairach
          TAL: Talairach
          subject native: native
          native space: native
        notes: >-
          Fallback for the space when the table parse did not recover one. Prefer
          Table.coordinate_space where it is populated; the two disagreeing is a review signal.

      tasks:
        transform: infer
        notes: >-
          Algorithm: take the Condition IDs in Analysis.effect.conditions and assign the
          distinct Tasks that own them. Exact rather than heuristic, because a condition now
          belongs to exactly one Task: the superset match this slot used when conditions were
          study-level is no longer needed.
          (1) If the analysis has no conditions, leave tasks empty; source data are
              represented by Analysis.acquisitions.
          (2) More than one task is a normal result -- a cross-task conjunction or a
              localizer-plus-main-task analysis genuinely spans paradigms.
          See issue #1.

      groups.n:
        populated_from: groups
        transform: verbatim
        notes: >-
          Per-analysis counts no longer form a parallel list. Each extraction
          GroupSampleSize resolves its group local_id to a storage Group and writes `n`
          onto that Group's existing AnalysisGroup in `groups` above. A count naming a group
          the analysis does not include has nowhere to go, which is the point of the
          merge: previously the two lists could disagree silently.

  # ───────────────────────────────────────────────────────────────────────────

  ModelTerm:
    populated_from: Term
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim
        notes: >-
          Verbatim where the source names the axis, and an extractor-supplied label where it
          names only the levels -- `load` over stated 1-back and 2-back conditions. The
          levels below are always the source's own, so the supplied part is the grouping's
          name and nothing else.

      source_definition:
        populated_from: source_definition.value
        transform: verbatim

      type:
        populated_from: type.value
        source_evidence: type.evidence
        status_field: type.extraction_status
        transform: normalize_enum
        value_mappings:
          categorical: categorical
          factor: categorical
          grouping variable: categorical
          continuous: continuous
          covariate: continuous
          regressor: continuous
          parametric: continuous

      assessment:
        populated_from: assessment
        transform: local_id_to_id

      levels:
        populated_from: levels
        transform: verbatim
        notes: >-
          Each extraction FactorLevel becomes a storage FactorLevel by the derivation
          below. This one slot replaces three encodings of the same relation: the old
          Term.conditions and Term.groups pointers, the old flat Term.levels label list,
          and the factor_levels that used to hang off every directional term and match a
          Term by name. The factor is now named once, by the ModelTerm this sits on.

      variation_level:
        populated_from: variation_level.value
        source_evidence: variation_level.evidence
        status_field: variation_level.extraction_status
        transform: normalize_enum
        value_mappings:
          within subject: within_subject
          within-subject: within_subject
          within-subjects factor: within_subject
          repeated measures: within_subject
          crossover: within_subject
          trial-wise: within_subject
          trial by trial: within_subject
          across trials: within_subject
          within run: within_subject
          between subjects: between_subject
          between-subject: between_subject
          between-subjects factor: between_subject
          parallel-group: between_subject
          across participants: between_subject
          across subjects: between_subject
          one value per participant: between_subject
          both: mixed
          within and between: mixed
        notes: >-
          Wording this table does not cover passes through verbatim, since the slot accepts free
          text -- "across sessions" for a longitudinal within-person term is the case that
          recurs. A value outside the vocabulary leaves the derived kind of a contrast testing
          this term undetermined -- it cannot choose between a modulation and a regression -- and
          that is the correct outcome rather than a reason to reject the record or coerce the
          level.

          Populated for categorical terms as well as continuous ones. Papers state a factor's
          scope in words this table already covers -- "a within-subjects factor task", "a
          between-subjects factor group" -- and only the continuous case reaches the kind
          derivation, so a factor's scope is carried without changing any derived value.

      functional_form:
        populated_from: functional_form.value
        transform: normalize_enum
        notes: >-
          `product` is no longer a value here. Wording that names a product or an interaction --
          "product term", "interaction term", "age x group" -- is evidence for `interaction_with`
          rather than for this slot, so route it there and leave this unset unless the source also
          states a shape. A term whose only stated form was "product" therefore arrives with
          functional_form empty and interaction_with populated, which is the whole of what the
          source said.
        value_mappings:
          linear: linear
          quadratic: quadratic
          squared: quadratic
          absolute: absolute
          unsigned: absolute
          log: log
          log-transformed: log

      interaction_with:
        populated_from: interaction_with
        transform: local_id_to_id
        notes: >-
          The one slot on ModelTerm that the derived kind reads directly. A celled term with a
          non-empty value here derives `interaction` before `variation_level` is consulted, which is
          what stops an age-by-group moderation reading as a cross-subject regression -- a continuous
          term has no levels, so that crossing cannot be read off compared levels.

          Two mapper obligations follow. Wording that names a product or interaction term populates
          this even when the extraction put it in `functional_form`, since that value no longer
          exists. And a product whose components are all categorical and all crossed is **flagged for
          review** rather than dropped or rejected: the crossed levels already derive `interaction`,
          so the column decides nothing, and this is the shape an extractor adds when reading a
          crossing off prose. It is the most over-applied field in the schema -- 19 of 19 bench
          disagreements were it being set where the reference left it empty.

      unit:
        populated_from: unit.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  FactorLevel:
    populated_from: FactorLevel
    slot_derivations:

      level:
        populated_from: level.value
        transform: verbatim

      order:
        populated_from: order.value
        source_evidence: order.evidence
        status_field: order.extraction_status
        transform: parse_int
        notes: >-
          Copied, never synthesized. An absent order means the extractor found no stated
          sequence, and numbering the levels in the order they happened to be written would
          assert an ordinal factor where the design may have a nominal one.

      conditions:
        populated_from: conditions
        transform: local_id_to_id

      groups:
        populated_from: groups
        transform: local_id_to_id

      timepoints:
        populated_from: timepoints
        transform: local_id_to_id

      arms:
        populated_from: arms
        transform: local_id_to_id

  # ───────────────────────────────────────────────────────────────────────────

  Cell:
    populated_from: FactorTerm
    notes: >-
      One class on the storage side for what extraction keeps in five. A `FactorTerm` maps
      across directly, since it already names a term and a level; an entity axis entry
      (ConditionTerm, GroupTerm, TimepointTerm, ArmTerm) reaches the same shape by the lookup
      in `Analysis.effect.cells`, which finds the term whose FactorLevel names that entity and
      takes that FactorLevel's label as the `level`. A continuous `TermUse` of interest becomes
      a cell with no level at all.
    slot_derivations:

      term:
        populated_from: term
        transform: local_id_to_id
        notes: >-
          Resolves to a ModelTerm of the ModelEstimation the containing Analysis references. A
          local_id naming a term outside that model is a structural error, not a record to
          repair by inventing one. For an entity-derived cell there is no local_id to resolve:
          the term is the one whose FactorLevel names the entity.

      level:
        populated_from: level.value
        source_evidence: level.evidence
        status_field: level.extraction_status
        transform: verbatim
        notes: >-
          Must match a FactorLevel.level of the referenced ModelTerm. The join is on the
          string, so the mapper compares after the same whitespace and case normalization it
          applies to the FactorLevel, and a level naming no recorded level is a structural
          error rather than a new level to create.

          Left unset only for a cell on a continuous term, where a level is not a thing a
          slope has.

      direction:
        populated_from: role.value
        source_evidence: role.evidence
        status_field: role.extraction_status
        transform: normalize_enum
        notes: >-
          One vocabulary for both kinds of term, so the comparative wording an extractor
          records for a factor level and the sign wording it records for a coefficient
          normalize to the same values. A cell derived from a continuous TermUse takes its
          `association_direction` through this same mapping instead of its role.

          **A non-directional level is three different facts, and `included` names all three.**
          Storage separates them and the mapper has to route them, because the wording an extractor
          reaches for does not:

            weighted out        -> no cell at all. Absence is how a zero weight is recorded, so the
                                   mapper drops the entry and the level falls out of the term's cell
                                   set by subtraction.
            held constant       -> a cell with `not_applicable`. A contrast taken *within* one level
                                   of a factor has that level take part while sitting on neither
                                   side. This keeps the factor out of the derived adjustment set --
                                   it was not averaged over -- without crossing it.
            direction unreported -> a cell with `unstated`. The level was compared and the source
                                   did not say which way.

          The three differ in what they claim, not in what they derive: none of them is directional,
          so the kind is the same either way. What they change is whether the record says the
          contrast weighted a level out, held it still, or reported nothing -- which is what a
          synthesis filters on.

          Bare `included` cannot be resolved, so it maps to `unstated` as the least-committal of the
          three and is **flagged for review**. Silently choosing is what put stratified contrasts on
          `unstated` in the first place. The wording tables below are what resolve it when the source
          gives more than "included".
        value_mappings:
          greater: positive
          higher: positive
          increased: positive
          present: positive
          positive: positive
          positively: positive
          lesser: negative
          lower: negative
          decreased: negative
          absent: negative
          negative: negative
          negatively: negative
          # held constant: the contrast was taken within this level
          held constant: not_applicable
          held at: not_applicable
          within this level: not_applicable
          restricted to: not_applicable
          stratified by: not_applicable
          no direction to report: not_applicable
          undirected: not_applicable
          # compared, sign not given
          unstated: unstated
          direction not reported: unstated
          # ambiguous: least-committal, and flagged
          included: unstated
          entered without a direction: unstated

      label:
        populated_from: label.value
        source_evidence: label.evidence
        status_field: label.extraction_status
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  PartialLeastSquaresDetails:
    populated_from: PartialLeastSquaresDetails
    slot_derivations:

      pls_type:
        populated_from: pls_type.value
        source_evidence: pls_type.evidence
        status_field: pls_type.extraction_status
        transform: normalize_enum
        value_mappings:
          task PLS: task
          task: task
          mean-centred task PLS: task
          mean-centered task PLS: task
          spatiotemporal task PLS: task
          experimental design: task
          behavioural PLS: behavioral
          behavioral PLS: behavioral
          behaviour: behavioral
          behavior: behavioral
          seed PLS: seed
          seed-based PLS: seed
          multiblock PLS: multiblock
          contrast-behaviour PLS: multiblock
        notes: >-
          An absent or empty value becomes `unstated`. Wording this table does not cover
          passes through verbatim, since the slot accepts free text.

      latent_variable_id:
        populated_from: latent_variable_id.value
        transform: verbatim

      latent_variable_label:
        populated_from: latent_variable_label.value
        transform: verbatim

      total_latent_variables:
        populated_from: total_latent_variables.value
        transform: parse_int

      crossblock_covariance_percent:
        populated_from: crossblock_covariance_percent.value
        transform: parse_float

      behavioral_variables:
        populated_from: behavioral_variables
        transform: local_id_to_id

      seed_regions:
        populated_from: seed_regions.value
        transform: verbatim

      salience_threshold:
        populated_from: salience_threshold.value
        transform: verbatim
        notes: >-
          Verbatim, and never copied into InferenceSettings. A bootstrap ratio is a
          stability measure rather than a test statistic, so recording it as a voxelwise
          threshold would misstate the inference.

      polarity_semantics:
        populated_from: polarity_semantics.value
        transform: normalize_enum

  # ───────────────────────────────────────────────────────────────────────────

  Condition:
    populated_from: Condition
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

  # ───────────────────────────────────────────────────────────────────────────

  StudyDesign:
    populated_from: Study
    slot_derivations:

      description:
        populated_from: design.value
        source_evidence: design.evidence
        status_field: design.extraction_status
        transform: verbatim
        notes: >-
          The narrative design paragraph, which was `Study.design` before the design axes
          became their own records.

      allocation:
        populated_from: study_design.allocation.value
        source_evidence: study_design.allocation.evidence
        status_field: study_design.allocation.extraction_status
        transform: normalize_enum
        value_mappings:
          randomized: randomized
          randomised: randomized
          randomly assigned: randomized
          quasi-randomized: randomized
          counterbalanced: randomized
          non-randomized: non_randomized
          nonrandomized: non_randomized
          clinician-assigned: non_randomized
          self-selected: non_randomized
          open-label single group: single_arm
          single-arm: single_arm
          single arm: single_arm
          all participants received: single_arm
          observational: not_applicable
          no intervention administered: not_applicable
        notes: >-
          Wording this table does not cover passes through verbatim; an absent or empty value
          becomes `unstated`.

      assignment_structure:
        populated_from: study_design.assignment_structure.value
        source_evidence: study_design.assignment_structure.evidence
        status_field: study_design.assignment_structure.extraction_status
        transform: normalize_enum
        value_mappings:
          parallel: parallel
          parallel-group: parallel
          between-groups: parallel
          two-arm: parallel
          crossover: crossover
          cross-over: crossover
          within-subject crossover: crossover
          repeated measures: within_subject
          within-subject: within_subject
          pre-post: within_subject
          longitudinal: within_subject
          single group: single_group
          cross-sectional: single_group
        notes: >-
          Wording this table does not cover passes through verbatim; an absent or empty value
          becomes `unstated`. This value is what says whether an arm reference belongs on a
          Group or on a Condition, so a disagreement between it and where the arms actually
          landed is worth surfacing for review.

      blinding:
        populated_from: study_design.blinding.value
        source_evidence: study_design.blinding.evidence
        status_field: study_design.blinding.extraction_status
        transform: normalize_enum
        value_mappings:
          open-label: open_label
          open label: open_label
          unblinded: open_label
          single-blind: participant_blind
          participant-blind: participant_blind
          subject-blind: participant_blind
          rater-blind: assessor_blind
          assessor-blind: assessor_blind
          observer-blind: assessor_blind
          double-blind: double_blind
          double blind: double_blind
          doubleblind: double_blind
        notes: >-
          `single-blind` maps to `participant_blind`, which is the usual meaning, but the term
          is used both ways; it is worth review when the paper does not say who was blinded.
          Wording this table does not cover passes through verbatim; an absent or empty value
          becomes `unstated`.

      arms:
        populated_from: arms
        notes: >-
          The Arm records themselves, from the extraction root. Held inline here because every
          reference to an Arm elsewhere is by identifier; see the Arm derivation below.

      timepoints:
        populated_from: timepoints
        notes: >-
          The Timepoint records themselves, from the extraction root. Held inline here for the
          same reason as `arms`; see the Timepoint derivation below.

  # ───────────────────────────────────────────────────────────────────────────

  Arm:
    populated_from: Arm
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

      agent:
        populated_from: agent.value
        transform: verbatim

      arm_kind:
        populated_from: arm_kind.value
        source_evidence: arm_kind.evidence
        status_field: arm_kind.extraction_status
        transform: normalize_enum
        value_mappings:
          drug: pharmacological
          drug administration: pharmacological
          infusion: pharmacological
          pharmacological: pharmacological
          TMS: stimulation
          rTMS: stimulation
          tDCS: stimulation
          tACS: stimulation
          stimulation: stimulation
          training: behavioural_intervention
          therapy: behavioural_intervention
          CBT: behavioural_intervention
          intervention: behavioural_intervention
          placebo: placebo
          saline: placebo
          vehicle: placebo
          sham: sham
          sham stimulation: sham
          active comparator: active_comparator
          active control: active_comparator
          usual care: usual_care
          treatment as usual: usual_care
          waitlist: no_intervention
          wait-list: no_intervention
          no treatment: no_intervention
        notes: >-
          This table is the one that used to sit on `Condition.condition_kind`, moved here
          with its target values unchanged: the same wordings resolve to the same strings, on
          the record that holds the fact. `condition_kind` has since been removed outright, so
          this is now the only home for these wordings. Wording it does not cover passes
          through verbatim; an absent or empty value becomes `unstated`.

  # ───────────────────────────────────────────────────────────────────────────

  Timepoint:
    populated_from: Timepoint
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      order:
        populated_from: order.value
        transform: parse_int

      time_from_intervention:
        populated_from: time_from_intervention.value
        transform: verbatim

      relation_to_intervention:
        populated_from: relation_to_intervention.value
        source_evidence: relation_to_intervention.evidence
        status_field: relation_to_intervention.extraction_status
        transform: normalize_enum
        value_mappings:
          baseline: pre_intervention
          pre-treatment: pre_intervention
          pre-intervention: pre_intervention
          pre: pre_intervention
          before: pre_intervention
          on-drug: during_intervention
          during: during_intervention
          acute challenge: during_intervention
          post-treatment: post_intervention
          post-intervention: post_intervention
          post: post_intervention
          after: post_intervention
          follow-up: post_intervention
          followup: post_intervention
          retention: post_intervention
          single session: single_occasion
          single scan: single_occasion
          cross-sectional: single_occasion
          observational: not_applicable
        notes: >-
          `baseline` resolves here, where it is unambiguous. It used to be turned away by
          `Condition.condition_kind`, which could not tell an occasion from a task-model
          baseline from a comparator arm; that field is now gone and this table is where the
          wording lands. Wording this table does not cover passes through verbatim; an absent
          or empty value becomes `unstated`.

  # ───────────────────────────────────────────────────────────────────────────

  Table:
    populated_from: Table
    slot_derivations:

      id:
        transform: generate

      table_number:
        populated_from: table_number.value
        transform: verbatim

      title:
        populated_from: title.value
        transform: verbatim

      caption:
        populated_from: caption.value
        transform: verbatim

      footer:
        populated_from: footer.value
        transform: verbatim

      source_path:
        transform: generate
        notes: Set by the ingestion pipeline to the repository path of the raw table file.

      coordinate_space:
        transform: derive
        notes: >-
          Normalized from the coordinate space the table parser recovered, not extracted. This is
          the first of the two places the space can live, and the preferred one: fill it when the
          parse yields a space, and leave Analysis.coordinate_space blank in that case.

      column_headings:
        populated_from: column_headings.value
        transform: verbatim

      description:
        populated_from: description.value
        transform: verbatim

      coordinate_count:
        transform: derive
        source_representation: normalized_table
        notes: >-
          Count coordinate rows or points in the normalized table
          representation. Set zero when the table has no coordinates.

# ───────────────────────────────────────────────────────────────────────────────
# Extraction fields and classes with no single storage field to land in. Every entry
# names a real extraction path and, where it survives, a real storage target; the
# completeness check verifies both, and fails on any extraction field that is neither
# mapped by a class_derivation nor listed here.

absorbed_sources:

  Analysis.baseline:
    absorbed_by: [Effect.cells, PerformanceMetric.reference_value]
    reason: >-
      Storage has no baseline field, because what a map was tested against is already three
      different facts. The mapper reads the wording and routes it; it does not normalize it into
      a vocabulary of its own.
    routing:
      rest / fixation / control task: >-
        A `negative` Cell on that condition's level. This is the route that can fail: if the
        condition is named in prose but no model term has a level carrying it, there is no cell to
        make. Report that as the structural error it is -- the same as any entity with no term --
        and do not invent the term.
      implicit baseline / implicit / zero: >-
        Nothing. A lone signed cell already tests its coefficient against zero, and zero is what
        the unmodelled implicit baseline is, so the absence of a second cell is the statement.
      chance / chance level: >-
        PerformanceMetric.reference_value, which carries the number and is per metric, since
        accuracy against chance and AUC against 0.5 are two references rather than one.
      nothing said: >-
        Nothing. The record carries whatever cells the contrast yielded, and the source's vagueness
        stays in this field's evidence rather than becoming a value.

  Analysis.conditions:
    absorbed_by: [Effect.cells]
    reason: >-
      An entity axis. Resolves to the model term whose FactorLevel names that Condition, and the
      cell's level is that FactorLevel's label. See Analysis.effect.cells.
  Analysis.timepoints:
    absorbed_by: [Effect.cells]
    reason: An entity axis, resolved the same way as Analysis.conditions.
  Analysis.arms:
    absorbed_by: [Effect.cells]
    reason: An entity axis, resolved the same way as Analysis.conditions.
  Analysis.factors:
    absorbed_by: [Effect.cells]
    reason: >-
      Already names a term and a level, so it maps straight across; it is the `populated_from` of
      the Cell class derivation.
  Analysis.term_uses:
    absorbed_by: [Effect.cells, Effect.mediation, ModelEstimation.terms]
    reason: >-
      Split by role. A term of interest on a continuous term becomes a Cell with no level; a
      covariate becomes nothing on the Effect and an obligation that the term appear in
      ModelEstimation.terms, since the adjustment set is that list minus the celled terms; a
      mediator becomes Effect.mediation.mediator.

      A role of "moderator" has no destination and is a reporting error rather than a value to
      normalize: the moderator and the effect it moderates are both terms of interest, and the
      moderation is a product Term naming them in interaction_with. Flag it for review rather than
      dropping it silently, since it usually means the product term was not extracted.
  Analysis.mediation_path:
    absorbed_by: [Effect.mediation]
    reason: >-
      Half of the Mediation object, the other half being the mediator term_use. Both are required
      inside the class, so the mapper creates it only when both are present.

  Analysis.decoding:
    absorbed_by: [Analysis.details]
    reason: Which of the eight payload slots is filled selects the AnalysisDetails subclass.
  Analysis.similarity:
    absorbed_by: [Analysis.details]
    reason: Payload slot; selects the AnalysisDetails subclass.
  Analysis.connectivity:
    absorbed_by: [Analysis.details]
    reason: Payload slot; selects the AnalysisDetails subclass.
  Analysis.conjunction:
    absorbed_by: [Analysis.details]
    reason: Payload slot; selects the AnalysisDetails subclass.
  Analysis.component_decomposition:
    absorbed_by: [Analysis.details]
    reason: Payload slot; selects the AnalysisDetails subclass.
  Analysis.partial_least_squares:
    absorbed_by: [Analysis.details]
    reason: Payload slot; selects the AnalysisDetails subclass.
  Analysis.not_structurable:
    absorbed_by: [Analysis.details]
    reason: Payload slot; selects the AnalysisDetails subclass.
  Analysis.other_method:
    absorbed_by: [Analysis.details]
    reason: >-
      Payload slot; selects OtherAnalysisDetails. All eight empty means MassUnivariateDetails,
      which is how a mass-univariate analysis is asserted rather than inferred from an absence.
  Analysis.statistic:
    absorbed_by: [Effect.statistic]
    reason: Nests one level down, the effect being what the statistic tested.

  Study.conditions:
    absorbed_by: [Task.conditions]
    reason: >-
      Extraction is a flat record with local_ids: Study holds the Condition registry and Task
      points into it. Storage inlines each Condition under the Task that owns it.
  Study.terms:
    absorbed_by: [ModelEstimation.terms]
    reason: The same registry pattern -- Study holds the Term records, ModelEstimation points into them.
  Study.arms:
    absorbed_by: [StudyDesign.arms]
    reason: Registry pattern; storage nests arms under the design.
  Study.timepoints:
    absorbed_by: [StudyDesign.timepoints]
    reason: Registry pattern; storage nests occasions under the design.
  Study.study_design:
    absorbed_by: [Study.design]
    reason: >-
      Renamed on the storage side, and the StudyDesign class derivation reads the Study record
      rather than this slot.
  Study.extraction_metadata:
    absorbed_by: []
    reason: >-
      Deliberately not carried. It is provenance about the extraction run -- model, prompt, run
      identifiers -- not a fact about the study, and storage records facts about studies. The audit
      log keeps it.

  GroupTerm:
    absorbed_by: [Cell, AnalysisGroup]
    reason: >-
      Split in two, which is the point of the split. `group` and `n` become an AnalysisGroup, which
      is membership only; a directional `role` additionally becomes a Cell on the model term whose
      levels name that cohort. A cohort the analysis merely ran on yields only the AnalysisGroup.
  ConditionTerm:
    absorbed_by: [Cell]
    reason: >-
      One of the four entity axes storage no longer has. Its Condition is resolved to the model
      term whose FactorLevel names it, and its role becomes the cell's direction.
  TimepointTerm:
    absorbed_by: [Cell]
    reason: An entity axis, absorbed the same way as ConditionTerm.
  ArmTerm:
    absorbed_by: [Cell]
    reason: An entity axis, absorbed the same way as ConditionTerm.
  TermUse:
    absorbed_by: [Cell, Mediation, ModelEstimation]
    reason: >-
      Split by role, as Analysis.term_uses describes. `TermRole` itself has no storage
      counterpart: a term is tested iff it has a Cell, adjusted for iff it is a term of the model
      with no Cell, and the mediator is named by Mediation.
