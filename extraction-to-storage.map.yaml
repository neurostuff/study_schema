  # ───────────────────────────────────────────────────────────────────────────

  Analysis:
    populated_from: Analysis
    # PENDING: the alpha.11 fields of the storage Analysis have no derivation yet,
    # because the extraction schema has no counterpart for them. Missing here:
    # spatial_scope, roi_definition, measure, details, effect
    # (kind, baseline, path, conditions, terms, statistic), details,
    # and the directional roles and factor levels of groups. The derivations below
    # are the pre-alpha.11 set, retargeted so the map still resolves against the
    # storage schema; they populate structure, not direction.
    slot_derivations:

      id:
        transform: generate

      name:
        populated_from: name.value
        transform: verbatim

      roi_label:
        populated_from: roi_label.value
        transform: verbatim
        notes: >-
          The verbatim spatial domain is the source-grounded region label. The
          normalized spatial_scope and roi_definition enums that accompany it have no
          derivation yet.

      acquisitions:
        populated_from: acquisitions
        transform: local_id_to_id
        notes: >-
          Each extraction Acquisition.local_id is resolved to a storage Acquisition.id.
          Source acquisitions are explicit for all analysis types, including structural
          and diffusion analyses without a Task.

      effect:
        transform: derive
        notes: >-
          Assembled rather than copied: extraction holds the effect's parts flat on Analysis,
          because a flat record is what an extractor fills and a nested one is what a query
          wants. conditions <- conditions, timepoints <- timepoints, arms <- arms, terms <-
          term_uses, statistic <- statistic, baseline <- baseline, path <- mediation_path, and
          kind is derived from the axis pattern. Each of the three directional axes normalizes
          its `role` through DirectionalRole the same way, and each resolves its entity
          local_id to a storage identifier.

          What the effect does *not* assemble is the terms themselves. Those belong to the
          ModelEstimation this analysis references, which several analyses may share; the
          effect records only which of them this contrast used.

      effect.terms:
        populated_from: term_uses
        transform: verbatim
        notes: >-
          Each extraction TermUse becomes a storage TermUse by the derivation below,
          resolving its `term` local_id to a ModelTerm of this analysis's ModelEstimation.
          The terms themselves are not copied here: they belong to the model, which several
          analyses may share, and this slot records only which of them this contrast used.

      effect.statistic:
        populated_from: statistic
        transform: verbatim

      effect.baseline:
        populated_from: baseline.value
        source_evidence: baseline.evidence
        status_field: baseline.extraction_status
        transform: normalize_enum
        value_mappings:
          rest: modelled_condition
          fixation: modelled_condition
          control task: modelled_condition
          implicit baseline: implicit
          implicit: implicit
          chance: chance
          chance level: chance
          zero: zero

      effect.path:
        populated_from: mediation_path.value
        transform: normalize_enum
        value_mappings:
          direct effect: direct
          direct: direct
          indirect effect: indirect
          indirect: indirect
          mediated: indirect
          total effect: total
          total: total

      details:
        transform: derive
        notes: >-
          Which of the eight payload slots on the extraction Analysis is filled selects the
          AnalysisDetails subclass. All seven empty means MassUnivariateDetails, which carries
          no fields -- that is how a mass-univariate analysis is asserted rather than inferred
          from an absence.

      effect.conditions:
        populated_from: conditions
        transform: local_id_to_id
        notes: >-
          Each local_id becomes a ConditionTerm whose condition is the resolved
          Condition. The extraction schema reports no direction, so role is `unstated`
          until it does; it must not be guessed, because an invented role would change
          the derived effect kind.

      model_estimation:
        populated_from: model_estimation
        transform: local_id_to_id
        notes: >-
          Required on both sides: every contrast comes from a model. The record carries the
          terms; this analysis's effect says which of them its contrast used.

      inference_settings:
        populated_from: inference_settings
        transform: verbatim
        notes: Structured inference settings are extracted at the analysis level.

      groups:
        populated_from: groups
        transform: local_id_to_id
        notes: >-
          Each local_id becomes a GroupTerm whose group is the resolved Group and whose
          role is `unstated`, on the same grounds as effect.conditions above. Which
          factorial cell the cohort occupies is not here: it is a level of a ModelTerm on
          the analysis's ModelEstimation, which names the cohort.

      preprocessing:
        populated_from: preprocessing
        transform: local_id_to_id

      prespecification:
        populated_from: prespecification.value
        source_evidence: prespecification.evidence
        status_field: prespecification.extraction_status
        transform: normalize_enum
        value_mappings:
          preregistered: preregistered
          pre-registered: preregistered
          prospectively registered: preregistered
          registered on ClinicalTrials.gov: preregistered
          registered on OSF: preregistered
          registered report: preregistered
          prespecified in the protocol: preregistered
          specified in the statistical analysis plan: preregistered
          planned a priori: preregistered
          confirmatory: preregistered
          exploratory: exploratory
          exploratory analysis: exploratory
          post hoc: exploratory
          post-hoc: exploratory
          data-driven: exploratory
          follow-up analysis: exploratory
          unplanned: exploratory
        notes: >-
          An absent or empty value becomes `unstated`, never `exploratory`: a paper that
          does not mention registration has not thereby called its analysis post hoc, and
          collapsing the two would manufacture a selective-reporting signal out of silence.

          The target enum is closed, so unlike every other normalize_enum here there is no
          verbatim fallback: wording this table does not cover must still resolve to one of
          the three, and the resolution is the same question the extractor already answered
          -- does the source say the contrast was planned, say it was not, or say nothing.
          `prespecified in the protocol` and its kin map to `preregistered` because what
          matters for pooling is that the contrast was fixed before the data were seen, not
          where the plan was deposited.

      definition:
        populated_from: definition.value
        transform: verbatim
        notes: >-
          The verbatim contrast specification is the source-grounded definition (layer L2),
          and its only source. An Analysis has a definition and no description, on either
          side of the map: one field states the tested effect, so there is no second
          narrative field to prefer it over and no fallback to reach for.

      tables:
        populated_from: tables
        transform: local_id_to_id


      coordinate_space:
        populated_from: coordinate_space.value
        source_evidence: coordinate_space.evidence
        status_field: coordinate_space.extraction_status
        transform: normalize_enum
        value_mappings:
