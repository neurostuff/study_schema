          native space: native
        notes: >-
          Fallback for the space when the table parse did not recover one. Prefer
          Table.coordinate_space where it is populated; the two disagreeing is a review signal.

      tasks:
        transform: infer
        notes: >-
          Algorithm: take the Condition IDs in Analysis.effect.conditions and assign the
          distinct Tasks that own them. Exact rather than heuristic, because a condition now
          belongs to exactly one Task: the superset match this slot used when conditions were
          study-level is no longer needed.
          (1) If the analysis has no conditions, leave tasks empty; source data are
              represented by Analysis.acquisitions.
          (2) More than one task is a normal result -- a cross-task conjunction or a
              localizer-plus-main-task analysis genuinely spans paradigms.
          See issue #1.

      groups.n:
        populated_from: groups
        transform: verbatim
        notes: >-
          Per-analysis counts no longer form a parallel list. Each extraction
          GroupSampleSize resolves its group local_id to a storage Group and writes `n`
          onto that Group's existing GroupTerm in `groups` above. A count naming a group
          the analysis does not include has nowhere to go, which is the point of the
          merge: previously the two lists could disagree silently.

