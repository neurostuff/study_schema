      performance_measures:
        range: ExtractedStringList
        description: Behavioral variables recorded and summaries used to verify task performance.
  Condition:
    description: >-
      A named condition of a task: a modelled state, event type, or baseline that an analysis
      can contrast against another. Only what happened inside the paradigm -- the occasion
      the task was run on and the arm it was run under are Timepoints and Arms, and enter
      an analysis as levels of their own model terms, compared by `Cell`s on the Effect.
    attributes:
      local_id:
        range: string
        required: true
        description: Stable identifier.
      name:
        range: ExtractedString
        required: true
        description: >-
          Short condition label that distinguishes the condition from other task periods or
          modeled effects.
      description:
        range: ExtractedString
        description: |-
          Complete definition of the condition, including whether it was a rest, fixation, or control state, and whether it put a demand on the participant.
          A rest or fixation period inside another paradigm is a Condition of that paradigm's Task. A standalone resting-state run is not: it is its own Task, with one condition or none. The distinction is which paradigm the participant was in, not what they were doing -- a fixation baseline between working-memory blocks belongs to the working-memory Task.
          What a tested effect was measured against is not recorded here: a contrast against this condition gives it a `negative` cell, and a contrast against the unmodelled implicit baseline has no second cell.
