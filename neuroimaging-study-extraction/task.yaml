id: https://neurostuff.org/schemas/neuroimaging-study-extraction/task
name: neuroimaging-study-extraction-task
title: Neuroimaging Study Extraction Task Module
description: The paradigm participants performed, and the conditions it was made of.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy_ex: https://neurostuff.org/schemas/neuroimaging-study-extraction/
default_prefix: neurostudy_ex
default_range: string
imports:
  - linkml:types
  - ../extraction-evidence
  - acquisition
  - design
enums:
  ResponseMode:
    description: >-
      How participants responded during a task. Open vocabulary: write the source's own wording
      in the field when nothing here fits.
    permissible_values:
      button_press:
        description: >-
          A discrete report on a button box, keypad, keyboard, joystick, or mouse. The commonest
          response in the literature by a wide margin.
      hand_movement:
        description: >-
          A hand or arm movement that is itself the response rather than a report -- finger
          tapping, a sequence, grasping, reaching, writing, drawing.
      speech:
        description: An overt vocal response -- naming, reading aloud, answering, generating
          words.
      covert_response:
        description: >-
          A response made silently and not emitted -- covert naming, subvocal rehearsal, imagined
          movement, counting to oneself. CogPO's covert response: real, instructed, and unobservable,
          so no accuracy comes with it.
      eye_movement:
        description: A saccade, antisaccade, smooth pursuit, fixation shift, or instructed
          blink.
      foot_or_leg_movement:
        description: A pedal press, foot or toe tapping, or ankle or leg movement.
      oral_nonspeech:
        description: >-
          A mouth or airway action that is not speech -- swallowing, chewing, tongue or jaw
          movement, a breath hold.
      none:
        description: >-
          The task required no response: passive viewing or listening, film watching, resting
          state. A positive statement, and not the same as leaving the field empty.
classes:
  Task:
    description: >-
      A meaningful participant paradigm, such as a task, resting-state protocol, stimulation,
      or passive viewing, performed in association with an acquisition. A Task record is required
      wherever the study models conditions, a resting-state protocol included. Acquisitions
      with no paradigm do not require one, even in a longitudinal or interventional study:
      a structural comparison across occasions is carried by the Effect's timepoint terms
      and linked through Analysis.acquisitions.
    attributes:
      local_id:
        range: string
        required: true
      name:
        range: ExtractedString
        description: >-
          Short, unique label for the task or paradigm; corresponds conceptually to BIDS TaskName
          when applicable.
      description:
        range: ExtractedString
        description: Complete narrative description of what participants experienced and did.
      conditions:
        range: Condition
        multivalued: true
        inlined_as_list: true
        description: The conditions this task was made of. These are the different states/modes
          of the task.
      design_type:
        range: ExtractedString
        description: >-
          Design form such as event-related, block, mixed, naturalistic, or continuous with
          no modelled events (such as resting state).
      acquisitions:
        range: Acquisition
        multivalued: true
        inlined: false
        description: >-
          The acquisition protocols used to collect data for this task. Exclude structural
          scans unless they are part of the task itself.
      presentation_software:
        range: ExtractedString
        description: Stimulus-presentation software name, version, and operating system when
