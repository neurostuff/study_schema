      instructions:
        range: ExtractedString
        description: Task- or paradigm-specific instructions given to participants.
      stimuli:
        range: ExtractedString
        description: Visuals or other materials presented to participants.
      response_mode:
        range: ExtractedResponseModeList
        description: >-
          How participants responded. Multivalued because a paradigm often collects more than
