id: https://neurostuff.org/schemas/neuroimaging-study-extraction/analysis_enums
name: neuroimaging-study-extraction-analysis-enums
title: Neuroimaging Study Extraction Analysis Vocabularies
description: |-
  Controlled vocabularies for the tested effect represented by an Analysis. Enumerations only, so that the analysis and analysis-details modules can both bind to them without either importing the other.
  Two conventions run through every enumeration. `not_applicable` means the concept does not apply to this analysis, and is a value like any other; a fact that could exist and which the source does not report is not a value at all, but `extraction_status: not_reported` on the wrapper, the one encoding of missingness.
  Second, most of these vocabularies are open rather than carrying a catch-all value. An attribute binding an open enumeration declares `any_of: [{range: <Enum>}, {range: string}]` instead of a range, so the field holds either a controlled value or the source's own words: when nothing fits, write the wording. Modality is the exception and keeps `other`, whose value selects the OtherModality payload class. A value outside a vocabulary is a signal for review, not a validation failure; canonicalization is the mapper's job, in the `normalize_enum` derivations of extraction-to-storage.map.yaml.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy_ex: https://neurostuff.org/schemas/neuroimaging-study-extraction/
default_prefix: neurostudy_ex
default_range: string
imports:
  - linkml:types
  - ../extraction-evidence
enums:
  AnalysisType:
    description: >-
      The method that produced the statistical map, independent of what was tested about it.
      A between-group comparison of connectivity, decoding accuracy, or component loadings
      keeps the method here and records the comparison in Effect. Bound only by ConjunctionComponent.analysis_type;
      an Analysis states its method by which AnalysisDetails subclass it fills. Open vocabulary:
      write the source's own wording in the field when nothing here fits.
    permissible_values:
      mass_univariate:
        description: >-
          Voxelwise, vertexwise, or ROI-wise GLM, mixed-effects model, ANOVA or ANCOVA, or
          robust regression. This is the default family and takes no details payload.
      multivariate_decoding:
        description: Classification or pattern discriminability.
      representational_similarity:
        description: >-
          Association at the level of representational dissimilarity matrices. A trial-wise
          similarity or model-fit regressor entered into a univariate GLM is mass_univariate
          with a parametric_modulation effect, not this.
      connectivity:
        description: >-
          PPI, gPPI, seed-based connectivity, DCM, covariance, or Granger causality. PPI stays
          here even when the software estimates it with a GLM.
      conjunction:
        description: Logical combination of independently defined effects.
      latent_decomposition:
        description: >-
          One component or latent variable of a decomposition -- ICA, PCA, NMF, PLS, CCA,
          or a multimodal fusion. How many blocks were decomposed is not a method family:
          it is `LatentDecompositionDetails.second_block`. A conjunction component needing
          the distinction states it in this field's free-text escape hatch.
      not_structurable:
        description: The effect is grounded in the source but has no stable structured decomposition.
  SpatialScope:
    description: >-
      Spatial domain of the analysis, and a meta-analysis inclusion criterion. Open vocabulary:
      write the source's own wording in the field when nothing here fits.
    permissible_values:
      whole_brain:
        description: Inference across the whole acquired volume or surface.
      roi:
        description: Inference restricted to one or more regions of interest.
      searchlight:
        description: Moving-window multivariate analysis across the whole search space.
  SpatialUnit:
    description: >-
      The element an analysis was carried out over: the surface-versus-volume distinction
      as well as the univariate-versus-parcellated one. Gives the element, where SpatialScope
      gives the extent. Open vocabulary: write the source's own wording in the field when
      nothing here fits.
    permissible_values:
      voxel:
        description: Volumetric voxels.
      vertex:
        description: >-
          Surface vertices, on a reconstructed cortical mesh. Results are vertex indices in
          a surface template rather than stereotactic coordinates.
      roi:
        description: >-
          One value per region, from an averaged or extracted regional summary rather than
          an element-wise map.
      parcel:
        description: >-
          Parcels of a parcellation covering the search space, as distinct from a small set
          of named regions of interest.
  EffectPath:
    description: |-
      Which path through a mediation model an effect's map is. Without it, an indirect-effect map is structurally identical to a plain regression on the same predictor, and a synthesis would pool the two.
      There is no `not_applicable`: an effect that is not a mediated path has no `Mediation` object, so there is no slot to fill.
    permissible_values:
      direct:
        description: The effect of the primary term with the mediator controlled.
      indirect:
        description: The mediated path, for example a product of coefficients.
      total:
        description: The unmediated total effect.
  ModelFamily:
    description: >-
      Statistical model family used to estimate the effect. Open vocabulary: write the source's
      own wording in the field when nothing here fits.
    permissible_values:
      glm:
        description: >-
          An ordinary least-squares general linear model, including the summary-statistics
          two-stage approach that fMRI calls a random-effects analysis: the group stage is
          still a GLM on contrast images.
      mixed_effects:
        description: >-
          A model estimating random effects directly, rather than by summarizing a first stage
          -- a linear mixed model, a hierarchical model.
      anova:
        description: Analysis of variance, with no continuous covariate.
      ancova:
        description: 'Analysis of covariance: a factorial design with a continuous covariate
          controlled for.'
      robust_regression:
        description: >-
          A regression fitted to resist outliers, such as an iteratively reweighted or M-estimator
          fit.
  StatisticFamily:
    description: >-
      Test statistic family for the tested effect, independent of the thresholding procedure
      recorded in InferenceSettings. Open vocabulary: write the source's own wording in the
      field when nothing here fits.
    permissible_values:
      t:
        description: >-
          Student's t. A single-degree-of-freedom statistic, so only the denominator degrees
          of freedom are populated.
      z:
        description: Has no degrees of freedom, so both numerator and denominator stay unset.
      f:
        description: Normally the only family besides likelihood_ratio to populate the numerator.
      chi_square:
        description: A chi-square statistic.
      likelihood_ratio:
        description: A likelihood-ratio statistic, from comparing a model against a nested
          one.
      beta:
        description: >-
          A regression coefficient reported as the test statistic itself, which some papers
          do instead of giving a t or z.
      correlation:
        description: A correlation coefficient reported as the statistic, r or rho.
  MeasureFamily:
    description: >-
      Broad imaging or signal family, for coarse filtering. A BOLD-derived connectivity or
      decoding result stays functional_bold: derived measures take the family of the underlying
      signal. Open vocabulary: write the source's own wording in the field when nothing here
      fits.
    permissible_values:
      functional_bold:
        description: >-
          The BOLD signal and anything derived from it, including connectivity, decoding performance,
          and amplitude measures.
      structural_morphometry:
        description: >-
          Measures of tissue shape and quantity from a structural image -- volume, thickness,
          surface area, density.
      diffusion:
        description: Measures from diffusion-weighted imaging.
      perfusion:
        description: Blood flow and volume measures, from ASL or a contrast agent.
      molecular_imaging:
        description: PET and SPECT measures of a tracer's distribution or binding.
      electrophysiology:
        description: EEG, MEG, and intracranial electrical measures.
  MeasureType:
    description: >-
      Normalized scientific quantity of the map, for cross-study queries. Activation and deactivation
      are directions rather than measure types; both are bold_response and the directional
      roles carry the direction. Gray-matter density is not collapsed into volume. A paper
      that does not identify the measure leaves the slot `extraction_status: not_reported`.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      bold_response:
        description: BOLD activation, task activation, or task-evoked response.
      bold_derived_metric:
        description: ALFF, fALFF, regional homogeneity, and similar derived BOLD metrics.
      gray_matter_volume:
        description: The quantity of grey matter, from voxel-based or region-based morphometry.
      gray_matter_density:
        description: Gray-matter density or concentration, kept distinct from volume.
      white_matter_volume:
        description: The quantity of white matter.
      cortical_thickness:
        description: The distance between the grey-white boundary and the pial surface.
      surface_area:
        description: The area of a cortical surface or one of its parcels.
      structural_morphometry_other:
        description: >-
          A structural measure none of the named ones covers -- gyrification, sulcal depth,
          a shape descriptor.
      diffusion_metric:
        description: >-
          Fractional anisotropy, mean diffusivity, and similar; name the metric in specific_metric.
      cerebral_blood_flow:
        description: Perfusion as a flow rate, from ASL or a tracer.
      cerebral_blood_volume:
        description: The fraction of tissue occupied by blood, distinct from the rate at which
          it flows.
      metabolic_rate:
        description: A rate of consumption or turnover, such as the glucose metabolic rate
          from FDG- PET.
      receptor_binding:
        description: PET receptor-binding potential.
      tracer_uptake:
        description: >-
          How much tracer accumulated, as an uptake value rather than a modelled rate or binding
          parameter.
      electrophysiological_amplitude:
        description: >-
          The size of a voltage or field deflection in the time domain, such as an evoked-
          potential peak.
      electrophysiological_power:
        description: >-
          Signal power in a frequency band. The band itself is not a field here; name it in
          specific_metric.
      connectivity_strength:
        description: PPI, seed correlation, or DCM parameter.
      decoding_performance:
        description: Classifier accuracy or other pattern-discriminability performance.
      representational_similarity:
        description: Model-brain similarity from an RDM-level association.
      component_loading:
        description: ICA or PCA spatial loading.
  Prespecification:
    description: >-
      Whether a contrast was planned before the data were seen. A preregistered primary contrast
      and a post-hoc sweep from the same paper are not equivalent evidence, and a synthesis
      that cannot tell them apart cannot address selective reporting.
    permissible_values:
      preregistered:
        description: >-
          The source states the analysis was planned before the data were seen. A public registration
          is the strongest form -- a registry entry, a trial identifier, a registered report
          -- but a stated protocol or analysis plan counts, since what matters for pooling
          is that the contrast was fixed in advance rather than where it was deposited. The
          claim must be the source's, and a registration covering the study does not by itself
          cover every contrast reported from it.
      exploratory:
        description: >-
          The source presents the analysis as exploratory, post hoc, data-driven, or follow-up
          to something else it found. A positive statement by the authors, not an inference
          from an absent registration.
  TermType:
    description: Whether a model term is categorical or continuous.
    permissible_values:
      categorical:
        description: >-
          A factor, defined by its levels and the cohorts, conditions, occasions, or arms
          carrying them. Its cells name a `level`, and a cell's `direction` is the sign of
          the contrast weight put on that level -- something the analyst specified.
      continuous:
        description: >-
          Carries the slope facts, and has no levels. Its cell names no `level`, there being
          no level for a slope to be, and the cell's `direction` is the sign of the fitted
          coefficient -- something the data produced rather than something specified.
  VariationLevel:
    description: |-
      The level at which a term varies -- whether it moves within a participant or only across the sample. A property of **any** term, categorical or continuous: a repeated-measures factor and a trial-wise modulator are both within-subject, and a diagnosis factor and an age covariate are both between-subject.
      For a continuous term it is what separates a parametric modulation from a cross-subject regression, and the derived kind of an effect testing it reads this. For a categorical factor it feeds no derivation; it is the factor's scope, and two studies that crossed a factor within participants and between them did not estimate the same thing. Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      within_subject:
        description: >-
          The term moves within a participant: a continuous term taking many values trial
          to trial or scan to scan, which is the level a parametric modulation is estimated
          at, or a categorical factor every participant met every level of -- a repeated-measures
          or crossover design.
      between_subject:
        description: >-
          The term varies only across the sample: one value per participant for a continuous
          term, or a categorical factor each participant sits in exactly one level of, as
          a diagnosis or a parallel-group allocation does.
      mixed:
        description: >-
          The term varies both within and between participants: age in a longitudinal study,
          where each person ages and people also differ in age at entry, or a partially crossed
          factor some participants met every level of and others did not.
  Direction:
    description: |-
      Which way a term entered or came out of an analysis, in one vocabulary for every kind of term. A categorical level put on the plus side of a comparison and a continuous term whose coefficient came out positive are both `positive`; which of the two a given cell carries follows from the referenced term's `type`, and on a cell over a **product** term it is the sign of the interaction coefficient rather than of either component's own slope.
      It is a sign, not a magnitude: numeric contrast weights are never recorded, and a contrast whose magnitudes matter keeps them in `Analysis.definition`. There is no value for a zero weight either -- a level the contrast did not weight has no `Cell` at all.
      Only `positive` and `negative` are directional. A cell can record no sign three ways -- `undirected`, `held`, or `extraction_status: not_reported` -- and choosing between them is the decision rule in extraction-readme.md §2.
    permissible_values:
      positive:
        description: >-
          A level on the plus side of the comparison, or a coefficient under which the measure
          rises as the term rises.
      negative:
        description: >-
          A level on the minus side of the comparison, or a coefficient under which the measure
          falls as the term rises.
      undirected:
        description: |-
          The test yields no per-level sign, so there is none to report. An F or chi-square over a factor compares that factor's levels against each other and returns one statistic for the set: every one of its levels takes a cell with this value, and a multi-degree-of-freedom interaction F takes it on the cell over the product column.
          Not `extraction_status: not_reported`: the sign is not missing from the page, it is absent from the test, so there is something to record rather than nothing. The post-hoc contrast that would supply one is a different Analysis.
      held:
        description: |-
          A level the contrast was taken *within*, which appears on **both sides** of the comparison and so has no net sign -- "patients versus controls, in the task condition" has task on the plus side and the minus side at once. Cell that one level and leave its factor's other levels **absent**, where an undirected test cells every level.
          No report, however complete, could sign this cell, which is what separates it from both unsigned neighbours: `undirected` is a test that produces no sign, a sign the page withheld is `extraction_status: not_reported`, and this is a sign that is not defined. A cell that names no level -- on a slope or a product column -- can never sit on both sides, so it can never take this value.
          Off a `Cell`, on a parameter-sign slot of a method payload, use `undirected` instead.
  FunctionalForm:
    description: >-
      Shape of a term's relationship to the measure. A squared term with a negative coefficient
      is an inverted-U relationship, not a negative association, so non-linear and transformed
      terms must not be reported as linear. Open vocabulary: write the source's own wording
      in the field when nothing here fits.
    permissible_values:
      linear:
        description: The measure changes by a constant amount per unit of the term.
      quadratic:
        description: >-
          A squared term. With a negative coefficient this is an inverted-U, not a negative
          association.
      absolute:
        description: >-
          Unsigned-magnitude regressors such as an absolute prediction error or an unsigned
          log-evidence.
      log:
        description: The term was log-transformed before entering the model.
  ConnectivityMethod:
    description: >-
      Method used to estimate connectivity. Open vocabulary: write the source's own wording
      in the field when nothing here fits.
    permissible_values:
      ppi:
        description: >-
          Psychophysiological interaction: connectivity with a seed that changes with a psychological
          condition.
      gppi:
        description: Generalized PPI, which models every condition rather than a single contrast.
      seed_based:
        description: >-
          Correlation between a seed's time series and every other element, with no interaction
          term.
      dcm:
        description: Dynamic causal modelling, which estimates directed influence from a generative
          model.
      granger:
        description: Granger causality, which infers direction from temporal precedence.
      coherence:
        description: Frequency-domain coupling between two signals.
      structural_covariance:
        description: >-
          Correlation of a structural measure between regions across participants, rather
          than of a signal within one. The seed and target are regions as in any other method
          here, but the correlation runs over subjects, so there is no time series.
      multivariate:
        description: >-
          Pattern-based connectivity: multivoxel or informational connectivity between ensembles
          of voxels rather than between averaged time series.
  ParameterChange:
    description: Whether the experimental effect raised or lowered a connectivity parameter.
    permissible_values:
      increased:
        description: The experimental effect raised the parameter.
      decreased:
        description: The experimental effect lowered the parameter.
      not_applicable:
        description: Direction is carried by condition or group roles instead.
  InferenceTarget:
    description: >-
      What the connectivity analysis drew inference about. Open vocabulary: write the source's
      own wording in the field when nothing here fits.
    permissible_values:
      connectivity_parameter:
        description: The test was on the strength of a connection.
      model_comparison:
        description: The test was on which of several models fits better, not on any one parameter.
      network:
        description: The test was on a set of connections treated as a unit, rather than on
          individual edges.
  EdgeDirectionality:
    description: >-
      Whether a connectivity edge is genuinely directed. Only directed models such as DCM
      and Granger causality qualify; a seed-to-voxel PPI or correlation is undirected, and
      its sign travels with the edge rather than implying a direction.
    permissible_values:
      directed:
        description: The method supports a claim about which region influences which.
      undirected:
        description: The method gives a symmetric relationship only, whatever the wording
          of the paper.
  PerformanceRelation:
    description: Direction of a decoding performance metric relative to its reference value.
    permissible_values:
      above_reference:
        description: Performance exceeded its reference value.
      below_reference:
        description: Performance fell below its reference value.
      not_applicable:
        description: The measure has no reference to compare against.
  NullHypothesis:
    description: >-
      Which null hypothesis a conjunction tested. Only the conjunction null licenses the interpretation
      that every component effect is present, so the hypothesis is recorded separately from
      the procedure that implemented it.
    permissible_values:
      global_null:
        description: At least one component effect is present at a voxel (Friston et al.).
      conjunction_null:
        description: Every component effect is present at a voxel (Nichols et al.).
  ConjunctionImplementation:
    description: >-
      Procedure used to compute the conjunction, which is not the same statement as the null
      hypothesis it tested: a minimum-statistic test is the usual implementation of the conjunction
      null. Open vocabulary: write the source's own wording in the field when nothing here
      fits.
    permissible_values:
      minimum_statistic:
        description: >-
          Each element takes the smaller of its statistics, so a conjunction survives only
          where both effects do.
      masking:
        description: One effect's map was thresholded and used to mask the other.
      logical_or:
        description: >-
          Elements surviving either effect were combined, which tests the global null rather
          than the conjunction null.
  SecondBlock:
    description: |-
      What a decomposition crossed the brain block with, one value per block. This decides whether two decompositions answer the same question, so it is the payload's one required vocabulary -- a task PLS and a behavioural PLS are not poolable, and neither is a one-block ICA with either of them.
      Multivalued, and `none` is a value rather than an absent field: a one-block decomposition is a positive assertion, not a gap. Name the blocks and not their number -- a design-plus-behaviour PLS is `[design, behavioral]`, and the count follows from the list's length.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      none:
        description: >-
          The brain data were decomposed alone -- ordinary ICA, PCA, or a related single-block
          method. The commonest case by a wide margin.
      design:
        description: >-
          The experimental design, as in mean-centred task PLS, including the spatiotemporal
          variant that carries a time dimension.
      behavioral:
        description: >-
          Participant-level behavioural or clinical measures. Where those measures are `Assessment`
          records of this study, `second_block_assessments` names them.
      seed_activity:
        description: >-
          Activity in one or more seed regions, named in `second_block_detail`. A connectivity
          question asked with decomposition machinery.
      other_imaging_modality:
        description: >-
          A second (or third) imaging measure of the same participants -- the multimodal fusion
          case. Joint, linked and parallel ICA and mCCA+jICA all land here, and a three-modality
          fusion carries this value once per additional modality.
      genetic:
        description: >-
          Genotype data such as a SNP array. Not an `Assessment`, so its contents belong in
          `second_block_detail`.
  DecompositionMethod:
    description: >-
      The algorithm that produced the components or latent variables, which decides what their
      values and signs mean. Independent of `second_block`, since one block structure is reachable
      by several algorithms: a brain-behaviour covariance can be decomposed by PLS or by CCA.
      Open vocabulary: write the source's own wording in the field when nothing here fits.
    permissible_values:
      ica:
        description: Independent component analysis.
      tensor_ica:
        description: >-
          ICA over a subject-by-time-by-space tensor, giving one shared spatial map with per-subject
          loadings.
      joint_ica:
        description: >-
          ICA on features concatenated across modalities, sharing one mixing matrix. Takes
          `other_imaging_modality` in `second_block`.
      parallel_ica:
        description: >-
          ICA run on two blocks at once with their mixing profiles linked, so a component
          of one block is paired with a component of the other. Covers linked ICA.
      pca:
        description: Principal component analysis, whose components are orthogonal rather
          than independent.
      nmf:
        description: Non-negative matrix factorization, whose components cannot take negative
          values.
      dictionary_learning:
        description: A sparse decomposition learning an overcomplete set of components.
      pls:
        description: >-
          Partial least squares, where the source does not distinguish the correlation and
          regression variants.
      pls_correlation:
        description: >-
          PLS correlation (PLS-C), decomposing the cross-block correlation matrix by SVD.
          The variant most fMRI work means by "PLS".
      pls_regression:
        description: >-
          PLS regression, which predicts one block from the other rather than decomposing
          their shared covariance symmetrically.
      cca:
        description: >-
          Canonical correlation analysis, which maximizes correlation between blocks where
          PLS maximizes covariance.
      mcca:
        description: >-
          Multi-set CCA, over three or more blocks. Frequently chained into joint ICA as mCCA+jICA,
          which takes this value with `joint_ica` noted in `Analysis.model_representation_notes`
          when the chaining matters.
  MapQuantity:
    description: >-
      What the values of a component or latent-variable map represent. Open vocabulary: write
      the source's own wording in the field when nothing here fits.
    permissible_values:
      loading:
        description: How strongly each participant or time point expresses the component.
      weight:
        description: The component's contribution at each element, in the decomposition's
          own scale.
      salience:
        description: >-
          A PLS salience: the element's contribution to a latent variable. Distinct from `weight`,
          saliences being conventionally reported as bootstrap ratios -- stability measures,
          not test statistics, so the threshold applied to them is `salience_threshold` and
          not a voxelwise statistic threshold.
      z_score:
        description: The component map after standardizing its values.
      spatial_map:
        description: The component's spatial pattern, where the source does not say what the
          values are.
  PolaritySemantics:
    description: >-
      Whether the sign of a component map carries meaning. Decomposition methods can return
      components whose polarity is arbitrary, in which case a negative loading is not a decrease.
    permissible_values:
      meaningful:
        description: 'The sign is interpretable: a negative value means a decrease.'
      arbitrary:
        description: >-
          The method could have returned the component with its sign flipped, so a negative
          value does not mean a decrease.
      unsigned:
        description: The values carry no sign at all.
  NotStructurableReason:
    description: >-
      Why a grounded effect has no stable structured decomposition. Open vocabulary: write
      the source's own wording in the field when nothing here fits.
    permissible_values:
      method_specific_derived_metric:
        description: >-
          The tested quantity is a metric peculiar to one method, with no counterpart in the
          shared vocabulary.
      insufficient_standard_structure:
        description: >-
          The design has too little of the usual structure -- no conditions, no groups, no
          terms -- to decompose.
      source_too_vague:
        description: The paper reports an effect without saying enough about it to structure.
  TableContent:
    description: >-
      What a table's rows are, for a table that reports no tested effect. A coordinate table
      is not an analysis merely by having coordinates in it: a study's ROI definitions, its
      atlas parcels, its connectivity seeds and the peaks of its independent components are
      all locations rather than findings. Open vocabulary: write the source's own wording
      when nothing here fits.
    permissible_values:
      region_definitions:
        description: >-
          Regions of interest the study delimited, with the coordinates that locate them --
          a sphere's centre, a mask's peak.
      atlas_or_parcellation:
        description: Entries of a published atlas or parcellation the study used.
      connectivity_seeds:
        description: The seed or node locations a connectivity analysis was run from.
      component_peaks:
        description: >-
          Peak locations of the components of a latent decomposition -- an ICA component's
          spatial map. The decomposition is not itself a tested effect.
      prior_literature_coordinates:
        description: Coordinates cited from other papers, for comparison or to place an ROI.
      stimulus_or_task_list:
        description: The stimuli, conditions or trial structure of the paradigm.
      demographics:
        description: Participant characteristics, whether or not group differences in them
          were tested.
      descriptive_statistics:
        description: Summary values with no inferential test -- means, percentages, dwell
          times.
classes:
  ExtractedAnalysisType:
    is_a: ExtractedValue
    description: >-
      An ExtractedValue whose value is AnalysisType, or the source's own wording when the
      vocabulary does not cover it.
    slot_usage:
      value:
        any_of:
          - range: AnalysisType
          - range: string
  ExtractedSpatialScope:
    is_a: ExtractedValue
    description: >-
      An ExtractedValue whose value is SpatialScope, or the source's own wording when the
      vocabulary does not cover it.
    slot_usage:
      value:
        any_of:
          - range: SpatialScope
          - range: string
  ExtractedSpatialUnit:
    is_a: ExtractedValue
    description: >-
      An ExtractedValue whose value is SpatialUnit, or the source's own wording when the vocabulary
      does not cover it.
    slot_usage:
      value:
        any_of:
          - range: SpatialUnit
          - range: string
  ExtractedEffectPath:
    is_a: ExtractedValue
    description: An ExtractedValue whose value is EffectPath.
    slot_usage:
      value:
        range: EffectPath
