enums:
  Modality:
    description: >-
      Imaging or recording modality of one Acquisition, and through `instantiates` the class
      in this module holding that modality's parameters. fMRI, sMRI, dMRI, and MRI all instantiate
      MRI; EEG, fNIRS, and PET instantiate their namesakes; MEG, SPECT, and other instantiate
      OtherModality. `instantiates` carries a CURIE against this module's own `neurostudy`
      prefix, so `neurostudy_ex:MRI` resolves to the MRI class below.
    permissible_values:
      fMRI:
        instantiates:
          - neurostudy_ex:MRI
        description: Functional MRI, whether BOLD, ASL perfusion, or cerebral blood volume
          weighted.
      sMRI:
        instantiates:
          - neurostudy_ex:MRI
        description: >-
          Structural MRI, such as a T1- or T2-weighted anatomical scan, used for morphometry
          or as a coregistration target.
      dMRI:
        instantiates:
          - neurostudy_ex:MRI
        description: Diffusion-weighted MRI, including DTI and DWI.
      MRI:
        instantiates:
          - neurostudy_ex:MRI
        description: >-
          An MRI acquisition whose functional, structural, or diffusion role the source does
          not make clear. Use a more specific value whenever the source supports one.
      EEG:
        instantiates:
          - neurostudy_ex:EEG
        description: Scalp electroencephalography.
      fNIRS:
        instantiates:
          - neurostudy_ex:FNIRS
        description: Functional near-infrared spectroscopy.
      PET:
        instantiates:
          - neurostudy_ex:PET
        description: Positron emission tomography.
      MEG:
        instantiates:
          - neurostudy_ex:OtherModality
        description: Magnetoencephalography. A first-class value with no compact class of
          its own.
      SPECT:
        instantiates:
          - neurostudy_ex:OtherModality
        description: Single-photon emission computed tomography.
      other:
        instantiates:
          - neurostudy_ex:OtherModality
        description: >-
          A modality none of the above names, such as intracranial EEG, ultrasound, or a physiological
          recording analysed on its own. OtherModality holds both its label and its parameters.
classes:
  Acquisition:
    description: >-
      A modality-agnostic protocol used to acquire neuroimaging or associated physiological
      data, holding only what every modality has in common. One Acquisition carries one modality:
      simultaneous recordings such as EEG+fMRI are separate Acquisition records that a Task
      lists together. Everything modality-specific lives in the class the Modality value instantiates
      -- MRI, EEG, FNIRS, PET, or OtherModality.
    attributes:
      local_id:
        range: string
        required: true
      acquisition_type:
        range: string
        required: true
        designates_type: true
        description: >-
          The concrete subclass this record instantiates. Derived by the mapper from the modality
          value's `instantiates`, never extracted.
      modality:
        range: ExtractedModality
        required: true
        description: >-
          Imaging or recording modality, from the closed Modality vocabulary. The value also
          names the class holding this acquisition's modality-specific parameters, through
          that value's `instantiates`.
      acquisition_duration_seconds:
        range: ExtractedNumber
        description: >-
          Total usable acquisition or recording duration in seconds. Useful for filtering
          studies by the amount of data contributing to an analysis, especially resting-state
          and continuous recordings.
      device:
        range: Device
        inlined: false
        description: >-
          The scanner, amplifier, or recording system this acquisition was made on, by identifier.
          Acquisitions made on one machine reference one record; a second record asserts the
          study used a second machine.
  MRI:
    is_a: Acquisition
    description: >-
      An MRI acquisition of any kind -- functional, structural, or diffusion, as modality
