      eeg_channel_count:
        range: ExtractedInteger
        description: Number of simultaneously recorded EEG channels.
  FNIRS:
    is_a: Acquisition
    description: >-
      An fNIRS acquisition. Its own attributes are the ones affecting cortical sensitivity,
