  OtherModality:
    is_a: Acquisition
    description: >-
      An acquisition whose modality has no class of its own: MEG, SPECT, and `other`. Nothing
      here is normalized, so this is where a modality the schema does not name keeps its parameters.
      A parameter that MRI, EEG, FNIRS, or PET has no field for belongs on that sibling class
