      pulse_sequence_type:
        range: ExtractedString
        description: General pulse sequence family, such as EPI, MPRAGE, SPGR, or spin echo.
      mr_acquisition_type:
        range: ExtractedString
        description: >-
          Acquisition dimensionality, such as 2D or 3D; useful for distinguishing protocols
          with materially different spatial sampling.
      repetition_time_seconds:
        range: ExtractedNumber
        description: Time between the start of successive acquired volumes, in seconds.
      echo_time_seconds:
        range: ExtractedNumberList
        description: >-
          Echo time in seconds, as a list of one value per echo. A multi-echo sequence has
          several; a single-echo one has a list of length one.
      acquisition_voxel_size_mm:
        range: ExtractedNumberList
        description: >-
          Original acquisition voxel size [x, y, z] in millimeters, before interpolation or
          resampling.
      number_of_volumes:
        range: ExtractedInteger
        description: >-
          Number of acquired volumes contributing to the recording, when reported; a proxy
