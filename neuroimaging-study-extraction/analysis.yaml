id: https://neurostuff.org/schemas/neuroimaging-study-extraction/analysis
name: neuroimaging-study-extraction-analysis
title: Neuroimaging Study Extraction Analysis Module
description: A reported analysis and the effect it tested.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy_ex: https://neurostuff.org/schemas/neuroimaging-study-extraction/
default_prefix: neurostudy_ex
default_range: string
imports:
  - linkml:types
  - ../extraction-evidence
  - acquisition
  - design
  - task
  - group
  - assessment
  - region
  - analysis_enums
  - analysis_details
classes:
  Analysis:
    description: |-
      A distinct reported inferential map or tested effect, linking its source acquisitions, sample, paradigm context, tested effect, preprocessing, model estimation, inference settings, and source result tables.
      Create one Analysis for each distinct tested effect. Separate Analyses are required when normalized direction, participant-group comparison, method, the pattern of `effect.cells`, seed or connectivity model, decoded variable, component identity, or spatial_scope differ, and when an omnibus effect and its directional post-hoc contrast are both reported. ROI definitions, acquisition summaries, descriptive sample tables, and masks without inferential effects are not Analyses. Nor is a map reported with no inferential test at all -- an ICA or PCA component map presented descriptively, a connectivity matrix given without a test -- there being nothing for such a map to be the effect of.
    attributes:
      local_id:
        range: string
        required: true
      name:
        range: ExtractedString
        required: true
        description: Study-local label for the analysis or inferential result, in the source's
          words.
      definition:
        range: ExtractedString
        required: true
        description: >-
          Precise statement of the tested effect in the source's own words, minimally cleaned.
          Always source-grounded. For an interaction it must state the direction of the interaction
          as the source states it; for an ordered contrast it must keep the ordering that
          the cell directions cannot express.
      prespecification:
        range: ExtractedPrespecification
        required: true
        description: Whether this contrast was planned before the data were seen or arrived
          at afterwards.
      interpretations:
        range: ExtractedStringList
        description: >-
          The source's own statement of what this analysis found and what it means, typically
          in Results and Discussion, verbatim or minimally cleaned. Always source-grounded,
          and the counterpart of `definition`: that field is the Methods-side statement of
          what was tested, this one is the Results/Discussion-side statement of what came
          of it.
      spatial_scope:
        range: ExtractedSpatialScope
        required: true
        description: Spatial domain of the analysis.
      regions:
        range: Region
        multivalued: true
        inlined: false
        description: |-
          The regions the analysis ran over -- its search space, what `spatial_scope: roi` restricts it to. Empty for whole-brain and searchlight, where the emptiness asserts that inference was not restricted.
          Not the analysis's seeds: a whole-brain seed-based analysis has a seed and no search-space region, so putting one here says the opposite of what it did. Seeds are `ConnectivityDetails.seed_regions`.
      defines_regions:
        range: Region
        multivalued: true
        inlined: false
        description: >-
          Regions this analysis produced: a localizer's clusters, or peaks of a contrast later
          used as seeds or ROIs. Populated on the analysis a region came *from*, not on those
          that use it, so a region whose `definition_method` is `same_study_analysis` and
          which another analysis lists in `regions` or `seed_regions` is a circularity the
          record states rather than asserts.
      measure:
        range: Measure
        required: true
        inlined: false
        description: >-
          The scientific quantity of the map, by identifier, independent of the statistic
          used to test it. Analyses of one quantity reference one record; an analysis of a
          different quantity takes its own. Required: a paper vague about what it measured
          still takes a record, with `source_label` as given and `extraction_status: not_reported`
          elsewhere.
      groups:
        range: AnalysisGroup
        multivalued: true
        required: true
        inlined_as_list: true
        description: >-
          The participant cohorts the analysis ran on, and how many participants each contributed.
          Membership only: this slot says which people were analysed, never what was compared.
          A cohort comparison is a pair of directional `Cell`s on the model term whose levels
          name the cohorts, exactly as a condition or occasion comparison is.
      effect:
        range: Effect
        required: true
        inlined: true
        description: What was tested about the map. Universal across every method.
      details:
        range: AnalysisDetails
        required: true
        inlined: true
        description: >-
          The method that produced the map, and its method-specific payload. Which subclass
          is filled states the method. A voxelwise, vertexwise, or ROI-wise GLM, mixed-effects
          model, ANOVA, ANCOVA, or robust regression takes MassUnivariateDetails; a method
          outside the first-class families takes OtherAnalysisDetails and names itself in
          method_label.
      acquisitions:
        range: Acquisition
        multivalued: true
        inlined: false
        description: >-
          Acquisition protocols supplying data to this analysis. Structural, diffusion, and
          other non-paradigm analyses are linked directly through this field.
      tasks:
        range: Task
        multivalued: true
        inlined: false
        description: |-
          The participant paradigms that contextualize this analysis. An analysis can span paradigms, as a cross-task conjunction or a localizer-plus-main-task analysis does.
          A resting-state analysis names its Task here like any other: the resting-state protocol is a paradigm, and a Task record exists for it. What leaves this empty is an analysis with no paradigm at all -- morphometry, diffusion, a static PET scan -- which is linked through `acquisitions` instead.
      model_estimation:
        range: ModelEstimation
        required: true
        inlined: false
        description: >-
          The model this analysis's contrast was taken from: its family, estimator, stage,
          software, and the terms it was specified with. What was selected out of those terms
          is `effect`. Required: a paper that describes a contrast and never names an estimator
          still takes a record, with the terms it does state and `extraction_status: not_reported`
          elsewhere. Analyses sharing one design reference one record; an analysis specified
          or estimated differently takes its own.
      inference_settings:
        range: InferenceSettings
        inlined: false
        description: >-
          The thresholding and correction this analysis was reported under, by identifier.
          Analyses sharing one scheme reference one record; an analysis thresholded or corrected
          differently takes its own. Not the model's -- one fit thresholded two ways is two
          records here and one `model_estimation`.
      tables:
        range: Table
        multivalued: true
        inlined: false
        description: The source tables reporting results for this analysis.
      coordinate_space:
        range: ExtractedString
        description: >-
          Coordinate reference space or template the spatial results are reported in, such
          as MNI152 or Talairach. The fallback of two places this can live: populated only
          when no table of this analysis gives the space. Exactly one of the two is filled,
          never both, so a value here means the tables were silent. Never inferred from the
          model's `spatial_unit` -- an analysis on a surface reports a surface template.
      assessments:
        range: Assessment
        multivalued: true
        inlined: false
        description: Assessments whose measurements were used in or selected the sample for
          this analysis.
      model_representation_notes:
        range: ExtractedString
        description: >-
          Model components that could not be represented or were represented only approximately,
          for an analysis whose method is otherwise first-class. Examples include random slopes,
          latent variables, dynamic connectivity, and dependencies between terms. An analysis
          whose method has no stable structured decomposition at all takes NotStructurableDetails
          instead.
  Effect:
    description: |-
      The inferential quantity tested about a map: what was compared, whether the comparison is a mediated path, and what statistic tested it. Estimation facts -- model family, estimator, stage, software -- belong to the ModelEstimation that produced the map.
      The comparison is `cells`: one entry per level of a model term that entered the contrast, each with the side it sat on. Three things a reader might expect to find here are read off that instead:
      - **what the contrast was adjusted for** -- the terms of the `ModelEstimation`, plus those
        of the stages it reaches through `inputs_from`, minus the terms these cells name.
      - **what the map was tested against** -- a modelled reference is that condition's level
        with a `negative` cell; the unmodelled implicit baseline, or zero, is the absence of a
        second cell; a decoding metric's reference is `PerformanceMetric.reference_value`.
    attributes:
      cells:
        range: Cell
        multivalued: true
        required: true
        inlined_as_list: true
        description: |-
          What this contrast compared: one entry per level of a model term that entered it, each with the side it sat on. The only place direction lives.
          Every cell names its term, so the axis of a comparison is explicit. Two cells naming one term compare levels within that factor; cells naming different terms compare across them. A condition contrast, a cohort comparison, a pre-post change, a crossover comparison of arms and a region-by-condition dissociation all take this one form, and what distinguishes them is what the named term's levels range over, which `FactorLevel` states on the model.
          Required and non-empty. A one-sample test is one signed cell: a lone `positive` cell tests that coefficient against zero, which is what the unmodelled implicit baseline is, and the sign distinguishes activation from deactivation. A map with no inferential test at all is not an Analysis.
      mediation:
        range: Mediation
        inlined: true
        description: >-
          The mediation model this effect's quantity is a path through. Present only for a
          mediation analysis and absent otherwise, so an effect carries either a complete
          Mediation or none.
      statistic:
        range: Statistic
        required: true
        inlined: true
        description: >-
          The statistic this effect was tested with, and its degrees of freedom. Not the value
          of the statistic at any location -- peak magnitudes belong to the reported coordinates.
  Statistic:
    description: >-
      A test statistic and its degrees of freedom. Statistic values -- peak magnitudes, p-values,
      cluster extents -- belong to the reported coordinates.
    attributes:
      family:
        range: ExtractedStatisticFamily
        required: true
        description: >-
          Which statistic was used. Independent of the thresholding procedure: a t-test corrected
          by permutation is still a `t`.
      degrees_of_freedom_numerator:
        range: ExtractedNumber
        description: >-
          Numerator degrees of freedom, normally populated only for f and likelihood_ratio.
          A single-degree-of-freedom statistic leaves this unset, since t(151) is F(1,151).
      degrees_of_freedom_denominator:
        range: ExtractedNumber
        description: >-
          Denominator degrees of freedom, used alone for t, correlation, and chi_square. Both
          are unset for z. Float, so corrected degrees of freedom such as a Greenhouse-Geisser
          adjustment can be recorded as reported.
  Measure:
    description: |-
      The scientific quantity of the map, independent of the statistic used to test it. When a paper alternates terms for the same map -- grey matter concentration in Methods and volume in Results -- take the Methods term for type and keep both wordings in source_label.
      One record may be referenced by several Analyses, so every field must hold for all of them; an analysis of a different quantity takes its own record. The test is mechanical: two analyses share a record when `family`, `type`, `specific_metric` and `unit` all match. A study measures one or two quantities and tests them many ways, so sharing is the common case -- eight analyses of one connectivity measure are one record, not eight.
      Not a property of the thresholding scheme: one correction scheme routinely covers several measures, and one measure is often tested under several schemes. See storage-schema-design-notes.md for the reasoning behind this shape.
    attributes:
      local_id:
        range: string
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      family:
        range: ExtractedMeasureFamily
        required: true
        description: Broad imaging or signal family, for coarse filtering.
      type:
        range: ExtractedMeasureType
        required: true
        description: Normalized quantity, for cross-study queries.
      source_label:
        range: ExtractedString
        description: >-
          The paper's own term for the measure. Unset only when the source does not identify
          the measure.
      specific_metric:
        range: ExtractedString
        description: >-
          Named metric when type is intentionally broad, such as fractional anisotropy, ALFF,
          fALFF, or a specific tracer binding potential.
      unit:
        range: ExtractedString
        description: >-
          The unit the measure is reported in, when the source gives one and it carries information
          -- mm for a thickness, mL for a volume. Omitted for a unitless quantity such as
          a correlation or a normalized index.
  Mediation:
    description: >-
      The mediation model an effect's tested quantity is a path through: which path, and the
      intervening term it runs through. Present only when there is one; the ordinary case
      leaves `Effect.mediation` unset. Both slots are required, so a path always names its
      mediator.
    attributes:
      path:
        range: ExtractedEffectPath
        required: true
        description: >-
          Which path through the mediation model this effect's map is. An effect that is not
          a mediated path has no Mediation, so there is no `not_applicable` case.
      mediator:
        range: ModelTerm
        required: true
        inlined: false
        description: >-
          The intervening term, by identifier. It must be a term of the ModelEstimation the
          containing Analysis names, or of a stage that model reaches through `inputs_from`.
  Cell:
    description: |-
      One side of the tested comparison: a level of a model term, and which way that level entered. The unit a contrast is built from.
      A cell points at a `ModelTerm`. Which cohort, condition, occasion or arm carries a level is a property of the design, held by the term's `FactorLevel`s, so the entity view of a contrast -- which conditions were compared, which cohorts -- is recovered by joining through the model. The `term` is therefore the axis of the comparison: cells sharing a term compare within a factor, cells on different terms compare across them.
      A cell over a term that declares no levels -- a slope, or a product column -- leaves `level` unset and carries its `direction` alone.
    attributes:
      term:
        range: ModelTerm
        required: true
        inlined: false
        description: >-
          The model term this cell belongs to, by identifier. It must be one of the terms
          of the ModelEstimation the containing Analysis references, or of a stage that model
          reaches through `inputs_from` -- a group contrast of a first-level condition, or
          of a seed's time series, is a cell on that stage's term rather than on a copy of
          it.
      level:
        range: ExtractedString
        description: |-
          Which level of that term this cell is, matching a `FactorLevel.level` of the referenced ModelTerm. The level vocabulary is stated on the model, so what is here is only which of them this comparison put on this side.
          Required exactly when the referenced term declares levels, and unset when it does not. A factor declares levels; a slope and a product column declare none, and their cells name none.
      direction:
        range: ExtractedDirection
        required: true
        description: |-
          Which way this cell entered the contrast: for a categorical term the sign of the weight put on this level, for a continuous one the sign of the fitted coefficient, and for a product column the sign of the interaction coefficient.
          Signs, never numeric weights. For an ordered comparison mark the extremes `positive` and `negative`, leave the levels in between out of `cells` -- absence is the zero weight -- and keep the ordering on `FactorLevel.order`.
      label:
        range: ExtractedString
        description: >-
          The source's wording for this level in this comparison, when it differs from the
          level's own label on the model.
  AnalysisGroup:
    description: >-
      One participant cohort the analysis ran on, and how many of its participants it included.
      Membership and sample size only. A comparison *between* cohorts is a pair of directional
      `Cell`s on the term whose levels name them.
    attributes:
      group:
        range: Group
        required: true
        inlined: false
        description: >-
          The cohort this entry refers to, by identifier. The cohort's own properties are
          on the Group record.
      n:
        range: ExtractedInteger
        description: >-
          Number of participants from this cohort included in this analysis. This is where
          a cohort's analysed size lives -- Group carries the recruitment funnel down to acquisition
          and nothing past it -- so populate it whenever the source gives a number, and expect
          it to be smaller than the acquired count when an analysis drops participants for
          motion or missing data.
  Preprocessing:
    description: >-
      An ordered preprocessing pipeline applied to acquired data before or as part of statistical
      modeling. This can be expanded with COBIDAS.
    attributes:
      local_id:
        range: string
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      description:
        range: ExtractedString
        description: Narrative overview of the pipeline, its inputs, outputs, and intended
          purpose.
      software:
        range: ExtractedStringList
        description: Software packages or methods used, including version and revision identifiers.
      steps:
        range: ExtractedStringList
        description: >-
          Ordered free-text preprocessing operation names, listed in execution order; examples
          include slice-timing correction, motion correction, distortion correction, spatial
          normalization, and smoothing. The smoothing kernel itself is `smoothing_fwhm_mm`
          rather than a phrase in this list, because it is the one preprocessing parameter
          a synthesis filters on.
      smoothing_fwhm_mm:
        range: ExtractedNumberList
        description: >-
          Full width at half maximum of the applied spatial smoothing kernel, in millimetres:
          a list of one value for an isotropic kernel and of three for an anisotropic [x,
          y, z] one. Record 0 when the source states that no smoothing was applied.
  ModelEstimation:
    see_also:
      - https://cdisc-org.github.io/analysis-results-standard/
      - https://bids-standard.github.io/stats-models/spec.html
      - https://nidm.nidash.org/specs/nidm-results_120.html
    description: |-
      How a model was specified in software and estimated: its terms, the family, the source's wording for it, the estimator, the stage, the software, the pipeline that produced the data it was fitted to, and the spatial element it was fitted over. One record may be referenced by several Analyses, so every field must hold for all of them; an analysis specified or estimated differently takes its own record. **The data a model was fitted to is part of its specification**.
      One record is one estimation stage. Neuroimaging splits a model across stages for tractability, and `inputs_from` is what puts it back together: a stage's terms are its own plus those of the stages it consumed, so the split costs the record nothing while each stage keeps its own family, estimator, software and basis.

      The test for whether two analyses share a record is mechanical: list the columns each was fitted with. A different dependent variable, a different covariate set, or a different subset of participants means a different design matrix and therefore a separate record, even when family, estimator and software are identical. Two BPM regressions of the same measure on the same regressor, one over the patients and one over patients and controls pooled, are two records.
      Sharing one record across matrices is not a tidy simplification. Because a contrast's adjustment set is *derived* -- the model's terms minus the terms its cells name -- one record behind several matrices makes every one of them claim adjustments that were never in the model that produced it, and nothing in the record contradicts it.
    attributes:
      local_id:
        range: string
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      model_family:
        range: ExtractedModelFamily
        required: true
        description: >-
          Normalized statistical model family, which is the queryable form. Required, so a
          paper that never says still carries the slot, as `extraction_status: not_reported`.
          A method the vocabulary cannot name -- ICA, representational similarity, a decoder
          -- is written here as free text; the Analysis.details subclass also identifies the
          method.
      model_type:
        range: ExtractedString
        required: true
        description: >-
          The source's own wording for the model, minimally cleaned, such as mass- univariate
          GLM, meta-analysis, multivariate, predictive model, ICA, or representational similarity
          analysis.
      hrf_model:
        range: ExtractedString
        description: >-
          The haemodynamic response basis the design matrix was built with: a canonical HRF,
          a canonical plus temporal or dispersion derivatives, an FIR or gamma basis, or a
          named alternative. Unset for a measure that models no timeseries -- morphometry,
          diffusion, static PET.
      model_settings:
        range: ExtractedString
        description: >-
          Essential estimator, variance, autocorrelation, covariance, regularization, and
          software-specific settings.
      stage:
        range: ExtractedString
        required: true
        description: |-
          Stage of analysis, in the source's terms: run, session, subject and group are the usual words, and any other the source uses is storable as written. Deliberately left open -- no vocabulary fits every design, and nothing derives anything from it.
          A label, not an ordering. Which stage fed which is `inputs_from`, and only `inputs_from`: two records both saying `group` say nothing about their relation, and a chain is never inferred from these strings.
      estimator:
        range: ExtractedString
        description: >-
          Estimation method, such as OLS, WLS, maximum likelihood, restricted maximum likelihood,
          permutation, or Bayesian estimation.
      software:
        range: ExtractedString
        description: Statistical software name, version, and relevant implementation details.
      spatial_unit:
        range: ExtractedSpatialUnit
        description: |-
          The element this model was fitted over. Distinct from the Analysis's `spatial_scope`, which gives the extent rather than the element: a whole-brain model can be voxelwise or vertexwise, and a model over an ROI can average the region or test its parcels. Record it rather than inferring it from `coordinate_space`.
          A model fitted over a different element is a different model, so a voxelwise GLM and an ROI-mean ANOVA of the same design take two records: no contrast of one can be read off the other's fit.
      preprocessing:
        range: Preprocessing
        multivalued: true
        inlined: false
        description: |-
          The pipelines that produced the data this model was fitted to. Every Analysis referencing this record came through them, so a model fitted to differently prepared data -- unsmoothed images for a classifier, smoothed ones for a mass-univariate fit -- takes its own record rather than sharing one.
          More than one entry when the fit consumed more than one kind of image: a multimodal regression of perfusion on grey-matter volume was fitted to the output of both pipelines, and naming either alone says the other's smoothing and normalisation did not touch the map.
      inputs_from:
        range: ModelEstimation
        multivalued: true
        inlined: false
        description: |-
          The models whose fitted output this model was estimated on: the first-level GLM whose contrast images a group model takes as its data, the subject-level fit an ROI ANOVA summarises. The stage graph, recorded only where the source states it.
          **A model's terms are its own plus, transitively, those of the models named here.** That combined list is what `terms` would be had the analysis been fitted in one step.
          Leave it empty when the source describes one design matrix, and when it describes the lower stage too thinly to constitute a model. Empty is not a claim that no lower stage existed; it is the absence of a statement about one, exactly as an unrecorded term is.
          Must be acyclic, no model may reach itself.
      terms:
        range: ModelTerm
        multivalued: true
        inlined_as_list: true
        description: |-
          The terms **this stage** was specified with -- the columns of its design matrix, in the general sense that covers a GLM's regressors and the predictors of any other family. Stated once here however many contrasts are taken from them, and never restated on a stage above: the terms of a lower stage are reached through `inputs_from`.
          Record every term the source states, including ones no reported contrast tests, and including ones mentioned only in passing: "controlling for age and sex" is a statement about the design matrix. This list, together with the lists reached through `inputs_from`, is **the adjustment set of every contrast taken from this model** -- each contrast's is that combined list minus the terms its cells name -- so a term omitted from every stage reads as one the model did not adjust for. Where the list is incomplete, the slot's extraction_status is what says so.
          May be empty, and legitimately is for a stage that fits only an intercept: a one-sample group test over first-level contrast images has no column of its own. Do not invent an intercept term to fill it.
          Analyses whose design matrices differ take their own records rather than sharing one.
  ModelTerm:
    description: |-
      One term of the model: a column of the design matrix, or the equivalent predictor in a family with no design matrix. A categorical term names its levels and the entities carrying them; a continuous term carries the facts that make a slope interpretable. Nothing here is a fact about any one contrast -- what a contrast did with this term is a `Cell` on that contrast's Effect. A term with no cell on some contrast is a term that contrast was adjusted for rather than tested.

      A term is something the measure was regressed *on*. The quantity being modelled is `Analysis.measure` and never a term of the model that models it. A table laid out with one row-block per measured parameter -- four diffusion parameters, three frequency bands -- is reporting one analysis per parameter over one measure each, not one analysis over a factor whose levels are the parameters.
    attributes:
      local_id:
        range: string
        required: true
        description: >-
          Stable identifier, referenced by an Effect's `cells` and its `mediation.mediator`,
          and by `interaction_with`.
      name:
        range: ExtractedString
        required: true
        description: |-
          Term label, unique within the model: a name appearing twice is one term recorded twice. For a categorical term this is the factor's identity.
          Often a label the source never writes. A paper reporting 1-back, 2-back and 3-back conditions states the levels and states that they vary together, but frequently names no axis; `load` is then a name supplied for a grouping the source does make. That is permitted, within two limits: the levels must be source-stated, and the name must not assert a comparison or a construct the paper does not.
      type:
        range: ExtractedTermType
        required: true
        description: |-
          Whether the term is categorical or continuous. Categorical when the column distinguishes named cells of the design -- occasions, cohorts, conditions, arms, regions -- whether or not the paper names the axis; `levels` is then required. Continuous when the column carries a measured value and the model fits a slope.
          Small as it is, this field settles four others: whether `levels` exists, whether a `Cell` here takes a `level`, whether the term can be crossed, and which branch of the derived kind fires. A term recorded continuous is one no contrast can be built across.
          **A term whose name states a comparison -- `pre > post`, `A versus B` -- is almost always a categorical factor written down from its contrast's side.** The design matrix distinguished two occasions, cohorts or conditions; the paper labelled the difference and left the axis unnamed. Record the factor with a level per side and let the cells carry the direction (`representing-models.md` §5.6). Collapsed into one continuous column, nothing says what was compared and the effect reads as a slope.
          The exception is a column genuinely holding one number per participant -- a difference score, a percent change entered as a covariate. That is continuous, and `source_definition` records the subtraction it came from.
      levels:
        range: FactorLevel
        multivalued: true
        inlined_as_list: true
        description: >-
          The levels of a categorical term, and for each the entities carrying it. This is
          the whole of what a factor is: its level vocabulary, and which cohort, condition,
          occasion, or arm occupies each cell. Record a level the source names even when no
          reported contrast uses it -- a three-level factor contrasted at two levels is still
          a three-level factor. Empty for a continuous term.
      assessment:
        range: Assessment
        inlined: false
        description: |-
          The assessment whose measurements supply a continuous term, **including when the column is derived from them rather than being one of them**: a change score, a percent change, a composite of subscales, a residualized score. The instrument is still where the values came from, and one administration or several makes no difference to that -- `region` says the same by example, an ROI mean and a PPI regressor both naming their region.
          One instrument, one record, however many columns it supplies: two subscale scores of one questionnaire each name it, and which subscale a column carries is the term's `name`.
          Unset only when the values come from somewhere the study does not record as an Assessment -- age, dose, a motion parameter, cardiac phase, scanner drift -- in which case `source_definition` names the origin. A term with neither is a column whose origin the record does not state.
      region:
        range: Region
        inlined: false
        description: |-
          The region whose signal supplies this term: a seed timecourse, an ROI mean covariate, a PPI physiological regressor. The counterpart of `assessment` for a column drawn from a place in the brain rather than an instrument.
          Singular, so it does not serve a factor that *compares* regions: that is one term with several levels, and the regions hang off `FactorLevel.regions`.
      variation_level:
        range: ExtractedVariationLevel
        description: |-
          Whether this term moves within a participant or only across the sample. Populate it for **any** term: a repeated-measures factor is within-subject and a diagnosis factor is between-subject in exactly the sense a trial-wise modulator and an age covariate are.
          For a continuous term it is what separates a parametric modulation from a cross-subject regression, and the derived kind of any effect testing it reads this on that basis. For a categorical factor it feeds no derivation, so setting it changes no other value; it is the factor's scope, and two studies that crossed a factor within participants and between them did not estimate the same thing.
          A categorical factor's levels usually settle it, and the two should agree: levels naming `groups` are between-subject, since a participant belongs to one cohort; levels naming `timepoints` are within-subject, since an occasion is when the same people were measured again; levels naming `conditions` are within-subject in the ordinary repeated-measures case; levels naming `arms` follow `StudyDesign.assignment_structure`, crossover being within and parallel between.
          A level the vocabulary cannot name is written here as free text; the derived kind then cannot choose between a modulation and a regression, so it is undetermined for that record rather than wrong.
      functional_form:
        range: ExtractedFunctionalForm
        description: |-
          Shape of the term's relationship to the measure. A squared term with a negative coefficient is an inverted-U relationship, not a negative association, so non-linear and transformed terms must not be recorded as linear. A model fitting both a linear and a quadratic form of the same measurement has two terms, not one.
          Not where a product is recorded: a non-empty `interaction_with` is what makes a column a product.
      interaction_with:
        range: ModelTerm
        multivalued: true
        inlined: false
        description: |-
          The other terms this term is a product of -- what makes this column an interaction column. Populate it when the source names an interaction term in one model; leave it empty when the source describes a regression on a contrast.
          The terms it may name are those of this model and of the stages it reaches through `inputs_from`, which is how a group stage crosses a cohort factor with a first-level condition: the product column is declared where it was fitted and names the lower stage's column directly.
          A crossing of two factors is normally read off the cells, since a factor compared against itself carries a positive cell and a negative one. A continuous term has no levels and so cannot be crossed that way, which makes this slot the only record of a moderation such as `age x group`; the derived kind reads it before `variation_level`.
          A product of terms that are all categorical and all crossed is legal but decides nothing, the crossed cells already saying what it says, and is flagged for review.
          A product column declares no `levels`, so a cell on it names none. Such a column is not a covariate of a contrast whose cells name all of its components.
      unit:
        range: ExtractedString
        description: >-
          The unit a continuous term is measured in, when the source gives one -- years for
          age, mg for a dose. It is what makes a reported slope interpretable.
      source_definition:
        range: ExtractedString
        description: |-
          The source's own definition of the term, and the origin of a continuous term that no Assessment supplies, such as age, dose, a motion parameter, cardiac phase, or scanner drift.
          **Required for a derived column, whatever its `assessment` says.** A change score names its instrument in `assessment` and its derivation here, in the source's own words and including the occasions it spans -- "percent reduction in BDI, (post-pre)/pre, from baseline to post-treatment". Nothing else can carry those occasions: `FactorLevel.timepoints` names the occasions a factor *compares*, and a derived column has no levels to hang them on, so where a study has several post-intervention occasions this is the only thing separating a change to the endpoint from a change to a later follow-up.
          Not the shape of the fitted relationship, which is `functional_form`: a percent change entered linearly is a linear term computed from a difference, so recording the construction as the form would lose whether the fit was linear or quadratic. A transform *of the measure* the vocabulary cannot name still goes in functional_form.
  FactorLevel:
    description: |-
      One level of a categorical model term, and the entities that carry it. Which cell of the design a cohort or condition occupies is a property of the design rather than of any contrast drawn from it, so it is held here on the ModelTerm.
      The five entity slots are what make the entity view of a contrast recoverable: an Effect's cells name levels, and joining those levels here says which cohorts, conditions, occasions, arms or regions were compared. A factor normally ranges over one of the five -- conditions for a task factor, cohorts for a participant factor, regions for one comparing places in the brain -- so the others stay empty; a level realized by a crossing, such as a drug given at follow-up, fills more than one.
      A factor whose levels are not entities of the study at all -- hemispheres, tasks, frequency bands, acquisition sessions -- leaves all five empty and is carried by `level` alone. Such a factor is complete, and takes `Cell`s like any other.
    attributes:
      level:
        range: ExtractedString
        required: true
        description: >-
          The level's label, as the source words it. Unique within its term: a level appearing
          twice is one level recorded twice.
      order:
        range: ExtractedInteger
        description: |-
          Position of this level in the factor's sequence, counting from 1, for a factor whose levels are ordered. It carries an ordering `Effect.cells` cannot: a contrast signs only its extremes and omits what lies between, so without this 1-back, 2-back and 3-back are an unordered set.
          Populate it whenever the levels have an order the source states or plainly implies -- a dose series, a load or difficulty series, an ordinal severity grading. Leave it unset for a nominal factor, where imposing an order would assert a structure the design does not have. Timepoint.order is the same device for occasions.
      conditions:
        range: Condition
        multivalued: true
        inlined: false
        description: The conditions carrying this level, by identifier.
      groups:
        range: Group
        multivalued: true
        inlined: false
        description: The participant cohorts carrying this level, by identifier.
      timepoints:
        range: Timepoint
        multivalued: true
        inlined: false
        description: The occasions carrying this level, by identifier.
      arms:
        range: Arm
        multivalued: true
        inlined: false
        description: The arms carrying this level, by identifier.
      regions:
        range: Region
        multivalued: true
        inlined: false
        description: >-
          The brain regions carrying this level, by identifier, for a factor comparing places.
          A three-region factor is one `ModelTerm` with three levels, one region on each.
  InferenceSettings:
    description: |-
      One thresholding and correction procedure. This is the canonical storage home for thresholding, correction, and cluster-inference metadata. The test statistic itself belongs to the tested effect and lives in Effect.statistic.
      One record may be referenced by several Analyses, so every field must hold for all of them; an analysis thresholded or corrected differently takes its own record. The test is mechanical: two analyses share a record when the threshold, its type, the correction method, the scope corrected over and the alpha are all the same. A paper that states one correction scheme in Methods and applies it throughout has one record.
      Inference attaches to the analysis, not to the fit: one model estimated once is often thresholded several ways -- an ROI test Bonferroni-corrected over four regions and a searchlight over the same fit corrected by FDR. See storage-schema-design-notes.md for the reasoning behind this shape.
    attributes:
      local_id:
        range: string
        required: true
        description: Stable identifier used by Analysis foreign-key references.
      inference_level:
        range: ExtractedString
        description: >-
          Level at which inference is made, such as voxel, vertex, cluster, region, network
          or other.
      voxelwise_threshold_value:
        range: ExtractedNumber
        description: Numeric voxelwise or vertexwise threshold before correction or cluster
          formation.
      voxelwise_threshold_type:
        range: ExtractedString
        description: Meaning of voxelwise_threshold_value, such as p, q, t, z, or F.
      cluster_forming_threshold_value:
        range: ExtractedNumber
        description: Numeric threshold used to form candidate clusters.
      cluster_extent_threshold:
        range: ExtractedInteger
        description: Minimum surviving cluster extent in voxels, vertices, or the unit stated
          in the source.
      clusterwise_threshold_value:
        range: ExtractedNumber
        description: Numeric cluster-level threshold for retaining clusters.
      multiple_comparison_method:
        range: ExtractedString
        description: Correction method, such as FWE, FDR, Bonferroni, permutation, Monte Carlo,
          or none.
      correction_scope:
        range: ExtractedString
        description: >-
          Domain over which correction was applied, such as whole brain, ROI set, hemisphere,
          or mask.
      search_volume:
        range: ExtractedString
        description: Reported search volume, mask size, or number of vertices or voxels used
          for inference.
      neighborhood_definition:
        range: ExtractedString
        description: Voxel or vertex adjacency or connectivity rule used for cluster formation.
      tfce_used:
        range: ExtractedBoolean
        description: Whether threshold-free cluster enhancement was used.
      tfce_parameters:
        range: ExtractedString
        description: TFCE parameters such as height and extent exponents when reported.
      permutation_count:
        range: ExtractedInteger
        description: Number of permutations, randomizations, or simulations used for inference.
      alpha_level:
        range: ExtractedNumber
        description: Family-wise, false-discovery, or nominal alpha threshold when reported.
      number_of_tests:
        range: ExtractedInteger
        description: Number of statistical tests considered by the multiple-comparison procedure.
  Table:
    description: >-
      A publication table that supplies coordinates, statistics, or contextual metadata. Raw
      cell structure and point-level provenance may remain in the repository's coordinate-table
      representation and be linked with source_path.
    attributes:
      local_id:
        range: string
        required: true
        description: Stable table identifier used by Analysis foreign-key references.
      table_number:
        range: ExtractedString
        description: Printed identifier such as Table 2 or Supplementary Table S4.
      title:
        range: ExtractedString
        description: Table title, when distinct from the caption.
      caption:
        range: ExtractedString
        description: Table caption describing the table's contents.
      footer:
        range: ExtractedString
        description: Table notes, abbreviations, threshold statements, and footnotes.
      column_headings:
        range: ExtractedStringList
        description: Ordered leaf column headings retained to aid interpretation of extracted
          values.
      description:
        range: ExtractedString
        description: Summary of the table contents and its role in the reported analyses.
      non_analysis_content:
        range: ExtractedTableContent
        description: |-
          What this table's rows are, filled only when they are not the foci of a reported effect: region or ROI definitions, atlas parcels, connectivity seeds, the peaks of a decomposition's components, coordinates cited from other papers, a stimulus list, demographics, descriptive statistics with no test. Leave it absent when the table reports results, which is the common case.
          A coordinate table is not an analysis merely by having coordinates in it, and this is the only field that can say so. Filling it is what distinguishes a table deliberately not encoded as an analysis from one the extraction missed -- without it those two are the same absence, and the coordinates belong on the entity they locate (a Region's description) rather than on a contrast that never produced them.
