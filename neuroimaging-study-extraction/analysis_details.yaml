id: https://neurostuff.org/schemas/neuroimaging-study-extraction/analysis_details
name: neuroimaging-study-extraction-analysis-details
title: Neuroimaging Study Extraction Analysis Details Module
description: |-
  Method-specific payloads for an Analysis: the fields that only make sense for one family of method. Exactly one subclass of AnalysisDetails applies to an Analysis, and which one is filled states the method.
  These classes carry method specifics only. What was tested about the map always lives in Effect, whatever the method, so a connectivity, decoding, RSA, or component analysis states its tested effect in exactly the same fields a voxelwise GLM does.
  This module must not import the analysis module: Analysis.details ranges on AnalysisDetails, so the dependency runs the other way. Shared vocabularies therefore live in analysis_enums, and ConjunctionComponent references a sibling analysis by plain id.
  See storage-schema-design-notes.md for the reasoning behind this shape.
prefixes:
  linkml: https://w3id.org/linkml/
  neurostudy_ex: https://neurostuff.org/schemas/neuroimaging-study-extraction/
default_prefix: neurostudy_ex
default_range: string
imports:
  - linkml:types
  - ../extraction-evidence
  - analysis_enums
  - task
  - region
classes:
  AnalysisDetails:
    abstract: true
    description: >-
      Base class for the method-specific payload of one Analysis, instantiated only through
      its subclasses. Analysis.details is required, so exactly one subclass always applies.
    attributes:
      details_type:
        range: string
        required: true
        designates_type: true
        description: >-
          The concrete details subclass carried by this payload. Populated from the class
          itself, not extracted.
  MassUnivariateDetails:
    is_a: AnalysisDetails
    description: |-
      Payload for a voxelwise, vertexwise, or ROI-wise GLM, mixed-effects model, ANOVA, ANCOVA, or robust regression -- the default family. It adds no fields: what was tested is in Effect and how it was estimated is in ModelEstimation.
      A voxelwise **mediation** analysis is one of these. Each path it reports is estimated by regression, so the fit is mass-univariate and what makes the map a mediation is `Effect.mediation` -- the path tested, and the term it runs through. Reaching for OtherAnalysisDetails because the word "mediation" has no first-class payload leaves `Effect.mediation` empty, and an indirect-effect map with no path recorded is indistinguishable from a plain regression on the same predictor.
    attributes: {}
  DecodingDetails:
    is_a: AnalysisDetails
    description: |-
      Payload for a classification or pattern-discriminability analysis. Above-chance decoding is one signed cell with nothing crossed, and the reference it beat is `PerformanceMetric.reference_value`, which is per metric because accuracy against chance and AUC against 0.5 are two references. A between-cohort accuracy comparison is a crossed cohort term; accuracy regressed on a behavioural score is a cell on a continuous term. Spatial scope is recorded on the Analysis, including for searchlight analyses.

      "One signed cell" means exactly one. The class the reported accuracy is *for* takes the positive cell and the other class takes no cell at all, because absence is the zero weight. Signing both would say the paper reported which way the classifier erred, which a single accuracy does not. Where the test is undirected -- accuracy against chance, with no class named as the target -- every cell is `undirected` instead.
      `classes` is then the only field saying what was told apart, so leaving it empty asserts that the paper never named the classes it decoded, which is rare.
    attributes:
      decoded_variable:
        range: ExtractedString
        required: true
        description: The variable the classifier or discriminability test predicted.
      classes:
        range: DecodingClass
        multivalued: true
        inlined_as_list: true
        description: >-
          The classes discriminated. These are non-directional: direction, where it exists,
          is carried by Effect.
      performance_metrics:
        range: PerformanceMetric
        multivalued: true
        required: true
        inlined_as_list: true
        description: >-
          The performance measures reported for this map, one entry each. Papers routinely
          give several of the same analysis -- accuracy with sensitivity and specificity,
          or accuracy with AUC -- and each carries its own value and its own reference. Record
          every one the source reports.
      validation_scheme:
        range: ExtractedString
        description: Cross-validation or resampling scheme, such as leave-one-run-out.
      generalization:
        range: ExtractedString
        description: Train/test split for cross-decoding, when the analysis generalized across
          sets.
  PerformanceMetric:
    description: One reported performance measure of a decoding analysis, and its value.
    attributes:
      name:
        range: ExtractedString
        required: true
        description: >-
          The measure as the source names it, such as accuracy, balanced accuracy, AUC, d-prime,
          sensitivity, specificity, or a correlation between predicted and observed scores.
      value:
        range: ExtractedNumber
        description: >-
          The value as reported, in the source's own scale: a percentage and a proportion
          are both recorded as written rather than converted, since the scale is not always
          stated and converting would invent precision.
      reference_value:
        range: ExtractedNumber
        description: >-
          Numeric reference this measure was compared against, when reported -- chance for
          an accuracy, zero for a correlation. Each measure carries its own: accuracy against
          chance and AUC against 0.5 are two references, not one. `relation` says which side
          of it the measure fell on.
      relation:
        range: ExtractedPerformanceRelation
        description: Direction of this measure relative to its own reference_value.
  DecodingClass:
    description: One class discriminated by a decoding analysis.
    attributes:
      label:
        range: ExtractedString
        required: true
        description: The class label as the source names it, such as `faces` or `left hand`.
      condition:
        range: Condition
        inlined: false
        description: The experimental condition this class corresponds to, when it is one.
  SimilarityDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a representational-similarity analysis. The direction of a model-brain association
      is a continuous ModelTerm on the analysis's ModelEstimation, with the model RDM as the
      term, tested by the Effect through a `Cell`. Before choosing this family, check that
      the association is at the RDM level: a similarity regressor entered into a univariate
      GLM is a parametric modulation, not RSA.
    attributes:
      model:
        range: ExtractedString
        description: >-
          The model RDM tested. Unset for a genuinely model-free test, such as within- versus
          between-category pattern similarity, or dissimilarity against zero -- a single signed
          cell rather than a comparison.
      neural_representation:
        range: ExtractedString
        description: How the neural pattern was defined, such as the voxel set or time window
          used.
      similarity_metric:
        range: ExtractedString
        description: >-
          Similarity or distance metric. The RDM distance metric and the model-brain association
          method are different facts, and crossnobis values are not comparable with correlation-distance
          values.
      competing_models:
        range: ExtractedStringList
        description: Other models the reported model was compared against.
  ConnectivityDetails:
    is_a: AnalysisDetails
    description: |-
      Payload for an analysis of a relationship between regions, whether that relationship is estimated from a signal or across subjects. Signal-based connectivity is the common case; structural covariance -- correlating cortical thickness or volume between a seed region and every other, across participants rather than within one -- shares the same shape of answer, so it takes this payload with `structural_covariance` as its method.
      Nothing here carries direction. The sign of the connectivity parameter, and whether the experimental effect raised or lowered it, are what the analysis tested, so they are `Effect.cells` like the direction of any other result: a negative PPI is a `negative` cell on the term the coupling was estimated for, and coupling higher in one condition than another is that condition term crossed. A sign recorded here as well would be a second route to one fact, and the two can disagree -- a whole-map `increased` beside a pair of crossed cells says the map has one direction and two at once.
    attributes:
      connectivity_method:
        range: ExtractedConnectivityMethod
        required: true
        description: Method used to estimate connectivity.
      seed_regions:
        range: Region
        multivalued: true
        inlined: false
        description: >-
          Seed or source regions, by identifier. What each one is and how it was delimited
          is on the `Region`; naming it here says only that this analysis seeded from it.
      target_regions:
        range: Region
        multivalued: true
        inlined: false
        description: Target regions, by identifier. Empty for a seed-to-whole-brain analysis.
      edges:
        range: ConnectivityEdge
        multivalued: true
        inlined_as_list: true
        description: Named region pairs, when the source reports specific edges.
      modulatory_input:
        range: ExtractedString
        description: Modulatory input of the model, for DCM and related methods.
      inference_target:
        range: ExtractedInferenceTarget
        description: >-
          What the statistical test was about: the strength of a connection, which of several
          models fits better, or a network taken as a whole. A model comparison and a parameter
          test answer different questions and are not poolable.
  ConnectivityEdge:
    description: One reported connection between two named regions.
    attributes:
      source_region:
        range: Region
        inlined: false
        description: Source region of the edge, by identifier.
      target_region:
        range: Region
        inlined: false
        description: Target region of the edge, by identifier.
  ConjunctionDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a conjunction. The conjunction's own cells describe the conjoint effect,
      so its kind derives like any other; what each component was in its own right is on that
      component's `analysis_type` and `definition`, which is where a conjunction over unlike
      components records the difference.
    attributes:
      components:
        range: ConjunctionComponent
        multivalued: true
        inlined_as_list: true
        description: The independently defined effects that were combined.
      null_hypothesis:
        range: ExtractedNullHypothesis
        description: Which null hypothesis was tested. Only the conjunction null licenses
          the strong reading.
      implementation:
        range: ExtractedConjunctionImplementation
        description: >-
          Procedure that computed the conjunction, recorded separately from the hypothesis
          it tested.
  ConjunctionComponent:
    description: One component effect of a conjunction, carrying its own direction in its
      definition.
    attributes:
      analysis_id:
        range: ExtractedString
        description: >-
          Identifier of the sibling Analysis record for this component, when it is separately
          reported.
      analysis_type:
        range: ExtractedAnalysisType
        description: >-
          The component's own method, when it is known and differs from the others. A method
          the vocabulary cannot name is written here as free text.
      definition:
        range: ExtractedString
        required: true
        description: Source-grounded statement of the component effect, including its direction.
  LatentDecompositionDetails:
    is_a: AnalysisDetails
    description: |-
      Payload for an analysis whose map is one component or latent variable of a decomposition -- ICA, PCA, NMF, PLS, CCA, and the multimodal fusion methods. Covers a component whose map or loading was *tested*: compared between cohorts, correlated with behaviour, or otherwise given an inferential result. A component map presented descriptively with no test is not an Analysis, so it takes no record here. Being representable here does not imply eligibility for coordinate-based meta-analysis.
      One analysis reports one component: a second latent variable or component from the same decomposition is a second Analysis.
      One invariant LinkML does not express, so the structural validator carries it: `crossblock_covariance_percent` is meaningless when `second_block` is `[none]`, there being no second block for the covariance to cross. `variance_explained_percent` is permitted either way, since a two-block decomposition may still report how much of the brain block its component captures.
    attributes:
      method:
        range: ExtractedDecompositionMethod
        required: true
        description: >-
          The algorithm that produced the components, which decides what their values and
          signs mean.
      second_block:
        range: ExtractedSecondBlockList
        required: true
        description: |-
          What the brain block was decomposed against, one value per additional block, and the primary filter on this payload. `[none]` for a decomposition of the brain data alone, which is a positive assertion rather than an empty slot.
          Multivalued because papers cross more than two blocks: a three-modality mCCA+jICA carries `other_imaging_modality` twice, and a design-plus-behaviour PLS carries `[design, behavioral]`. Name the blocks, never their number.
      second_block_assessments:
        range: Assessment
        multivalued: true
        inlined: false
        description: >-
          The measures forming a behavioural or clinical block, by identifier, when they are
          `Assessment` records of this study. Empty when the second block is the design, another
          imaging modality, or anything else that is not an assessment -- those are named
          in `second_block_detail`.
      second_block_detail:
        range: ExtractedStringList
        description: >-
          What each non-assessment block held, in the source's words: the seed regions of
          a seed decomposition, the modalities of a fusion ("ALFF, FA, grey matter"), the
          genotype array of a parallel ICA ("367 SNPs"). Free text because the range of things
          that form a second block is open, and a SNP array is neither an `Assessment` nor
          an `Acquisition` of this study.
      component_id:
        range: ExtractedString
        required: true
        description: >-
          Identifier of the component or latent variable within the decomposition, as reported
          -- commonly an index such as `IC12` or `LV1`. Required because without it two analyses
          from one decomposition are indistinguishable.
      component_label:
        range: ExtractedString
        description: >-
          The source's name for the component, such as a network label, or for what a latent
          variable captures.
      total_components:
        range: ExtractedInteger
        description: Number of components or latent variables the decomposition produced.
      dimensionality_selection_method:
        range: ExtractedString
        description: >-
          How the number of components was chosen, as reported -- minimum description length,
          a variance-retained cutoff, a scree criterion, permutation on the singular values,
          or a fixed a priori number.
      selection_criterion:
        range: ExtractedString
        description: How this component was selected for reporting.
      variance_explained_percent:
        range: ExtractedNumber
        description: >-
          Percentage of the brain block's variance this component accounts for, as reported.
          Not interchangeable with `crossblock_covariance_percent`: one is variance within
          a block and the other covariance between blocks, and averaging across the two would
          combine incomparable quantities.
      crossblock_covariance_percent:
        range: ExtractedNumber
        description: >-
          Percentage of crossblock covariance this latent variable accounts for, as reported.
          The nearest thing a two-block decomposition has to an effect size, and what a paper
          uses to justify reporting one latent variable and not another. Unset when `second_block`
          is `[none]`, there being no second block to cross.
      map_quantity:
        range: ExtractedMapQuantity
        description: >-
          What the values of the reported map represent -- a loading, a weight, a PLS salience,
          a standardized score.
      salience_threshold:
        range: ExtractedString
        description: >-
          The criterion deciding which elements count as reliable contributors, as reported
          -- conventionally a bootstrap ratio cutoff such as "|BSR| > 3.0", or a standardized
          cutoff such as "|Z| > 3.5". Not `InferenceSettings`: a bootstrap ratio is a stability
          measure and not a test statistic, so reading it as a voxelwise threshold would misstate
          the inference.
      polarity_semantics:
        range: ExtractedPolaritySemantics
        description: >-
          Whether the sign of the reported map carries meaning. A latent variable's sign is
          arbitrary up to a flip, and so is an independent component's, so a paper must say
          what positive means before a direction can be pooled.
  OtherAnalysisDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for a method outside the first-class families. Available for any analysis, so
      an unusual design never has to delete true terms in order to validate.
    attributes:
      method_label:
        range: ExtractedString
        required: true
        description: >-
          The method's name as the source gives it. This is the only record of what the method
          was, so write what the paper calls it rather than a paraphrase.
      structured_details:
        range: ExtractedString
        description: JSON-encoded method-specific payload, when the method has structure worth
          keeping.
      reason_first_class_type_not_used:
        range: ExtractedString
        required: true
        description: Why no first-class details subclass fits this method.
  NotStructurableDetails:
    is_a: AnalysisDetails
    description: >-
      Payload for an effect that is grounded in the source but has no stable structured decomposition.
      Analysis.definition remains required, so the meaning survives even though the structure
      does not.
    attributes:
      reason:
        range: ExtractedNotStructurableReason
        required: true
        description: >-
          Which kind of obstacle prevented structuring, from a short vocabulary. Pairs with
          `explanation`, which says what specifically was lost.
      explanation:
        range: ExtractedString
        required: true
        description: >-
          What specifically could not be represented, in the source's own terms. The reason
          gives the category; this gives the instance, so a reader can judge whether the effect
          is usable.
