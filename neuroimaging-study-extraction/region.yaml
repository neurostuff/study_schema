classes:
  Region:
    description: >-
      A brain region the study delimited and used: a connectivity seed or target, the search
      space an analysis was restricted to, a level of a factor comparing regions, or the signal
      a model term carries. Declared once and referenced from each, because the same seed
      written separately in each place is three spellings nothing can join.
    attributes:
      local_id:
        range: string
        required: true
        description: Stable identifier.
      name:
        range: ExtractedString
        required: true
        description: >-
          The region as the source names it -- aSCC, left dlPFC parcel, salience network.
          Its own words: normalization to an anatomical vocabulary happens downstream and
          needs the original to map from.
      definition_method:
        range: ExtractedRegionDefinition
        required: true
        description: |-
          How the region was delimited, which is a statement about independence: one drawn from the study's own prior contrast is not independent of an effect tested inside it. Per region, since one analysis may use an atlas mask and a functional ROI at once. Required, so a source that does not say still carries the slot, as `extraction_status: not_reported`.

          Two values are routinely confused and the difference is the entire point of the field. `functional_localizer` means a *separate* acquisition or run whose only purpose was to locate the region, independent of the effect later tested in it. A region that is a peak, a cluster, or a component of one of *this paper's own* analyses is `same_study_analysis` however functionally it was defined -- and that value is what makes the circularity visible, which is why `Analysis.defines_regions` exists to name the analysis it came from. Reaching for `functional_localizer` because the region is functional, rather than because a localizer was run, is the mistake to avoid.
      region_type:
        range: ExtractedRegionType
        description: >-
          What kind of thing the region is, which `definition_method` does not settle: an
          atlas parcel and an anatomical structure can both come from an atlas, and a network
          is neither.
