# Findings a reviewer has judged acceptable for now, so that a check can be switched on
# before every paper satisfies it.
#
# Without this the choice is between a check nobody can turn on and a pipeline that fails
# on every paper, and the second teaches people to pass `--no-strict` forever. An entry is
# a claim that a specific finding on a specific paper is known and tolerated, and it
# carries a `why` for the same reason every entry in `corrections/` does: an allowlist
# without reasons becomes a place findings go to be forgotten.
#
# Matching is on the paper, the path with list indices stripped, and a prefix of the
# message. So one entry covers `analyses[0..3].details.seed_regions` without naming four.
# Both `build_record.py --known-gaps` and `validate_record.py --known-gaps` read this file
# and report what they suppressed rather than hiding it.
#
# The test of a good entry is that it names what would remove it. Every entry below is
# waiting on the same thing.

gaps:

  # ---------------------------------------------------------------- seed_regions by name
  #
  # All five of these are one defect with one fix. `MODE_NOTE["entities"]` never mentioned
  # Region until now, so eleven of sixteen papers emitted none -- and an analysis whose
  # seed has no Region to point at wrote the region's *name* into the reference slot
  # instead. `check_local_ids` could not see these at all until it learned to follow the
  # type designator into ConnectivityDetails, so they are newly visible rather than new.
  #
  # Removed by: re-running the `entities` and `analyses` passes with the Region paragraph
  # in the entities note. Expect the references to resolve and these five entries to be
  # deletable in one go; a paper still listed after that re-run is a real finding.

  - paper: 7HPLh5nJzmP5
    path: Study.analyses.details.seed_regions
    message: "-> unknown local_id"
    why: >-
      Four seed references naming `left dlPFC parcel` and `right dlPFC parcel`, which are
      real regions this paper delimited and no Region record exists for.

  - paper: aVGe9BmFTMDR
    path: Study.analyses.details.seed_regions
    message: "-> unknown local_id"
    why: >-
      Two seeds named by their coordinates -- `responder Rlocation (-42, 34, 38)`. The
      coordinates belong in the Region's description once the Region exists.

  - paper: QQCjAAT6SwwQ
    path: Study.analyses.details.seed_regions
    message: "-> unknown local_id"
    why: >-
      Seven salience-network seeds named in prose, no Region records.

  - paper: kzMj26hGWacQ
    path: Study.analyses.details.seed_regions
    message: "-> unknown local_id"
    why: >-
      Network seeds named rather than referenced.

  - paper: TgcHKMRfrVog
    path: Study.analyses.details.seed_regions
    message: "-> unknown local_id"
    why: >-
      Nine references to the three rsFC seeds this paper defines, none of them a local_id.

  # ---------------------------------------------------------- duplicated covariate ids
  #
  # A different defect that happens to surface in the same check. Two linear mixed-effects
  # models each declare `term_age`, `term_sex`, `term_education` and `term_group`, so a
  # `Cell.term` naming one of them cannot say which model's column it means.
  #
  # Removed by: the `ModelEstimation` description deviation, which now states that a model
  # fitted over a different sample is a different record -- but not by that alone, since
  # the ids still have to differ. `corrections/krv8mTKTUHSp.corrections.json` shows the
  # repair by hand; the extraction has to stop minting the collision in the first place.

  - paper: QQCjAAT6SwwQ
    path: ""
    message: "local_id 'term_"
    why: >-
      Four covariate ids declared twice across two sibling mixed-effects models. Every
      reference to one of them is ambiguous, and both declarations resolve, so nothing but
      this check notices.
