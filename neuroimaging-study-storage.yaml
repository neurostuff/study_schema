id: https://neurostuff.org/schemas/neuroimaging-study-storage
name: neuroimaging-study-storage
title: Neuroimaging Study Storage Schema
description: >-
  Normalized, query-optimized schema for study-level neuroimaging metadata.
  Values here are typed, bound to controlled vocabularies, and free of
  extraction provenance. This is the target of the extraction-to-storage mapper
  and the schema used by the NeuroStore database and API.

  Do not hand-edit records in this format; they are generated by running the
  extraction-to-storage mapper over a neuroimaging-study-extraction record.
  Re-running the mapper re-generates this record from the immutable extraction;
  the only way to change an extraction value is to re-run the LLM extractor.

  The representation of the tested effect -- Analysis.analysis_type, Analysis.effect,
  Analysis.measure, and the details payloads -- is ported from analysis-schema
  v0.1.0-alpha.11 (analysis-schema/analysis-schema-v0.1.0-alpha.11.md). That
  specification's invariants that LinkML cannot express, chiefly the derivation of
  Effect.kind from which terms carry direction, are enforced by a separate structural
  validator.

license: CC0-1.0
version: 0.6.0
