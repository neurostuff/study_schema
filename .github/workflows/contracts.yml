name: contracts

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install ".[test,generate,layouts,parquet]" jsonschema
      - name: Generated models and JSON Schemas match the YAML
        run: python tools/generate_models.py --check
      - name: Tests
        # -rs lists skips: the layout tests skip until pyarty main reads pydantic models.
        run: pytest -rs
