name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[docs]"
      - name: Generate the schema reference and stage the guides
        run: python tools/build_docs.py
      - name: Build the site (broken links fail)
        run: mkdocs build --strict
      - name: Every page is rendered, not raw Markdown
        run: python tools/check_site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
